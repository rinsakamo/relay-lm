normative_heading_keywords:
  - contract
  - boundary
  - invariant
  - schema
  - field
  - state
  - transition
  - gate
  - required
  - forbidden
  - privacy
  - security
  - exact
  - normative
  - must
  - shall
  - 必須
  - 禁止
  - 境界
  - 不変条件

normative_line_patterns:
  - '(?i)\bmust\b'
  - '(?i)\bmust not\b'
  - '(?i)\bshall\b'
  - '(?i)\brequired\b'
  - '(?i)\bforbidden\b'
  - '(?i)\bexact\b'
  - '必須'
  - '禁止'
  - 'してはならない'
  - 'のみ許可'

path_reference_regex: '(?<![A-Za-z0-9_./-])(docs/[A-Za-z0-9_./-]+\.md)'
