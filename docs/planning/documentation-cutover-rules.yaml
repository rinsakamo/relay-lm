    disposition: split
    target_records:
      - target_path: docs/evaluation/lat1-retrieval-scaling.md
        target_doc_type: evaluation_method
      - target_path: docs/templates/evaluation/lat1-retrieval-scaling-report.md
        target_doc_type: template
    deletion_reason: >-
      Cutover 1C-39: this source mixed a repeatable evaluation method with a
      blank, non-authoritative report template under one file and one
      legacy evaluation_record metadata profile. Split into a canonical
      evaluation_method and a canonical template; no measured evidence was
      fabricated for either target, and no evidence_retained disposition
      applies since the source was never itself a measured result. This
      override supersedes the generic evaluation-result/evaluation-method
      family rules below for this one path, since neither alone can
      represent a single source splitting into two different target
      document types.

family_rules:
  - id: canonical-target-collections
    path_regex: '^docs/(planning|reference|templates)/'
    disposition: retained
    target_doc_type_from_metadata: true
    target_same_path: true
  - id: adr-retained
    path_regex: '^docs/adr/'
    disposition: retained
    target_doc_type: adr
    target_same_path: true
  - id: contracts-retained
    path_regex: '^docs/contracts/'
    disposition: retained
    target_doc_type: contract
    target_same_path: true
    normative_decision: retained_exact
  - id: mvp-snapshot-delete
    path_regex: '^docs/mvp/mvp[0-9]+_summary\.md$'
    disposition: deleted_git_history_only
    target_doc_type: evidence
    deletion_reason: redundant milestone snapshot
  - id: mvp-completion-evidence
    path_regex: '^docs/mvp/(wave[0-9]+/)?[^/]*_completion_report\.md$'
    disposition: evidence_retained
    target_doc_type: evidence
    target_template: 'docs/evidence/implementation/{relative_after_mvp}'
  - id: mvp-release-readiness
    path_regex: '^docs/mvp/v[^/]*_release_readiness\.md$'
    disposition: moved
    target_doc_type: release
    target_template: 'docs/release/{basename}'
  - id: mvp-template
    path_regex: '^docs/mvp/.*TEMPLATE.*\.md$'
    disposition: moved
    target_doc_type: template
    target_template: 'docs/templates/{basename_lower}'
  - id: mvp-other-evidence
    path_regex: '^docs/mvp/'
    disposition: evidence_retained
    target_doc_type: evidence
    target_template: 'docs/evidence/implementation/{relative_after_mvp}'
  - id: smoke-operations
    path_regex: '^docs/smoke/'
    disposition: moved
    target_doc_type: operations
    target_template: 'docs/operations/{relative_after_smoke}'
  - id: tools-operations
    path_regex: '^docs/tools/'
    disposition: moved
    target_doc_type: operations
    target_template: 'docs/operations/tools/{relative_after_tools}'
  - id: evaluation-template
    path_regex: '^docs/evaluation/.*template.*\.md$'
    disposition: moved
    target_doc_type: template
    target_template: 'docs/templates/evaluation/{basename}'
  - id: evaluation-result
    path_regex: '^docs/evaluation/.*(report|result|[0-9]{4}_[0-9]{2}_[0-9]{2}).*\.md$'
    disposition: evidence_retained
    target_doc_type: evidence
    target_template: 'docs/evidence/evaluations/{basename}'
  - id: evaluation-method
    path_regex: '^docs/evaluation/'
    disposition: retained
    target_doc_type: evaluation_method
    target_same_path: true
  - id: relaysoul-contract
    path_regex: '^docs/relaysoul/.*contract.*\.md$'
    disposition: rebuilt_verbatim
    target_doc_type: contract
    target_template: 'docs/contracts/character/{stable_stem}.md'
    normative_decision: rebuild_verbatim
  - id: relaysoul-experiment
    path_regex: '^docs/relaysoul/.*(experimental|draft|showcase|fixture).*\.md$'
    disposition: split
    target_doc_type: strategy
    target_paths:
      - docs/strategy/character-experiments.md
    requires_manual_section_map: true
  - id: relaysoul-design
    path_regex: '^docs/relaysoul/'
    disposition: synthesized
    target_doc_type: subsystem_architecture
    target_paths:
      - docs/architecture/character-workspace/system.md
    requires_manual_section_map: true
  - id: architecture-archive
    path_regex: '^docs/architecture/archive/'
    disposition: deleted_git_history_only
    target_doc_type: evidence
    deletion_reason: superseded architecture copy retained in Git history
  - id: architecture-wave-audit
    path_regex: '^docs/architecture/.*(wave[0-9]+.*audit|cross_slice_convergence_audit).*\.md$'
    disposition: evidence_retained
    target_doc_type: evidence
    target_template: 'docs/evidence/waves/{basename}'
  - id: architecture-validation-evaluation
    path_regex: '^docs/architecture/.*(validation|evaluation|recovery_audit).*\.md$'
    disposition: evidence_retained
    target_doc_type: evidence
    target_template: 'docs/evidence/evaluations/{basename}'
  - id: architecture-contract
    path_regex: '^docs/architecture/.*contract.*\.md$'
    disposition: rebuilt_verbatim
    target_doc_type: contract
    target_template: 'docs/contracts/migrated/{stable_stem}.md'
    normative_decision: rebuild_verbatim
    requires_manual_section_map: true
  - id: architecture-analyzer
    path_regex: '^docs/architecture/(acg[0-9]+_|analyzer_)'
    disposition: split
    target_doc_type: subsystem_architecture
    target_paths:
      - docs/architecture/analyzers/candidate-governance.md
