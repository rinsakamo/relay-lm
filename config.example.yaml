mode: pass_through

listen:
  host: 127.0.0.1
  port: 8090

common_runtime_policy: examples/profiles/default/common_runtime_policy.md

trace:
  enabled: false
  path: traces/relaylm_trace.jsonl

# RelayCTX short-term source diagnostics are default-off and content-free.
# When enabled, RelayLM records OpenWebUI message counts/source metadata only;
# it never stores, restores, rewrites, compresses, or injects short-term CTX.
relayctx_short_term_source_diagnostics_enabled: false

# RelayCTX short-term extraction dry-run is default-off, diagnostics-only,
# deterministic, and content-free. When enabled, RelayLM classifies aggregate
# OpenWebUI short-term CTX candidate counts only; it does not store/restore CTX,
# inject runtime context, mutate backend payloads, or mutate response bodies.
relayctx_short_term_extraction_dry_run_enabled: false

# RelayCTX short-term block assembly dry-run is default-off, diagnostics-only,
# and content-free. When enabled, RelayLM plans internal short-term CTX block
# metadata from extraction counts only; it does not store/restore CTX, inject
# runtime context, mutate backend payloads, mutate responses, or rewrite messages.
relayctx_short_term_block_assembly_dry_run_enabled: false

# RelayCTX short-term runtime injection preflight is default-off and content-free.
# Even when enabled, dry-run-only remains true by default: RelayLM only emits
# future insertion metadata and never mutates backend payloads, responses,
# OpenWebUI messages, persisted CTX, or restored cross-thread CTX.
relayctx_short_term_runtime_injection_preflight_enabled: false

# RelayCTX short-term runtime injection gated apply is default-off. Backend
# payload mutation can occur only when apply_enabled=true and dry_run_only=false
# are both explicitly set. The inserted system message is a content-free count
# summary only; RelayLM still does not persist/restore CTX, mutate responses, or
# compress/rewrite OpenWebUI messages.
relayctx_short_term_runtime_injection_apply_enabled: false
relayctx_short_term_runtime_injection_dry_run_only: true
relayctx_short_term_runtime_injection_token_budget: 400

# RelayINT fast path dry-run is default-off, diagnostics-only, and content-free.
# It uses deterministic heuristics only: no LLM call, no MEM lookup, and no
# backend payload or response mutation.
relayint_fast_path_dry_run_enabled: false
relayint_fast_path_high_confidence_threshold: 0.80
relayint_fast_path_low_confidence_threshold: 0.55

# RelayINT quick clarification preflight is default-off and diagnostics-only.
# It only emits content-free metadata when Fast Path would ask clarification; it
# does not generate user-visible text, call LLM/MEM, or mutate payload/response.
relayint_quick_clarification_preflight_enabled: false
relayint_quick_clarification_dry_run_only: true

# RelayINT quick clarification apply planning is also default-off and
# dry-run-only by default. MVP-47 is diagnostics-only / plan-only: enabling this
# emits relayint_quick_clarification_apply_plan.v0 metadata for preflight smoke,
# but does not short-circuit backend forwarding, mutate payloads, or mutate
# response bodies.
relayint_quick_clarification_apply_enabled: false
relayint_quick_clarification_apply_dry_run_only: true
relayint_quick_clarification_response_max_chars: 120

memory:
  candidate_limit: 3
  token_budget_hint: 800
  character_budget: 1200
  # Global shadow policy switch for token-policy diagnostics.
  # false keeps policy_mode=disabled unless a character override enables shadow mode.
  token_policy_shadow_enabled: false
  # Hard enforcement is not implemented yet. Token policy remains diagnostics/trace only.
  # RelayMEM file-backed store MVP is read-only and diagnostics-first.
  # Disabled by default; enabling it only inspects layout and does not inject CTX.
  root_path: .
  store_enabled: false
  retrieval_dry_run_only: true
  ctx_block_apply_enabled: false
  # Bounded snippet-bearing runtime injection is default-off.
  # With snippet_runtime_injection_enabled=false and snippet_runtime_dry_run_only=true,
  # RelayMEM may still produce diagnostics, but snippet text is not sent to the backend.
  # Only when all explicit gates pass for an eligible request can RelayLM insert a
  # bounded [RelayMEM Snippet Context] message. When that happens, the metadata-only
  # [RelayMEM Context] message is skipped to avoid duplicate RelayMEM context.
  # Retrieval does not mutate MEM or SOUL state.
  snippet_extraction_enabled: false
  snippet_dry_run_only: true
  snippet_apply_enabled: false
  snippet_runtime_injection_enabled: false
  snippet_runtime_dry_run_only: true
  snippet_budget: 512
  max_snippet_chars: 512
  max_snippet_candidates: 3

backends:
  local_backend:
    type: openai_compatible
    base_url: http://127.0.0.1:8000/v1
    api_key: dummy
    default_model: local-model

model_routes:
  relaylm-default:
    backend: local_backend
    backend_model: local-model
    character_id: default
    mode: pass_through
    cache_namespace: character/default
    memory_namespace: character/default

characters:
  default:
    soul: examples/profiles/default/SOUL.md
    output_policy: examples/profiles/default/style.md
    room_anchor: examples/profiles/default/ROOM_ANCHOR.md
    scene_state: examples/profiles/default/SCENE_STATE.md
    memory_seed_path: examples/memory/default_memories.yaml
    # unset -> falls back to memory.token_policy_shadow_enabled
    # token_policy_shadow_enabled:
  # Example override: enable shadow policy for one character even when global=false.
  # vtuber_a:
  #   soul: examples/profiles/default/SOUL.md
  #   output_policy: examples/profiles/default/style.md
  #   room_anchor: examples/profiles/default/ROOM_ANCHOR.md
  #   memory_seed_path: examples/memory/default_memories.yaml
  #   token_policy_shadow_enabled: true
  # Example override: disable shadow policy for one character even when global=true.
  # vtuber_b:
  #   soul: examples/profiles/default/SOUL.md
  #   output_policy: examples/profiles/default/style.md
  #   room_anchor: examples/profiles/default/ROOM_ANCHOR.md
  #   memory_seed_path: examples/memory/default_memories.yaml
  #   token_policy_shadow_enabled: false

# RelayEMO MVP initial (default off, diagnostics/preview first)
# relayemo_enabled=true で diagnostics/trace artifact は出力される
# relayemo_text_marker_enabled=true のときだけ marker preview/apply を有効化
relayemo_enabled: false
relayemo_dry_run: true
relayemo_text_marker_enabled: false
relayemo_text_marker_apply_mode: diagnostics_only
relayemo_marker_open_threshold: 0.65
relayemo_marker_close_threshold: 0.45
relayemo_max_markers: 3
relayemo_scene_gate_enabled: true
relayemo_session_state_enabled: false
relayemo_session_state_ttl_seconds: 1800
relayemo_session_state_max_entries: 256

# RelayEMO LLM affect probe remains heuristic-active by default.
# llm_structured_dry_run exposes LLM candidates in diagnostics only.
# Runtime invocation should stay dry-run, budgeted, fail-closed, and protected
# from recursive RelayLM calls before any candidate apply gate is introduced.
relayemo_affect_probe_mode: heuristic
relayemo_llm_affect_probe_enabled: false
relayemo_llm_affect_probe_dry_run: true
relayemo_llm_affect_probe_max_input_chars: 2000
relayemo_llm_affect_probe_timeout_ms: 1500
relayemo_llm_affect_probe_max_output_tokens: 160
relayemo_llm_affect_probe_skip_when_busy: true
relayemo_llm_affect_probe_every_n_turns: 1

# RelayRUN checkpoint writer is default-off.
# The writer only persists a content-free checkpoint envelope when explicitly enabled
# and dry-run mode is disabled. It never stores backend payloads, raw user content,
# response text, or prompt text.
relayrun_checkpoint_write_enabled: false
relayrun_checkpoint_root: .relayrun/checkpoints
relayrun_checkpoint_dry_run_only: true

# RelayRUN resume preflight is diagnostics-only and default-off.
# It may validate content-free checkpoint envelopes when explicitly enabled,
# but it never applies resume/retry/recovery transitions.
relayrun_resume_preflight_enabled: false
relayrun_resume_dry_run_only: true

# RelayRUN checkpoint index/listing diagnostics are default-off.
# When enabled and not dry-run-only, RelayLM scans only checkpoint-root .json envelopes
# and indexes content-free metadata summaries without applying resume/retry/recovery.
relayrun_checkpoint_index_enabled: false
relayrun_checkpoint_index_dry_run_only: true
relayrun_checkpoint_index_max_files: 100

# RelayRUN recovery transition artifacts are diagnostics-only and default-off.
# They never generate direct user-visible output or apply resume/retry/recovery transitions.
relayrun_recovery_transition_enabled: false
relayrun_recovery_transition_dry_run_only: true

# RelayRUN waiting_user contract artifacts are diagnostics-only and default-off.
# They structure future user-confirmation needs but never emit user-visible output.
relayrun_waiting_user_contract_enabled: false
relayrun_waiting_user_contract_dry_run_only: true

# RelayRUN recovery apply preflight artifacts are diagnostics-only and default-off.
# They define future apply gates without applying resume/retry/recovery or visible output.
relayrun_recovery_apply_preflight_enabled: false
relayrun_recovery_apply_dry_run_only: true

# RelayRUN recovery response draft artifacts are diagnostics-only and default-off.
# They draft output-pipeline instructions without generating final user-visible text.
relayrun_recovery_response_draft_enabled: false
relayrun_recovery_response_draft_dry_run_only: true

# RelayRUN visible recovery response preflight artifacts are diagnostics-only and default-off.
# They require the full output pipeline before any future user-visible recovery text.
relayrun_visible_recovery_preflight_enabled: false
relayrun_visible_recovery_dry_run_only: true

# RelayRUN recovery response generator artifacts are diagnostics-only and default-off.
# They model a future generator contract without producing final user-visible text.
relayrun_recovery_response_generator_enabled: false
relayrun_recovery_response_generator_dry_run_only: true

# RelayRUN output RelaySCN recovery gate artifacts are diagnostics-only and default-off.
# They model an output-side scene/safety gate for future visible recovery with no final user-visible text.
relayrun_output_relayscn_recovery_gate_enabled: false
relayrun_output_relayscn_recovery_gate_dry_run_only: true

# RelayRUN visible recovery apply preflight artifacts are diagnostics-only and default-off.
# They model future visible recovery response apply without response body mutation or final user-visible text.
relayrun_visible_recovery_apply_preflight_enabled: false
relayrun_visible_recovery_apply_preflight_dry_run_only: true

# RelayRUN user action contract artifacts are diagnostics-only and default-off.
# They model future user confirmation / clarification action contracts without resume, retry, or visible recovery apply.
relayrun_user_action_dry_run_enabled: false
relayrun_user_action_dry_run_only: true


