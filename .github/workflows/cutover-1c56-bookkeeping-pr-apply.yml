name: Apply Cutover 1C-56 Bookkeeping From PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/cutover-1c56-bookkeeping-apply.py
      - .github/workflows/cutover-1c56-bookkeeping-pr-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/documentation-hard-cutover-1c56-bookkeeping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/documentation-hard-cutover-1c56-bookkeeping
          fetch-depth: 0

      - name: Apply exact bookkeeping payload
        run: python .github/cutover-1c56-bookkeeping-apply.py

      - name: Validate bookkeeping tree
        shell: bash
        run: |
          python -m compileall -q relaylm scripts
          PYTHONPATH=. python scripts/relaylm_phase_i3_handoff_cutover_guard.py
          PYTHONPATH=. python scripts/relaylm_phase_i3_handoff_cutover_guard.py --self-test
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
          PYTHONPATH=. python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check
          test "$(git diff --name-only HEAD | sort)" = $'docs/evidence/migrations/cutover-1c56-phase-i3.md\ndocs/evidence/migrations/documentation-hard-cutover-receipt.md'

      - name: Commit final bookkeeping tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize cutover 1C-56 bookkeeping"
          git push origin HEAD:agent/documentation-hard-cutover-1c56-bookkeeping
