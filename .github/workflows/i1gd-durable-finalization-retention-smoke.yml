name: I1-GD durable-finalization retention smoke

on:
  pull_request:
    paths:
      - "relaylm/config.py"
      - "relaylm/relaymem_slp_durable_finalization_*.py"
      - "relaylm/_relaymem_slp_durable_finalization_*.py"
      - "scripts/relaylm_i1g_*.py"
      - "scripts/relaylm_i1gb_*.py"
      - "scripts/relaylm_i1gc_*.py"
      - "scripts/relaylm_i1gd_*.py"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "docs/**"
      - "config.example.yaml"
      - ".github/workflows/i1gd-durable-finalization-retention-smoke.yml"
  push:
    branches:
      - main
      - phase-i1gd-durable-finalization-retention-cleanup
    paths:
      - "relaylm/config.py"
      - "relaylm/relaymem_slp_durable_finalization_*.py"
      - "relaylm/_relaymem_slp_durable_finalization_*.py"
      - "scripts/relaylm_i1gd_*.py"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "docs/**"
      - "config.example.yaml"
      - ".github/workflows/i1gd-durable-finalization-retention-smoke.yml"

permissions:
  contents: read

concurrency:
  group: i1gd-durable-finalization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RelayLM runtime dependencies
        run: python -m pip install -e .
      - name: Compile repository Python
        run: python -m compileall -q relaylm scripts
      - name: Run I1-GD retention convergence smoke
        id: i1gd
        shell: bash
        run: |
          set +e
          PYTHONPATH=.:scripts python scripts/relaylm_i1gd_durable_finalization_retention_smoke.py > i1gd-smoke.log 2>&1
          first_exit=$?
          PYTHONPATH=.:scripts python scripts/relaylm_i1gd_durable_finalization_retention_contract_smoke.py >> i1gd-smoke.log 2>&1
          second_exit=$?
          PYTHONPATH=.:scripts python scripts/relaylm_i1gd_durable_finalization_retention_race_smoke.py >> i1gd-smoke.log 2>&1
          third_exit=$?
          cat i1gd-smoke.log
          if [ "$first_exit" -ne 0 ]; then
            exit "$first_exit"
          fi
          if [ "$second_exit" -ne 0 ]; then
            exit "$second_exit"
          fi
          exit "$third_exit"
      - name: Upload I1-GD smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1gd-smoke-output
          path: i1gd-smoke.log
          if-no-files-found: error
          retention-days: 3
      - name: Run I1-GA through I1-GC regressions
        run: |
          PYTHONPATH=. python scripts/relaylm_i1g_pre_enqueue_fault_model_smoke.py
          PYTHONPATH=. python scripts/relaylm_i1gb_durable_finalization_publication_smoke.py
          PYTHONPATH=. python scripts/relaylm_i1gb_durable_finalization_app_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_i1gc_durable_finalization_replay_smoke.py
      - name: Run documentation checks
        id: docs
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py > documentation-smoke.log 2>&1
          links_exit=$?
          PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py >> documentation-smoke.log 2>&1
          boundary_exit=$?
          cat documentation-smoke.log
          if [ "$links_exit" -ne 0 ]; then
            exit "$links_exit"
          fi
          exit "$boundary_exit"
      - name: Upload documentation smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-smoke-output
          path: documentation-smoke.log
          if-no-files-found: error
          retention-days: 3
