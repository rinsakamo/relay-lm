name: Cutover 1C-8 Wave 6 receipt finalizer

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: github.head_ref == 'agent/docs-cutover-1c8-wave6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Finalize receipt validation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/evidence/migrations/documentation-hard-cutover-receipt.md")
          text = path.read_text(encoding="utf-8")
          start = text.index("### C1C8-001")
          end = text.index("## Pending batches", start)
          block = text[start:end]
          old = """  documentation_link_check_required: true
            documentation_semantic_audit_required: true
            affected_current_boundary_checks_required: true
          """
          old = "\n".join(line.removeprefix("          ") for line in old.splitlines()) + "\n"
          new = """  documentation_link_check: passed
            documentation_semantic_audit: passed
            affected_current_boundary_checks: passed
            all_github_actions: passed
            unresolved_review_threads: 0
          """
          new = "\n".join(line.removeprefix("          ") for line in new.splitlines()) + "\n"
          if block.count(old) != 1:
              raise AssertionError(f"C1C8 validation fields mismatch: {block.count(old)}")
          block = block.replace(old, new, 1)
          path.write_text(text[:start] + block + text[end:], encoding="utf-8")
          PY

          rm .github/workflows/cutover-1c8-wave6-finalize.yml
          git diff --check
          python -m compileall -q relaylm scripts
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
          PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize Cutover 1C-8 validation receipt"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
