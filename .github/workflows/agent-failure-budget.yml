name: Agent failure budget

on:
  workflow_run:
    workflows:
      - "Completion report link smoke"
      - "Documentation completion report files"
      - "Documentation current boundary smoke"
      - "Documentation cutover preparation"
      - "Documentation governance"
      - "Documentation links"
      - "E1 evaluation consolidation"
      - "MVP eval runner"
      - "Onboarding config smoke"
      - "Phase I-4A Forget Hide contract"
      - "RelayLM runtime code smokes"
      - "RelayMEM / SLP smokes"
      - "Repository & storage inventory artifact"
      - "Scripts inventory artifact"
      - "Smoke consolidation contract"
      - "SOUL Lab UI smokes"
      - "Unit tests"
      - "v0.1 final main validation"
      - "Wave 4 cross-slice convergence"
      - "Wave 5 cross-slice convergence"
      - "Windows startup"
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose reviewed P6 stop state is being reset
        required: true
        type: number
      reset_reason:
        description: Reviewed P0/P1/P2 re-bootstrap evidence for the reset
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-failure-budget-${{ github.event.workflow_run.head_branch || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.name != 'Agent execution safety' &&
        github.event.workflow_run.name != 'Agent failure budget'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run failure-budget self-test
        run: node scripts/relaylm_agent_failure_budget.js --self-test
      - name: Update bounded PR failure state
        uses: actions/github-script@v7
        env:
          RELAYLM_PR_NUMBER: ${{ inputs.pr_number }}
          RELAYLM_RESET_REASON: ${{ inputs.reset_reason }}
        with:
          script: |
            const monitor = require('./scripts/relaylm_agent_failure_budget.js');
            const dispatchContext = context.eventName === 'workflow_dispatch'
              ? {
                  ...context,
                  payload: {
                    ...context.payload,
                    inputs: {
                      pr_number: process.env.RELAYLM_PR_NUMBER,
                      reset_reason: process.env.RELAYLM_RESET_REASON,
                    },
                  },
                }
              : context;
            await monitor.run({github, context: dispatchContext});
