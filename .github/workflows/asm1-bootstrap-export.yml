name: ASM-1 implementation publisher

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: asm1-implementation-publisher-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct verified implementation patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '5c751db6fc4b26503dfbf115e0e2afe39d191a58c36464d81b39a8809f9741dd' '.github/asm1-bootstrap/patch.part00' | sha256sum --check --strict
          printf '%s  %s\n' 'e1e9b20777f9341ebf3a0b82b74e5e4f913df145ae9b52248c0e2b0637a252e1' '.github/asm1-bootstrap/patch.part01' | sha256sum --check --strict
          printf '%s  %s\n' '5e23c9debd5b1639bd38c5ae8013db1bdfc31e4752bc4cd240cd4f3d66d0b2fd' '.github/asm1-bootstrap/patch.part02' | sha256sum --check --strict
          printf '%s  %s\n' '021e29a4986481b37e09df23dfe71bbfb25027c7ef35273252d1620d5a177eac' '.github/asm1-bootstrap/patch.part03' | sha256sum --check --strict
          printf '%s  %s\n' '133ab1dbb18ea7f655490c8128308ca0329ef8019777fbe13ca8b12dd116ab96' '.github/asm1-bootstrap/patch.part04' | sha256sum --check --strict
          cat \
            .github/asm1-bootstrap/patch.part00 \
            .github/asm1-bootstrap/patch.part01 \
            .github/asm1-bootstrap/patch.part02 \
            .github/asm1-bootstrap/patch.part03 \
            .github/asm1-bootstrap/patch.part04 \
            > /tmp/asm1.patch.gz.b64
          printf '%s  %s\n' \
            'f30224f1f413304390148d4dddf20e1e70be7148d2610040d7567c472d5aaf3a' \
            '/tmp/asm1.patch.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/asm1.patch.gz.b64 | gzip --decompress > /tmp/asm1.patch

      - name: Apply ASM-1 to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git apply --index --whitespace=error-all /tmp/asm1.patch
          test ! -e .github/asm1-bootstrap
          test ! -e .github/workflows/asm1-bootstrap-export.yml
          git diff --cached --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -e '.[test]'

      - name: Validate final implementation tree
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q relaylm scripts
          pytest -q
          python scripts/relaylm_asm1_shared_assessment_smoke.py
          python scripts/relaylm_docs_link_check.py
          python scripts/relaylm_docs_semantic_audit.py

      - name: Publish one atomic implementation commit
        shell: bash
        env:
          TARGET_BRANCH: agent/asm1-shared-assessment-runtime-v1
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement ASM-1 shared assessment runtime foundation'
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
