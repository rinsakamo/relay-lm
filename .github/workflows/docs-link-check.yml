name: Documentation links

on:
  pull_request:
    paths:
      - README.md
      - docs/**
      - scripts/relaylm_docs_link_check.py
      - .github/workflows/docs-link-check.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/**
      - scripts/relaylm_docs_link_check.py
      - .github/workflows/docs-link-check.yml

permissions:
  contents: read

jobs:
  docs-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local Markdown links
        run: python scripts/relaylm_docs_link_check.py
