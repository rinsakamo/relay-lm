name: Documentation links

on:
  workflow_dispatch:
  pull_request:
    paths:
      - README*.md
      - docs/**
      - scripts/relaylm_docs_link_check.py
      - scripts/relaylm_docs_link_check_smoke.py
      - .github/workflows/docs-link-check.yml
  push:
    branches:
      - main
    paths:
      - README*.md
      - docs/**
      - scripts/relaylm_docs_link_check.py
      - scripts/relaylm_docs_link_check_smoke.py
      - .github/workflows/docs-link-check.yml

permissions:
  contents: read

jobs:
  docs-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate link checker fixtures
        run: python scripts/relaylm_docs_link_check_smoke.py
      - name: Check repository Markdown links and anchors
        run: |
          set +e
          python scripts/relaylm_docs_link_check.py 2>&1 | tee docs-link-check.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload documentation link diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-link-diagnostics
          path: docs-link-check.log
          if-no-files-found: error
