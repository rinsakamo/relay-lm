name: Documentation links

on:
  workflow_dispatch:
  pull_request:
    paths:
      - README*.md
      - docs/**
      - relaylm/__init__.py
      - relaylm/trace_runtime.py
      - scripts/relaylm_audit_projection_contract_smoke.py
      - scripts/relaylm_audit_projection_exact_contract_smoke.py
      - scripts/relaylm_trace_success_smoke.py
      - .github/workflows/docs-link-check.yml
  push:
    branches:
      - main
    paths:
      - README*.md
      - docs/**
      - scripts/relaylm_docs_link_check.py
      - scripts/relaylm_docs_link_check_smoke.py
      - .github/workflows/docs-link-check.yml

permissions:
  contents: read

jobs:
  docs-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RelayLM
        run: python -m pip install -q -e .
      - name: Validate link checker fixtures
        run: python scripts/relaylm_docs_link_check_smoke.py
      - name: Check repository Markdown links
        run: python scripts/relaylm_docs_link_check.py
      - name: Compile audit paths
        run: python -m compileall relaylm scripts
      - name: Audit projection contract
        run: python scripts/relaylm_audit_projection_contract_smoke.py
      - name: Exact audit projection contract
        run: python scripts/relaylm_audit_projection_exact_contract_smoke.py
      - name: Trace success contract
        run: python scripts/relaylm_trace_success_smoke.py
      - name: History preflight integration
        run: python scripts/relaylm_client_history_exclusion_preflight_smoke.py
