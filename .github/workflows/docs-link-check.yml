name: Documentation links

on:
  workflow_dispatch:
  pull_request:
    paths:
      - README*.md
      - docs/**
      - scripts/relaylm_docs_link_check.py
      - scripts/relaylm_docs_link_check_smoke.py
      - .github/workflows/docs-link-check.yml
  push:
    branches:
      - main
      - docs-align-current-implementation-status-20260621
    paths:
      - README*.md
      - docs/**
      - scripts/relaylm_docs_link_check.py
      - scripts/relaylm_docs_link_check_smoke.py
      - .github/workflows/docs-link-check.yml

permissions:
  contents: write

jobs:
  docs-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply PR 348 UI-A4 status follow-up
        if: github.ref == 'refs/heads/docs-align-current-implementation-status-20260621'
        run: python scripts/_temporary_pr348_ui_a4_followup.py
      - name: Validate link checker fixtures
        run: python scripts/relaylm_docs_link_check_smoke.py
      - name: Check repository Markdown links
        run: python scripts/relaylm_docs_link_check.py

# Trigger pass 2 after relaxing pre-rebase validation.
