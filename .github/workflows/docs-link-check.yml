# Trigger the one-shot RelayATN / CTX-OVL boundary update after the job exists on the branch.
name: Documentation links

on:
  workflow_dispatch:
  pull_request:
    paths:
      - README*.md
      - docs/**
      - scripts/relaylm_docs_link_check.py
      - scripts/relaylm_docs_link_check_smoke.py
      - .github/workflows/docs-link-check.yml
  push:
    branches:
      - main
    paths:
      - README*.md
      - docs/**
      - scripts/relaylm_docs_link_check.py
      - scripts/relaylm_docs_link_check_smoke.py
      - .github/workflows/docs-link-check.yml

permissions:
  contents: write

concurrency:
  group: documentation-links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relayatn-ctx-ovl-boundary-update:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'docs/subjective-memory-formation-proposal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/subjective-memory-formation-proposal
          fetch-depth: 0

      - name: Merge current main and resolve proposal-index cutover conflict
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            set +e
            git merge --no-commit --no-ff origin/main
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              for path in docs/proposals/README.md docs/proposals/subjective-memory-formation-consolidation-and-retrieval.md docs/evidence/implementation/session-evidence-overlay-feasibility.md; do
                if git ls-files -u -- "$path" | grep -q .; then
                  git checkout --ours -- "$path"
                  git add "$path"
                fi
              done
              unresolved="$(git diff --name-only --diff-filter=U)"
              if [ -n "$unresolved" ]; then
                printf 'Unresolved merge conflicts:\n%s\n' "$unresolved"
                exit 1
              fi
            fi
          fi

      - name: Apply reviewed RelayATN and CTX-OVL boundary
        shell: python
        run: |
          from pathlib import Path

          proposal_path = Path("docs/proposals/subjective-memory-formation-consolidation-and-retrieval.md")
          feasibility_path = Path("docs/evidence/implementation/session-evidence-overlay-feasibility.md")
          review_path = Path("docs/evidence/implementation/relayatn-ctx-ovl-boundary-review.md")
          index_path = Path("docs/proposals/README.md")

          proposal = proposal_path.read_text(encoding="utf-8")
          proposal = proposal.replace(
              "relaylm_related_evidence:\n  - ../evidence/implementation/session-evidence-overlay-feasibility.md\n",
              "relaylm_related_evidence:\n  - ../evidence/implementation/session-evidence-overlay-feasibility.md\n  - ../evidence/implementation/relayatn-ctx-ovl-boundary-review.md\n",
          )
          marker = "### SCN input split\n"
          section = '### RelayATN, governed ingress, and catch-up boundary\n\nRelayATN remains a resident **pre-request admission** component. It may reject, hold, select, or attach content-free advisory flags, but it never creates, updates, retracts, collapses, acknowledges, or shadows a CTX-OVL candidate.\n\nThe following decisions are orthogonal:\n\n```text\nturn admission\n  -> RelayATN\n\nevidence admission and Protected Source Evidence retention\n  -> governed source domain\n\ncurrent-session continuity and CTX-OVL mutation\n  -> RelayCTX\n\nscene classification and scene policy\n  -> RelaySCN\n\ndurable assessment, relation, lifecycle, confidence, and persistence\n  -> RelaySLP / RelayMEM\n```\n\nA RelayATN `reject` means only that no RelayRUN turn starts from that candidate. It does not delete governed evidence, change evidence-admission results, forbid later bounded catch-up, or prohibit independent deferred processing.\n\n#### Bounded rejected-ingress catch-up\n\nTurn-rejected governed SourceEvents may be considered on the next admitted request through a bounded RelayCTX-owned ingress-coverage scan. Catch-up is **not** automatic semantic hydration:\n\n```text\nretained governed SourceEvent\n  -> bounded sequence / lineage coverage scan\n  -> consent, retention, source, identity, room, and scene fences\n  -> bounded unassessed recent-evidence selection\n  -> normal REL / SCN / EMO / INT / MEM / CTX pipeline\n  -> validated sidecar or explicit deterministic operation\n  -> optional CTX-OVL candidate\n```\n\nRelayCTX may select governed references, system-owned metadata, deterministic source classes, and policy-permitted bounded source text. It must not reparse rejected raw text into relationship, scene, affect, intent, temporal-validity, shadow-target, or memory authority.\n\nCoverage must be monotonic, revision-fenced, replay-safe, and bounded by events, bytes/tokens, age, and wall time. Budget exhaustion leaves catch-up incomplete; it does not advance past an unexamined gap or authorize a broad shadow. If no later admitted turn occurs, no CTX-OVL catch-up occurs.\n\nInputs identified through trusted metadata, deterministic rules, or RelayATN advisory detection as requiring immediate provisional continuity are not eligible for terminal reject. They route to policy-controlled select, bounded hold, or fail-safe escalation; final intent, scene, and memory semantics remain downstream authority.\n\n#### Multi-user partitions and identity fences\n\nMulti-user enablement requires separate:\n\n```text\nshared_scene\nparticipant:<trusted participant>\nrelationship:<RelayREL-resolved target>\nquarantine:<missing or conflicting identity/scope>\n```\n\nUnknown or conflicting participant identity enters quarantine only. It cannot be packed as participant/REL context, shadow participant- or REL-scoped durable MEM, increase participant-specific confidence, or create relationship interpretation.\n\nA relationship partition may use only a target resolved by RelayREL from trusted route/session identity. CTX-OVL does not infer a relationship target from text.\n\n#### Private-to-group escalation\n\nRelayATN may emit only a content-free possible-scope-escalation flag. RelaySCN retains authoritative scene classification and downgrade decisions. Before group-visible packing, RelayCTX excludes or quarantines prior private partitions, suspends participant/REL shadowing while scope is unresolved, and packs only content permitted by the resolved RelaySCN policy and compatible scene epoch.\n\nThe exact scene-epoch issuer is an open contract. RelayATN never issues the epoch or chooses disclosure policy.\n\n#### RelayCTX Reflex Snapshot\n\nRelayATN may consume a bounded content-free RelayCTX Reflex Snapshot for **CTX-derived session state**. The snapshot may expose revisions, covered ingress sequence or lag class, scene epoch, bounded counts, and booleans such as unresolved direct address, correction, scope escalation, or identity conflict.\n\nIt must not expose source text, semantic objects, subjective interpretation, affect content, sidecar bodies, durable MEM IDs, private REL content, confidence, salience, or shadow targets.\n\nThis does not remove RelayATN\'s existing bounded access to the raw incoming candidate required for admission scoring.\n\nRelayATN Tier 3 is not a semantic-sidecar repair path. CTX-OVL state, hot affect, provisional shadow state, and RelayATN scores must not directly update a resident attention profile, REL/SCN state, or any durable MEM property.\n\nCTX-OVL loss, eviction, catch-up failure, or restart may reduce short-term continuity. It must not delete or weaken Protected Source Evidence or durable MEM.\n\nThe detailed review and the non-authoritative counterpart checklist for the RelayATN-owned architecture document are recorded in [RelayATN / CTX-OVL Boundary Review](../evidence/implementation/relayatn-ctx-ovl-boundary-review.md).\n\n'
          if "### RelayATN, governed ingress, and catch-up boundary" not in proposal:
              if marker not in proposal:
                  raise SystemExit("proposal insertion marker missing")
              proposal = proposal.replace(marker, section + marker, 1)

          seq_start = proposal.index("## Recommended implementation sequence\n")
          seq_end = proposal.index("## Non-goals\n", seq_start)
          proposal = proposal[:seq_start] + '## Recommended implementation sequence\n\n1. Accept or reject this direction through an ADR.\n2. Define governed SourceEvent identity, evidence-admission ownership, consent, retention, source authority, and ingress ordering before any rejected-input catch-up.\n3. Define the CTX evidence envelope, system-owned metadata, and bounded selected-recent-evidence projection.\n4. Implement CTX-OVL-0 only after contract acceptance: exact overlay contract and isolated in-memory store in dry-run/read-only form.\n5. Implement CTX-OVL-1: non-stream current-session continuity for admitted turns.\n6. Specify and evaluate bounded rejected-ingress coverage/catch-up without automatic semantic projection.\n7. Gate multi-user enablement on shared-scene, participant, RelayREL-resolved relationship, and quarantine partitions.\n8. Define the content-free RelayCTX Reflex Snapshot and update the RelayATN-owned architecture document through its own authority path.\n9. Implement CTX-OVL-2: Retrieval boost/shadow and dynamic-suffix packing after participant, scene, and identity fences are validated.\n10. Implement CTX-OVL-3: stream-safe finalization ordering.\n11. Run ATN + CTX-OVL + multi-user + stream concurrency and privacy evaluation.\n12. Implement CTX-OVL-4: RelaySLP source-lineage acknowledgement and overlay cleanup.\n13. Consider CTX-OVL-5 restart recovery only if measured user value justifies durable checkpoint complexity.\n14. Run the aggregation and Retrieval-scale spikes.\n15. Correct and extend the storage spike with final lifecycle semantics and complete crash tests.\n16. Define exact contracts and rehearse import, rebuild, backup, rollback, and migration.\n17. Perform one hard cutover without permanent dual-read or dual-write.\n\n' + proposal[seq_end:]
          proposal = proposal.replace(
              "- make Session Evidence Overlay a second durable memory store;\n",
              "- make Session Evidence Overlay a second durable memory store;\n"
              "- amend RelayATN architecture or authorize RelayATN implementation;\n"
              "- convert every turn-rejected event into a CTX-OVL semantic candidate;\n",
          )
          proposal_path.write_text(proposal, encoding="utf-8")

          feasibility = feasibility_path.read_text(encoding="utf-8")
          feasibility = feasibility.replace(
              "  - SCN or EMO conditioning boundaries change\n",
              "  - SCN or EMO conditioning boundaries change\n"
              "  - RelayATN, governed ingress, or multi-user partition boundaries change\n",
          )
          feasibility = feasibility.replace(
              "relaylm_source_commit: 103bc03f90c9fda089b5a9e0d5197607e96a303f\n",
              "relaylm_source_commit: 5d60433713574c042afe5ceab15b865a48824ae5\n"
              "relaylm_source_pr: 586\n",
          )
          feas_marker = "## Missing implementation pieces\n"
          feas_section = '## RelayATN and governed-ingress feasibility boundary\n\n[RelayATN / CTX-OVL Boundary Review](relayatn-ctx-ovl-boundary-review.md) re-evaluates this proposal against current `main` at `5d60433713574c042afe5ceab15b865a48824ae5` and PR #586 head `707d81523b9eec8469f0e1a23f2842bd6da514dd`.\n\nThe integration is feasible only through a directional boundary:\n\n```text\nraw ingress candidate\n  -> RelayATN admission scoring\n\ngoverned retained SourceEvent\n  -> bounded RelayCTX catch-up selection on a later admitted request\n\nCTX-OVL\n  -> content-free RelayCTX Reflex Snapshot\n  -> RelayATN advisory freshness signals\n\nRelayATN\n  -/-> CTX-OVL mutation\n  -/-> semantic sidecar repair\n  -/-> durable memory authority\n```\n\nThe review accepts RelayATN non-write, evidence/turn-admission separation, multi-user partitioning, unknown-identity quarantine, private-to-group packing fences, and a content-free Reflex Snapshot.\n\nIt revises the input in four important ways:\n\n1. RelayATN still reads the raw incoming candidate being scored; only CTX-derived state is snapshot-only.\n2. Rejected events are eligible for bounded catch-up consideration, not automatic semantic candidate creation.\n3. Pre-response catch-up may select unassessed governed evidence, but RelayCTX must not infer REL, SCN, EMO, INT, temporal-validity, shadow-target, or memory semantics from rejected raw text.\n4. RelayATN only flags escalation; RelaySCN classifies the scene and RelayCTX enforces the pre-pack quarantine or scene-epoch fence.\n\nThe governed SourceEvent envelope, evidence-admission ownership, ingress sequence, coverage watermark, pre-node hydration point, Reflex Snapshot, multi-user partition schema, and scene-epoch handoff are missing contracts. This evidence record therefore supports contract design and evaluation only; it does not authorize implementation.\n\nRequired failure behavior includes:\n\n- missing or expired SourceEvent -> no overlay mutation and no synthesized evidence;\n- budget exhaustion -> bounded stop with incomplete coverage;\n- stale revision or replay -> idempotent no-op or deferred retry;\n- missing/conflicting identity -> quarantine and no shadow;\n- unresolved private-to-group escalation -> no private partition packing;\n- stale/missing Reflex Snapshot -> no CTX-derived assumption;\n- RelayATN failure -> evidence admission and Protected Source Evidence unchanged;\n- CTX-OVL eviction/restart -> continuity loss only;\n- malformed sidecar -> visible response preserved, no ATN repair, evidence-only fallback or no update.\n\nThe exact counterpart changes required in `RelayATN Reflex Layer Design` are listed in the review evidence rather than duplicated here as active architecture authority.\n\n'
          if "## RelayATN and governed-ingress feasibility boundary" not in feasibility:
              if feas_marker not in feasibility:
                  raise SystemExit("feasibility insertion marker missing")
              feasibility = feasibility.replace(feas_marker, feas_section + feas_marker, 1)
          feasibility_path.write_text(feasibility, encoding="utf-8")

          review_path.write_text('''---
