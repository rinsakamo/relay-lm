name: Token estimation smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - relaylm/token_budget.py
      - relaylm/memory_token_budget.py
      - relaylm/memory_token_dry_run.py
      - relaylm/token_budget_truncation.py
      - relaylm/relaymem_runtime_ctx.py
      - scripts/relaylm_cjk_token_estimation_smoke.py
      - scripts/relaylm_fullwidth_space_token_smoke.py
      - scripts/relaylm_relaymem_cjk_runtime_estimation_smoke.py
      - scripts/relaylm_token_memory_dry_run_smoke.py
      - scripts/relaylm_token_budget_truncation*_smoke.py
      - docs/PROJECT_STATUS.md
      - docs/architecture/phase5d1_cjk_token_estimation_handoff.md
      - docs/architecture/pipeline_implementation_plan.md
      - docs/config_schema.md
      - .github/workflows/token-estimation-smoke.yml
  push:
    branches: [main]
    paths:
      - relaylm/token_budget.py
      - relaylm/memory_token_budget.py
      - relaylm/memory_token_dry_run.py
      - relaylm/token_budget_truncation.py
      - relaylm/relaymem_runtime_ctx.py
      - scripts/relaylm_cjk_token_estimation_smoke.py
      - scripts/relaylm_fullwidth_space_token_smoke.py
      - scripts/relaylm_relaymem_cjk_runtime_estimation_smoke.py
      - scripts/relaylm_token_memory_dry_run_smoke.py
      - scripts/relaylm_token_budget_truncation*_smoke.py
      - docs/PROJECT_STATUS.md
      - docs/architecture/phase5d1_cjk_token_estimation_handoff.md
      - docs/architecture/pipeline_implementation_plan.md
      - docs/config_schema.md
      - .github/workflows/token-estimation-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and smoke scripts
        run: python -m compileall relaylm scripts
      - name: Run CJK estimator contract
        run: python scripts/relaylm_cjk_token_estimation_smoke.py
      - name: Run full-width space regression
        run: python scripts/relaylm_fullwidth_space_token_smoke.py
      - name: Run RelayMEM CJK runtime estimate contract
        run: python scripts/relaylm_relaymem_cjk_runtime_estimation_smoke.py
      - name: Run token memory regression
        run: python scripts/relaylm_token_memory_dry_run_smoke.py
      - name: Run message truncation contract
        run: python scripts/relaylm_token_budget_truncation_smoke.py
      - name: Run truncation dry-run regression
        run: python scripts/relaylm_token_budget_truncation_dry_run_smoke.py
      - name: Run truncation apply regression
        run: python scripts/relaylm_token_budget_truncation_apply_smoke.py
      - name: Run truncation proxy regression
        run: python scripts/relaylm_token_budget_truncation_proxy_smoke.py
