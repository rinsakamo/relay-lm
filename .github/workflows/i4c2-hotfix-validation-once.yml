name: I-4C2 concurrent loser hotfix validation

on:
  push:
    branches:
      - fix-i4c2-concurrent-forget-loser
    paths:
      - ".github/workflows/i4c2-hotfix-validation-once.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-i4c2-concurrent-forget-loser
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full I-4C2 regression gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_check() {
            local name="$1"
            shift
            local log
            log="$(mktemp)"
            echo "==> ${name}"
            if "$@" >"${log}" 2>&1; then
              cat "${log}"
              rm -f "${log}"
              return 0
            fi
            local status=$?
            {
              echo "### I-4C2 hotfix validation failed"
              echo
              echo "**Check:** ${name}"
              echo
              tail -n 120 "${log}" | sed 's/^/    /'
            } > /tmp/i4c2-hotfix-comment.md
            cat "${log}"
            gh pr comment 407 --repo "$GITHUB_REPOSITORY" --body-file /tmp/i4c2-hotfix-comment.md
            rm -f "${log}"
            exit "${status}"
          }

          run_check "Install RelayLM" python -m pip install -e .
          run_check "Compile repository Python" python -m compileall -q relaylm scripts
          run_check "I-4C2 recovery/finalization" env PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_recovery_smoke.py
          run_check "I-4C2 fault/restart" env PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_fault_smoke.py
          run_check "I-4C2 concurrency" env PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_concurrency_smoke.py
          run_check "I-4C2 security" env PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_security_smoke.py
          run_check "I-4C2 ownership boundary" env PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_ownership_boundary_smoke.py
          run_check "I-4C1 hidden successor" env PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c1_primary_forget_hidden_successor_smoke.py
          run_check "I-4C1 fault" env PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c1_primary_forget_fault_smoke.py
          run_check "I-4C1 concurrency" env PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c1_primary_forget_concurrency_smoke.py
          run_check "I-4C1 security" env PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c1_primary_forget_security_smoke.py
          run_check "I-4B resolver/fence" env PYTHONPATH=.:scripts python scripts/relaylm_phase_i4b_ci_runner.py
          run_check "I-3 Correct" env PYTHONPATH=.:scripts python scripts/relaylm_phase_i3_primary_mem_correct_ci_runner.py
          run_check "M3e page writer" env PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_smoke.py
          run_check "M3f reconciliation" env PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_reconciliation_smoke.py
          run_check "M3g reconciliation apply" env PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_apply_smoke.py
          run_check "M3h recovery audit" env PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_recovery_audit_smoke.py
          run_check "Documentation links" env PYTHONPATH=. python scripts/relaylm_docs_link_check.py
          run_check "Documentation current boundary" env PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          run_check "Clean working tree" bash -lc 'git status --short; test -z "$(git status --short)"'
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/i4c2-hotfix-validation-once.yml
          git commit -m "chore: remove temporary I-4C2 hotfix validation workflow"
          git push origin HEAD:fix-i4c2-concurrent-forget-loser
