name: LC1A fix preimage helper

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/lc1a-subjective-mem-correct'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - name: Replace preimage helper only
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path('relaylm/subjective_mem_lifecycle_runtime.py')
          text = path.read_text(encoding='utf-8')
          left = text.index('def _validate_pre_image_authority_current(\n')
          right = text.index('def _predecessor_from_artifact(\n', left)
          replacement = base64.b64decode('').decode('utf-8')
          updated = text[:left] + replacement + text[right:]
          if updated == text:
              raise SystemExit('preimage helper unchanged')
          path.write_text(updated, encoding='utf-8')
          PY
          git diff --check
          git diff --stat -- relaylm/subjective_mem_lifecycle_runtime.py
          rm -f .github/workflows/lc1a-fix-preimage.yml .github/lc1a-fix-preimage-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize LC-1A preimage authority helper'
          git push origin HEAD:agent/lc1a-subjective-mem-correct
