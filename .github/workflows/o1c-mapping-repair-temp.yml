name: Temporary O1C mapping repair

on:
  push:
    branches:
      - phase-o1c-eligible-b2-queue-lane
    paths:
      - "scripts/_fix_o1c_mapping.py"
      - ".github/workflows/o1c-mapping-repair-temp.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-o1c-eligible-b2-queue-lane
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Repair and validate O1C mapping
        run: |
          python scripts/_fix_o1c_mapping.py
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_o1c_eligible_queue_lane_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1c_eligible_queue_lane_security_smoke.py
      - name: Commit repaired production mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/o1c-mapping-repair-temp.yml scripts/_fix_o1c_mapping.py
          git add relaylm/relaymem_slp_scheduler_queue_lane.py
          git commit -m "fix: preserve C2 source retry classification"
          git push origin HEAD:phase-o1c-eligible-b2-queue-lane
