name: Documentation cutover 1C-9 PR applicator

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 566 && github.event.pull_request.head.ref == 'agent/docs-cutover-1c9-wave7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c9-wave7
          fetch-depth: 0
          show-progress: false

      - name: Prepare applicator inventory correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/docs_cutover_1c9.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'if not path.is_file() or ".git" in path.parts:',
              'if not path.is_file() or ".git" in path.parts or ".github" in path.parts:',
          )

          anchor = '''replace(
              "scripts/relaylm_documentation_current_boundary_smoke.py",
              "    \\\"docs/architecture/wave7_cross_slice_convergence_audit.md\\\",\\n",
              "",
              1,
          )
          '''
          addition = anchor + '''replace(
              "scripts/relaylm_documentation_current_boundary_smoke.py",
              "    \\\"docs/architecture/wave7_cross_slice_convergence_audit.md\\\": (\\n"
              "        \\\"# Wave 7 Cross-Slice Convergence Audit\\\",\\n"
              "        \\\"PR #436\\\",\\n"
              "        \\\"7bb2525cb000e893146408065f1aa5976f2b54ab\\\",\\n"
              "        \\\"PR #437\\\",\\n"
              "        \\\"e6e5b32cd489dda493ff0171a260dd561a91765c\\\",\\n"
              "        \\\"E1-R3 provenance-preserving Primary MEM formation summary: complete\\\",\\n"
              "        \\\"E1-R4 retrieval-response grounding and unsupported-detail suppression: complete\\\",\\n"
              "        \\\"W7-INT is merged.\\\",\\n"
              "    ),\\n",
              "",
              1,
          )
          '''
          assert text.count(anchor) == 1
          text = text.replace(anchor, addition)
          assert text.count('script_hard_coded_path_reference_occurrences_updated_in_pr_tree: 3') == 1
          text = text.replace(
              'script_hard_coded_path_reference_occurrences_updated_in_pr_tree: 3',
              'script_hard_coded_path_reference_occurrences_updated_in_pr_tree: 4',
          )
          assert text.count('three hard-coded script occurrences across two smoke files') == 1
          text = text.replace(
              'three hard-coded script occurrences across two smoke files',
              'four hard-coded script occurrences across two smoke files',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply Wave 7 evidence cutover
        id: cutover
        continue-on-error: true
        shell: bash
        run: python .github/scripts/docs_cutover_1c9.py > cutover-apply.log 2>&1

      - name: Stop after applicator failure
        if: steps.cutover.outcome == 'failure'
        shell: bash
        run: |
          cat cutover-apply.log
          exit 1

      - name: Validate cutover
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== compileall ==='
            python -m compileall relaylm scripts
            echo '=== documentation links ==='
            python scripts/relaylm_docs_link_check.py
            echo '=== semantic audit ==='
            python scripts/relaylm_docs_semantic_audit.py
            echo '=== current boundary ==='
            python scripts/relaylm_documentation_current_boundary_smoke.py
            echo '=== E1 consolidation ==='
            python scripts/relaylm_e1_evaluation_consolidation_smoke.py
            echo '=== diff check ==='
            git diff --check
          } > cutover-validation.log 2>&1

      - name: Upload cutover diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-cutover-1c9-diagnostics
          path: |
            cutover-apply.log
            cutover-validation.log
          if-no-files-found: error

      - name: Stop after validation failure
        if: steps.validate.outcome == 'failure'
        shell: bash
        run: |
          cat cutover-validation.log
          exit 1

      - name: Commit cutover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: move Wave 7 convergence audit in cutover 1C-9"
          git push origin HEAD:agent/docs-cutover-1c9-wave7
