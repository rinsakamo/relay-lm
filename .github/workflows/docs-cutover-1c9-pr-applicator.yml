name: Documentation cutover 1C-9 PR applicator

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 566 && github.event.pull_request.head.ref == 'agent/docs-cutover-1c9-wave7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c9-wave7
          fetch-depth: 0

      - name: Apply Wave 7 evidence cutover
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/if not path.is_file() or "\.git" in path.parts:/if not path.is_file() or ".git" in path.parts or ".github" in path.parts:/' .github/scripts/docs_cutover_1c9.py
          python .github/scripts/docs_cutover_1c9.py

      - name: Validate cutover
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall relaylm scripts
          python scripts/relaylm_documentation_link_check.py
          python scripts/relaylm_docs_semantic_audit.py
          python scripts/relaylm_documentation_current_boundary_smoke.py
          python scripts/relaylm_e1_evaluation_consolidation_smoke.py
          git diff --check

      - name: Commit cutover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: move Wave 7 convergence audit in cutover 1C-9"
          git push origin HEAD:agent/docs-cutover-1c9-wave7
