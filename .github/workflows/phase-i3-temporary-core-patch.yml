name: Temporary Phase I-3 core patch

on:
  push:
    branches:
      - phase-i3-auditable-primary-mem-correct
    paths:
      - scripts/_phase_i3_m3e_replay_patch.py
      - .github/workflows/phase-i3-temporary-core-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i3-auditable-primary-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/_phase_i3_m3e_replay_patch.py
      - run: python -m compileall -q relaylm/relaymem_primary_correction.py
      - name: Commit source update
        run: |
          rm scripts/_phase_i3_m3e_replay_patch.py
          rm .github/workflows/phase-i3-temporary-core-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relaylm/relaymem_primary_correction.py
          git add -u scripts/_phase_i3_m3e_replay_patch.py .github/workflows/phase-i3-temporary-core-patch.yml
          git commit -m "fix: handle existing exact Primary page in I3 recovery"
          git push origin HEAD:phase-i3-auditable-primary-mem-correct
