name: Wave 3 cross-slice convergence

on:
  pull_request:
    paths:
      - "docs/PROJECT_STATUS.md"
      - "docs/README.md"
      - "docs/mvp/README.md"
      - "docs/mvp/wave3/*.md"
      - "docs/architecture/wave3_cross_slice_convergence_audit.md"
      - "docs/architecture/i1ge_durable_finalization_crash_validation.md"
      - "docs/architecture/phase_i4d_primary_retrieval_exclusion.md"
      - "docs/architecture/o1d1_production_scheduler_round.md"
      - "docs/architecture/README.md"
      - "docs/config_schema.md"
      - "config.example.yaml"
      - "relaylm/config.py"
      - "relaylm/relaymem_slp_scheduler_round.py"
      - "relaylm/relaymem_primary_recall.py"
      - "relaylm/relaymem_primary_retrieval_eligibility.py"
      - "scripts/relaylm_wave3_cross_slice_*.py"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - ".github/workflows/wave3-cross-slice-convergence.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m compileall -q relaylm scripts
      - run: PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model --check-all
      - run: PYTHONPATH=. python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_wave3_cross_slice_convergence_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_wave3_cross_slice_security_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1ge_durable_finalization_security_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4d_security_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_o1d1_production_round_security_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_o1b_sealed_replay_lane_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_o1c_eligible_queue_lane_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_wave2_cross_slice_convergence_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
      - run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
      - run: test -z "$(git status --short)"
