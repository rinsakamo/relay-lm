name: Phase I-1 store smoke projection diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/relaylm_relaymem_store_dry_run_smoke.py"
      - ".github/workflows/_phase_i1_store_smoke_projection_patch.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run updated store smoke
        id: smoke
        continue-on-error: true
        run: python scripts/relaylm_relaymem_store_dry_run_smoke.py > phase-i1-store-smoke.log 2>&1
      - name: Upload store smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-i1-store-smoke-log
          path: phase-i1-store-smoke.log
          if-no-files-found: error
      - name: Fail when store smoke failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
