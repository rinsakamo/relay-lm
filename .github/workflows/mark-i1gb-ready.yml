name: Mark I1-GB ready

on:
  pull_request:
    branches:
      - main
    paths:
      - .mark-i1gb-ready

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 387 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 387 --repo rinsakamo/relay-lm
