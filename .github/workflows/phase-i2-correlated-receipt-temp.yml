name: Phase I-2 correlated receipt update

on:
  pull_request:
    paths:
      - ".github/workflows/phase-i2-correlated-receipt-temp.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/phase_i2_correlated_receipt_temp.py
      - run: python -m compileall -q relaylm scripts
      - name: Commit updates
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add relaylm/soul_lab_observation_store.py relaylm/soul_lab_observation_projection.py scripts/relaylm_phase_i2_lab_observation_security_smoke.py
          git diff --cached --quiet || git commit -m "fix: correlate latest run observation receipts exactly"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
