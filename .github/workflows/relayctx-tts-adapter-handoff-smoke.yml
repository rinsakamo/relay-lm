name: RelayCTX TTS adapter handoff smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - relaylm/relayctx_tts_adapter_handoff.py
      - relaylm/relayctx_tts_segmentation.py
      - scripts/relaylm_relayctx_tts_adapter_handoff_smoke.py
      - docs/PROJECT_STATUS.md
      - docs/architecture/phase5_5_stream_unpack_bounded_slice.md
      - docs/architecture/phase55c1_tts_adapter_handoff_contract.md
      - docs/architecture/pipeline_implementation_plan.md
      - .github/workflows/relayctx-tts-adapter-handoff-smoke.yml
      - pyproject.toml
  push:
    branches: [main]
    paths:
      - relaylm/relayctx_tts_adapter_handoff.py
      - relaylm/relayctx_tts_segmentation.py
      - scripts/relaylm_relayctx_tts_adapter_handoff_smoke.py
      - docs/PROJECT_STATUS.md
      - docs/architecture/phase5_5_stream_unpack_bounded_slice.md
      - docs/architecture/phase55c1_tts_adapter_handoff_contract.md
      - docs/architecture/pipeline_implementation_plan.md
      - .github/workflows/relayctx-tts-adapter-handoff-smoke.yml
      - pyproject.toml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and smoke scripts
        run: python -m compileall relaylm scripts
      - name: Run TTS adapter handoff smoke
        run: python scripts/relaylm_relayctx_tts_adapter_handoff_smoke.py
