name: Phase 6-B3 targeted renewal patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase6b3-targeted-renewal-patch.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply bounded renewal fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "relaylm/relaymem_slp_queue_state.py",
              '        expiry = parse_timestamp(record["lease_expires_at"])\n        assert expiry is not None\n        renewed_text, error = _lease_expiry(expiry, request.lease_duration_seconds)',
              '        renewed_text, error = _lease_expiry(now, request.lease_duration_seconds)',
          )

          replace_once(
              "scripts/relaylm_phase6b3_queue_state_smoke.py",
              '            assert renewed["lease_expires_at"] > claimed["lease_expires_at"]',
              '            assert renewed["claim_owner"] == claimed["claim_owner"]\n            assert renewed["lease_acquired_at"] == claimed["lease_acquired_at"]\n            assert renewed["lease_expires_at"] == "2026-06-22T01:00:35.000000Z"\n            assert renewed["lease_expires_at"] != "2026-06-22T01:01:00.000000Z"',
          )

          replace_once(
              "docs/architecture/phase6b3_relayslp_queue_state_helpers.md",
              'Renewal increments only `record_revision`, updates `updated_at`, and extends `lease_expires_at`. It preserves attempt count, claim generation, owner, lease token, and lease acquisition time. Timestamp arithmetic overflow and clock regression are returned as bounded blocked results rather than exceptions.',
              'Renewal increments only `record_revision`, updates `updated_at`, and resets `lease_expires_at` to the validated current UTC transition time plus the bounded requested lease duration. It does not accumulate duration from the previous expiry. It preserves attempt count, claim generation, owner, lease token, and lease acquisition time. Timestamp arithmetic overflow and clock regression are returned as bounded blocked results rather than exceptions.',
          )

          Path(".github/workflows/phase6b3-targeted-renewal-patch.yml").unlink()
          PY
      - name: Commit targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bound lease renewal from current time"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
