name: Managed apply regression smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - relaylm/**
      - scripts/relaylm_client_msg_runtime_dry_run_smoke.py
      - scripts/relaylm_client_instruction_identity_smoke.py
      - scripts/relaylm_client_identity_runtime_private_smoke.py
      - scripts/relaylm_client_instruction_cache_reader_smoke.py
      - scripts/relaylm_client_instruction_cache_lookup_smoke.py
      - scripts/relaylm_client_instruction_cache_lookup_dependency_smoke.py
      - scripts/relaylm_client_instruction_cache_lookup_runtime_smoke.py
      - scripts/relaylm_client_history_exclusion_preflight_smoke.py
      - scripts/relaylm_client_history_exclusion_apply_contract_smoke.py
      - scripts/relaylm_client_history_exclusion_apply_runtime_smoke.py
      - scripts/relaylm_client_history_exclusion_apply_forward_gate_smoke.py
      - scripts/relaylm_system_fallback_smoke.py
      - scripts/relaylm_trace_content_free_contract_smoke.py
      - scripts/relaylm_jsonl_trace_smoke.py
      - scripts/relaylm_hardening_smoke.py
      - .github/workflows/managed-apply-regression-smoke.yml
  push:
    branches: [main]
    paths:
      - relaylm/**
      - scripts/relaylm_client_msg_runtime_dry_run_smoke.py
      - scripts/relaylm_client_instruction_identity_smoke.py
      - scripts/relaylm_client_identity_runtime_private_smoke.py
      - scripts/relaylm_client_instruction_cache_reader_smoke.py
      - scripts/relaylm_client_instruction_cache_lookup_smoke.py
      - scripts/relaylm_client_instruction_cache_lookup_dependency_smoke.py
      - scripts/relaylm_client_instruction_cache_lookup_runtime_smoke.py
      - scripts/relaylm_client_history_exclusion_preflight_smoke.py
      - scripts/relaylm_client_history_exclusion_apply_contract_smoke.py
      - scripts/relaylm_client_history_exclusion_apply_runtime_smoke.py
      - scripts/relaylm_client_history_exclusion_apply_forward_gate_smoke.py
      - scripts/relaylm_system_fallback_smoke.py
      - scripts/relaylm_trace_content_free_contract_smoke.py
      - scripts/relaylm_jsonl_trace_smoke.py
      - scripts/relaylm_hardening_smoke.py
      - .github/workflows/managed-apply-regression-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - relaylm_client_msg_runtime_dry_run_smoke.py
          - relaylm_client_instruction_identity_smoke.py
          - relaylm_client_identity_runtime_private_smoke.py
          - relaylm_client_instruction_cache_reader_smoke.py
          - relaylm_client_instruction_cache_lookup_smoke.py
          - relaylm_client_instruction_cache_lookup_dependency_smoke.py
          - relaylm_client_instruction_cache_lookup_runtime_smoke.py
          - relaylm_client_history_exclusion_preflight_smoke.py
          - relaylm_client_history_exclusion_apply_contract_smoke.py
          - relaylm_client_history_exclusion_apply_runtime_smoke.py
          - relaylm_client_history_exclusion_apply_forward_gate_smoke.py
          - relaylm_system_fallback_smoke.py
          - relaylm_trace_content_free_contract_smoke.py
          - relaylm_jsonl_trace_smoke.py
          - relaylm_hardening_smoke.py
    name: ${{ matrix.script }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/${{ matrix.script }}
