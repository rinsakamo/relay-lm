name: Temporary I1-GD documentation reconciliation

on:
  push:
    branches:
      - phase-i1gd-durable-finalization-retention-cleanup
    paths:
      - .github/workflows/tmp-i1gd-doc-reconcile.yml

permissions:
  contents: write

concurrency:
  group: tmp-i1gd-doc-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i1gd-durable-finalization-retention-cleanup
          fetch-depth: 0
      - name: Reconcile current documentation boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "docs/PROJECT_STATUS.md",
              """I-4C2 prepared recovery / tombstone
          || O1B sealed-record discovery
          || O1C queue-record discovery
          || I1-GE crash validation preparation""",
              """I-4C2 prepared recovery / tombstone
          || I1-GE crash validation preparation""",
          )
          replace_once(
              "docs/PROJECT_STATUS.md",
              "- O1B through O1F, O2, and O3;",
              "- O1D through O1F, O2, and O3;",
          )

          replace_once(
              "docs/README.md",
              "[Current project status](PROJECT_STATUS.md) — current implementation boundary through I1-GD, I-4C1, O0, O1A, UI-B0, and the local E1 result.",
              "[Current project status](PROJECT_STATUS.md) — current implementation boundary through I1-GD, I-4C1, O0, O1A, O1B, O1C, UI-B0, and the local E1 result.",
          )
          replace_once(
              "docs/README.md",
              """- [O1A two-lane scheduler contract](architecture/o1a_two_lane_scheduler_contract.md)
          - [I1-G durable-finalization contract and completed GA-GD boundaries](architecture/i1g_pre_enqueue_durable_finalization_contract.md)
          - [I1-GD durable-finalization retention and isolation lifecycle](architecture/i1gd_durable_finalization_retention_cleanup.md)""",
              """- [O1A two-lane scheduler contract](architecture/o1a_two_lane_scheduler_contract.md)
          - [O1C eligible B2/B3 queue lane](architecture/o1c_eligible_b2_queue_lane.md)
          - [I1-G durable-finalization contract and completed GA-GD boundaries](architecture/i1g_pre_enqueue_durable_finalization_contract.md)
          - [I1-GD durable-finalization retention and isolation lifecycle](architecture/i1gd_durable_finalization_retention_cleanup.md)""",
          )

          replace_once(
              "docs/architecture/README.md",
              "I1-GC provides the caller-selected one-record convergence authority. I1-GD provides bounded retention and isolation cleanup while preserving sealed-pending replay evidence, using the same per-record fence as I1-GC plus the existing I1-GB root mutation lock, and leaving I1-GE full crash validation unimplemented. O1B through O1F remain production scheduling work. O1A is only the pure replay-before-queue round/idle contract.",
              "I1-GC provides the caller-selected one-record convergence authority. I1-GD provides bounded retention and isolation cleanup while preserving sealed-pending replay evidence, using the same per-record fence as I1-GC plus the existing I1-GB root mutation lock, and leaving I1-GE full crash validation unimplemented. O1A remains the pure replay-before-queue round/idle contract. O1B is complete for one bounded sealed-record replay-lane opportunity, and O1C is complete for one bounded queue-lane opportunity. O1D through O1F remain production scheduling work; no scheduler loop, fairness policy, stale recovery, supervision, or always-on operation is complete.",
          )

          replace_once(
              "docs/architecture/i1g_pre_enqueue_durable_finalization_contract.md",
              "O1A defines only the scheduler-side two-lane round contract. Future O1B discovers at most one eligible sealed record, canonically rereads eligibility, and calls I1-GC once. O1B does not own replay, completion, C1-5, B2, retention, or cleanup.",
              "O1A defines only the scheduler-side two-lane round contract. O1B is complete for one bounded eligible sealed-record discovery, canonical selected-record reread, and at most one I1-GC call. O1C is complete for one independent bounded B2/B3 queue discovery, canonical reread, server-owned scope resolution, and at most one existing C2 call. Neither lane owns I1-G replay, completion, C1-5, B2/B3 lifecycle, retention, cleanup, or worker execution.",
          )
          replace_once(
              "docs/architecture/i1g_pre_enqueue_durable_finalization_contract.md",
              "Future O1B may perform one bounded non-recursive discovery, secure eligibility classification, deterministic one-candidate selection, canonical reread, and one I1-GC call. It must not:",
              "O1B performs one bounded non-recursive discovery, secure eligibility classification, deterministic one-candidate selection, canonical reread, and at most one I1-GC call. It must not:",
          )
          replace_once(
              "docs/architecture/i1g_pre_enqueue_durable_finalization_contract.md",
              "Current status documents must describe I1-GA through I1-GD as complete and leave I1-GE and O1B onward unimplemented.",
              """Current status documents must describe I1-GA through I1-GD, O1B, and O1C as complete; I1-GE and O1D onward remain unimplemented.

          <!-- O1B_CURRENT_BOUNDARY -->
          ### O1B sealed replay-lane discovery — complete

          O1B owns one bounded secure inventory of the configured durable-finalization root, exact grouping and eligibility classification, lexicographic selection of one sealed-pending locator, canonical selected-locator reread, and at most one delegation to the existing I1-GC authority. It owns no replay algorithm, completion publication, retention, cleanup, queue lane, C2/worker execution, polling, fairness, backoff, shutdown, supervision, or always-on operation.

          ### O1C queue-lane discovery — complete

          O1C owns one bounded secure B2/B3 inventory, due/future classification, deterministic one-candidate selection, canonical reread, server-owned scope resolution, exact C2 request construction, and at most one existing C2 delegation. It owns no replay output handoff, B3 lifecycle, worker execution, polling, fairness, backoff, shutdown, supervision, or always-on operation.""",
          )

          replace_once(
              "docs/architecture/post_i3_evaluation_work_roadmap.md",
              "Phase I-3 Correct, UI-B0 real Home conversation, O0 local one-job execution, I1-GA through I1-GD, I-4B, I-4C1, and O1A are complete at their bounded boundaries. Phase I-4A remains the target Forget / Hide contract. I1-GE, I-4C2 through I-4F, and O1B through O1F remain incomplete.",
              "Phase I-3 Correct, UI-B0 real Home conversation, O0 local one-job execution, I1-GA through I1-GD, I-4B, I-4C1, O1A, O1B, and O1C are complete at their bounded boundaries. Phase I-4A remains the target Forget / Hide contract. I1-GE, I-4C2 through I-4F, and O1D through O1F remain incomplete.",
          )
          replace_once(
              "docs/architecture/post_i3_evaluation_work_roadmap.md",
              "- O1A pure replay-before-queue round/idle contract;",
              """- O1A pure replay-before-queue round/idle contract;
          - O1B one bounded sealed-record replay-lane adapter;
          - O1C one bounded queue-lane adapter;""",
          )
          replace_once(
              "docs/architecture/post_i3_evaluation_work_roadmap.md",
              "-> O0 or later O1C queue execution",
              "-> O0 or O1C queue execution",
          )
          replace_once(
              "docs/architecture/post_i3_evaluation_work_roadmap.md",
              """I-4C2
          || O1B
          || O1C
          || UI-B1A projection design""",
              """I-4C2
          || UI-B1A projection design
          || I1-GE crash validation preparation""",
          )
          replace_once(
              "docs/architecture/post_i3_evaluation_work_roadmap.md",
              "- O1A is contract-only; O1B through O1F remain unimplemented.",
              "- O1A is contract-only; O1B and O1C bounded lane adapters are complete; O1D through O1F remain unimplemented.",
          )

          replace_once(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "I1-GC one-record replay and completion convergence is complete outside RelayMEM lifecycle authority. I1-GD bounded retention and isolation cleanup is also complete outside RelayMEM lifecycle authority. I1-GE and O1B through O1F remain operations work.",
              "I1-GC one-record replay and completion convergence is complete outside RelayMEM lifecycle authority. I1-GD bounded retention and isolation cleanup is also complete outside RelayMEM lifecycle authority. O1B and O1C are complete bounded lane adapters. I1-GE and O1D through O1F remain operations work.",
          )
          replace_once(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "O1A defines a pure replay-before-queue round with at most one future I1-GC delegation and at most one future C2 delegation. O1D through O1F remain unimplemented. Replay output is never a direct queue/C2 input.",
              "O1A defines a pure replay-before-queue round. O1B supplies at most one existing I1-GC delegation and O1C supplies at most one existing C2 delegation through independent discovery and canonical reread. O1D through O1F remain unimplemented. Replay output is never a direct queue/C2 input.",
          )
          replace_once(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "Parallel non-RelayMEM operations work may proceed as O1B/O1C and I1-GE without moving their authorities into lifecycle code.",
              "Parallel non-RelayMEM operations work may proceed as I1-GE and O1D/O1E without moving their authorities into lifecycle code.",
          )
          replace_once(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "- O1A two-lane round/idle contract: complete\n- O1D through O1F production scheduling: unimplemented",
              "- O1A two-lane round/idle contract: complete\n- O1B sealed replay-lane adapter: complete\n- O1C queue-lane adapter: complete\n- O1D through O1F production scheduling: unimplemented",
          )
          replace_once(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "O1C through O1F, O2, and O3 remain unimplemented.",
              "O1D through O1F, O2, and O3 remain unimplemented.",
          )

          replace_once(
              "docs/architecture/relaymem_slp_current_target.md",
              "O1A is contract-only. O1B/O1C production discovery and delegation, O1D fairness/retry/backoff, O1E stale recovery/shutdown, O1F operational validation, O2 supervision, and O3 always-on operation remain unimplemented.",
              "O1A is contract-only. O1B and O1C bounded production discovery and delegation are complete. O1D fairness/retry/backoff, O1E stale recovery/shutdown, O1F operational validation, O2 supervision, and O3 always-on operation remain unimplemented.",
          )
          replace_once(
              "docs/architecture/relaymem_slp_current_target.md",
              "- O1B through O1F automatic scheduling, O2 supervision, and O3 always-on operation;",
              "- O1D through O1F automatic scheduling, O2 supervision, and O3 always-on operation;",
          )
          replace_once(
              "docs/architecture/relaymem_slp_current_target.md",
              "M3a-M3h, C1-0 through C1-5, C2, O0, I1-GC, I1-GD, I-1 recall, I-2 observation, I-3 Correct, I-4B, and I-4C1 are implemented. Forget is not product-complete until I-4C2 through I-4F provide recovery/tombstone, retrieval exclusion, API/UI, and production validation.",
              "M3a-M3h, C1-0 through C1-5, C2, O0, I1-GC, I1-GD, O1B, O1C, I-1 recall, I-2 observation, I-3 Correct, I-4B, and I-4C1 are implemented. O1B and O1C are bounded lane adapters only; O1D through O1F, O2, and O3 remain incomplete. Forget is not product-complete until I-4C2 through I-4F provide recovery/tombstone, retrieval exclusion, API/UI, and production validation.",
          )

          replace_once(
              "docs/architecture/o1b_sealed_i1g_replay_lane.md",
              "**Production replay-lane adapter complete. Production scheduler round, queue lane, polling, fairness, and service operation remain unimplemented.**",
              "**Production replay-lane adapter complete. O1C queue-lane adapter is also complete; the production scheduler round, polling, fairness, and service operation remain unimplemented.**",
          )
          replace_once(
              "docs/architecture/o1b_sealed_i1g_replay_lane.md",
              "O1C eligible B2 discovery + one C2 delegation          unimplemented",
              "O1C eligible B2 discovery + one C2 delegation          complete",
          )

          smoke = Path("scripts/relaylm_documentation_current_boundary_smoke.py")
          text = smoke.read_text(encoding="utf-8")
          text = text.replace(
              '    "docs/architecture/i1gd_durable_finalization_retention_cleanup.md",\n',
              '    "docs/architecture/i1gd_durable_finalization_retention_cleanup.md",\n    "docs/architecture/o1b_sealed_i1g_replay_lane.md",\n',
              1,
          )
          text = text.replace(
              "O1A adds no accepted configuration fields\n\"\"\"",
              "O1A adds no accepted configuration fields\nScheduler replay lane: O1B one bounded sealed-record discovery/reread/I1-GC adapter complete\nScheduler queue lane: O1C one bounded discovery/reread/scope/C2 adapter complete\nScheduler remaining production: O1D through O1F unimplemented\n\"\"\"",
              1,
          )
          text = text.replace(
              "O1A completion alone is not O1 completion.\n",
              "O1A completion alone is not O1 completion.\nO1B sealed replay-lane adapter: complete\nO1C eligible queue-lane adapter: complete\n",
              1,
          )
          text = text.replace(
              "O1A completion alone does not satisfy the O1 checkpoint.\n",
              "O1A completion alone does not satisfy the O1 checkpoint.\nO1B/O1C bounded production lane adapters\nO1D through O1F automatic bounded scheduling\n",
              1,
          )
          text = text.replace(
              "### I1-GE — unimplemented\n\"\"\"",
              "### I1-GE — unimplemented\nO1B sealed replay-lane discovery — complete\nO1C queue-lane discovery — complete\n\"\"\"",
              1,
          )
          text = text.replace(
              "No production hidden-state filtering exists yet because I-4D integration is not implemented\n\"\"\"",
              "No production hidden-state filtering exists yet because I-4D integration is not implemented\nO1B sealed replay-lane adapter: complete\nO1C queue-lane adapter: complete\n\"\"\"",
              1,
          )
          text = text.replace(
              "Forget is not product-complete until I-4C2 through I-4F\n\"\"\"",
              "Forget is not product-complete until I-4C2 through I-4F\nO1B and O1C bounded production discovery and delegation are complete\n\"\"\"",
              1,
          )
          text = text.replace(
              "Phase I-4C1 is complete\n\"\"\"",
              "Phase I-4C1 is complete\no1c_eligible_b2_queue_lane.md\nO1C is complete for one bounded B2/B3 inventory\n\"\"\"",
              1,
          )
          text = text.replace(
              "Phase I-4C1 Primary Forget Hidden-Successor Commit\n\"\"\"",
              "Phase I-4C1 Primary Forget Hidden-Successor Commit\nO1B is complete for one bounded sealed-record replay-lane opportunity\nO1C is complete for one bounded queue-lane opportunity\n\"\"\"",
              1,
          )
          text = text.replace(
              '    "docs/architecture/o1a_two_lane_scheduler_contract.md": """',
              '''    "docs/architecture/o1b_sealed_i1g_replay_lane.md": """
          Production replay-lane adapter complete
          bounded non-recursive secure inventory
          lexicographically first sealed-pending locator
          existing I1-GC delegation at most once
          O1C eligible B2 discovery + one C2 delegation          complete
          content-free
          """,
              "docs/architecture/o1a_two_lane_scheduler_contract.md": """''',
              1,
          )
          text = text.replace(
              "Contract and pure deterministic aggregation model complete; production scheduler unimplemented.",
              "Contract and pure deterministic aggregation model complete; O1B replay adapter and O1C queue adapter complete; production scheduler loop unimplemented.",
              1,
          )
          text = text.replace(
              "O1A performs no filesystem mutation or production scan\n\"\"\"",
              "O1A performs no filesystem mutation or production scan\nO1B and O1C are complete as bounded production lane adapters\n\"\"\"",
              1,
          )
          text = text.replace(
              "Future O1C reuse boundary\nO1C must not launch this CLI as a subprocess",
              "Shared O0/O1C production helper boundary\nO1C does not launch this CLI as a subprocess",
              1,
          )
          text = text.replace(
              "O1B  one sealed I1-G discovery and I1-GC delegation\n\"\"\"",
              "O1B  one sealed I1-G discovery and I1-GC delegation\nO1C  one B2/B3 discovery and C2 delegation — complete\n\"\"\"",
              1,
          )
          text = text.replace(
              '    "docs/architecture/soul_lab_ui_b0_real_home_conversation.md": """',
              '''    "docs/architecture/o1c_eligible_b2_queue_lane.md": """
          O1C is complete as one bounded production queue-lane adapter
          Shared O0-compatible helper
          future_retry_only
          Same-round replay independence
          O1D ordering, fairness, retry-delay policy, backoff, or jitter
          """,
              "docs/architecture/soul_lab_ui_b0_real_home_conversation.md": """''',
              1,
          )
          text = text.replace(
              "supersedes earlier roadmap entries\n\"\"\")",
              """supersedes earlier roadmap entries
          I1-GE and O1B through O1F remain operations work
          O1B through O1F remain unimplemented
          O1B/O1C production discovery and delegation, O1D fairness/retry/backoff
          Future O1B may perform
          Future O1C reuse boundary
          O1C eligible B2 discovery + one C2 delegation          unimplemented
          O1C through O1F, O2, and O3 remain unimplemented
          \"\"\")""",
              1,
          )
          smoke.write_text(text, encoding="utf-8")
          PY

          PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-i1gd-doc-reconcile.yml
          git add docs scripts/relaylm_documentation_current_boundary_smoke.py
          git commit -m "docs: reconcile I1-GD with O1B and O1C boundaries"
          git push origin HEAD:phase-i1gd-durable-finalization-retention-cleanup
