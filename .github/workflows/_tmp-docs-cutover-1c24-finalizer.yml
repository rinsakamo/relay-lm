name: Temporary Cutover 1C-24 receipt finalizer

on:
  push:
    branches:
      - agent/docs-cutover-1c24-horizontal-status-sweep
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-receipt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c24-horizontal-status-sweep
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation validation dependency
        run: python -m pip install pyyaml

      - name: Finalize receipt
        run: python scripts/_tmp_finalize_docs_cutover_1c24.py

      - name: Validate finalized receipt
        run: |
          python scripts/relaylm_docs_link_check.py
          python scripts/relaylm_docs_semantic_audit.py
          python scripts/relaylm_documentation_current_boundary_smoke.py
          python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/docs_horizontal_status_sweep_completion_report.md
          python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          git diff --check

      - name: Commit finalized receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/migrations/documentation-hard-cutover-receipt.md
          git commit -m 'docs: finalize Cutover 1C-24 receipt'
          git push origin HEAD:agent/docs-cutover-1c24-horizontal-status-sweep
