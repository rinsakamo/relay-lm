name: Docs cutover 1C-16 finalizer

on:
  pull_request:
    paths:
      - ".github/workflows/docs-cutover-1c16-finalizer.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Finalize receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/evidence/migrations/documentation-hard-cutover-receipt.md')
          body = path.read_text(encoding='utf-8')
          marker = '### C1C16-001 — E1-R3 completion report'
          start = body.index(marker)
          old = '  all_github_actions: pending'
          position = body.index(old, start)
          assert position < body.index('## Pending batches', start)
          body = body[:position] + '  all_github_actions: passed' + body[position + len(old):]
          path.write_text(body, encoding='utf-8')
          PY
      - name: Validate final state
        run: |
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_e1r3_provenance_formation_summary_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_e1r3_provenance_formation_security_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6_runtime_enqueue_source_capture_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_e1_evaluation_consolidation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/e1r3_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check
      - name: Commit receipt finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/migrations/documentation-hard-cutover-receipt.md
          git commit -m "docs: finalize Cutover 1C-16 validation state"
          git push origin HEAD:${{ github.head_ref }}
