name: Docs cutover 1C-14 applicator

on:
  pull_request:
    paths:
      - ".github/scripts/docs_cutover_1c14.py"
      - ".github/workflows/docs-cutover-1c14-applicator.yml"
      - "docs/evidence/implementation/twin_extraction_completion_report-source.txt"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Apply cutover
        run: python .github/scripts/docs_cutover_1c14.py
      - name: Validate exact source preservation
        run: test "$(git hash-object docs/evidence/implementation/twin_extraction_completion_report-source.txt)" = "c0b71f940cebf4b6de2f912870a1be7e14c90b60"
      - name: Validate Twin Extraction and completion evidence
        run: |
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_twin_extraction_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_twin_extraction_security_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/twin_extraction_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
      - name: Validate documentation
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check
      - name: Commit cutover result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: move Twin Extraction report in cutover 1C-14"
          git push origin HEAD:${{ github.head_ref }}
