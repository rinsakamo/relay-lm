name: Phase I-4C2 Primary Forget recovery and finalization

on:
  push:
    paths:
      - "relaylm/relaymem_primary_forget.py"
      - "relaylm/relaymem_primary_forget_*.py"
      - "relaylm/relaymem_primary_current_state.py"
      - "relaylm/_relaymem_primary_current_state_impl.py"
      - "relaylm/relaymem_primary_mutation_coordinator.py"
      - "scripts/relaylm_phase_i4c2_*"
      - "docs/**"
      - ".github/workflows/phase-i4c2-primary-forget-recovery.yml"
  pull_request:
    paths:
      - "relaylm/relaymem_primary_forget.py"
      - "relaylm/relaymem_primary_forget_*.py"
      - "relaylm/relaymem_primary_current_state.py"
      - "relaylm/_relaymem_primary_current_state_impl.py"
      - "relaylm/relaymem_primary_mutation_coordinator.py"
      - "scripts/relaylm_phase_i4c2_*"
      - "docs/**"
      - ".github/workflows/phase-i4c2-primary-forget-recovery.yml"

permissions:
  contents: read

jobs:
  i4c2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m compileall -q relaylm scripts
      - name: I-4C2 recovery/finalization smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_recovery_smoke.py
      - name: I-4C2 fault/restart smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_fault_smoke.py
      - name: I-4C2 concurrency smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_concurrency_smoke.py
      - name: I-4C2 security smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_security_smoke.py
      - name: I-4C2 ownership boundary smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_ownership_boundary_smoke.py
      - name: I-4C1 hidden-successor regression
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c1_primary_forget_hidden_successor_smoke.py
      - name: I-4C1 fault regression
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c1_primary_forget_fault_smoke.py
      - name: I-4C1 concurrency regression
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c1_primary_forget_concurrency_smoke.py
      - name: I-4C1 security regression
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c1_primary_forget_security_smoke.py
      - name: I-4B shared resolver/fence regressions
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4b_ci_runner.py
      - name: I-3 Correct regressions
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i3_primary_mem_correct_ci_runner.py
      - name: M3e page writer
        run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_smoke.py
      - name: M3f reconciliation
        run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_reconciliation_smoke.py
      - name: M3g reconciliation apply
        run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_apply_smoke.py
      - name: M3h recovery audit
        run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_recovery_audit_smoke.py
      - name: Documentation links
        run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
      - name: Documentation current boundary
        run: PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
      - name: Confirm clean working tree
        run: |
          git status --short
          test -z "$(git status --short)"
