name: RelayCTX TTS adapter handoff runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "relaylm/**"
      - "scripts/relaylm_relayctx_tts_adapter_handoff_runtime_smoke.py"
      - ".github/workflows/relayctx-tts-adapter-handoff-runtime-smoke.yml"
      - "config.example.yaml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "relaylm/**"
      - "scripts/relaylm_relayctx_tts_adapter_handoff_runtime_smoke.py"
      - ".github/workflows/relayctx-tts-adapter-handoff-runtime-smoke.yml"
      - "config.example.yaml"
      - "pyproject.toml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Install package
        run: pip install -e .
      - name: Compile RelayLM
        run: python -m compileall relaylm scripts
      - name: Run runtime TTS handoff smoke
        run: python scripts/relaylm_relayctx_tts_adapter_handoff_runtime_smoke.py
