name: W2 sync latest main once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/w2-sync-latest-main-once.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave2-cross-slice-convergence-audit
          fetch-depth: 0
      - name: Merge latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:wave2-cross-slice-convergence-audit
