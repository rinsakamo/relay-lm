name: Phase 5-D1 config reference patch

on:
  push:
    branches:
      - phase5d1-cjk-token-estimation
    paths:
      - .github/workflows/phase5d1-doc-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5d1-cjk-token-estimation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch config reference
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/config_schema.md")
          text = path.read_text(encoding="utf-8")
          old = (
              "- `chars_per_token=4` is a current compatibility heuristic, not a "
              "tokenizer-exact estimate and is not conservative enough for all "
              "CJK-heavy text."
          )
          new = (
              "- `chars_per_token=4` is the ASCII-word compatibility ratio used by "
              "the deterministic tokenizer-free estimator. CJK/Kana/Hangul/full-width "
              "text, punctuation, symbols/emoji, combining/format characters, and "
              "other non-ASCII characters are accounted for separately. The result "
              "remains model-agnostic and is not tokenizer-exact."
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one legacy config note, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Commit config reference patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/config_schema.md
          git commit -m "docs: align token estimator config reference"
          git push origin HEAD:phase5d1-cjk-token-estimation
