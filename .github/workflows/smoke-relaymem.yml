  cross-slice-convergence:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install RelayLM
      run: |-
        python -m pip install --upgrade pip
        pip install -e .
    - name: Compile repository Python
      run: python -m compileall -q relaylm scripts
    - run: PYTHONPATH=.:scripts python scripts/relaylm_wave2_cross_slice_convergence_smoke.py
    - run: PYTHONPATH=.:scripts python scripts/relaylm_wave2_cross_slice_security_smoke.py
    - run: test -z "$(git status --short)"
    - name: Run Wave 3 convergence smoke
      run: |
        set +e
        PYTHONPATH=.:scripts python scripts/relaylm_wave3_cross_slice_convergence_smoke.py 2>&1 | tee wave3-convergence.log
        status=${PIPESTATUS[0]}
        exit "$status"
    - name: Upload Wave 3 convergence diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: wave3-convergence-diagnostics
        path: wave3-convergence.log
    - run: PYTHONPATH=.:scripts python scripts/relaylm_wave3_cross_slice_security_smoke.py
    - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4d_security_smoke.py
    - run: test -z "$(git status --short)"
