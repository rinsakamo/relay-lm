  recall-correction-forget-pin:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install RelayLM
      run: |-
        python -m pip install --upgrade pip
        pip install -e .
    - name: Compile repository Python
      run: python -m compileall -q relaylm scripts
    - name: Run Phase I-1 integration and security smokes
      run: |-
        set -o pipefail
        PYTHONPATH=.:scripts python scripts/relaylm_phase_i1_two_turn_primary_recall_ci_runner.py 2>&1 | tee phase-i1-smoke.log
    - name: Upload Phase I-1 runner log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phase-i1-smoke-log
        path: phase-i1-smoke.log
        if-no-files-found: ignore
    - name: Run RelayMEM M1/M2, RelayCTX, and managed enqueue regressions
      run: |-
        set -o pipefail
        {
          PYTHONPATH=. python scripts/relaylm_relaymem_store_dry_run_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_retrieval_dry_run_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_selection_dry_run_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_ctx_injection_plan_dry_run_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_runtime_ctx_injection_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_snippet_runtime_injection_apply_smoke.py
        } 2>&1 | tee relaymem-regressions.log
    - name: Upload RelayMEM regression log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: relaymem-regressions-log
        path: relaymem-regressions.log
        if-no-files-found: ignore
