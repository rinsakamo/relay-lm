    - name: Run documentation checks
      run: PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py
    - name: Run I1-GC replay convergence smoke
      id: i1gc
      shell: bash
      run: |
        set +e
        PYTHONPATH=. python scripts/relaylm_i1gc_durable_finalization_replay_smoke.py > i1gc-smoke.log 2>&1
        exit_code=$?
        cat i1gc-smoke.log
        exit "$exit_code"
    - name: Upload I1-GC smoke output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: i1gc-smoke-output
        path: i1gc-smoke.log
        if-no-files-found: error
        retention-days: 3
    - name: Run I1-G contract and I1-GB publication regressions
      run: PYTHONPATH=. python scripts/relaylm_i1gc_canonical_formation_replay_smoke.py
    - name: Run I1-GD retention convergence smoke
      id: i1gd
      shell: bash
      run: |
        set +e
        PYTHONPATH=.:scripts python scripts/relaylm_i1gd_durable_finalization_retention_smoke.py > i1gd-smoke.log 2>&1
        first_exit=$?
        PYTHONPATH=.:scripts python scripts/relaylm_i1gd_durable_finalization_retention_contract_smoke.py >> i1gd-smoke.log 2>&1
        second_exit=$?
        PYTHONPATH=.:scripts python scripts/relaylm_i1gd_durable_finalization_retention_race_smoke.py >> i1gd-smoke.log 2>&1
        third_exit=$?
        cat i1gd-smoke.log
        if [ "$first_exit" -ne 0 ]; then
          exit "$first_exit"
        fi
        if [ "$second_exit" -ne 0 ]; then
          exit "$second_exit"
        fi
        exit "$third_exit"
    - name: Upload I1-GD smoke output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: i1gd-smoke-output
        path: i1gd-smoke.log
        if-no-files-found: error
        retention-days: 3
    - run: PYTHONPATH=.:scripts python scripts/relaylm_i1ge_durable_finalization_nonstream_crash_smoke.py
