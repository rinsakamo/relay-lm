permissions:
  contents: read
jobs:
  primary-memory:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install RelayLM
      run: |-
        python -m pip install --upgrade pip
        pip install -e .
    - name: Compile repository Python
      run: python -m compileall -q relaylm scripts
    - name: Run RelayMEM M3g reconciliation apply smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_apply_smoke.py
    - name: Run RelayMEM M3g reconciliation security smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_apply_security_smoke.py
    - name: Run RelayMEM M3f reconciliation preflight smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_reconciliation_smoke.py
    - name: Run RelayMEM M3f marker hardening smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_reconciliation_marker_smoke.py
    - name: Run RelayMEM M3h recovery audit functional smoke
      run: |
        set +e
        PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_recovery_audit_smoke.py > m3h-functional-smoke.log 2>&1
        exit_code=$?
        cat m3h-functional-smoke.log
        exit "$exit_code"
    - name: Upload RelayMEM M3h functional smoke output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: relaymem-m3h-functional-smoke-output
        path: m3h-functional-smoke.log
        if-no-files-found: error
        retention-days: 3
    - name: Run RelayMEM M3h recovery audit security smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_recovery_audit_security_smoke.py
    - name: Run RelayMEM M3h receipt invariant smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_recovery_audit_receipt_smoke.py
    - name: Run RelayMEM M3e page writer smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_smoke.py
    - name: Run RelayMEM M3e security smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_security_smoke.py
    - name: Run RelayMEM M3e atomicity smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_atomicity_smoke.py
    - name: Run RelayMEM M3d writer handoff smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_writer_handoff_smoke.py
    - name: Run RelayMEM M3d review smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_writer_handoff_review_smoke.py
    - name: Run RelayMEM M3d security smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_writer_handoff_security_smoke.py
    - name: Run RelayMEM M3d idempotency smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_writer_handoff_idempotency_smoke.py
    - name: Run RelayMEM Primary compose functional smoke
      run: |
        PYTHONPATH=. python - <<'PY'
        import runpy
        import traceback
        from pathlib import Path

        diagnostic = Path("compose-smoke-diagnostic.txt")
        try:
            runpy.run_path(
                "scripts/relaylm_relaymem_primary_pipeline_smoke.py",
                run_name="__main__",
            )
        except SystemExit as exc:
            if exc.code in (None, 0):
                raise
            frames = traceback.extract_tb(exc.__traceback__)
            diagnostic.write_text(
                "SystemExit\n" + "\n".join(
                    f"{Path(frame.filename).name}:{frame.lineno}:{frame.name}"
                    for frame in frames[-8:]
                ) + "\n",
                encoding="utf-8",
            )
            raise
        except BaseException as exc:
            frames = traceback.extract_tb(exc.__traceback__)
            diagnostic.write_text(
                type(exc).__name__ + "\n" + "\n".join(
                    f"{Path(frame.filename).name}:{frame.lineno}:{frame.name}"
                    for frame in frames[-8:]
                ) + "\n",
                encoding="utf-8",
            )
            raise SystemExit(1) from None
        PY
    - name: Upload sanitized compose smoke diagnostic
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: relaymem-primary-compose-diagnostic
        path: compose-smoke-diagnostic.txt
        if-no-files-found: error
        retention-days: 1
    - name: Run RelayMEM Primary compose security smokes
      run: |-
        PYTHONPATH=. python scripts/relaylm_relaymem_primary_pipeline_security_smoke.py
        PYTHONPATH=. python scripts/relaylm_relaymem_primary_pipeline_result_validation_smoke.py
    - name: Run M3a-M3d contract smokes
      run: |-
        PYTHONPATH=. python scripts/relaylm_relaymem_primary_formation_dry_run_smoke.py
        PYTHONPATH=. python scripts/relaylm_relaymem_primary_write_preflight_smoke.py
        PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_candidate_smoke.py
    - name: Run documentation link check
      run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
  slp-queue:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install RelayLM
      run: |-
        python -m pip install --upgrade pip
        pip install -e .
    - name: Compile repository Python
      run: python -m compileall -q relaylm scripts
    - name: Run Phase 6-B contract smoke
      run: PYTHONPATH=. python scripts/relaylm_phase6b0_durable_queue_contract_smoke.py
    - name: Run Phase 6-B1 dispatch preflight smoke
      run: PYTHONPATH=. python scripts/relaylm_phase6b1_dispatch_preflight_smoke.py
    - name: Run strict Phase 6-B1 dispatch preflight security smoke
      run: PYTHONPATH=. python scripts/relaylm_phase6b1_dispatch_preflight_security_smoke.py
    - name: Run Phase 6-B2 durable enqueue smoke
      run: PYTHONPATH=. python scripts/relaylm_phase6b2_durable_enqueue_smoke.py
    - name: Run strict Phase 6-B2 durable enqueue security smoke
      run: PYTHONPATH=. python scripts/relaylm_phase6b2_durable_enqueue_security_smoke.py
    - name: Run Phase 6-B2 contract smoke
      run: PYTHONPATH=. python scripts/relaylm_phase6b2_durable_enqueue_contract_smoke.py
    - name: Run Phase 6-A1 admission smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_slp_job_admission_smoke.py
    - name: Run Phase 6-A1 bounded metadata smoke
      run: PYTHONPATH=. python scripts/relaylm_relaymem_slp_job_admission_bounded_metadata_smoke.py
    - name: Run B2/B3 enqueue lifecycle compatibility smoke
      run: PYTHONPATH=. python scripts/relaylm_phase6b3_enqueue_lifecycle_compat_smoke.py
    - name: Run Phase 6-B3 precommit failure projection smoke
      run: PYTHONPATH=. python scripts/relaylm_phase6b3_precommit_failure_projection_smoke.py
    - name: Run Phase 6-B3 queue root path smoke
      run: PYTHONPATH=. python scripts/relaylm_phase6b3_queue_root_path_smoke.py
    - name: Run Phase 6-B3 queue state smoke
      run: PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_smoke.py
    - name: Verify Phase 6-B3 bounded renewal horizon contract
      run: |
        PYTHONPATH=. python - <<'PY'
        from pathlib import Path

        source = Path("relaylm/relaymem_slp_queue_state.py").read_text(encoding="utf-8")
        smoke = Path("scripts/relaylm_phase6b3_queue_state_smoke.py").read_text(encoding="utf-8")
        contract = Path("docs/architecture/phase6b3_relayslp_queue_state_helpers.md").read_text(encoding="utf-8")

        assert '_lease_expiry(now, request.lease_duration_seconds)' in source
        assert '_lease_expiry(expiry, request.lease_duration_seconds)' not in source
        assert '2026-06-22T01:00:35.000000Z' in smoke
        assert 'does not accumulate duration from the previous expiry' in contract
        PY
    - name: Run strict Phase 6-B3 queue state security smoke
      run: PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_security_smoke.py
    - name: Run Phase 6-B3 queue state contract smoke
      run: PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_contract_smoke.py
    - name: Run Phase 6-A2 smoke
