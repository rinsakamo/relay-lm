name: Temporary Cutover 1C-23 applicator

on:
  push:
    branches:
      - agent/docs-cutover-1c23-e1r2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c23-e1r2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RelayLM and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyyaml

      - name: Apply Cutover 1C-23
        env:
          CUTOVER_PR: '585'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_tmp_apply_docs_cutover_1c23.py')
          text = path.read_text(encoding='utf-8')
          old = '''    mvp = ROOT / "docs/mvp/README.md"
              replace_once(mvp, "wave6/e1r2_completion_report.md", "../evidence/implementation/e1r2_completion_report.md")
              replace_once(
                  mvp,
                  "docs/mvp/wave6/e1r2_completion_report.md",
                  "docs/evidence/implementation/e1r2_completion_report.md",
              )
          '''.replace('              ', '    ')
          new = '''    mvp = ROOT / "docs/mvp/README.md"
              replace_once(
                  mvp,
                  "docs/mvp/wave6/e1r2_completion_report.md",
                  "docs/evidence/implementation/e1r2_completion_report.md",
              )
              replace_once(mvp, "wave6/e1r2_completion_report.md", "../evidence/implementation/e1r2_completion_report.md")
          '''.replace('              ', '    ')
          if text.count(old) != 1:
              raise SystemExit('replacement-order patch anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/_tmp_apply_docs_cutover_1c23.py

      - name: Verify exact source preservation
        run: |
          test "$(git hash-object docs/evidence/implementation/e1r2_completion_report-source.txt)" = "107923354f09e0e3340e329f282d2c818910cad2"
          test "$(sha256sum docs/evidence/implementation/e1r2_completion_report-source.txt | cut -d' ' -f1)" = "72e1fcb022cf2db3bcbda3e3d14a46a18da1f50c3747f6706301346abc6f7722"
          test ! -e docs/mvp/wave6/e1r2_completion_report.md
          ! git grep -n 'docs/mvp/wave6/e1r2_completion_report.md' -- . ':!docs/evidence/implementation/e1r2_completion_report-source.txt' ':!docs/evidence/migrations/documentation-hard-cutover-receipt.md' ':!scripts/_tmp_apply_docs_cutover_1c23.py' ':!.github/workflows/_tmp-docs-cutover-1c23.yml'

      - name: Run focused and documentation validation
        run: |
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_e1r2_character_store_bootstrap_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_e1_evaluation_consolidation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_ci_consolidated_smoke.py run --workflow runtime --group e1r2_character_store_bootstrap
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/e1r2_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          git diff --check

      - name: Commit validated cutover and remove temporary tooling
        run: |
          rm scripts/_tmp_apply_docs_cutover_1c23.py
          rm .github/workflows/_tmp-docs-cutover-1c23.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: apply Cutover 1C-23 E1-R2'
          git push origin HEAD:agent/docs-cutover-1c23-e1r2
