name: Temporary I1-GD main synchronization

on:
  push:
    branches:
      - phase-i1gd-durable-finalization-retention-cleanup
    paths:
      - .github/workflows/tmp-i1gd-sync-main.yml

permissions:
  contents: write

concurrency:
  group: tmp-i1gd-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i1gd-durable-finalization-retention-cleanup
          fetch-depth: 0
      - name: Merge current main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -X ours origin/main -m "merge main into I1-GD branch"
          git rm .github/workflows/tmp-i1gd-sync-main.yml
          git commit --amend --no-edit
          git push origin HEAD:phase-i1gd-durable-finalization-retention-cleanup
