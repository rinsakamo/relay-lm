name: Temporary Cutover 1C-22 E1-R1 applicator

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/tmp_c1c22_e1r1_applicator.py"
      - ".github/workflows/tmp-c1c22-e1r1-applicator.yml"

permissions:
  contents: write

jobs:
  apply-c1c22-e1r1:
    if: github.head_ref == 'agent/docs-cutover-1c22-e1r1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -e . pytest pyyaml

      - name: Apply Cutover 1C-22 updates
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/tmp_c1c22_e1r1_applicator.py

      - name: Verify exact source preservation
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected_blob = "3d4e78d63e4be836e1de8b0ad1781a513e5349bc"
          expected_sha = "35c8d68527fea415465119f28ca366897ab7d320f6828fa92489dff4af58c6d7"
          snapshot = Path("docs/evidence/implementation/e1r1_completion_report-source.txt")
          raw = snapshot.read_bytes()
          blob = hashlib.sha1(f"blob {len(raw)}\0".encode("ascii") + raw).hexdigest()
          assert blob == expected_blob, (blob, expected_blob)
          assert hashlib.sha256(raw).hexdigest() == expected_sha
          assert not Path("docs/mvp/wave6/e1r1_completion_report.md").exists()
          canonical = Path("docs/evidence/implementation/e1r1_completion_report.md").read_text()
          for value in (
              "relaylm_source_pr: 433",
              "Current trusted Home scene-admission behavior belongs to",
              "e1r1_completion_report-source.txt",
              "At source PR #433",
          ):
              assert value in canonical, value
          PY

      - name: Validate E1-R1 cutover and focused behavior
        run: |
          set -o pipefail
          {
            python -m compileall -q relaylm scripts
            PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/e1r1_completion_report.md
            PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
            PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
            PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
            PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
            PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
            PYTHONPATH=.:scripts python scripts/relaylm_e1r1_trusted_home_scene_admission_smoke.py
            PYTHONPATH=.:scripts python scripts/relaylm_e1_evaluation_consolidation_smoke.py
            PYTHONPATH=.:scripts python scripts/relaylm_ci_consolidated_smoke.py run --workflow runtime --group e1r1_trusted_home_scene_admission
            git diff --check
          } 2>&1 | tee c1c22-validation.log

      - name: Persist validation diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f c1c22-validation.log
          git commit -m "chore: capture E1-R1 cutover diagnostics"
          git push origin HEAD:${{ github.head_ref }}

      - name: Mark local validation passed
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/evidence/migrations/documentation-hard-cutover-receipt.md")
          body = path.read_text()
          start = body.index("### C1C22-001 — E1-R1 completion report")
          end = body.index("## Pending batches", start)
          section = body[start:end]
          fields = (
              "focused_e1r1_smoke",
              "e1_evaluation_consolidation_smoke",
              "consolidated_runtime_e1r1_group",
              "documentation_link_check",
              "documentation_semantic_audit",
              "completion_report_model_and_file_checks",
              "completion_report_pr_link_check",
          )
          for field in fields:
              old = f"  {field}: pending"
              new = f"  {field}: passed"
              assert section.count(old) == 1, (field, section.count(old))
              section = section.replace(old, new, 1)
          body = body[:start] + section + body[end:]
          path.write_text(body)
          PY
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check

      - name: Commit Cutover 1C-22 updates and remove temporary tooling
        run: |
          rm scripts/tmp_c1c22_e1r1_applicator.py
          rm .github/workflows/tmp-c1c22-e1r1-applicator.yml
          rm -f c1c22-validation.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: apply E1-R1 cutover 1C-22"
          git push origin HEAD:${{ github.head_ref }}
