name: LC1A direct runtime repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/lc1a-subjective-mem-correct'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply direct runtime repair
        shell: bash
        run: |
          python .github/lc1a_runtime_repair.py
          python -m compileall -f -q relaylm scripts tests
          python -m pip install -q -e '.[test]'
          PYTHONPATH=tests:. python -m pytest -q \
            tests/test_subjective_mem_runtime.py \
            tests/test_subjective_mem_commit_runtime.py \
            tests/test_subjective_mem_lifecycle_runtime.py \
            tests/test_ctx_ovl_config.py \
            tests/test_evidence_config_routing.py \
            tests/test_shared_assessment_runtime.py
          git diff --check
          rm -f .github/lc1a_runtime_repair.py \
                .github/workflows/lc1a-direct-runtime-repair.yml \
                .github/lc1a-direct-runtime-repair-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair LC-1A runtime helper indentation'
          git push origin HEAD:agent/lc1a-subjective-mem-correct
