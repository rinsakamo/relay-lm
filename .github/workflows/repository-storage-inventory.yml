name: Repository & storage inventory artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "relaylm/**"
      - "scripts/**"
      - "apps/**"
      - "tests/**"
      - "pyproject.toml"
      - "config.example.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Self-test
        run: python scripts/relaylm_repo_inventory_cli.py --self-test
      - name: Generate JSON inventory
        run: python scripts/relaylm_repo_inventory_cli.py --all --format json --output generated/repository_storage_inventory.json
      - name: Generate Markdown inventory
        run: python scripts/relaylm_repo_inventory_cli.py --all --format markdown --output generated/repository_storage_inventory.md
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: repository-storage-inventory
          path: generated/repository_storage_inventory.*
          if-no-files-found: error
          retention-days: 7
