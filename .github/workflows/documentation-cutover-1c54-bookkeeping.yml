  open_pr_content_imported: false
```

PR #642 preserves PR #404 recovery/finalization provenance and PR #407 concurrent-loser normalization as frozen implementation evidence and merged as `a21b9ac617fcf11d85a52e919f2ecb8678485927` from reviewed head `9b92df29a2cd112c6ad80086fdcfa4ad0e6fd0d6` on integration base `32135811283edffa4408846c8a9e51173aea743e`. PR #{bookkeeping_pr} consolidates merge attribution and exact-head validation without changing accepted cutover content. The record remains non-authoritative for current runtime, schema, API/UI, storage, product, compatibility, alias, redirect, dual-read, or dual-write behavior.'''
          if ledger.count(old_block) != 1:
              raise SystemExit(f"central ledger block mismatch: found {ledger.count(old_block)}")
          ledger_path.write_text(ledger.replace(old_block, new_block, 1), encoding="utf-8")
          PY
      - name: Validate bookkeeping serially
        run: |
          set -euo pipefail
          python -m compileall -q scripts
          python scripts/relaylm_i4c2_handoff_cutover_guard.py
          python scripts/relaylm_i4c2_handoff_cutover_guard.py --self-test
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check
      - name: Commit bookkeeping
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/migrations/cutover-1c54-i4c2.md docs/evidence/migrations/documentation-hard-cutover-receipt.md
          git commit -m "docs: finalize cutover 1C-54 bookkeeping"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

