name: Documentation Cutover 1C-54 Bookkeeping

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/documentation-cutover-1c54-bookkeeping.yml"
      - "docs/evidence/migrations/cutover-1c54-i4c2.md"
      - "docs/evidence/migrations/documentation-hard-cutover-receipt.md"

permissions:
  contents: write

concurrency:
  group: documentation-cutover-1c54-bookkeeping-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bookkeeping:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c54-bookkeeping'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact bookkeeping facts
        env:
          BOOKKEEPING_PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          bookkeeping_pr = os.environ["BOOKKEEPING_PR"]
          local_path = Path("docs/evidence/migrations/cutover-1c54-i4c2.md")
          local = local_path.read_text(encoding="utf-8")
          replacements = {
              "- Cutover PR: pending draft PR number at construction time": "- Cutover PR: #642",
              "- Bookkeeping consolidation PR: pending after merge": f"- Bookkeeping consolidation PR: #{bookkeeping_pr}",
              "- Base main: `16e733b41b57b9dfefe6c3af130c28acf915057b`": "- Integration base / current main at final review: `32135811283edffa4408846c8a9e51173aea743e`",
              "- Validated content head: pending exact-head validation": "- Validated content head: `9b92df29a2cd112c6ad80086fdcfa4ad0e6fd0d6`",
              "- Merged commit: pending": "- Merged commit: `a21b9ac617fcf11d85a52e919f2ecb8678485927`",
              "- Merged at: pending": "- Merged at: `2026-07-22T16:24:41Z`",
              "- Open-PR overlap at branch creation: PR #636 overlaps `docs/architecture/README.md`; PR #639 and temporary PR #641 have no planned-path overlap. No open-PR content was imported.": "- Parallel-work resolution: PR #636 and PR #639 merged before final review; their ASM-1 and OVL-1 changes were retained during exact main synchronization. PR #643 was open at merge time, changed only `docs/PROJECT_STATUS.md`, and had no cutover-path overlap. No open-PR content was imported.",
              "- Project-status preservation: `docs/PROJECT_STATUS.md` is unchanged, preserving PR #640 EV-1-complete / ASM-1-in-progress convergence.": "- Project-status preservation: `docs/PROJECT_STATUS.md` was unchanged by Cutover 1C-54; later status convergence remains separately owned by PR #643.",
              "- Exact-head GitHub Actions: pending": "- Exact-head GitHub Actions: 16 workflows; 16 success, 0 failure, 0 pending",
              "- Unresolved review threads: pending final review": "- Unresolved review threads: 0",
          }
          for old, new in replacements.items():
              if local.count(old) != 1:
                  raise SystemExit(f"local receipt expected one occurrence: {old!r}, found {local.count(old)}")
              local = local.replace(old, new, 1)
          conclusion = "Every current normative behavior recorded by the old I-4C2 handoff is independently owned by the Phase I-4 master contract, current implementation, current I-4D/I-4E/I-4F boundaries, and focused executable validation. The move therefore removes no unique current authority. The canonical document is frozen historical evidence only."
          merged_conclusion = conclusion + f" PR #642 merged as `a21b9ac617fcf11d85a52e919f2ecb8678485927` from reviewed head `9b92df29a2cd112c6ad80086fdcfa4ad0e6fd0d6` on integration base `32135811283edffa4408846c8a9e51173aea743e`; PR #{bookkeeping_pr} consolidates those facts without changing accepted cutover content."
          if local.count(conclusion) != 1:
              raise SystemExit("local receipt conclusion anchor mismatch")
          local = local.replace(conclusion, merged_conclusion, 1)
          marker = "- Merged at: `2026-07-22T16:24:41Z`\n"
          local = local.replace(marker, marker + "- Final cutover diff: 16 changed files, +410/-31\n", 1)
          local_path.write_text(local, encoding="utf-8")

          ledger_path = Path("docs/evidence/migrations/documentation-hard-cutover-receipt.md")
          ledger = ledger_path.read_text(encoding="utf-8")
          old_block = '''### C1C54-001 — I-4C2 recovery/finalization handoff (pending merge attribution)

```yaml
cutover_pr: pending
merged_commit: pending
old_path: docs/architecture/phase_i4c2_primary_forget_recovery_finalization.md
old_blob_sha: ab8f8e0f906690dfc9a28c680f4fb2b230211ce1
old_content_sha256: f0b6eeef01f423283ef0b48cf9e8940b1edfacef23a0483669058ff4d81bba92
source_prs:
  - 404
  - 407
source_final_heads:
  - 73416fab26f12e8c34793959bd3229f5c9fe8c59
  - b4bff3b4804afa0e6f81d00410cd0d73512a15b7
source_merge_commits:
  - 97e5a1060bface993bb4382f9a50074aca1ec37d
  - c23b82da89853947eb5a2269760e24d7c25829c0
recorded_on: 2026-06-26
disposition: evidence_retained
new_canonical_path: docs/evidence/implementation/i4c2-primary-forget-recovery-finalization-handoff.md
verification:
  old_path_removed_in_pr_tree: true
  canonical_evidence_metadata_added: true
  historical_banner_added: true
  current_authority_independently_owned: true
  pre_cutover_referrer_files: 10
  active_path_references_repaired: true
  implementation_evidence_index_updated: true
  documentation_current_boundary_smoke_updated: true
  runtime_files_changed: 0
  relaylm_files_changed: 0
  exact_head_actions: pending
  unresolved_review_threads: pending
```

Pending merge attribution only. The frozen record preserves PR #404 recovery/finalization provenance and PR #407 concurrent-loser normalization without becoming current runtime, schema, API/UI, storage, product, compatibility, alias, redirect, dual-read, or dual-write authority.'''
          new_block = f'''### C1C54-001 — I-4C2 recovery/finalization handoff

```yaml
cutover_pr: 642
merged_commit: a21b9ac617fcf11d85a52e919f2ecb8678485927
bookkeeping_pr: {bookkeeping_pr}
base_main: 32135811283edffa4408846c8a9e51173aea743e
validated_content_head: 9b92df29a2cd112c6ad80086fdcfa4ad0e6fd0d6
head_at_merge: 9b92df29a2cd112c6ad80086fdcfa4ad0e6fd0d6
merged_at: 2026-07-22T16:24:41Z
old_path: docs/architecture/phase_i4c2_primary_forget_recovery_finalization.md
old_blob_sha: ab8f8e0f906690dfc9a28c680f4fb2b230211ce1
old_content_sha256: f0b6eeef01f423283ef0b48cf9e8940b1edfacef23a0483669058ff4d81bba92
source_prs:
  - 404
  - 407
source_final_heads:
  - 73416fab26f12e8c34793959bd3229f5c9fe8c59
  - b4bff3b4804afa0e6f81d00410cd0d73512a15b7
source_merge_commits:
  - 97e5a1060bface993bb4382f9a50074aca1ec37d
  - c23b82da89853947eb5a2269760e24d7c25829c0
