name: SOUL Lab Management Projection

on:
  pull_request:
    paths:
      - "relaylm/soul_lab_management.py"
      - "relaylm/soul_lab_app.py"
      - "scripts/relaylm_soul_lab_management_projection_smoke.py"
      - "pyproject.toml"
      - ".github/workflows/soul-lab-management-projection.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/soul_lab_management.py"
      - "relaylm/soul_lab_app.py"
      - "scripts/relaylm_soul_lab_management_projection_smoke.py"
      - "pyproject.toml"
      - ".github/workflows/soul-lab-management-projection.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RelayLM
        run: python -m pip install -e .
      - name: Compile SOUL Lab management modules
        run: python -m compileall -q relaylm/soul_lab_management.py relaylm/soul_lab_app.py scripts/relaylm_soul_lab_management_projection_smoke.py
      - name: Run SOUL Lab management projection smoke
        run: python scripts/relaylm_soul_lab_management_projection_smoke.py
