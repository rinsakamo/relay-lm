name: Phase I-4A Forget Hide contract

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/**"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "scripts/relaylm_phase_i4_forget_hide_contract_smoke.py"
      - ".github/workflows/phase-i4-forget-hide-contract-smoke.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "scripts/relaylm_phase_i4_forget_hide_contract_smoke.py"
      - ".github/workflows/phase-i4-forget-hide-contract-smoke.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m compileall -q relaylm scripts
      - run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
      - run: PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py
      - run: PYTHONPATH=. python scripts/relaylm_phase_i4_forget_hide_contract_smoke.py
      - name: Check diff whitespace
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
