name: Docs cutover 1C-13 applicator

on:
  pull_request:
    paths:
      - ".github/scripts/docs_cutover_1c13.py"
      - ".github/workflows/docs-cutover-1c13-applicator.yml"
      - "docs/evidence/implementation/e2_value_smoke_harness_completion_report*.txt"
      - "docs/evidence/implementation/e2_value_smoke_harness_completion_report.md"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Apply cutover
        run: python .github/scripts/docs_cutover_1c13.py
      - name: Validate exact source preservation
        run: |
          test "$(git hash-object docs/evidence/implementation/e2_value_smoke_harness_completion_report-source.txt)" = "333ba34007a38b794572683c41e947ae1d0ad8cf"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('docs/evidence/implementation/e2_value_smoke_harness_completion_report-source.txt')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'ffc09e20a41f7202c05682aa9e50a8c859107a64bacdc33ff5e9a81723b13358'
          PY
      - name: Validate E2 harness and completion evidence
        run: |
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_e2_value_smoke_harness_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/e2_value_smoke_harness_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
      - name: Validate documentation
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check
      - name: Commit cutover result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: move E2 value smoke harness report in cutover 1C-13"
          git push origin HEAD:${{ github.head_ref }}
