name: Phase I-4C1 Primary Forget hidden successor

on:
  push:
    paths:
      - "relaylm/relaymem_primary_forget.py"
      - "relaylm/relaymem_primary_forget_*.py"
      - "relaylm/relaymem_primary_lifecycle_page.py"
      - "relaylm/relaymem_primary_current_state.py"
      - "relaylm/relaymem_primary_mutation_coordinator.py"
      - "relaylm/relaymem_primary_page_candidate.py"
      - "relaylm/relaymem_primary_writer_handoff.py"
      - "relaylm/relaymem_primary_page_writer.py"
      - "relaylm/_relaymem_primary_lifecycle_page_writer.py"
      - "relaylm/_relaymem_primary_page_writer_common.py"
      - "scripts/relaylm_phase_i4c1_*"
      - "docs/**"
      - ".github/workflows/phase-i4c1-primary-forget-hidden-successor-smoke.yml"
  pull_request:
    paths:
      - "relaylm/relaymem_primary_forget.py"
      - "relaylm/relaymem_primary_forget_*.py"
      - "relaylm/relaymem_primary_lifecycle_page.py"
      - "relaylm/relaymem_primary_current_state.py"
      - "relaylm/relaymem_primary_mutation_coordinator.py"
      - "relaylm/relaymem_primary_page_candidate.py"
      - "relaylm/relaymem_primary_writer_handoff.py"
      - "relaylm/relaymem_primary_page_writer.py"
      - "relaylm/_relaymem_primary_lifecycle_page_writer.py"
      - "relaylm/_relaymem_primary_page_writer_common.py"
      - "scripts/relaylm_phase_i4c1_*"
      - "docs/**"
      - ".github/workflows/phase-i4c1-primary-forget-hidden-successor-smoke.yml"

permissions:
  contents: read

jobs:
  i4c1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m compileall -q relaylm scripts
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c1_ci_runner.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4b_ci_runner.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i3_primary_mem_correct_ci_runner.py
      - run: PYTHONPATH=. python scripts/relaylm_m3e_atomic_primary_page_writer_smoke.py
      - run: PYTHONPATH=. python scripts/relaylm_phase_i1_two_turn_primary_recall_smoke.py
      - run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
      - name: Confirm clean working tree
        run: |
          git status --short
          test -z "$(git status --short)"
