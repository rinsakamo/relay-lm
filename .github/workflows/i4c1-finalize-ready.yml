name: Finalize I-4C1 review readiness

on:
  push:
    branches:
      - phase-i4c1-primary-forget-hidden-successor
    paths:
      - ".github/workflows/i4c1-finalize-ready.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i4c1-primary-forget-hidden-successor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Ensure latest main is contained
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-commit --no-ff -X ours origin/main
          fi
      - name: Install project
        run: pip install -e .
      - name: Compile
        run: python -m compileall -q relaylm scripts
      - name: Validate O1A and merged documentation authority
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/relaylm_o1a_scheduler_round_contract_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
      - name: Validate I-4 contract and I-4B regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/relaylm_phase_i4_forget_hide_contract_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4b_ci_runner.py
      - name: Validate complete I-4C1 matrix
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c1_ci_runner.py
      - name: Validate Phase I-3 Correct regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i3_primary_mem_correct_ci_runner.py
      - name: Validate M3e atomic writer regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_security_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_atomicity_smoke.py
      - name: Validate related reconciliation smokes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts_to_run < <(find scripts -maxdepth 1 -type f \( -name '*m3f*smoke.py' -o -name '*m3g*smoke.py' -o -name '*m3h*smoke.py' \) | sort)
          test "${#scripts_to_run[@]}" -gt 0
          for script in "${scripts_to_run[@]}"; do
            PYTHONPATH=.:scripts python "$script"
          done
      - name: Validate I-1 and I-2 regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/relaylm_phase_i1_two_turn_primary_recall_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i2_documentation_boundary_smoke.py
      - name: Commit main sync when required
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "chore: sync latest main into I-4C1 branch"
          fi
      - name: Remove temporary finalization files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .i4c1-sync-diagnostics.log \
            .github/workflows/i4c1-sync-latest-main.yml \
            .github/workflows/i4c1-sync-latest-main-diagnostic.yml \
            .github/workflows/i4c1-finalize-ready.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary I-4C1 finalization workflows"
          fi
          git push origin HEAD:phase-i4c1-primary-forget-hidden-successor
      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready 396 --repo rinsakamo/relay-lm
          gh pr comment 396 --repo rinsakamo/relay-lm --body "I-4C1 final validation passed on commit $(git rev-parse HEAD). Latest main is contained; O1A/documentation, I-4/I-4B/I-4C1/I-3, M3e/M3f/M3g/M3h, I-1/I-2, link, compile, and clean finalization checks completed. PR is ready for review."
