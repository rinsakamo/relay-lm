name: Phase I-1 projection reason diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/_phase_i1_projection_reason_patch.py"
      - ".github/workflows/_phase_i1_projection_reason_patch.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .:scripts

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i1-primary-mem-next-turn-recall
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/_phase_i1_projection_reason_patch.py
      - run: pip install -e .
      - name: Run focused projection smokes
        id: smoke
        continue-on-error: true
        run: |
          {
            python scripts/relaylm_relaymem_store_dry_run_smoke.py
            python scripts/relaylm_relaymem_retrieval_dry_run_smoke.py
            python scripts/relaylm_phase_i1_two_turn_primary_recall_ci_runner.py
          } > phase-i1-projection-reason.log 2>&1
      - name: Upload projection reason log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-i1-projection-reason-log
          path: phase-i1-projection-reason.log
          if-no-files-found: error
      - name: Fail when focused smokes fail
        if: steps.smoke.outcome != 'success'
        run: exit 1
