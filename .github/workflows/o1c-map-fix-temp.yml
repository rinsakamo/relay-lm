name: Temporary O1C mapping fix

on:
  push:
    branches:
      - phase-o1c-eligible-b2-queue-lane
    paths:
      - ".github/workflows/o1c-map-fix-temp.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-o1c-eligible-b2-queue-lane
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded C2 mapping fix and clean validation marker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("relaylm/relaymem_slp_scheduler_queue_lane.py")
          body = path.read_text(encoding="utf-8")
          old = '''    if result.retryable or result.worker_status == "retry_released":
              return _lane(
                  status="retry_released",
                  no_immediate_work=False,
                  retryable=True,
                  reasons=reasons or ("queue_retry_released",),
                  **common,
              )
          if result.status == "worker_completed" and result.worker_invoked:
              return _lane(
                  status="executed",
                  no_immediate_work=False,
                  reasons=reasons or ("queue_worker_executed",),
                  **common,
              )
          if result.status in {"claim_not_applied", "claim_lost_before_rehydrate"}:
              return _lane(
                  status="candidate_changed",
                  no_immediate_work=False,
                  retryable=True,
                  reasons=reasons or ("queue_claim_conflict",),
                  **common,
              )
          if result.status == "source_blocked":
              return _lane(
                  status="unsafe_state",
                  no_immediate_work=True,
                  unsafe=True,
                  reasons=reasons or ("queue_source_blocked",),
                  **common,
              )
          if result.status == "source_retryable":
              return _lane(
                  status="failed",
                  no_immediate_work=True,
                  retryable=True,
                  reasons=reasons or ("queue_source_retryable",),
                  **common,
              )
          '''
          new = '''    if result.status in {"claim_not_applied", "claim_lost_before_rehydrate"}:
              return _lane(
                  status="candidate_changed",
                  no_immediate_work=False,
                  retryable=True,
                  reasons=reasons or ("queue_claim_conflict",),
                  **common,
              )
          if result.status == "source_blocked":
              return _lane(
                  status="unsafe_state",
                  no_immediate_work=True,
                  unsafe=True,
                  reasons=reasons or ("queue_source_blocked",),
                  **common,
              )
          if result.status == "source_retryable":
              return _lane(
                  status="failed",
                  no_immediate_work=True,
                  retryable=True,
                  reasons=reasons or ("queue_source_retryable",),
                  **common,
              )
          if result.status == "worker_completed" and (
              result.retryable or result.worker_status == "retry_released"
          ):
              return _lane(
                  status="retry_released",
                  no_immediate_work=False,
                  retryable=True,
                  reasons=reasons or ("queue_retry_released",),
                  **common,
              )
          if result.status == "worker_completed" and result.worker_invoked:
              return _lane(
                  status="executed",
                  no_immediate_work=False,
                  reasons=reasons or ("queue_worker_executed",),
                  **common,
              )
          '''
          if old not in body:
              raise SystemExit("O1C mapping patch anchor missing")
          path.write_text(body.replace(old, new), encoding="utf-8")
          PY
          rm -f o1c_validation_report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/o1c-map-fix-temp.yml
          git add relaylm/relaymem_slp_scheduler_queue_lane.py
          git add -u o1c_validation_report.txt || true
          git commit -m "fix: preserve C2 source retry classification"
          git push origin HEAD:phase-o1c-eligible-b2-queue-lane
