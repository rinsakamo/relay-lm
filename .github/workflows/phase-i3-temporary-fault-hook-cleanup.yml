name: Temporary Phase I-3 fault hook cleanup

on:
  push:
    branches:
      - phase-i3-auditable-primary-mem-correct
    paths:
      - scripts/_phase_i3_remove_synthetic_index_fault.py
      - .github/workflows/phase-i3-temporary-fault-hook-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i3-auditable-primary-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/_phase_i3_remove_synthetic_index_fault.py
      - run: python -m compileall -q relaylm/relaymem_primary_correction.py scripts/relaylm_phase_i3_primary_mem_correct_fault_smoke.py
      - name: Commit source cleanup
        run: |
          rm scripts/_phase_i3_remove_synthetic_index_fault.py
          rm .github/workflows/phase-i3-temporary-fault-hook-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relaylm/relaymem_primary_correction.py
          git add -u scripts/_phase_i3_remove_synthetic_index_fault.py .github/workflows/phase-i3-temporary-fault-hook-cleanup.yml
          git commit -m "test: use real index-before-log crash seam for I3"
          git push origin HEAD:phase-i3-auditable-primary-mem-correct
