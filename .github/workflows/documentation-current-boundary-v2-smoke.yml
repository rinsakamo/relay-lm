name: Documentation current boundary v2 smoke

on:
  pull_request:
    paths:
      - "docs/**"
      - "relaylm/config.py"
      - "config.example.yaml"
      - "scripts/relaylm_documentation_current_boundary_smoke_v2.py"
      - ".github/workflows/documentation-current-boundary-v2-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integrated documentation smoke
        run: python -m compileall -q scripts/relaylm_documentation_current_boundary_smoke_v2.py
      - name: Validate integrated documentation boundaries
        env:
          PYTHONPATH: .:scripts
        run: |
          set -o pipefail
          python scripts/relaylm_documentation_current_boundary_smoke_v2.py 2>&1 | tee documentation-current-boundary-v2.log
      - name: Upload integrated documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-current-boundary-v2-log
          path: documentation-current-boundary-v2.log
