name: Documentation current boundary legacy diagnostic

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - ".github/workflows/documentation-current-boundary-legacy-diagnostic.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run legacy documentation smoke
        env:
          PYTHONPATH: .:scripts
        run: |
          set -o pipefail
          python scripts/relaylm_documentation_current_boundary_smoke.py 2>&1 | tee documentation-current-boundary-legacy.log
      - name: Upload legacy documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-current-boundary-legacy-log
          path: documentation-current-boundary-legacy.log
