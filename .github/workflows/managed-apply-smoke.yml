name: Managed apply smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - relaylm/**
      - scripts/phase5c4a_*.py
      - scripts/relaylm_phase5c4a_*_smoke.py
      - .github/workflows/managed-apply-smoke.yml
  push:
    branches: [main]
    paths:
      - relaylm/**
      - scripts/phase5c4a_*.py
      - scripts/relaylm_phase5c4a_*_smoke.py
      - .github/workflows/managed-apply-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - contract
          - compiler
          - runtime
          - fields
          - cache
          - optional
          - gate
          - projection
          - audit
          - error
    name: smoke-${{ matrix.script }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m compileall relaylm scripts
      - run: python scripts/relaylm_phase5c4a_${{ matrix.script }}_smoke.py
