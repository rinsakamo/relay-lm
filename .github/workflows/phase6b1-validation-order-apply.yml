name: Apply Phase 6-B1 validation-order fix

on:
  push:
    branches:
      - phase6b1-relayslp-dispatch-preflight
    paths:
      - "scripts/patch_phase6b1_validation_order.py"
      - ".github/workflows/phase6b1-validation-order-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase6b1-relayslp-dispatch-preflight
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Apply validation-order patch
        run: python scripts/patch_phase6b1_validation_order.py
      - name: Commit and push validation-order fix
        run: |
          git add relaylm/relaymem_slp_dispatch_preflight.py
          git diff --cached --check
          git commit -m "fix: preserve Phase 6-B1 validation reason order"
          git push origin HEAD:phase6b1-relayslp-dispatch-preflight
