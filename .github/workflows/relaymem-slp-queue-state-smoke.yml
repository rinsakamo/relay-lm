name: RelayMEM RelaySLP queue state smoke

on:
  pull_request:
    paths:
      - "relaylm/relaymem_slp_durable_enqueue.py"
      - "relaylm/relaymem_slp_queue_state.py"
      - "relaylm/relaymem_slp_queue_record.py"
      - "relaylm/relaymem_slp_queue_storage.py"
      - "scripts/relaylm_phase6b0_durable_queue_contract_smoke.py"
      - "scripts/relaylm_phase6b2_durable_enqueue_contract_smoke.py"
      - "scripts/relaylm_phase6b3_enqueue_lifecycle_compat_smoke.py"
      - "scripts/relaylm_phase6b3_precommit_failure_projection_smoke.py"
      - "scripts/relaylm_phase6b3_queue_root_path_smoke.py"
      - "scripts/relaylm_phase6b3_queue_state_smoke.py"
      - "scripts/relaylm_phase6b3_queue_state_security_smoke.py"
      - "scripts/relaylm_phase6b3_queue_state_contract_smoke.py"
      - "docs/architecture/phase6_async_relayslp_bounded_slice.md"
      - "docs/architecture/phase6b0_relayslp_durable_queue_contract.md"
      - "docs/architecture/phase6b2_relayslp_atomic_durable_enqueue.md"
      - "docs/architecture/phase6b3_relayslp_queue_state_helpers.md"
      - "docs/architecture/relaymem_slp_current_target.md"
      - "docs/architecture/pipeline_implementation_plan.md"
      - "docs/architecture/README.md"
      - "docs/README.md"
      - "docs/PROJECT_STATUS.md"
      - ".github/workflows/relaymem-slp-queue-state-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/relaymem_slp_durable_enqueue.py"
      - "relaylm/relaymem_slp_queue_state.py"
      - "relaylm/relaymem_slp_queue_record.py"
      - "relaylm/relaymem_slp_queue_storage.py"
      - "scripts/relaylm_phase6b0_durable_queue_contract_smoke.py"
      - "scripts/relaylm_phase6b2_durable_enqueue_contract_smoke.py"
      - "scripts/relaylm_phase6b3_enqueue_lifecycle_compat_smoke.py"
      - "scripts/relaylm_phase6b3_precommit_failure_projection_smoke.py"
      - "scripts/relaylm_phase6b3_queue_root_path_smoke.py"
      - "scripts/relaylm_phase6b3_queue_state_smoke.py"
      - "scripts/relaylm_phase6b3_queue_state_security_smoke.py"
      - "scripts/relaylm_phase6b3_queue_state_contract_smoke.py"
      - "docs/architecture/phase6_async_relayslp_bounded_slice.md"
      - "docs/architecture/phase6b0_relayslp_durable_queue_contract.md"
      - "docs/architecture/phase6b2_relayslp_atomic_durable_enqueue.md"
      - "docs/architecture/phase6b3_relayslp_queue_state_helpers.md"
      - "docs/architecture/relaymem_slp_current_target.md"
      - "docs/architecture/pipeline_implementation_plan.md"
      - "docs/architecture/README.md"
      - "docs/README.md"
      - "docs/PROJECT_STATUS.md"
      - ".github/workflows/relaymem-slp-queue-state-smoke.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-final-review-fix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final B3 projection review fix
        run: python scripts/relaylm_phase6b3_final_review_fix.py
      - name: Validate targeted regression
        run: |
          python -m compileall -q relaylm/relaymem_slp_queue_state.py scripts/relaylm_phase6b3_precommit_failure_projection_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6b3_precommit_failure_projection_smoke.py
      - name: Commit fix
        run: |
          git rm scripts/relaylm_phase6b3_final_review_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: project current state for invalid proposals"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RelayLM
        run: python -m pip install -e .
      - name: Compile Phase 6-B queue helpers and smokes
        run: >-
          python -m compileall -q
          relaylm/relaymem_slp_durable_enqueue.py
          relaylm/relaymem_slp_queue_state.py
          relaylm/relaymem_slp_queue_record.py
          relaylm/relaymem_slp_queue_storage.py
          scripts/relaylm_phase6b0_durable_queue_contract_smoke.py
          scripts/relaylm_phase6b2_durable_enqueue_contract_smoke.py
          scripts/relaylm_phase6b3_enqueue_lifecycle_compat_smoke.py
          scripts/relaylm_phase6b3_precommit_failure_projection_smoke.py
          scripts/relaylm_phase6b3_queue_root_path_smoke.py
          scripts/relaylm_phase6b3_queue_state_smoke.py
          scripts/relaylm_phase6b3_queue_state_security_smoke.py
          scripts/relaylm_phase6b3_queue_state_contract_smoke.py
      - name: Run Phase 6-B0 durable queue contract smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b0_durable_queue_contract_smoke.py
      - name: Run Phase 6-B1 dispatch preflight smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b1_dispatch_preflight_smoke.py
      - name: Run strict Phase 6-B1 dispatch security smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b1_dispatch_preflight_security_smoke.py
      - name: Run Phase 6-B2 durable enqueue smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b2_durable_enqueue_smoke.py
      - name: Run strict Phase 6-B2 durable enqueue security smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b2_durable_enqueue_security_smoke.py
      - name: Run Phase 6-B2 durable enqueue contract smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b2_durable_enqueue_contract_smoke.py
      - name: Run B2/B3 enqueue lifecycle compatibility smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b3_enqueue_lifecycle_compat_smoke.py
      - name: Run Phase 6-B3 precommit failure projection smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b3_precommit_failure_projection_smoke.py
      - name: Run Phase 6-B3 queue root path smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b3_queue_root_path_smoke.py
      - name: Run Phase 6-B3 queue state smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_smoke.py
      - name: Verify Phase 6-B3 bounded renewal horizon contract
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path

          source = Path("relaylm/relaymem_slp_queue_state.py").read_text(encoding="utf-8")
          smoke = Path("scripts/relaylm_phase6b3_queue_state_smoke.py").read_text(encoding="utf-8")
          contract = Path("docs/architecture/phase6b3_relayslp_queue_state_helpers.md").read_text(encoding="utf-8")

          assert '_lease_expiry(now, request.lease_duration_seconds)' in source
          assert '_lease_expiry(expiry, request.lease_duration_seconds)' not in source
          assert '2026-06-22T01:00:35.000000Z' in smoke
          assert 'does not accumulate duration from the previous expiry' in contract
          PY
      - name: Run strict Phase 6-B3 queue state security smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_security_smoke.py
      - name: Run Phase 6-B3 queue state contract smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_contract_smoke.py
      - name: Run documentation link audit
        run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
