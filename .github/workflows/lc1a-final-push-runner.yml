name: LC1A final push repair runner

on:
  push:
    branches: [agent/lc1a-subjective-mem-correct]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run final source repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/lc1a-final-repair.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = workflow.index(marker) + len(marker)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow[start:].splitlines()
          ) + '\n'
          script = script.replace(
              "rm -f .github/workflows/lc1a-final-repair.yml .github/lc1a-final-repair-trigger",
              "rm -f .github/workflows/lc1a-final-repair.yml .github/workflows/lc1a-final-push-runner.yml .github/lc1a-final-repair-trigger .github/lc1a-final-push-trigger .github/lc1a-final-repair-error.txt",
          )
          Path('/tmp/lc1a-final-repair.sh').write_text(script, encoding='utf-8')
          PY
          set +e
          bash /tmp/lc1a-final-repair.sh > /tmp/lc1a-final-repair.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            tail -300 /tmp/lc1a-final-repair.log > .github/lc1a-final-repair-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/lc1a-final-repair-error.txt
            git commit -m 'chore: record LC-1A final repair failure'
            git push origin HEAD:agent/lc1a-subjective-mem-correct
            exit 1
          fi
