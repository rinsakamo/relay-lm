name: I-7AB held Apply Discard contract smoke

on:
  pull_request:
    paths:
      - "relaylm/relaymem_held_governance_contract.py"
      - "relaylm/relaymem_held_governance_preflight.py"
      - "tests/test_relaymem_held_governance_preflight.py"
      - "scripts/relaylm_i7ab_held_apply_discard_contract_smoke.py"
      - "docs/architecture/phase_i7ab_held_apply_discard_contract.md"
      - "docs/mvp/wave4/i7ab_completion_report.md"
      - ".github/workflows/i7ab-held-apply-discard-contract-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/relaymem_held_governance_contract.py"
      - "relaylm/relaymem_held_governance_preflight.py"
      - "tests/test_relaymem_held_governance_preflight.py"
      - "scripts/relaylm_i7ab_held_apply_discard_contract_smoke.py"
      - "docs/architecture/phase_i7ab_held_apply_discard_contract.md"
      - "docs/mvp/wave4/i7ab_completion_report.md"
      - ".github/workflows/i7ab-held-apply-discard-contract-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RelayLM and test runner
        run: python -m pip install -e . pytest
      - name: Compile I-7AB helpers and smoke
        run: >-
          python -m compileall -q
          relaylm/relaymem_held_governance_contract.py
          relaylm/relaymem_held_governance_preflight.py
          scripts/relaylm_i7ab_held_apply_discard_contract_smoke.py
      - name: Run I-7AB unit tests
        run: PYTHONPATH=. python -m pytest tests/test_relaymem_held_governance_preflight.py
      - name: Run I-7AB contract smoke
        run: PYTHONPATH=. python scripts/relaylm_i7ab_held_apply_discard_contract_smoke.py
      - name: Run B3 queue contract regression smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_contract_smoke.py
      - name: Run C2 one queued worker integration regression smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6c2_one_queued_primary_worker_integration_smoke.py
      - name: Run I-4D retrieval exclusion regression smoke
        run: PYTHONPATH=. python scripts/relaylm_phase_i4d_primary_retrieval_exclusion_smoke.py
      - name: Run O1A scheduler contract regression smoke
        run: PYTHONPATH=. python scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py
      - name: Run documentation link audit
        run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
