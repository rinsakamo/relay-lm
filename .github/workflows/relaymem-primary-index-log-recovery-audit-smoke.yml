name: RelayMEM Primary index log recovery audit smoke

on:
  pull_request:
    paths:
      - "relaylm/relaymem_primary_index_log_recovery_audit.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_contract.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_io.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_io_page.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_io_control.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_io_cleanup.py"
      - "scripts/relaylm_relaymem_primary_index_log_recovery_audit_smoke.py"
      - "scripts/relaylm_relaymem_primary_index_log_recovery_audit_security_smoke.py"
      - "scripts/relaylm_relaymem_primary_index_log_recovery_audit_receipt_smoke.py"
      - "docs/architecture/relaymem_m3h_primary_index_log_reconciliation_recovery_audit.md"
      - ".github/workflows/relaymem-primary-index-log-recovery-audit-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/relaymem_primary_index_log_recovery_audit.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_contract.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_io.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_io_page.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_io_control.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_io_cleanup.py"
      - "scripts/relaylm_relaymem_primary_index_log_recovery_audit_smoke.py"
      - "scripts/relaylm_relaymem_primary_index_log_recovery_audit_security_smoke.py"
      - "scripts/relaylm_relaymem_primary_index_log_recovery_audit_receipt_smoke.py"
      - "docs/architecture/relaymem_m3h_primary_index_log_reconciliation_recovery_audit.md"
      - ".github/workflows/relaymem-primary-index-log-recovery-audit-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RelayMEM M3h helper and smoke
        run: >-
          python -m compileall -q
          relaylm/relaymem_primary_index_log_recovery_audit.py
          relaylm/_relaymem_primary_index_log_recovery_audit.py
          relaylm/_relaymem_primary_index_log_recovery_audit_contract.py
          relaylm/_relaymem_primary_index_log_recovery_audit_io.py
          relaylm/_relaymem_primary_index_log_recovery_audit_io_page.py
          relaylm/_relaymem_primary_index_log_recovery_audit_io_control.py
          relaylm/_relaymem_primary_index_log_recovery_audit_io_cleanup.py
          scripts/relaylm_relaymem_primary_index_log_recovery_audit_smoke.py
          scripts/relaylm_relaymem_primary_index_log_recovery_audit_security_smoke.py
          scripts/relaylm_relaymem_primary_index_log_recovery_audit_receipt_smoke.py
      - name: Run RelayMEM M3h recovery audit functional smoke
        run: |
          set +e
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_recovery_audit_smoke.py > m3h-functional-smoke.log 2>&1
          exit_code=$?
          cat m3h-functional-smoke.log
          exit "$exit_code"
      - name: Upload RelayMEM M3h functional smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relaymem-m3h-functional-smoke-output
          path: m3h-functional-smoke.log
          if-no-files-found: error
          retention-days: 3
      - name: Run RelayMEM M3h recovery audit security smoke
        run: >-
          PYTHONPATH=.
          python scripts/relaylm_relaymem_primary_index_log_recovery_audit_security_smoke.py
      - name: Run RelayMEM M3h receipt invariant smoke
        run: >-
          PYTHONPATH=.
          python scripts/relaylm_relaymem_primary_index_log_recovery_audit_receipt_smoke.py
