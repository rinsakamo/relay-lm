name: One-shot O1A status anchor fix
on:
  pull_request:
    paths:
      - .github/workflows/tmp-o1a-status-anchor.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i1gd-durable-finalization-retention-cleanup
          fetch-depth: 0
      - name: Update exact status line
        run: |
          perl -0pi -e 's/\*\*Contract and pure deterministic aggregation model complete; O1B replay adapter and O1C queue adapter complete; production scheduler loop unimplemented\.\*\*/**Contract and pure deterministic aggregation model complete; production scheduler unimplemented.** O1B replay adapter and O1C queue adapter are complete; the scheduler loop remains unimplemented./' docs/architecture/o1a_two_lane_scheduler_contract.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-o1a-status-anchor.yml
          git add docs/architecture/o1a_two_lane_scheduler_contract.md
          git commit -m 'docs: preserve O1A scheduler compatibility anchor'
          git push origin HEAD:phase-i1gd-durable-finalization-retention-cleanup
