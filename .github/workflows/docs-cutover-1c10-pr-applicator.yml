name: Documentation cutover 1C-10 PR applicator

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/docs-cutover-1c10-e1r5-post-wave7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c10-e1r5-post-wave7
          fetch-depth: 0
          show-progress: false

      - name: Prepare cutover dependency corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/docs_cutover_1c10.py')
          text = path.read_text(encoding='utf-8')

          current_anchor = '''replace(
              "scripts/relaylm_documentation_current_boundary_smoke.py",
              "    \\\"docs/architecture/e1r5_post_wave7_correction_convergence_audit.md\\\",\\n",
              "",
              1,
          )
          '''
          current_addition = current_anchor + '''replace(
              "scripts/relaylm_documentation_current_boundary_smoke.py",
              "    \\\"docs/architecture/e1r5_post_wave7_correction_convergence_audit.md\\\": (\\n"
              "        \\\"relaylm_doc_type: integration_convergence_audit\\\",\\n"
              "        \\\"# E1-R5 Post-Wave-7 Correction Convergence Audit\\\",\\n"
              "        \\\"M2 remains the preferred relevance owner.\\\",\\n"
              "        \\\"PM-D8: E1-R5 bounded Primary MEM candidate fallback folded into canonical Primary recall adapter in PR #491\\\",\\n"
              "        \\\"PYTHONPATH=. python scripts/relaylm_e1r5_primary_mem_recall_candidate_bridge_smoke.py\\\",\\n"
              "        \\\"PYTHONPATH=. python scripts/relaylm_e1r4_unsupported_detail_suppression_smoke.py\\\",\\n"
              "    ),\\n",
              "",
              1,
          )
          '''
          assert text.count(current_anchor) == 1
          text = text.replace(current_anchor, current_addition)

          handoff_anchor = '''replace(
              "docs/architecture/e1r5_primary_mem_recall_candidate_bridge.md",
              "  - e1r5_post_wave7_correction_convergence_audit.md",
              "  - ../evidence/waves/e1r5_post_wave7_correction_convergence_audit.md",
              1,
          )
          '''
          handoff_addition = handoff_anchor + '''replace(
              "docs/architecture/e1r5_primary_mem_recall_candidate_bridge.md",
              "(e1r5_post_wave7_correction_convergence_audit.md)",
              "(../evidence/waves/e1r5_post_wave7_correction_convergence_audit.md)",
              1,
          )
          '''
          assert text.count(handoff_anchor) == 1
          text = text.replace(handoff_anchor, handoff_addition)

          replacements = (
              (
                  'script_hard_coded_path_reference_occurrences_updated_in_pr_tree: 1',
                  'script_hard_coded_path_reference_occurrences_updated_in_pr_tree: 2',
              ),
              (
                  'relative_markdown_link_referrer_files_at_frozen_baseline: 3',
                  'relative_markdown_link_referrer_files_at_frozen_baseline: 4',
              ),
              (
                  'relative_markdown_link_dependencies_at_frozen_baseline: 4',
                  'relative_markdown_link_dependencies_at_frozen_baseline: 5',
              ),
              (
                  'one hard-coded current-boundary path',
                  'two hard-coded current-boundary occurrences',
              ),
              (
                  'four Markdown relative links across three referrer files',
                  'five Markdown relative links across four referrer files',
              ),
          )
          for old, new in replacements:
              assert text.count(old) == 1, old
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply E1-R5 correction evidence cutover
        id: cutover
        continue-on-error: true
        env:
          CUTOVER_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: python .github/scripts/docs_cutover_1c10.py > cutover-apply.log 2>&1

      - name: Stop after applicator failure
        if: steps.cutover.outcome == 'failure'
        shell: bash
        run: |
          cat cutover-apply.log
          exit 1

      - name: Validate cutover
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== compileall ==='
            python -m compileall relaylm scripts
            echo '=== documentation links ==='
            python scripts/relaylm_docs_link_check.py
            echo '=== semantic audit ==='
            python scripts/relaylm_docs_semantic_audit.py
            echo '=== current boundary ==='
            python scripts/relaylm_documentation_current_boundary_smoke.py
            echo '=== E1 consolidation ==='
            python scripts/relaylm_e1_evaluation_consolidation_smoke.py
            echo '=== diff check ==='
            git diff --check
          } > cutover-validation.log 2>&1

      - name: Upload cutover diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-cutover-1c10-diagnostics
          path: |
            cutover-apply.log
            cutover-validation.log
          if-no-files-found: error

      - name: Stop after validation failure
        if: steps.validate.outcome == 'failure'
        shell: bash
        run: |
          cat cutover-validation.log
          exit 1

      - name: Commit cutover
        shell: bash
        run: |
          set -euo pipefail
          rm -f cutover-apply.log cutover-validation.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: move E1-R5 correction audit in cutover 1C-10"
          git push origin HEAD:agent/docs-cutover-1c10-e1r5-post-wave7
