name: Documentation cutover 1C-10 PR applicator

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/docs-cutover-1c10-e1r5-post-wave7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c10-e1r5-post-wave7
          fetch-depth: 0
          show-progress: false

      - name: Prepare current-boundary inventory correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/docs_cutover_1c10.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''replace(
              "scripts/relaylm_documentation_current_boundary_smoke.py",
              "    \\\"docs/architecture/e1r5_post_wave7_correction_convergence_audit.md\\\",\\n",
              "",
              1,
          )
          '''
          addition = anchor + '''replace(
              "scripts/relaylm_documentation_current_boundary_smoke.py",
              "    \\\"docs/architecture/e1r5_post_wave7_correction_convergence_audit.md\\\": (\\n"
              "        \\\"relaylm_doc_type: integration_convergence_audit\\\",\\n"
              "        \\\"# E1-R5 Post-Wave-7 Correction Convergence Audit\\\",\\n"
              "        \\\"M2 remains the preferred relevance owner.\\\",\\n"
              "        \\\"PM-D8: E1-R5 bounded Primary MEM candidate fallback folded into canonical Primary recall adapter in PR #491\\\",\\n"
              "        \\\"PYTHONPATH=. python scripts/relaylm_e1r5_primary_mem_recall_candidate_bridge_smoke.py\\\",\\n"
              "        \\\"PYTHONPATH=. python scripts/relaylm_e1r4_unsupported_detail_suppression_smoke.py\\\",\\n"
              "    ),\\n",
              "",
              1,
          )
          '''
          assert text.count(anchor) == 1
          text = text.replace(anchor, addition)
          assert text.count('script_hard_coded_path_reference_occurrences_updated_in_pr_tree: 1') == 1
          text = text.replace(
              'script_hard_coded_path_reference_occurrences_updated_in_pr_tree: 1',
              'script_hard_coded_path_reference_occurrences_updated_in_pr_tree: 2',
          )
          assert text.count('one hard-coded current-boundary path') == 1
          text = text.replace(
              'one hard-coded current-boundary path',
              'two hard-coded current-boundary occurrences',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply E1-R5 correction evidence cutover
        id: cutover
        continue-on-error: true
        env:
          CUTOVER_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: python .github/scripts/docs_cutover_1c10.py > cutover-apply.log 2>&1

      - name: Upload cutover diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-cutover-1c10-diagnostics
          path: cutover-apply.log
          if-no-files-found: error

      - name: Stop after applicator failure
        if: steps.cutover.outcome == 'failure'
        shell: bash
        run: |
          cat cutover-apply.log
          exit 1

      - name: Validate cutover
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall relaylm scripts
          python scripts/relaylm_docs_link_check.py
          python scripts/relaylm_docs_semantic_audit.py
          python scripts/relaylm_documentation_current_boundary_smoke.py
          python scripts/relaylm_e1_evaluation_consolidation_smoke.py
          git diff --check

      - name: Commit cutover
        shell: bash
        run: |
          set -euo pipefail
          rm -f cutover-apply.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: move E1-R5 correction audit in cutover 1C-10"
          git push origin HEAD:agent/docs-cutover-1c10-e1r5-post-wave7
