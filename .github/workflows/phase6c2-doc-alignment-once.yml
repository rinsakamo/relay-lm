name: Phase 6-C2 documentation alignment once

on:
  push:
    branches:
      - phase6c2-one-queued-job-integration
    paths:
      - "scripts/_phase6c2_apply_doc_updates.py"
      - ".github/workflows/phase6c2-doc-alignment-once.yml"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6c2-one-queued-job-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Phase 6-C2 documentation alignment
        run: python scripts/_phase6c2_apply_doc_updates.py
      - name: Remove one-shot alignment machinery
        run: |
          rm scripts/_phase6c2_apply_doc_updates.py
          rm .github/workflows/phase6c2-doc-alignment-once.yml
      - name: Commit aligned documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/_phase6c2_apply_doc_updates.py .github/workflows/phase6c2-doc-alignment-once.yml
          git commit -m "docs: align repository with Phase 6-C2 completion"
          git push origin HEAD:phase6c2-one-queued-job-integration
