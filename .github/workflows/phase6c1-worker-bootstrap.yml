name: Phase 6-C1 worker bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/phase6c1-worker-bootstrap.yml

permissions:
  issues: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Hash payload parts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/367/comments?per_page=100")"
          echo "comment_count=$(jq 'length' <<<"$comments")"
          : > "$RUNNER_TEMP/phase6c1-payload.b64"
          for part in 1 2 3 4; do
            marker="<!-- PHASE6C1_PAYLOAD_PART_${part} -->"
            body="$(jq -r --arg marker "$marker" '[.[] | select(.body | startswith($marker))] | last | .body // empty' <<<"$comments")"
            test -n "$body"
            payload="$(printf '%s\n' "$body" | tail -n +2)"
            echo "part_${part}_chars=${#payload}"
            printf '%s' "$payload" | sha256sum
            printf '%s' "$payload" >> "$RUNNER_TEMP/phase6c1-payload.b64"
          done
          echo "payload_chars=$(wc -c < "$RUNNER_TEMP/phase6c1-payload.b64")"
          sha256sum "$RUNNER_TEMP/phase6c1-payload.b64"
          exit 1
