name: SOUL Lab UI-B0 real Home conversation

on:
  push:
    paths:
      - "apps/soul-lab/**"
      - "relaylm/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/soul-lab-ui-b0-home-conversation.yml"
  pull_request:
    paths:
      - "apps/soul-lab/**"
      - "relaylm/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/soul-lab-ui-b0-home-conversation.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/soul-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run smoke:home-conversation
      - run: npm run build

  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m compileall -q relaylm scripts
      - run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
      - run: PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i1_two_turn_primary_recall_ci_runner.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i2_lab_observation_ci_runner.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i3_primary_mem_correct_ci_runner.py
      - run: PYTHONPATH=. python scripts/relaylm_openwebui_lmstudio_config_smoke.py
      - run: PYTHONPATH=. python scripts/relaylm_openwebui_lmstudio_proxy_smoke.py
