name: RelayMEM Primary index log apply smoke

on:
  pull_request:
    paths:
      - "relaylm/relaymem_primary_index_log_apply.py"
      - "relaylm/_relaymem_primary_index_log_apply.py"
      - "relaylm/_relaymem_primary_index_log_apply_contract.py"
      - "relaylm/_relaymem_primary_index_log_apply_io.py"
      - "scripts/relaylm_relaymem_primary_index_log_apply_smoke.py"
      - "scripts/relaylm_relaymem_primary_index_log_apply_security_smoke.py"
      - "docs/architecture/relaymem_m3g_primary_index_log_reconciliation_apply.md"
      - ".github/workflows/relaymem-primary-index-log-apply-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/relaymem_primary_index_log_apply.py"
      - "relaylm/_relaymem_primary_index_log_apply.py"
      - "relaylm/_relaymem_primary_index_log_apply_contract.py"
      - "relaylm/_relaymem_primary_index_log_apply_io.py"
      - "scripts/relaylm_relaymem_primary_index_log_apply_smoke.py"
      - "scripts/relaylm_relaymem_primary_index_log_apply_security_smoke.py"
      - "docs/architecture/relaymem_m3g_primary_index_log_reconciliation_apply.md"
      - ".github/workflows/relaymem-primary-index-log-apply-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RelayMEM M3g helper and smoke
        run: >-
          python -m compileall -q
          relaylm/relaymem_primary_index_log_apply.py
          relaylm/_relaymem_primary_index_log_apply.py
          relaylm/_relaymem_primary_index_log_apply_contract.py
          relaylm/_relaymem_primary_index_log_apply_io.py
          scripts/relaylm_relaymem_primary_index_log_apply_smoke.py
          scripts/relaylm_relaymem_primary_index_log_apply_security_smoke.py
      - name: Run RelayMEM M3g reconciliation apply smoke
        run: >-
          PYTHONPATH=.
          python scripts/relaylm_relaymem_primary_index_log_apply_smoke.py
      - name: Run RelayMEM M3g reconciliation security smoke
        run: >-
          PYTHONPATH=.
          python scripts/relaylm_relaymem_primary_index_log_apply_security_smoke.py
