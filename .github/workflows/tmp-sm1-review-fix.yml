name: Temporary SM-1 review corrections

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/tmp-sm1-review-fix.yml
      - scripts/tmp_sm1_review_fix.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply review corrections
        run: python scripts/tmp_sm1_review_fix.py

      - name: Compile
        run: python -m compileall -q relaylm scripts

      - name: Focused SM-1 tests
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=tests:. pytest -q tests/test_subjective_mem_runtime.py --tb=short 2>&1 | tee focused-sm1.log

      - name: Upload focused test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-sm1-output
          path: focused-sm1.log
          if-no-files-found: error

      - name: Stop on focused test failure
        if: steps.focused.outcome == 'failure'
        run: exit 1

      - name: SM-1 smoke
        run: python scripts/relaylm_sm1_subjective_mem_create_smoke.py

      - name: Full pytest
        run: PYTHONPATH=tests:. pytest -q --tb=short

      - name: Diff check
        run: git diff --check

      - name: Commit corrections and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relaylm/subjective_mem_runtime.py relaylm/evidence_store.py tests/test_subjective_mem_runtime.py docs/architecture/project_execution_plan.md docs/architecture/sm1_subjective_mem_create_runtime.md
          git rm .github/workflows/tmp-sm1-review-fix.yml scripts/tmp_sm1_review_fix.py
          git commit -m "fix: enforce SM-1 scoped idempotency and selector uniqueness"
          git push origin HEAD:agent/sm1-subjective-mem-create-runtime
