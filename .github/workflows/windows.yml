name: Windows startup

on:
  workflow_dispatch:
  push:
    paths:
      - relaylm/**
      - pyproject.toml
      - scripts/relaylm_windows_startup_check.py
      - .github/workflows/windows.yml
  pull_request:
    paths:
      - relaylm/**
      - pyproject.toml
      - scripts/relaylm_windows_startup_check.py
      - .github/workflows/windows.yml

permissions:
  contents: read

jobs:
  startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package
        run: pip install -e .
      - name: Run Windows startup check
        run: python scripts/relaylm_windows_startup_check.py
