name: Bootstrap Documentation Hard Cutover 1C-53 Bookkeeping

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/bootstrap-cutover-1c53-bookkeeping.yml"
      - "scripts/relaylm_cutover_1c53_bookkeeping.py"

permissions:
  contents: write

jobs:
  bookkeeping:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c53-bookkeeping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Finalize Cutover 1C-53 bookkeeping
        env:
          BOOKKEEPING_PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python scripts/relaylm_cutover_1c53_bookkeeping.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/migrations/cutover-1c53-i4c1.md docs/evidence/migrations/documentation-hard-cutover-receipt.md
          git diff --cached --stat
          git commit -m "docs: finalize cutover 1C-53 bookkeeping facts"
          git push origin HEAD:"${HEAD_REF}"
