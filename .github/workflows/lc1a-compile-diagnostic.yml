name: LC1A helper repair

on:
  push:
    branches: [agent/lc1a-subjective-mem-correct]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Repair lifecycle helper functions
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path('relaylm/subjective_mem_lifecycle_runtime.py')
          text = path.read_text(encoding='utf-8')

          def replace(start: str, end: str, encoded: str) -> None:
              global text
              left = text.index(start)
              right = text.index(end, left)
              body = base64.b64decode(encoded).decode('utf-8')
              text = text[:left] + body + text[right + 1 :]

          replace(
              'def _validate_pre_image_authority_current(\n',
              '\ndef _predecessor_from_artifact(\n',
              ''
          )
          replace(
              'def _predecessor_from_artifact(\n',
              '\ndef _artifact_exact_for_intent(\n',
              ''
          )
          replace(
              'def _artifact_exact_for_intent(\n',
              '\ndef identity_transition(\n',
              ''
          )
          replace(
              'def _state_from_intent(\n',
              '\ndef _mark_recovery_required(\n',
              ''
          )
          replace(
              'def _current_state_from_dict(raw: object) -> SubjectiveMemCurrentState | None:\n',
              '\ndef _derive_identity(\n',
              ''
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m compileall -f -q relaylm scripts tests
          python -m pip install -q -e '.[test]'
          PYTHONPATH=tests:. python -m pytest -q \
            tests/test_subjective_mem_runtime.py \
            tests/test_subjective_mem_commit_runtime.py \
            tests/test_subjective_mem_lifecycle_runtime.py \
            tests/test_ctx_ovl_config.py \
            tests/test_evidence_config_routing.py \
            tests/test_shared_assessment_runtime.py
          git diff --check
          rm -f .github/workflows/lc1a-compile-diagnostic.yml \
                .github/lc1a-compile-diagnostic-trigger \
                .github/lc1a-compile-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize LC-1A lifecycle helpers'
          git push origin HEAD:agent/lc1a-subjective-mem-correct
