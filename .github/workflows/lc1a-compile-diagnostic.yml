name: LC1A compile diagnostic

on:
  push:
    branches: [agent/lc1a-subjective-mem-correct]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Capture compile output
        shell: bash
        run: |
          set +e
          python -m compileall -f relaylm scripts > /tmp/lc1a-compile.log 2>&1
          status=$?
          set -e
          {
            echo "status=$status head=$GITHUB_SHA"
            tail -300 /tmp/lc1a-compile.log
          } > .github/lc1a-compile-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/lc1a-compile-error.txt
          git commit -m 'chore: record LC-1A compile diagnostic'
          git push origin HEAD:agent/lc1a-subjective-mem-correct
          exit 1
