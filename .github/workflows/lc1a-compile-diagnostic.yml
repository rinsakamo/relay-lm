name: LC1A compile repair

on:
  push:
    branches: [agent/lc1a-subjective-mem-correct]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Repair exact pre-image authority helper
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path('relaylm/subjective_mem_lifecycle_runtime.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _validate_pre_image_authority_current(\n')
          end = text.index('\ndef _predecessor_from_artifact(\n', start)
          replacement = base64.b64decode(
              ''
          ).decode('utf-8')
          path.write_text(text[:start] + replacement + text[end + 1 :], encoding='utf-8')
          PY
          python -m compileall -f -q relaylm scripts tests
          python -m pip install -q -e '.[test]'
          PYTHONPATH=tests:. python -m pytest -q \
            tests/test_subjective_mem_runtime.py \
            tests/test_subjective_mem_commit_runtime.py \
            tests/test_subjective_mem_lifecycle_runtime.py \
            tests/test_ctx_ovl_config.py \
            tests/test_evidence_config_routing.py \
            tests/test_shared_assessment_runtime.py
          git diff --check
          rm -f .github/workflows/lc1a-compile-diagnostic.yml \
                .github/lc1a-compile-diagnostic-trigger \
                .github/lc1a-compile-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair LC-1A pre-image authority helper'
          git push origin HEAD:agent/lc1a-subjective-mem-correct
