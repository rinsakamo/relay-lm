name: O1F operational validation

on:
  pull_request:
    paths:
      - "relaylm/relaymem_slp_scheduler_operational_validation.py"
      - "relaylm/relaymem_slp_scheduler_operations.py"
      - "relaylm/relaymem_slp_scheduler_policy.py"
      - "relaylm/relaymem_slp_scheduler_round.py"
      - "relaylm/relaymem_slp_queue_*.py"
      - "relaylm/relaymem_slp_durable_finalization_*.py"
      - "docs/architecture/o1f_operational_validation.md"
      - "docs/mvp/wave6/o1f_completion_report.md"
      - "scripts/_relaylm_o1f_support.py"
      - "scripts/relaylm_o1f_operational_validation_*.py"
      - ".github/workflows/o1f-operational-validation.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/relaymem_slp_scheduler_operational_validation.py"
      - "relaylm/relaymem_slp_scheduler_operations.py"
      - "relaylm/relaymem_slp_scheduler_policy.py"
      - "relaylm/relaymem_slp_scheduler_round.py"
      - "relaylm/relaymem_slp_queue_*.py"
      - "relaylm/relaymem_slp_durable_finalization_*.py"
      - "docs/architecture/o1f_operational_validation.md"
      - "docs/mvp/wave6/o1f_completion_report.md"
      - "scripts/_relaylm_o1f_support.py"
      - "scripts/relaylm_o1f_operational_validation_*.py"
      - ".github/workflows/o1f-operational-validation.yml"

jobs:
  o1f-operational-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile focused files
        run: python -m compileall relaylm scripts
      - name: O1F operational smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_smoke.py
      - name: O1F corruption smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_corruption_smoke.py
      - name: O1F concurrency smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_concurrency_smoke.py
      - name: O1F saturation smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_saturation_smoke.py
      - name: O1F restart smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_restart_smoke.py
      - name: O1F security smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_security_smoke.py
      - name: O1F completion report smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/mvp/wave6/o1f_completion_report.md
      - name: MVP PR link smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
      - name: Docs link check
        run: PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
