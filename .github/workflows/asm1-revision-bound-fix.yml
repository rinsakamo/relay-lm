name: ASM-1 revision bound fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply bounded revision correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path("relaylm/shared_assessment_runtime.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          marker = '''ReceiptStatus = Literal["issued", "duplicate_existing", "fail_closed", "integrity_conflict"]\n'''
          replacement = marker + '''\nMAX_SHARED_ASSESSMENT_REVISIONS = 4096\n'''
          if runtime.count(marker) != 1:
              raise SystemExit("ASM-1 ReceiptStatus marker mismatch")
          runtime = runtime.replace(marker, replacement, 1)

          marker = '''            if index_reasons:\n                return SharedAssessmentCommitResult(\n                    "fail_closed", blocked_reasons=index_reasons\n                )\n            if current_state is not None and (\n'''
          replacement = '''            if index_reasons:\n                return SharedAssessmentCommitResult(\n                    "fail_closed", blocked_reasons=index_reasons\n                )\n            if (\n                current_state is not None\n                and current_state.current_revision\n                >= MAX_SHARED_ASSESSMENT_REVISIONS\n            ):\n                return SharedAssessmentCommitResult(\n                    "fail_closed",\n                    blocked_reasons=(\n                        "shared_assessment_revision_index_bound_exceeded",\n                    ),\n                )\n            if current_state is not None and (\n'''
          if runtime.count(marker) != 1:
              raise SystemExit("ASM-1 commit-bound marker mismatch")
          runtime = runtime.replace(marker, replacement, 1)

          marker = '''    if expected_count > 4096:\n'''
          replacement = '''    if expected_count > MAX_SHARED_ASSESSMENT_REVISIONS:\n'''
          if runtime.count(marker) != 1:
              raise SystemExit("ASM-1 index-bound marker mismatch")
          runtime = runtime.replace(marker, replacement, 1)
          runtime_path.write_text(runtime, encoding="utf-8")

          tests_path = Path("tests/test_shared_assessment_runtime.py")
          tests = tests_path.read_text(encoding="utf-8")
          marker = '''from relaylm.config import RelayLMConfig\n'''
          replacement = marker + '''import relaylm.shared_assessment_runtime as shared_assessment_runtime\n'''
          if tests.count(marker) != 1:
              raise SystemExit("ASM-1 test import marker mismatch")
          tests = tests.replace(marker, replacement, 1)

          marker = '''\ndef test_dry_run_validates_without_shared_assessment_write(store) -> None:\n'''
          addition = '''\ndef test_revision_bound_blocks_successor_without_corrupting_current(\n    monkeypatch, store\n) -> None:\n    _captures, bundle = _bundle(store)\n    monkeypatch.setattr(\n        shared_assessment_runtime, "MAX_SHARED_ASSESSMENT_REVISIONS", 1\n    )\n    first = commit_shared_assessment_revision(\n        store=store,\n        bundle=bundle,\n        proposal=_proposal(),\n        operation_idempotency_key="bounded-revision-1",\n        apply_enabled=True,\n        now=NOW,\n    )\n    assert first.status == "committed"\n\n    blocked = commit_shared_assessment_revision(\n        store=store,\n        bundle=bundle,\n        proposal=_proposal(expected=1, text="must not become revision two"),\n        operation_idempotency_key="bounded-revision-2",\n        apply_enabled=True,\n        now=NOW + timedelta(seconds=1),\n    )\n    assert blocked.status == "fail_closed"\n    assert blocked.blocked_reasons == (\n        "shared_assessment_revision_index_bound_exceeded",\n    )\n    receipt = issue_shared_assessment_formation_receipt(\n        store=store,\n        evidence_space_id=bundle.evidence_space_id,\n        assessment_id="assessment-1",\n        assessment_revision=1,\n        operation_idempotency_key="bounded-revision-receipt",\n        now=NOW + timedelta(seconds=2),\n    )\n    assert receipt.status == "issued"\n\n\ndef test_dry_run_validates_without_shared_assessment_write(store) -> None:\n'''
          if tests.count(marker) != 1:
              raise SystemExit("ASM-1 test insertion marker mismatch")
          tests = tests.replace(marker, addition, 1)
          tests_path.write_text(tests, encoding="utf-8")
          PY
          git rm .github/workflows/asm1-revision-bound-fix.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -e '.[test]'

      - name: Validate corrected ASM-1 tree
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q relaylm scripts
          pytest -q
          python scripts/relaylm_asm1_shared_assessment_smoke.py
          python scripts/relaylm_docs_link_check.py
          python scripts/relaylm_docs_semantic_audit.py

      - name: Publish correction
        shell: bash
        env:
          TARGET_BRANCH: agent/asm1-shared-assessment-runtime-v1
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add relaylm/shared_assessment_runtime.py tests/test_shared_assessment_runtime.py
          git commit -m 'fix: enforce ASM-1 revision bound before successor'
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
