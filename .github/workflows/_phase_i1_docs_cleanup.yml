name: Phase I-1 documentation alignment

on:
  push:
    branches:
      - phase-i1-primary-mem-next-turn-recall
    paths:
      - ".github/workflows/_phase_i1_docs_cleanup.yml"

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i1-primary-mem-next-turn-recall
          fetch-depth: 0
      - name: Align current status and non-obsolete smoke anchors
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              body = target.read_text(encoding="utf-8")
              if old not in body:
                  raise SystemExit(f"missing anchor in {path}: {old!r}")
              target.write_text(body.replace(old, new, 1), encoding="utf-8")

          replace(
              "docs/PROJECT_STATUS.md",
              "- Phase 6-C2 one queued-job claim / rehydrate / execute integration adapter.",
              "- Phase 6-C2 one queued-job claim / rehydrate / execute integration adapter,\n- Phase I-1 Primary MEM next-turn recall and character/namespace isolation.",
          )
          replace(
              "docs/PROJECT_STATUS.md",
              "Asynchronous RelaySLP orchestration: I1-B and B3 complete; C1-0 through C1-5 complete; C2 one-job adapter complete",
              "Asynchronous RelaySLP orchestration: I1-B and B3 complete; C1-0 through C1-5 complete; C2 one-job adapter complete; I1 next-turn recall complete",
          )
          replace(
              "docs/PROJECT_STATUS.md",
              "RelayMEM Primary path: M1/M2 complete; M3a-M3h composed and executable for one exact active claim",
              "RelayMEM Primary path: M1/M2 complete; M3a-M3h composed and executable; ordinary next-turn recall and character/namespace isolation complete",
          )
          replace(
              "docs/PROJECT_STATUS.md",
              "- next-turn recall and real SOUL Lab memory observation remain unproven.",
              "- real SOUL Lab latest-run and memory observation remain unimplemented.",
          )
          replace(
              "docs/PROJECT_STATUS.md",
              "- successful worker execution does not yet prove that a later ordinary turn retrieves and uses the newly formed memory,",
              "- later ordinary-turn retrieval and bounded RelayCTX use are proven for the correct character and namespace,",
          )
          replace(
              "docs/PROJECT_STATUS.md",
              "  -> next-turn recall and scope isolation: next",
              "  -> next-turn recall and scope isolation: complete",
          )
          replace(
              "docs/PROJECT_STATUS.md",
              "1. Add a two-turn smoke proving next-turn recall and character/namespace isolation.\n2. Add real SOUL Lab read APIs for latest run, formed/held/blocked memory, and used memory.\n3. Add one auditable Correct operation whose result changes later retrieval behavior.\n4. Treat the visible-response-to-background-finalizer crash window as a separate I1 durability boundary; C1-5 and C2 do not claim to close it.",
              "1. Add real SOUL Lab read APIs for latest run, formed/held/blocked memory, and used memory.\n2. Add one auditable Correct operation whose result changes later retrieval behavior.\n3. Treat the visible-response-to-background-finalizer crash window as a separate I1 durability boundary; C1-5, C2, and Phase I-1 do not claim to close it.\n4. Keep queue scanning, scheduling, and daemon lifecycle as separate later operational work.",
          )
          replace(
              "docs/PROJECT_STATUS.md",
              "I1-B, B3, C1-0 through C1-5, and C2 are complete prerequisites, not the final product goal.",
              "I1-B, B3, C1-0 through C1-5, C2, and Phase I-1 next-turn recall are complete. SOUL Lab real observation is next; auditable Correct operation is later.",
          )
          replace(
              "docs/PROJECT_STATUS.md",
              "- end-to-end next-turn recall proof from newly formed runtime memory,\n",
              "",
          )
          replace(
              "docs/PROJECT_STATUS.md",
              "The memory write path remains explicitly gated. C1-5 and C2 provide restart-safe protected-source recovery and one exact queued-job execution; they do not make queue scheduling or next-turn recall automatic.",
              "The memory write path remains explicitly gated. C1-5 and C2 provide restart-safe protected-source recovery and one exact queued-job execution; Phase I-1 adds ordinary scoped recall, but queue scheduling and the pre-enqueue background-finalizer crash window remain unresolved.",
          )

          replace(
              "docs/architecture/pipeline_implementation_plan.md",
              "  next-turn recall and scope isolation: next",
              "  I1 next-turn Primary MEM recall: complete\n  character and namespace isolation: complete",
          )
          replace(
              "docs/architecture/pipeline_implementation_plan.md",
              "  next-turn recall and scope isolation: pending",
              "  next-turn recall and scope isolation: complete",
          )
          replace(
              "docs/architecture/pipeline_implementation_plan.md",
              "Phase 6-C2 completes the thin one-job claim/rehydrate/execute integration adapter. It accepts one exact queued canonical record, uses B3 claim, resolves source through C1-5, invokes C1-2, and preserves bounded retry/terminal behavior without adding a queue scanner, daemon, generalized worker pool, or retry scheduler. The next RelayLM Core boundary is next-turn recall and scope isolation.",
              "Phase 6-C2 completes the thin one-job claim/rehydrate/execute integration adapter. It accepts one exact queued canonical record, uses B3 claim, resolves source through C1-5, invokes C1-2, and preserves bounded retry/terminal behavior without adding a queue scanner, daemon, generalized worker pool, or retry scheduler. Phase I-1 now completes next-turn recall and character/namespace isolation; SOUL Lab real observation is next.",
          )
          replace(
              "docs/architecture/pipeline_implementation_plan.md",
              "  -> next-turn RelayMEM retrieval\n  -> RelayCTX injection\n  -> model response uses the formed memory",
              "  -> next-turn RelayMEM retrieval                      complete as Phase I-1\n  -> RelayCTX bounded injection                         complete as Phase I-1\n  -> model response uses the formed memory              complete as Phase I-1",
          )
          replace(
              "docs/architecture/pipeline_implementation_plan.md",
              "- C1-2 and C2 exist, but the ordinary runtime still lacks later-turn recall and scope-isolation proof.",
              "- Phase I-1 proves later-turn recall and character/namespace isolation; SOUL Lab still lacks real observation APIs.",
          )
          replace(
              "docs/architecture/pipeline_implementation_plan.md",
              "Phase 6 has implemented B0-B3, I1-B, C1-0 through C1-5, and the bounded C2 queued-record claim/rehydrate/execute adapter. The remaining Phase 6 product connection is next-turn recall and scope isolation, followed by Lab integration.",
              "Phase 6 has implemented B0-B3, I1-B, C1-0 through C1-5, the bounded C2 queued-record claim/rehydrate/execute adapter, and Phase I-1 scoped next-turn recall. SOUL Lab real observation is the next product connection.",
          )

          replace(
              "docs/architecture/relaymem_slp_current_target.md",
              "- proof that newly formed memory is selected and used in a later turn,",
              "- real SOUL Lab observation of formed and used memory,",
          )
          replace(
              "docs/architecture/relaymem_slp_current_target.md",
              "  -> later RelayMEM retrieval\n  -> RelayCTX injection\n  -> response uses formed memory",
              "  -> later RelayMEM retrieval                          complete as Phase I-1\n  -> RelayCTX bounded injection                           complete as Phase I-1\n  -> response uses formed memory                          complete as Phase I-1",
          )
          replace(
              "docs/architecture/relaymem_slp_current_target.md",
              "1. validate later-turn recall and character/namespace isolation,\n2. expose real latest-run and memory outcomes through server-owned SOUL Lab APIs,\n3. add one auditable Correct operation that changes later retrieval,\n4. resolve or formally bound the separate pre-enqueue background-finalizer crash window.",
              "1. expose real latest-run and memory outcomes through server-owned SOUL Lab APIs,\n2. add one auditable Correct operation that changes later retrieval,\n3. resolve or formally bound the separate pre-enqueue background-finalizer crash window,\n4. keep queue scanning and daemon lifecycle as separate operational work.",
          )
          replace(
              "docs/architecture/relaymem_slp_current_target.md",
              "I1-B, B3, C1-0 through C1-5, and C2 are complete prerequisites. Next-turn recall and scope isolation: next; the Primary MEM product loop remains integration pending.",
              "I1-B, B3, C1-0 through C1-5, C2, and Phase I-1 next-turn recall are complete. Character and namespace isolation: complete. SOUL Lab real observation is next.",
          )
          replace(
              "docs/architecture/relaymem_slp_current_target.md",
              "These boundaries still do not make the memory feature end to end. The active migration completes only when a later ordinary turn retrieves and uses the resulting memory within the correct character/namespace scope.",
              "Phase I-1 completes the ordinary two-turn Primary MEM loop by retrieving and using the resulting memory only within the correct character/namespace scope. SOUL Lab observation and Correct operations remain later boundaries.",
          )
          replace(
              "docs/architecture/relaymem_slp_current_target.md",
              "I1 next-turn Primary MEM recall: complete. Character and namespace isolation:\ncomplete.",
              "I1 next-turn Primary MEM recall: complete. Character and namespace isolation: complete.",
          )

          replace(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "These boundaries do not scan or schedule the queue and do not prove later-turn recall.",
              "These boundaries do not scan or schedule the queue. Phase I-1 separately proves later-turn recall.",
          )
          replace(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "## MEM-M3i-b: one-job runtime integration — complete; recall is next",
              "## MEM-M3i-b: one-job runtime integration and recall — complete",
          )
          replace(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "### Remaining scope\n\nC2 completed the one-job portion of M3i-b by adding the thin queued-record claim/rehydrate/execute adapter and reusing exact C1/M3 artifacts rather than public projections. The remaining recall scope must:",
              "### Completed recall scope\n\nC2 completed the one-job portion of M3i-b, and Phase I-1 completed the ordinary recall portion while reusing exact C1/M3/M2 artifacts rather than public projections. The completed recall scope:",
          )
          replace(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "The C2 one-job portion of M3i-b is complete, but M3 is not end-to-end complete until next-turn recall and scope isolation pass. C1-0 through C1-5 and C2 prove worker execution and protected-source restart boundaries, not the product recall loop.",
              "M3i-b is complete through C2 one-job execution and Phase I-1 next-turn recall with character/namespace isolation. Queue scheduling, the pre-enqueue crash window, SOUL Lab observation, and correction remain separate later boundaries.",
          )
          replace(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "Until next-turn recall and scope isolation close M3i, prefer connecting existing producers and consumers over new persistence schemas, recovery layers, or Secondary MEM behavior.",
              "With M3i next-turn recall and scope isolation complete, prefer SOUL Lab observation and auditable correction over new persistence schemas, recovery layers, or Secondary MEM behavior.",
          )

          replace(
              "docs/architecture/phase6c1_primary_mem_worker_contract.md",
              "Next-turn retrieval/RelayCTX injection is an I1 integration smoke, not a C1 worker prerequisite.",
              "Next-turn retrieval/RelayCTX injection is implemented by Phase I-1 and remains separate from the C1 worker prerequisite contract.",
          )
          replace(
              "docs/architecture/phase6c1_primary_mem_worker_contract.md",
              "Phase 6-C2 one-job queued-record claim/rehydrate/execute adapter: complete. The next boundary is next-turn recall and scope isolation: next. I1 separately retains the pre-enqueue background-finalizer crash window.",
              "Phase 6-C2 one-job queued-record claim/rehydrate/execute adapter: complete. Phase I-1 next-turn recall and scope isolation: complete. I1 separately retains the pre-enqueue background-finalizer crash window.",
          )

          replace(
              "scripts/relaylm_documentation_current_boundary_smoke.py",
              '        "next-turn recall and scope isolation: next",\n        "C2 exact queued-record claim, canonical reread",',
              '        "I1 next-turn Primary MEM recall: complete",\n        "character and namespace isolation: complete",\n        "C2 exact queued-record claim, canonical reread",',
          )
          replace(
              "scripts/relaylm_documentation_current_boundary_smoke.py",
              '        "Character and namespace isolation: complete",',
              '        "character and namespace isolation: complete",',
          )
          replace(
              "scripts/relaylm_phase6c1_worker_contract_smoke.py",
              '        "next-turn recall and scope isolation: next",',
              '        "Phase I-1 next-turn recall and scope isolation: complete",',
          )
          replace(
              "scripts/relaylm_phase6b0_durable_queue_contract_smoke.py",
              '        "next-turn recall and scope isolation: next",',
              '        "I1 next-turn Primary MEM recall: complete",\n        "character and namespace isolation: complete",',
          )
          PY
      - name: Commit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts
          git commit -m "docs: align Phase I-1 completion status"
          git push origin HEAD:phase-i1-primary-mem-next-turn-recall
