name: Phase 6-C1-0 primary worker source smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "relaylm/relaymem_slp_primary_worker_source.py"
      - "scripts/relaylm_phase6c1_primary_worker_source_smoke.py"
      - "docs/architecture/README.md"
      - ".github/workflows/phase6c1-primary-worker-source-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/relaymem_slp_primary_worker_source.py"
      - "scripts/relaylm_phase6c1_primary_worker_source_smoke.py"
      - "docs/architecture/README.md"
      - ".github/workflows/phase6c1-primary-worker-source-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Phase 6-C1-0 worker source
        run: >-
          python -m compileall -q
          relaylm/relaymem_slp_primary_worker_source.py
          scripts/relaylm_phase6c1_primary_worker_source_smoke.py
      - name: Validate Phase 6-C1-0 worker source
        run: python scripts/relaylm_phase6c1_primary_worker_source_smoke.py
