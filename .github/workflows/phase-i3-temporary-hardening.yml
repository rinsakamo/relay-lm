name: Temporary Phase I-3 hardening patch

on:
  push:
    branches:
      - phase-i3-auditable-primary-mem-correct
    paths:
      - scripts/_phase_i3_hardening_patch.py
      - .github/workflows/phase-i3-temporary-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i3-auditable-primary-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/_phase_i3_hardening_patch.py
      - run: python -m compileall -q relaylm
      - run: npm install --no-audit --no-fund
        working-directory: apps/soul-lab
      - run: npm run typecheck
        working-directory: apps/soul-lab
      - name: Commit hardening changes
        run: |
          rm scripts/_phase_i3_hardening_patch.py
          rm .github/workflows/phase-i3-temporary-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relaylm apps/soul-lab
          git add -u scripts/_phase_i3_hardening_patch.py .github/workflows/phase-i3-temporary-hardening.yml
          git commit -m "fix: harden Phase I3 correction fencing and schemas"
          git push origin HEAD:phase-i3-auditable-primary-mem-correct
