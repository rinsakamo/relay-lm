name: I1-GE durable-finalization crash validation

on:
  pull_request:
    paths:
      - "relaylm/relaymem_slp_durable_finalization_*.py"
      - "relaylm/_relaymem_slp_durable_finalization_*.py"
      - "relaylm/relaymem_slp_runtime_finalization.py"
      - "relaylm/relaymem_slp_scheduler_replay_lane.py"
      - "relaylm/app.py"
      - "scripts/_relaylm_i1ge_*.py"
      - "scripts/relaylm_i1ge_*.py"
      - "scripts/relaylm_i1g*.py"
      - "scripts/relaylm_o1b_*.py"
      - "scripts/relaylm_wave2_cross_slice_*.py"
      - "docs/mvp/wave3/i1ge_completion_report.md"
      - ".github/workflows/i1ge-durable-finalization-crash-validation.yml"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  crash-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Apply completion seam patch
        if: github.event_name == 'pull_request'
        run: |
          git apply --check scripts/i1ge_completion_seam_fix.patch
          git apply scripts/i1ge_completion_seam_fix.patch
          python -m py_compile scripts/_relaylm_i1ge_crash_child.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/_relaylm_i1ge_crash_child.py
          git commit -m "test: bind completion crash seams to no-clobber publication"
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m compileall -q relaylm scripts
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1ge_durable_finalization_replay_crash_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1ge_durable_finalization_retention_crash_smoke.py
