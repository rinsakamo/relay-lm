name: I1-GE durable-finalization crash validation

on:
  pull_request:
    paths:
      - "relaylm/relaymem_slp_durable_finalization_*.py"
      - "relaylm/_relaymem_slp_durable_finalization_*.py"
      - "relaylm/relaymem_slp_runtime_finalization.py"
      - "relaylm/relaymem_slp_scheduler_replay_lane.py"
      - "relaylm/app.py"
      - "scripts/_relaylm_i1ge_*.py"
      - "scripts/relaylm_i1ge_*.py"
      - "scripts/relaylm_i1g*.py"
      - "scripts/relaylm_o1b_*.py"
      - "scripts/relaylm_wave2_cross_slice_*.py"
      - "docs/mvp/wave3/i1ge_completion_report.md"
      - ".github/workflows/i1ge-durable-finalization-crash-validation.yml"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  crash-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Apply final harness seam repair
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path

          child = Path("scripts/_relaylm_i1ge_crash_child.py")
          text = child.read_text()
          public_import = "import relaylm.relaymem_slp_durable_finalization_replay as replay_public  # noqa: E402\n"
          if public_import not in text:
              anchor = "import relaylm._relaymem_slp_durable_finalization_replay_impl as replay_impl  # noqa: E402\n"
              if anchor not in text:
                  raise SystemExit("public replay import anchor missing")
              text = text.replace(anchor, anchor + public_import, 1)

              old = '''        if seam == "during_b2_publication":
                      def queue_link_before(*args: Any, **kwargs: Any) -> None:
                          del args, kwargs
                          _crash(seam)

                      stack.enter_context(
                          patch.object(durable_enqueue_module.os, "link", new=queue_link_before)
                      )
                  elif seam == "after_b2_publication_before_canonical_reread":
                      original_inspect = durable_enqueue_module._inspect_existing
                      inspect_calls = 0

                      def queue_inspect_before(*args: Any, **kwargs: Any):
                          nonlocal inspect_calls
                          inspect_calls += 1
                          if inspect_calls >= 2:
                              _crash(seam)
                          return original_inspect(*args, **kwargs)

                      stack.enter_context(
                          patch.object(
                              durable_enqueue_module,
                              "_inspect_existing",
                              new=queue_inspect_before,
                          )
                      )
          '''
              new = '''        if seam in {"during_b2_publication", "after_b2_publication_before_canonical_reread"}:
                      original_apply = replay_public.apply_relaymem_slp_runtime_enqueue

                      def queue_apply(*args: Any, **kwargs: Any):
                          if seam == "during_b2_publication":
                              _crash(seam)
                          result = original_apply(*args, **kwargs)
                          _crash(seam)
                          return result

                      stack.enter_context(
                          patch.object(
                              replay_public,
                              "apply_relaymem_slp_runtime_enqueue",
                              new=queue_apply,
                          )
                      )
          '''
              if old not in text:
                  raise SystemExit("current B2 seam block missing")
              text = text.replace(old, new, 1)
              child.write_text(text)

          helper = Path("scripts/_relaylm_i1ge_crash_validation.py")
          text = helper.read_text()
          parser_import = "    parse_isolation_filename,\n"
          if parser_import not in text:
              anchor = '''from relaylm.relaymem_slp_durable_finalization_isolation import (  # noqa: E402
                  isolation_filename,
              )
          '''
              replacement = '''from relaylm.relaymem_slp_durable_finalization_isolation import (  # noqa: E402
                  isolation_filename,
                  parse_isolation_filename,
              )
          '''
              if anchor not in text:
                  raise SystemExit("isolation import anchor missing")
              text = text.replace(anchor, replacement, 1)

              old = '''def locator(root: Path) -> str | None:
                  bases = sorted((root / "finalization").glob("durable-finalization-v0-*.base.json"))
                  if not bases:
                      return None
                  require(len(bases) == 1, [path.name for path in bases])
                  name = bases[0].name
                  value = name[len("durable-finalization-v0-") : -len(".base.json")]
                  require(len(value) == 64 and all(char in "0123456789abcdef" for char in value), value)
                  return value
          '''
              new = '''def locator(root: Path) -> str | None:
                  finalization = root / "finalization"
                  bases = sorted(finalization.glob("durable-finalization-v0-*.base.json"))
                  if bases:
                      require(len(bases) == 1, [path.name for path in bases])
                      name = bases[0].name
                      value = name[len("durable-finalization-v0-") : -len(".base.json")]
                      require(len(value) == 64 and all(char in "0123456789abcdef" for char in value), value)
                      return value
                  markers = sorted(finalization.glob("durable-finalization-v0-*.segment-isolation.json"))
                  if not markers:
                      return None
                  require(len(markers) == 1, [path.name for path in markers])
                  value = parse_isolation_filename(markers[0].name)
                  require(value is not None, markers[0].name)
                  return value
          '''
              if old not in text:
                  raise SystemExit("locator block missing")
              helper.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet -- scripts/_relaylm_i1ge_crash_child.py scripts/_relaylm_i1ge_crash_validation.py; then
            echo "Final harness seam repair already applied"
          else
            python -m py_compile scripts/_relaylm_i1ge_crash_child.py scripts/_relaylm_i1ge_crash_validation.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/_relaylm_i1ge_crash_child.py scripts/_relaylm_i1ge_crash_validation.py
            git commit -m "test: bind crash seams to public replay authority"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m compileall -q relaylm scripts
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1ge_durable_finalization_nonstream_crash_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1ge_durable_finalization_stream_crash_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1ge_durable_finalization_replay_crash_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1ge_durable_finalization_retention_crash_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1ge_durable_finalization_concurrency_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1ge_durable_finalization_security_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1gb_durable_finalization_publication_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1gb_durable_finalization_app_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1gc_durable_finalization_replay_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1gd_durable_finalization_retention_contract_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1gd_durable_finalization_retention_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_i1gd_durable_finalization_retention_race_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_o1b_sealed_replay_lane_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_o1b_sealed_replay_lane_security_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_wave2_cross_slice_convergence_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_wave2_cross_slice_security_smoke.py
      - run: PYTHONPATH=. python scripts/relaylm_mvp_completion_report_smoke.py --check-model --check-all
      - run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
      - run: test -z "$(git status --short)"
