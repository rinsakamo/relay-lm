name: O1D1 production scheduler round

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "relaylm/config.py"
      - "relaylm/relaymem_slp_scheduler_contract.py"
      - "relaylm/relaymem_slp_scheduler_replay_lane.py"
      - "relaylm/relaymem_slp_scheduler_queue_lane.py"
      - "relaylm/relaymem_slp_scheduler_round.py"
      - "scripts/_relaylm_o1d1_support.py"
      - "scripts/relaylm_o1d1_*.py"
      - "scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py"
      - "scripts/relaylm_o1b_sealed_replay_lane_*.py"
      - "scripts/relaylm_o1c_eligible_queue_lane_*.py"
      - "scripts/relaylm_wave2_cross_slice_convergence_smoke.py"
      - "docs/config_schema.md"
      - "config.example.yaml"
      - "docs/architecture/o1d1_production_scheduler_round.md"
      - "docs/mvp/wave3/o1d1_completion_report.md"
      - ".github/workflows/o1d1-production-scheduler-round.yml"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - "relaylm/config.py"
      - "relaylm/relaymem_slp_scheduler_round.py"
      - "scripts/_relaylm_o1d1_support.py"
      - "scripts/relaylm_o1d1_*.py"
      - "docs/config_schema.md"
      - "config.example.yaml"
      - "docs/architecture/o1d1_production_scheduler_round.md"
      - ".github/workflows/o1d1-production-scheduler-round.yml"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: o1d1-production-round-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RelayLM
        run: python -m pip install -q -e .
      - name: Compile repository Python
        run: python -m compileall -q relaylm scripts
      - name: Run O1D1 production-round smokes
        env:
          PYTHONPATH: .:scripts
        run: |
          set -euo pipefail
          python scripts/relaylm_o1d1_config_smoke.py
          python scripts/relaylm_o1d1_production_round_smoke.py
          python scripts/relaylm_o1d1_production_round_fault_smoke.py
          python scripts/relaylm_o1d1_production_round_concurrency_smoke.py
          python scripts/relaylm_o1d1_production_round_security_smoke.py
      - name: Run O1 lane and Wave 2 regressions
        env:
          PYTHONPATH: .:scripts
        run: |
          set -euo pipefail
          python scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py
          python scripts/relaylm_o1b_sealed_replay_lane_smoke.py
          python scripts/relaylm_o1b_sealed_replay_lane_security_smoke.py
          python scripts/relaylm_o1c_eligible_queue_lane_smoke.py
          python scripts/relaylm_o1c_eligible_queue_lane_security_smoke.py
          python scripts/relaylm_wave2_cross_slice_convergence_smoke.py
          python scripts/relaylm_wave2_cross_slice_security_smoke.py
      - name: Run O0 and lower-authority regressions
        env:
          PYTHONPATH: .:scripts
        run: |
          set -euo pipefail
          python scripts/relaylm_o0_local_one_job_runner_ci_runner.py
          python scripts/relaylm_i1gc_durable_finalization_replay_smoke.py
          python scripts/relaylm_i1gd_durable_finalization_retention_smoke.py
          python scripts/relaylm_phase6b2_durable_enqueue_contract_smoke.py
          python scripts/relaylm_phase6b3_queue_state_smoke.py
          python scripts/relaylm_phase6c2_one_queued_job_runner_ci_runner.py
      - name: Validate config and implementation evidence
        env:
          PYTHONPATH: .:scripts
        run: |
          set -euo pipefail
          python -c 'from relaylm.config import load_config; load_config("config.example.yaml")'
          python scripts/relaylm_mvp_completion_report_smoke.py docs/mvp/wave3/o1d1_completion_report.md
          python scripts/relaylm_docs_link_check.py
