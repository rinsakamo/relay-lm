name: Temporary Phase I-3 integration patch

on:
  push:
    branches:
      - phase-i3-auditable-primary-mem-correct
    paths:
      - scripts/_phase_i3_apply_patch.py
      - .github/workflows/phase-i3-temporary-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i3-auditable-primary-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/_phase_i3_apply_patch.py
      - run: python -m compileall -q relaylm
      - name: Commit exact-source integration
        run: |
          rm scripts/_phase_i3_apply_patch.py
          rm .github/workflows/phase-i3-temporary-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relaylm/relaymem_primary_recall.py relaylm/soul_lab_observation_projection.py
          git add -u scripts/_phase_i3_apply_patch.py .github/workflows/phase-i3-temporary-patch.yml
          git commit -m "feat: integrate correction-aware Primary MEM reads"
          git push origin HEAD:phase-i3-auditable-primary-mem-correct
