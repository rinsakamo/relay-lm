name: Phase I-1 runtime projection diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/relaylm_relaymem_runtime_ctx_injection_smoke.py"
      - ".github/workflows/_phase_i1_legacy_trace_smoke_patch.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .:scripts

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i1-primary-mem-next-turn-recall
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run runtime CTX smoke
        id: smoke
        continue-on-error: true
        run: python scripts/relaylm_relaymem_runtime_ctx_injection_smoke.py > runtime-projection-smoke.log 2>&1
      - name: Upload runtime projection log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-i1-runtime-projection-log
          path: runtime-projection-smoke.log
          if-no-files-found: error
      - name: Fail when runtime smoke fails
        if: steps.smoke.outcome != 'success'
        run: exit 1
