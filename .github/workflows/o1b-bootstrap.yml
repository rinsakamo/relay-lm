name: O1B bootstrap

on:
  push:
    paths:
      - ".github/workflows/o1b-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-o1b-sealed-i1g-replay-lane
          fetch-depth: 0
      - name: Apply staged O1B payload
        run: |
          cat .relaylm_o1b_payload/part_* | base64 -d > /tmp/o1b.tar.gz
          mkdir /tmp/o1b
          tar -xzf /tmp/o1b.tar.gz -C /tmp/o1b
          python /tmp/o1b/apply.py "$GITHUB_WORKSPACE"
          rm -rf .relaylm_o1b_payload
          rm -f .github/workflows/o1b-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add O1B sealed I1-G replay-lane discovery"
          git push origin HEAD:phase-o1b-sealed-i1g-replay-lane
