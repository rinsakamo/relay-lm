name: O1B bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: o1b-bootstrap-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'phase-o1b-sealed-i1g-replay-lane'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-o1b-sealed-i1g-replay-lane
          fetch-depth: 0
          show-progress: false
      - name: Apply staged O1B payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          cat .relaylm_o1b_payload/part_* | base64 -d > /tmp/o1b.tar.gz
          rm -rf /tmp/o1b
          mkdir /tmp/o1b
          tar -xzf /tmp/o1b.tar.gz -C /tmp/o1b
          set +e
          python /tmp/o1b/apply.py "$GITHUB_WORKSPACE" > /tmp/o1b-apply.log 2>&1
          status=$?
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -ne 0 ]; then
            printf 'O1B bootstrap failure on `%s`:\n\n```text\n' "$GITHUB_SHA" > /tmp/o1b-comment.md
            cat /tmp/o1b-apply.log >> /tmp/o1b-comment.md
            printf '\n```\n' >> /tmp/o1b-comment.md
            gh pr comment 406 --body-file /tmp/o1b-comment.md
            cat /tmp/o1b-apply.log
            exit "$status"
          fi
          rm -rf .relaylm_o1b_payload
          rm -f .github/workflows/o1b-bootstrap.yml
          git add -A
          git commit -m "feat: add O1B sealed I1-G replay-lane discovery"
          git push origin HEAD:phase-o1b-sealed-i1g-replay-lane
