name: O1B bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: o1b-bootstrap-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'phase-o1b-sealed-i1g-replay-lane'
    runs-on: ubuntu-latest
    steps:
      - name: Clone branch and apply staged payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          git clone -q --depth 1 --branch phase-o1b-sealed-i1g-replay-lane \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          cat .relaylm_o1b_payload/part_* | base64 -d > /tmp/o1b.tar.gz
          rm -rf /tmp/o1b
          mkdir /tmp/o1b
          tar -xzf /tmp/o1b.tar.gz -C /tmp/o1b
          python /tmp/o1b/apply.py "$PWD"
          rm -rf .relaylm_o1b_payload
          rm -f .github/workflows/o1b-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add O1B sealed I1-G replay-lane discovery"
          git push -q origin HEAD:phase-o1b-sealed-i1g-replay-lane
