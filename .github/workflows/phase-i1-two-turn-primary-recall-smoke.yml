name: Phase I-1 two-turn Primary MEM recall smoke

on:
  push:
    paths:
      - "relaylm/**"
      - "scripts/relaylm_phase_i1_*"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "docs/**"
      - ".github/workflows/phase-i1-two-turn-primary-recall-smoke.yml"
  pull_request:
    paths:
      - "relaylm/**"
      - "scripts/relaylm_phase_i1_*"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "docs/**"
      - ".github/workflows/phase-i1-two-turn-primary-recall-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m compileall -q relaylm scripts
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i1_two_turn_primary_recall_ci_runner.py
      - run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
      - name: RelayMEM M1/M2 and RelayCTX regressions
        run: |
          PYTHONPATH=. python scripts/relaylm_relaymem_store_dry_run_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_retrieval_dry_run_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_selection_dry_run_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_ctx_injection_plan_dry_run_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_runtime_ctx_injection_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_snippet_runtime_injection_apply_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6_runtime_enqueue_app_smoke.py
      - name: Phase 6 worker and C2 regressions
        run: |
          PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_contract_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_primary_worker_ci_runner.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_worker_integration_ci_runner.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_durable_protected_source_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c2_one_queued_job_runner_ci_runner.py
