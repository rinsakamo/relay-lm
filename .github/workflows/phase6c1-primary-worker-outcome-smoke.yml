name: Phase 6-C1 Primary worker outcome smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "relaylm/relaymem_slp_primary_worker_outcome.py"
      - "relaylm/_relaymem_slp_primary_worker_outcome_*.py"
      - "scripts/relaylm_phase6c1_primary_worker_outcome_*.py"
      - "docs/architecture/phase6c1_primary_worker_outcome_classifier.md"
      - ".github/workflows/phase6c1-primary-worker-outcome-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/relaymem_slp_primary_worker_outcome.py"
      - "relaylm/_relaymem_slp_primary_worker_outcome_*.py"
      - "scripts/relaylm_phase6c1_primary_worker_outcome_*.py"
      - "docs/architecture/phase6c1_primary_worker_outcome_classifier.md"
      - ".github/workflows/phase6c1-primary-worker-outcome-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Primary worker outcome classifier
        run: >-
          python -m compileall -q
          relaylm/relaymem_slp_primary_worker_outcome.py
          relaylm/_relaymem_slp_primary_worker_outcome_types.py
          relaylm/_relaymem_slp_primary_worker_outcome_validate.py
          relaylm/_relaymem_slp_primary_worker_outcome_result.py
          relaylm/_relaymem_slp_primary_worker_outcome_classify.py
          scripts/relaylm_phase6c1_primary_worker_outcome_support.py
          scripts/relaylm_phase6c1_primary_worker_outcome_success_retry_cases.py
          scripts/relaylm_phase6c1_primary_worker_outcome_terminal_cases.py
          scripts/relaylm_phase6c1_primary_worker_outcome_validation_cases.py
          scripts/relaylm_phase6c1_primary_worker_outcome_purity_cases.py
          scripts/relaylm_phase6c1_primary_worker_outcome_smoke.py
      - name: Validate Primary worker outcome classification
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_primary_worker_outcome_smoke.py
      - name: Revalidate M3g M3h and B3 contracts
        run: |
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_apply_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_recovery_audit_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_contract_smoke.py
