name: Temporary O1B O1C merge validation

on:
  push:
    branches:
      - phase-o1c-eligible-b2-queue-lane
    paths:
      - "scripts/_merge_o1b_o1c.py"
      - ".github/workflows/o1bc-merge-temp.yml"

permissions:
  contents: write

jobs:
  merge-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-o1c-eligible-b2-queue-lane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge, validate, and publish result
        shell: bash
        env:
          PYTHONPATH: .:scripts
        run: |
          set +e
          log=/tmp/o1bc-merge.log
          : > "$log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main >>"$log" 2>&1
          git merge --no-ff --no-commit origin/main >>"$log" 2>&1
          merge_code=$?
          if [ $merge_code -ne 0 ]; then
            conflicts=(
              docs/PROJECT_STATUS.md
              docs/README.md
              docs/architecture/README.md
              docs/architecture/o1a_two_lane_scheduler_contract.md
              docs/architecture/pipeline_implementation_plan.md
              docs/architecture/post_i3_evaluation_work_roadmap.md
              docs/architecture/relaymem_mvp_implementation_plan.md
              docs/architecture/relaymem_slp_current_target.md
              scripts/relaylm_documentation_current_boundary_smoke.py
            )
            git checkout --ours -- "${conflicts[@]}" >>"$log" 2>&1
          fi

          python scripts/_merge_o1b_o1c.py >>"$log" 2>&1
          reconcile_code=$?
          git add -A >>"$log" 2>&1
          unresolved=$(git diff --name-only --diff-filter=U)

          validation_code=0
          if [ $reconcile_code -eq 0 ] && [ -z "$unresolved" ]; then
            python -m pip install -q -e . >>"$log" 2>&1 || validation_code=$?
            if [ $validation_code -eq 0 ]; then
              checks=(
                "python -m compileall -q relaylm scripts"
                "python scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py"
                "python scripts/relaylm_o1b_sealed_replay_lane_smoke.py"
                "python scripts/relaylm_o1b_sealed_replay_lane_security_smoke.py"
                "python scripts/relaylm_o1c_eligible_queue_lane_smoke.py"
                "python scripts/relaylm_o1c_eligible_queue_lane_security_smoke.py"
                "python scripts/relaylm_o0_local_one_job_runner_ci_runner.py"
                "python scripts/relaylm_phase6b2_durable_enqueue_contract_smoke.py"
                "python scripts/relaylm_phase6b3_queue_state_smoke.py"
                "python scripts/relaylm_phase6c2_one_queued_job_runner_ci_runner.py"
                "python scripts/relaylm_phase6c1_primary_worker_ci_runner.py"
                "python scripts/relaylm_phase6c1_worker_integration_ci_runner.py"
                "python scripts/relaylm_phase6c1_durable_protected_source_smoke.py"
                "python scripts/relaylm_documentation_current_boundary_smoke.py"
                "python scripts/relaylm_docs_link_check.py"
              )
              for check in "${checks[@]}"; do
                echo "== $check ==" >>"$log"
                bash -lc "$check" >>"$log" 2>&1
                code=$?
                if [ $code -ne 0 ]; then
                  validation_code=$code
                  break
                fi
              done
            fi
          else
            validation_code=1
          fi

          if [ $reconcile_code -eq 0 ] && [ -z "$unresolved" ] && [ $validation_code -eq 0 ]; then
            git rm .github/workflows/o1bc-merge-temp.yml scripts/_merge_o1b_o1c.py >>"$log" 2>&1
            git add -A >>"$log" 2>&1
            git commit -m "merge: integrate O1B replay and O1C queue lanes" >>"$log" 2>&1
            git push origin HEAD:phase-o1c-eligible-b2-queue-lane >>"$log" 2>&1
            exit $?
          fi

          git merge --abort >>"$log" 2>&1 || true
          git reset --hard HEAD >>"$log" 2>&1
          {
            echo "O1B/O1C merge validation: FAIL"
            echo "merge_code=$merge_code"
            echo "reconcile_code=$reconcile_code"
            echo "validation_code=$validation_code"
            echo "unresolved=${unresolved:-none}"
            echo "--- bounded log tail ---"
            tail -n 180 "$log"
          } > o1bc_merge_report.txt
          git add o1bc_merge_report.txt
          git commit -m "test: record O1B O1C merge failure"
          git push origin HEAD:phase-o1c-eligible-b2-queue-lane
          exit 1
