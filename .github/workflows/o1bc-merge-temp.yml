name: Temporary O1B O1C merge validation

on:
  push:
    branches:
      - phase-o1c-eligible-b2-queue-lane
    paths:
      - "scripts/_merge_o1b_o1c.py"
      - ".github/workflows/o1bc-merge-temp.yml"

permissions:
  contents: write

jobs:
  merge-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-o1c-eligible-b2-queue-lane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge main and resolve bounded O1B/O1C documentation conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_code=$?
          set -e
          if [ $merge_code -ne 0 ]; then
            conflicts=(
              docs/PROJECT_STATUS.md
              docs/README.md
              docs/architecture/README.md
              docs/architecture/o1a_two_lane_scheduler_contract.md
              docs/architecture/pipeline_implementation_plan.md
              docs/architecture/post_i3_evaluation_work_roadmap.md
              docs/architecture/relaymem_mvp_implementation_plan.md
              docs/architecture/relaymem_slp_current_target.md
              scripts/relaylm_documentation_current_boundary_smoke.py
            )
            git checkout --ours -- "${conflicts[@]}"
          fi
          python scripts/_merge_o1b_o1c.py
          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
      - name: Install RelayLM
        run: python -m pip install -q -e .
      - name: Run integrated O1B/O1C validation
        env:
          PYTHONPATH: .:scripts
        run: |
          set -euo pipefail
          python -m compileall -q relaylm scripts
          python scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py
          python scripts/relaylm_o1b_sealed_replay_lane_smoke.py
          python scripts/relaylm_o1b_sealed_replay_lane_security_smoke.py
          python scripts/relaylm_o1c_eligible_queue_lane_smoke.py
          python scripts/relaylm_o1c_eligible_queue_lane_security_smoke.py
          python scripts/relaylm_o0_local_one_job_runner_ci_runner.py
          python scripts/relaylm_phase6b2_durable_enqueue_contract_smoke.py
          python scripts/relaylm_phase6b3_queue_state_smoke.py
          python scripts/relaylm_phase6c2_one_queued_job_runner_ci_runner.py
          python scripts/relaylm_phase6c1_primary_worker_ci_runner.py
          python scripts/relaylm_phase6c1_worker_integration_ci_runner.py
          python scripts/relaylm_phase6c1_durable_protected_source_smoke.py
          python scripts/relaylm_documentation_current_boundary_smoke.py
          python scripts/relaylm_docs_link_check.py
      - name: Commit integrated merge
        run: |
          git rm .github/workflows/o1bc-merge-temp.yml scripts/_merge_o1b_o1c.py
          git add -A
          git commit -m "merge: integrate O1B replay and O1C queue lanes"
          git push origin HEAD:phase-o1c-eligible-b2-queue-lane
