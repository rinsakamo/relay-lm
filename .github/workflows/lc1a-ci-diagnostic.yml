name: LC1A Python 3.10 repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/lc1a-subjective-mem-correct'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Normalize Python 3.10 indentation and clean diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          subjective = Path('relaylm/subjective_mem.py')
          text = subjective.read_text(encoding='utf-8')
          replacement = base64.b64decode('').decode('utf-8')
          pattern = re.compile(r'    def __post_init__\(self\) -> None:\n.*?(?=    @property\n    def authority_bound)', re.DOTALL)
          text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'subjective_mem post-init replacement count={count}')
          subjective.write_text(text, encoding='utf-8')

          runtime = Path('relaylm/subjective_mem_lifecycle_runtime.py')
          text = runtime.read_text(encoding='utf-8')
          replacement = base64.b64decode('').decode('utf-8')
          pattern = re.compile(r'    if predecessor\.memory_revision == 1:\n.*?        return \(\)\n(?=    transition_id = receipt\.get)', re.DOTALL)
          text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'predecessor authority replacement count={count}')
          runtime.write_text(text, encoding='utf-8')

          for path in (
              Path('.github/workflows/lc1a-ci-diagnostic.yml'),
              Path('.github/lc1a-ci-diagnostic-trigger'),
              Path('.github/lc1a-ci-diagnostic.txt'),
          ):
              path.unlink(missing_ok=True)
          PY
          python -m compileall -f -q relaylm scripts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize LC-1A Python 3.10 indentation"
          git push origin HEAD:agent/lc1a-subjective-mem-correct
