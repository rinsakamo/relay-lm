name: LC1A CI diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/lc1a-subjective-mem-correct'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Capture Python 3.10 compile failure
        shell: bash
        run: |
          set +e
          python -m compileall -f relaylm scripts > /tmp/lc1a-ci-diagnostic.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "compileall passed unexpectedly" > /tmp/lc1a-ci-diagnostic.txt
          fi
          {
            echo "run_id=$GITHUB_RUN_ID head=$GITHUB_SHA status=$status"
            cat /tmp/lc1a-ci-diagnostic.txt
          } > .github/lc1a-ci-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/lc1a-ci-diagnostic.txt
          git commit -m "chore: record LC-1A Python 3.10 diagnostic"
          git push origin HEAD:agent/lc1a-subjective-mem-correct
          exit 1
