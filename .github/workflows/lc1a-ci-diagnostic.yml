name: LC1A Python 3.10 repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/lc1a-subjective-mem-correct'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Normalize indentation and validate Python 3.10
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_region(path: Path, search_after: str, start: str, end: str, replacement: list[str]) -> None:
              lines = path.read_text(encoding="utf-8").splitlines()
              anchor = lines.index(search_after)
              start_index = lines.index(start, anchor + 1)
              end_index = lines.index(end, start_index + 1)
              lines[start_index:end_index] = replacement
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          replace_region(
              Path("relaylm/subjective_mem.py"),
              "class SubjectiveMemCurrentState:",
              "    def __post_init__(self) -> None:",
              "    @property",
              [
                  "    def __post_init__(self) -> None:",
                  "        lifecycle_states = {",
                  '            "active",',
                  '            "pinned",',
                  '            "held",',
                  '            "hidden",',
                  '            "superseded",',
                  '            "purged",',
                  "        }",
                  '        mutation_states = {"none", "prepared", "recovery_required", "corrupt"}',
                  "        expected_eligible = (",
                  '            self.mutation_state == "none"',
                  '            and self.lifecycle_state in {"active", "pinned"}',
                  "        )",
                  "        authority_values = (",
                  "            self.workspace_authority_digest,",
                  "            self.scope_binding_digest,",
                  "            self.page_id,",
                  "            self.block_id,",
                  "            self.canonical_page_digest,",
                  "            self.authorization_kind,",
                  "            self.authorization_id,",
                  "            self.current_receipt_id,",
                  "        )",
                  "        unbound = all(value is None for value in authority_values)",
                  "        bound = all(",
                  "            isinstance(value, str) and bool(value)",
                  "            for value in authority_values",
                  "        )",
                  "        if bound:",
                  "            assert self.workspace_authority_digest is not None",
                  "            assert self.scope_binding_digest is not None",
                  "            assert self.canonical_page_digest is not None",
                  "            if (",
                  "                len(self.workspace_authority_digest) != 64",
                  "                or len(self.scope_binding_digest) != 64",
                  '                or not self.canonical_page_digest.startswith("sha256:")',
                  "                or len(self.canonical_page_digest) != 71",
                  "            ):",
                  '                raise ValueError("subjective_mem_current_state_authority_invalid")',
                  "        if (",
                  "            self.lifecycle_state not in lifecycle_states",
                  "            or self.mutation_state not in mutation_states",
                  "            or type(self.current_revision) is not int",
                  "            or self.current_revision < 1",
                  "            or self.retrieval_eligible is not expected_eligible",
                  "            or not (unbound or bound)",
                  "        ):",
                  '            raise ValueError("subjective_mem_current_state_pair_invalid")',
                  "",
              ],
          )

          replace_region(
              Path("relaylm/subjective_mem_lifecycle_runtime.py"),
              "def _validate_predecessor_authority_locked(",
              "    if predecessor.memory_revision == 1:",
              '    transition_id = receipt.get("transition_id")',
              [
                  "    if predecessor.memory_revision == 1:",
                  "        decision = tx.read_record(",
                  '            record_kind="subjective_mem_decision",',
                  "            record_id=predecessor.authorization_id,",
                  "        )",
                  "        result_ref = (",
                  '            decision.get("result_memory_ref_or_null")',
                  "            if isinstance(decision, dict)",
                  "            else None",
                  "        )",
                  "        if (",
                  '            predecessor.authorization_kind != "formation_decision"',
                  '            or receipt.get("decision_id") != predecessor.authorization_id',
                  "            or not isinstance(result_ref, dict)",
                  '            or result_ref.get("memory_id") != predecessor.memory_id',
                  '            or result_ref.get("memory_revision") != 1',
                  "        ):",
                  '            return ("subjective_mem_lifecycle_predecessor_authority_not_exact",)',
                  "        return ()",
              ],
          )

          tests = Path("tests/test_subjective_mem_lifecycle_runtime.py")
          test_text = tests.read_text(encoding="utf-8")
          test_text = test_text.replace(
              '        if stage == "after_intent_before_page":\n  raise RuntimeError("simulated")',
              '        if stage == "after_intent_before_page":\n            raise RuntimeError("simulated")',
          )
          tests.write_text(test_text, encoding="utf-8")
          PY
          python -m compileall -f -q relaylm scripts tests
          git diff --check
          python - <<'PY'
          from pathlib import Path
          for path in (
              Path(".github/workflows/lc1a-ci-diagnostic.yml"),
              Path(".github/lc1a-ci-diagnostic-trigger"),
              Path(".github/lc1a-ci-diagnostic.txt"),
          ):
              path.unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize LC-1A Python 3.10 indentation"
          git push origin HEAD:agent/lc1a-subjective-mem-correct
