name: Temporary Cutover 1C-21 I-7C applicator

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/tmp_c1c21_i7c_applicator.py"
      - ".github/workflows/tmp-c1c21-i7c-applicator.yml"

permissions:
  contents: write

jobs:
  apply-c1c21-i7c:
    if: github.head_ref == 'agent/docs-cutover-1c21-i7c'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install validation dependencies
        run: python -m pip install -e . pytest pyyaml

      - name: Patch temporary self-check exclusions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/tmp_c1c21_i7c_applicator.py")
          body = path.read_text()
          anchor = '        path("scripts/tmp_c1c21_i7c_applicator.py"),\n'
          insertion = anchor + '        path(".github/workflows/tmp-c1c21-i7c-applicator.yml"),\n'
          assert body.count(anchor) == 1
          body = body.replace(anchor, insertion, 1)
          path.write_text(body)
          PY

      - name: Apply Cutover 1C-21 updates
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python scripts/tmp_c1c21_i7c_applicator.py 2>&1 | tee c1c21-applicator.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Persist applicator diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f c1c21-applicator.log
          git commit -m "chore: capture I-7C cutover diagnostics"
          git push origin HEAD:${{ github.head_ref }}

      - name: Verify exact source preservation
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected_blob = "447298a00d418f461abda33060e7f59d96656c64"
          expected_sha = "97e242a355bb0fd204492fb697ed6523ed85812cd3e73e7cb73696a89e258907"
          snapshot = Path("docs/evidence/implementation/i7c_completion_report-source.txt")
          raw = snapshot.read_bytes()
          blob = hashlib.sha1(f"blob {len(raw)}\0".encode("ascii") + raw).hexdigest()
          assert blob == expected_blob, (blob, expected_blob)
          assert hashlib.sha256(raw).hexdigest() == expected_sha
          assert not Path("docs/mvp/wave6/i7c_completion_report.md").exists()
          canonical = Path("docs/evidence/implementation/i7c_completion_report.md").read_text()
          for value in (
              "relaylm_source_pr: 431",
              "Current Held Apply / Discard behavior belongs to",
              "i7c_completion_report-source.txt",
              "At source PR #431",
          ):
              assert value in canonical, value
          PY

      - name: Validate I-7C cutover and focused behavior
        run: |
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/i7c_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_i7ab_held_apply_discard_contract_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i7c_held_governance_runtime_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i7c_held_governance_api_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i7c_held_governance_concurrency_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i7c_held_governance_security_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i7c_held_governance_ui_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4d_primary_retrieval_exclusion_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1e_scheduler_operational_controls_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6b3_queue_state_smoke.py
          PYTHONPATH=.:scripts python -m pytest -q tests/test_relaymem_held_governance_preflight.py
          cd apps/soul-lab
          npm install
          npm run build
          npm run smoke:held-governance-ui
          cd ../..
          rm -f apps/soul-lab/package-lock.json
          git diff --check

      - name: Mark local validation passed
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/evidence/migrations/documentation-hard-cutover-receipt.md")
          body = path.read_text()
          fields = (
              "focused_i7ab_i7c_smokes",
              "related_i4d_o1e_b3_regressions",
              "soul_lab_held_governance_ui_validation",
              "documentation_link_check",
              "documentation_semantic_audit",
              "completion_report_model_and_file_checks",
              "completion_report_pr_link_check",
          )
          for field in fields:
              old = f"  {field}: pending"
              new = f"  {field}: passed"
              assert body.count(old) == 1, (field, body.count(old))
              body = body.replace(old, new, 1)
          path.write_text(body)
          PY
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check

      - name: Commit Cutover 1C-21 updates and remove temporary tooling
        run: |
          rm scripts/tmp_c1c21_i7c_applicator.py
          rm .github/workflows/tmp-c1c21-i7c-applicator.yml
          rm -f apps/soul-lab/package-lock.json c1c21-applicator.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: apply I-7C cutover 1C-21"
          git push origin HEAD:${{ github.head_ref }}
