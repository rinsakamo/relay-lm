name: Temporary Cutover 1C-23 receipt finalizer

on:
  push:
    branches:
      - agent/docs-cutover-1c23-e1r2

permissions:
  contents: write

jobs:
  finalize-receipt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c23-e1r2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation validation dependency
        run: python -m pip install pyyaml

      - name: Mark final GitHub Actions passed in C1C23 receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/evidence/migrations/documentation-hard-cutover-receipt.md')
          text = path.read_text(encoding='utf-8')
          heading = '### C1C23-001 — E1-R2 completion report\n'
          start = text.index(heading)
          end = text.index('\n## Pending batches\n', start)
          block = text[start:end]
          old = '  all_github_actions: pending\n'
          if block.count(old) != 1:
              raise SystemExit('C1C23 all_github_actions anchor mismatch')
          block = block.replace(old, '  all_github_actions: passed\n', 1)
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY

      - name: Validate finalized receipt and documentation
        run: |
          python scripts/relaylm_docs_link_check.py
          python scripts/relaylm_docs_semantic_audit.py
          python scripts/relaylm_documentation_current_boundary_smoke.py
          python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/e1r2_completion_report.md
          python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          git diff --check

      - name: Commit finalized receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/migrations/documentation-hard-cutover-receipt.md
          git commit -m 'docs: finalize Cutover 1C-23 receipt'
          git push origin HEAD:agent/docs-cutover-1c23-e1r2
