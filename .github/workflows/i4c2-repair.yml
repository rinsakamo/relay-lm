name: I4C2 repair
on:
  push:
    branches: [phase-i4c2-primary-forget-recovery-finalization]
    paths: [.github/workflows/i4c2-repair.yml]
  pull_request:
    paths: [.github/workflows/i4c2-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i4c2-primary-forget-recovery-finalization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact repairs
        run: |
          python scripts/_phase_i4c2_already_hidden_patch.py
          python scripts/_phase_i4c2_m2_boundary_patch.py
          python scripts/_phase_i4c2_docs_summary_patch.py
          python scripts/_phase_i4c2_documentation_smoke_patch.py
      - run: pip install -e .
      - run: python -m compileall -q relaylm scripts
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_recovery_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_fault_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_concurrency_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_security_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_ownership_boundary_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4b_ci_runner.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i3_primary_mem_correct_ci_runner.py
      - run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_reconciliation_smoke.py
      - run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_apply_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
      - run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
      - name: Remove temporary repair files
        run: |
          rm -f i4c2-debug.log
          rm -f scripts/_phase_i4c2_already_hidden_patch.py
          rm -f scripts/_phase_i4c2_m2_boundary_patch.py
          rm -f scripts/_phase_i4c2_docs_summary_patch.py
          rm -f scripts/_phase_i4c2_documentation_smoke_patch.py
          rm -f .github/workflows/i4c2-already-hidden-patch.yml
          rm -f .github/workflows/i4c2-doc-smoke-patch.yml
          rm -f .github/workflows/i4c2-doc-summary-apply.yml
          rm -f .github/workflows/i4c2-finalize-branch.yml
          rm -f .github/workflows/i4c2-repair.yml
      - name: Commit repaired branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve I-4D retrieval ownership and finalize I-4C2"
          git push origin HEAD:phase-i4c2-primary-forget-recovery-finalization
