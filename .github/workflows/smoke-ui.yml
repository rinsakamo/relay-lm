# Consolidated SOUL Lab UI / mixed python+node smoke fleet.
#
# <old-workflow-file> -> job <job-name>
# phase-i2-lab-observation-smoke.yml -> jobs lab-observation, lab-observation-regressions, lab-observation-frontend
# phase-i3-primary-mem-correct-smoke.yml -> jobs primary-mem-correct, primary-mem-correct-regressions, primary-mem-correct-frontend
# soul-lab-ui-b0-home-conversation.yml -> jobs home-conversation-frontend, home-conversation-regressions
# phase-i4d-primary-retrieval-exclusion.yml -> jobs forget-lifecycle, forget-lifecycle-regressions, forget-lifecycle-frontend
# phase-i4e-forget-api-ui.yml -> job forget-lifecycle-regressions (backend), forget-lifecycle-frontend (frontend)
# phase-i4f-forget-validation.yml -> job forget-lifecycle-regressions (backend), forget-lifecycle-frontend (frontend)
# phase-i5b-pin-unpin-apply.yml -> job pin-unpin
# phase-i7c-held-governance-runtime.yml -> job held-governance
# soul-lab-ui-b1a-lifecycle-visibility.yml -> job lifecycle-visibility
# soul-lab-ui.yml -> job soul-lab-build
#
# Dropped duplicate invocations (documented per PR-13 dedup convention):
# - phase-i4d-primary-retrieval-exclusion.yml's own "recall-observation-correct
#   -regressions" job ran scripts/relaylm_phase_i1_two_turn_primary_recall_ci_runner.py,
#   scripts/relaylm_phase_i2_lab_observation_ci_runner.py, and
#   scripts/relaylm_phase_i3_primary_mem_correct_ci_runner.py -- all three
#   already run verbatim in job lab-observation-regressions / lab-observation /
#   primary-mem-correct below, so that whole job was dropped rather than
#   absorbed.
# - job primary-mem-correct-regressions dropped scripts/relaylm_phase6c1_primary_worker_ci_runner.py,
#   scripts/relaylm_phase6c1_worker_integration_ci_runner.py,
#   scripts/relaylm_phase6c2_one_queued_job_runner_ci_runner.py,
#   scripts/relaylm_phase_i1_two_turn_primary_recall_ci_runner.py,
#   scripts/relaylm_phase_i2_lab_observation_ci_runner.py, and
#   scripts/relaylm_soul_lab_management_projection_smoke.py -- all six already
#   run verbatim in job lab-observation / lab-observation-regressions.
# - job primary-mem-correct-frontend dropped its "Run strict observation
#   browser schema smoke" step (tsc + node scripts/observationApiSmoke.mjs) --
#   identical to the step already kept in job lab-observation-frontend.
# - job home-conversation-regressions dropped scripts/relaylm_docs_link_check.py
#   (kept once in job forget-lifecycle below) and the same three cross-slice
#   CI-runner invocations dropped from primary-mem-correct-regressions above.
# - job forget-lifecycle-regressions dropped, relative to
#   phase-i4e-forget-api-ui.yml and phase-i4f-forget-validation.yml source
#   order: scripts/relaylm_phase_i4c1_primary_forget_hidden_successor_smoke.py,
#   scripts/relaylm_phase_i4c1_primary_forget_security_smoke.py,
#   scripts/relaylm_phase_i4c2_primary_forget_recovery_smoke.py,
#   scripts/relaylm_phase_i4c2_primary_forget_fault_smoke.py,
#   scripts/relaylm_phase_i4c2_primary_forget_concurrency_smoke.py (all five
#   first introduced by the i4d forget-regressions block below),
#   scripts/relaylm_phase_i4d_primary_retrieval_exclusion_smoke.py,
#   scripts/relaylm_phase_i4d_historical_projection_smoke.py,
#   scripts/relaylm_phase_i4d_fresh_conversation_smoke.py (already covered by
#   job forget-lifecycle's own functional smoke below), plus
#   phase-i4f-forget-validation.yml's own re-run of
#   scripts/relaylm_phase_i4b_primary_forget_preflight_smoke.py,
#   scripts/relaylm_phase_i4c1_primary_forget_fault_smoke.py,
#   scripts/relaylm_phase_i4c1_primary_forget_concurrency_smoke.py,
#   scripts/relaylm_phase_i4e_forget_api_smoke.py,
#   scripts/relaylm_phase_i4e_forget_api_security_smoke.py, and
#   scripts/relaylm_docs_link_check.py (all already covered earlier in this
#   same job / by job forget-lifecycle).
# - job forget-lifecycle-frontend dropped phase-i4e-forget-api-ui.yml and
#   phase-i4f-forget-validation.yml's own "npm run smoke:home-conversation"
#   (already covered by job home-conversation-frontend) and de-duplicated
#   "npm run smoke:forget-ui" (i4e and i4f both ran it; kept once).
# - Cross-job file-wide dedup: phase-i2, phase-i4d, and phase-i7c each
#   independently ran the whole-repo scripts/relaylm_docs_link_check.py with
#   no arguments. Kept once (job lab-observation) and dropped from jobs
#   forget-lifecycle and held-governance. Likewise
#   scripts/relaylm_mvp_completion_report_pr_link_smoke.py was independently
#   run by phase-i4f and phase-i7c; kept once (job held-governance) and
#   dropped from job forget-lifecycle-regressions.

