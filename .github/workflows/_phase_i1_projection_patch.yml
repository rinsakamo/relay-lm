name: Phase I-1 content-free projection patch

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/_phase_i1_projection_patch.py"
      - ".github/workflows/_phase_i1_projection_patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i1-primary-mem-next-turn-recall
          fetch-depth: 0
      - name: Apply projection patch
        id: apply_patch
        continue-on-error: true
        run: python scripts/_phase_i1_projection_patch.py > phase-i1-projection-patch.log 2>&1
      - name: Upload projection patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-i1-projection-patch-log
          path: phase-i1-projection-patch.log
          if-no-files-found: error
      - name: Fail when projection patch failed
        if: steps.apply_patch.outcome != 'success'
        run: exit 1
      - run: python -m compileall -q relaylm scripts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relaylm docs
          git commit -m "fix: keep I1 recall diagnostics content-free"
          git push origin HEAD:phase-i1-primary-mem-next-turn-recall
