name: LC1A push repair runner

on:
  push:
    branches: [agent/lc1a-subjective-mem-correct]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Execute reviewed repair payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/lc1a-merge-diagnostic.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = workflow.index(marker) + len(marker)
          lines = workflow[start:].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          script = script.replace(
              'Path(".github/workflows/lc1a-merge-diagnostic.yml"),',
              'Path(".github/workflows/lc1a-merge-diagnostic.yml"),\n              Path(".github/workflows/lc1a-push-runner.yml"),\n              Path(".github/lc1a-helper-repair-trigger"),',
          )
          Path('/tmp/lc1a-repair.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/lc1a-repair.sh
