name: Temporary documentation evidence index patch

on:
  push:
    paths:
      - ".github/workflows/_temporary-doc-evidence-index.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.ref_name == 'agent/docs-evidence-index'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-evidence-index
      - name: Patch documentation index
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/README.md')
          text = path.read_text(encoding='utf-8')

          old_start = '- [Current project status](PROJECT_STATUS.md) — the single current implementation status authority.\n- [Project execution plan](architecture/project_execution_plan.md) — the single MVP execution plan and post-MVP roadmap authority.'
          new_start = '- [Current project status](PROJECT_STATUS.md) — the single current implementation status authority.\n- [v0.1 Release Readiness Assessment](mvp/v0.1_release_readiness.md) — current readiness assessment and pending final main-HEAD validation; not a completed tag receipt.\n- [Project execution plan](architecture/project_execution_plan.md) — the single MVP execution plan and post-MVP roadmap authority.'

          old_wave8 = '- [O2/O3 and PM-D5-D7 docs convergence completion report](mvp/wave8/o2_o3_pm_d5_d7_docs_convergence_completion_report.md) — source PR #490. Historical documentation convergence evidence only.\n- [Twin Extraction Tooling completion report](mvp/wave8/twin_extraction_completion_report.md) — source PR #503. Offline runtime-non-contact preprocessing/extraction tooling only; no MEM/SOUL ingestion or RelaySLP runtime wiring.'
          new_wave8 = '- [O2/O3 and PM-D5-D7 docs convergence completion report](mvp/wave8/o2_o3_pm_d5_d7_docs_convergence_completion_report.md) — source PR #490. Historical documentation convergence evidence only.\n- [E2 Value Smoke Harness completion report](mvp/wave8/e2_value_smoke_harness_completion_report.md) — source PR #481. Harness implementation evidence only; the later human quality judgment remains separate and local-only.\n- [Twin Extraction Tooling completion report](mvp/wave8/twin_extraction_completion_report.md) — source PR #503. Offline runtime-non-contact preprocessing/extraction tooling only; no MEM/SOUL ingestion or RelaySLP runtime wiring.'

          replacements = [(old_start, new_start), (old_wave8, new_wave8)]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected docs/README.md anchor: {old[:80]!r}')
              if text.count(old) != 1:
                  raise SystemExit('expected unique docs/README.md anchor')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/README.md
          git commit -m "docs: index release assessment and E2 harness evidence"
          git push origin HEAD:agent/docs-evidence-index
