name: Bootstrap Documentation Hard Cutover 1C-52 Bookkeeping

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/relaylm_cutover_1c52_bookkeeping_bootstrap.py"
      - ".github/workflows/documentation-cutover-1c52-bookkeeping-bootstrap.yml"

permissions:
  contents: write

jobs:
  bookkeeping:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c52-bookkeeping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Finalize Cutover 1C-52 bookkeeping
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python scripts/relaylm_cutover_1c52_bookkeeping_bootstrap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/migrations/cutover-1c52-i1ge.md docs/evidence/migrations/documentation-hard-cutover-receipt.md
          if git diff --cached --quiet; then
            echo "No bookkeeping changes required"
            exit 0
          fi
          git commit -m "docs: finalize cutover 1C-52 bookkeeping facts"
          git push origin HEAD:"${HEAD_REF}"
