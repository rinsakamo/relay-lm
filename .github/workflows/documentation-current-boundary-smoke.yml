name: Cutover 1C-55 Bookkeeping Content Generator

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/cutover-1c55-bookkeeping-generator'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "bccc8278523ff8a79bdd82c9e81598940745708f"
      - name: Install validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Generate and validate bookkeeping documents
        run: |
          set -euo pipefail
          python scripts/_tmp_cutover_1c55_bookkeeping_generator.py
          python -m compileall -q relaylm scripts
          python scripts/relaylm_phase_i2_handoff_cutover_guard.py
          python scripts/relaylm_phase_i2_handoff_cutover_guard.py --self-test
          python scripts/relaylm_phase_i2_documentation_boundary_smoke.py
          python scripts/relaylm_e1_evaluation_consolidation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          python scripts/relaylm_docs_semantic_audit.py
          python scripts/relaylm_docs_semantic_audit.py --self-test
          git diff --check
          changed="$(git diff --name-only HEAD)"
          expected=$'docs/evidence/migrations/cutover-1c55-phase-i2.md\ndocs/evidence/migrations/documentation-hard-cutover-receipt.md'
          test "$changed" = "$expected"
      - name: Commit generated bookkeeping documents
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "bccc8278523ff8a79bdd82c9e81598940745708f"
          git add docs/evidence/migrations/cutover-1c55-phase-i2.md docs/evidence/migrations/documentation-hard-cutover-receipt.md
          git commit -m "docs: generate cutover 1C-55 bookkeeping content"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
