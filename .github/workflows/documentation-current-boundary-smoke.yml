name: Cutover 1C-56 Phase I-3 Builder Diagnostic

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c56-phase-i3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Diagnose exact payload and builder
        env:
          BASE_MAIN: 358e6a57251688df8590f48f3b04317fd7023601
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          {
            echo '## chunk hashes'
            sha256sum scripts/_cutover_1c56_phase_i3_builder.py.b64.*
            echo '## chunk sizes'
            wc -c scripts/_cutover_1c56_phase_i3_builder.py.b64.*
            cat scripts/_cutover_1c56_phase_i3_builder.py.b64.* > /tmp/cutover_i3_builder.py.b64
            echo '## combined hash and size'
            sha256sum /tmp/cutover_i3_builder.py.b64
            wc -c /tmp/cutover_i3_builder.py.b64
            base64 -d /tmp/cutover_i3_builder.py.b64 > /tmp/cutover_i3_builder.py
            decode_status=$?
            echo "decode_status=$decode_status"
            echo '## decoded hash and size'
            sha256sum /tmp/cutover_i3_builder.py
            wc -c /tmp/cutover_i3_builder.py
            python -m py_compile /tmp/cutover_i3_builder.py
            compile_status=$?
            echo "compile_status=$compile_status"
            git fetch origin main
            python /tmp/cutover_i3_builder.py
            builder_status=$?
            echo "builder_status=$builder_status"
            echo '## git status'
            git status --short
            echo '## changed paths'
            git diff --name-only
          } > cutover-1c56-builder-diagnostic.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: cutover-1c56-builder-diagnostic
          path: cutover-1c56-builder-diagnostic.txt
          if-no-files-found: error
