name: Documentation Cutover 1C-55 Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/documentation-current-boundary-smoke.yml"
      - "scripts/_cutover_1c55_builder.py"

permissions:
  contents: write

concurrency:
  group: documentation-cutover-1c55-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c55-phase-i2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact Cutover 1C-55 transformation
        env:
          CUTOVER_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/_cutover_1c55_builder.py")
          text = path.read_text(encoding="utf-8")
          old = '''    template = template.replace(
                  '    "docs/evidence/migrations/cutover-1c54-i4c2.md",',
                  f'    "{LOCAL_RECEIPT}",',
              )'''
          new = '''    template = template.replace(
                  "docs/evidence/migrations/cutover-1c54-i4c2.md",
                  LOCAL_RECEIPT,
              )'''
          if text.count(old) != 1:
              raise SystemExit(f"builder receipt replacement anchor mismatch: {text.count(old)}")
          text = text.replace(old, new, 1)
          if text.count("- Guard self-test: 22 assertions") != 1:
              raise SystemExit("builder self-test count anchor mismatch")
          text = text.replace("- Guard self-test: 22 assertions", "- Guard self-test: 24 assertions", 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile scripts/_cutover_1c55_builder.py
          python scripts/_cutover_1c55_builder.py
      - name: Install validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile validation scripts
        run: python -m compileall -q scripts
      - name: Validate cutover repository tree
        run: python scripts/relaylm_phase_i2_handoff_cutover_guard.py
      - name: Validate cutover guard self-test
        run: python scripts/relaylm_phase_i2_handoff_cutover_guard.py --self-test
      - name: Validate Phase I-2 documentation boundary
        run: python scripts/relaylm_phase_i2_documentation_boundary_smoke.py
      - name: Validate E1 evidence inventory
        run: python scripts/relaylm_e1_evaluation_consolidation_smoke.py
      - name: Validate documentation links
        run: PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
      - name: Validate documentation semantics
        run: |
          python scripts/relaylm_docs_semantic_audit.py
          python scripts/relaylm_docs_semantic_audit.py --self-test
      - name: Validate current documentation boundary
        run: python scripts/relaylm_documentation_current_boundary_smoke.py
      - name: Validate final reviewable tree shape
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/_cutover_1c55_builder.py
          grep -q '^name: Documentation current boundary smoke$' .github/workflows/documentation-current-boundary-smoke.yml
      - name: Commit and publish validated Cutover 1C-55 tree
        id: publish
        shell: bash
        run: |
          set +e
          {
            git status --short
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "docs: move Phase I-2 handoff to frozen evidence"
            commit_status=$?
            echo "commit_status=$commit_status"
            if [ "$commit_status" -eq 0 ]; then
              git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
              publish_status=$?
            else
              publish_status=$commit_status
            fi
            echo "publish_status=$publish_status"
          } > cutover-1c55-publish.log 2>&1
          echo "status=$publish_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload publish diagnostics
        if: steps.publish.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cutover-1c55-publish-diagnostics
          path: cutover-1c55-publish.log
          if-no-files-found: error
      - name: Enforce publication
        if: steps.publish.outputs.status != '0'
        run: |
          cat cutover-1c55-publish.log
          exit 1
