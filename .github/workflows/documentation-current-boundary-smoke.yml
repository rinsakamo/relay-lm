name: Documentation current boundary smoke

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/documentation-current-boundary-smoke.yml"

permissions:
  contents: write

jobs:
  bootstrap-cutover-1c50-bookkeeping:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c50-bookkeeping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Finalize Cutover 1C-50 bookkeeping
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          pr_number = os.environ["PR_NUMBER"]
          final_head = "8f38cd8b98bebbd3b9c2c68530c40886308e3390"
          merge_commit = "869f4241384700c2160b5082b44e87729ea7e8ad"
          merged_at = "2026-07-21T15:13:47Z"

          receipt_path = Path("docs/evidence/migrations/cutover-1c50-phase55c4.md")
          receipt = receipt_path.read_text(encoding="utf-8")
          replacements = [
              ("- Bookkeeping consolidation PR: pending", f"- Bookkeeping consolidation PR: #{pr_number}"),
              (
                  "- Validated content head: pending exact-head validation\n- Merged commit: pending",
                  f"- Final cutover head: `{final_head}`\n"
                  f"- Merged commit: `{merge_commit}`\n"
                  f"- Merged at: `{merged_at}`\n"
                  "- Final cutover diff: 9 files, +582/-18",
              ),
              ("- Exact-head GitHub Actions: pending", "- Exact-head GitHub Actions: 16 workflow runs, 16 success, 0 failure"),
              (
                  "- Open-PR content imported: none; open PR enumeration before branch creation was 0",
                  "- Open-PR content imported: none; PR #629 was open at final review, shared 0 changed paths, and no content was imported",
              ),
              ("- Unresolved review threads: pending final review", "- Unresolved review threads at final cutover head: 0"),
              (
                  "This receipt records the in-review Cutover 1C-50 boundary. It does not make the historical C4 handoff current authority and does not change runtime, contract, schema, storage, compatibility, alias, redirect, dual-read, or dual-write behavior. Merge and exact-head observations remain pending until explicit final review and merge.",
                  "This frozen receipt records the Cutover 1C-50 migration facts. It does not make the historical C4 handoff current authority and does not change runtime, contract, schema, storage, compatibility, alias, redirect, dual-read, or dual-write behavior. This bookkeeping-only integration changes no accepted cutover content.",
              ),
          ]
          for old, new in replacements:
              count = receipt.count(old)
              if count != 1:
                  raise SystemExit(f"receipt replacement count for {old!r}: {count}")
              receipt = receipt.replace(old, new, 1)
          receipt_path.write_text(receipt, encoding="utf-8")

          ledger_path = Path("docs/evidence/migrations/documentation-hard-cutover-receipt.md")
          ledger = ledger_path.read_text(encoding="utf-8")
          marker = "### C1C50-001 — Phase 5.5-C4 runtime TTS transport envelope wiring handoff"
          if ledger.count(marker) != 1:
              raise SystemExit("C1C50 marker count is not exactly one")
          prefix, block = ledger.split(marker, 1)
          block_replacements = [
              ("merged_commit: pending", f"merged_commit: {merge_commit}"),
              ("bookkeeping_pr: pending", f"bookkeeping_pr: {pr_number}"),
              ("validated_content_head: pending", f"validated_content_head: {final_head}"),
              ("head_at_merge: pending", f"head_at_merge: {final_head}"),
              ("merged_at: pending", f"merged_at: {merged_at}"),
              ("  exact_head_workflow_runs: pending", "  exact_head_workflow_runs: 16"),
              ("  exact_head_workflow_success: pending", "  exact_head_workflow_success: 16"),
              ("  exact_head_workflow_failure: pending", "  exact_head_workflow_failure: 0"),
              ("  unresolved_review_threads: pending", "  unresolved_review_threads: 0"),
              (
                  "PR #628 preserves the completed C4 runtime-wiring handoff as frozen implementation evidence. Source-time implementation claims remain historical; current Stream Unpack sequencing, runtime handoff behavior, and transport contract authority remain parent-, C2/C3-, code-, and focused-smoke-owned. Merge attribution and exact-head validation remain pending until explicit final review and bookkeeping consolidation.",
                  f"PR #628 preserves the completed C4 runtime-wiring handoff as frozen implementation evidence. Source-time implementation claims remain historical; current Stream Unpack sequencing, runtime handoff behavior, and transport contract authority remain parent-, C2/C3-, code-, and focused-smoke-owned. PR #{pr_number} consolidates the merge attribution in the central audit ledger and local frozen receipt without changing accepted cutover content.",
              ),
          ]
          for old, new in block_replacements:
              count = block.count(old)
              if count != 1:
                  raise SystemExit(f"ledger replacement count for {old!r}: {count}")
              block = block.replace(old, new, 1)
          ledger_path.write_text(prefix + marker + block, encoding="utf-8")
          PY

          if git diff --quiet -- docs/evidence/migrations/cutover-1c50-phase55c4.md docs/evidence/migrations/documentation-hard-cutover-receipt.md; then
            echo "Bookkeeping already finalized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/migrations/cutover-1c50-phase55c4.md docs/evidence/migrations/documentation-hard-cutover-receipt.md
          git commit -m "docs: finalize cutover 1C-50 bookkeeping"
          git push origin HEAD:"${HEAD_REF}"
