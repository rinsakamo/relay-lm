name: Cutover 1C-56 Whitespace Diagnostic

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c56-phase-i3'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct final cutover tree
        env:
          BASE_MAIN: 358e6a57251688df8590f48f3b04317fd7023601
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          cat scripts/_cutover_1c56_phase_i3_builder.py.b64.* > /tmp/cutover_i3_builder.py.b64
          echo 'a80be96139edc44d8c346aeab1b796a363ef5a5e102d0157066f50b12edca0da  /tmp/cutover_i3_builder.py.b64' | sha256sum -c -
          base64 -d /tmp/cutover_i3_builder.py.b64 > /tmp/cutover_i3_builder.py
          echo 'eb89897568c5bfa7c439a73610d8fac3a7bd5ec543c420155be366bb7496a71f  /tmp/cutover_i3_builder.py' | sha256sum -c -
          python /tmp/cutover_i3_builder.py
          rm -f scripts/_cutover_1c56_phase_i3_builder.py.b64.*
      - name: Install validation dependencies
        run: python -m pip install -e ".[test]"
      - name: Run validated sequence
        run: |
          python -m compileall -q relaylm scripts
          python scripts/relaylm_phase_i3_handoff_cutover_guard.py
          python scripts/relaylm_phase_i3_handoff_cutover_guard.py --self-test
          python scripts/relaylm_phase_i3_primary_mem_correct_ci_runner.py
          python scripts/relaylm_phase_i2_documentation_boundary_smoke.py
          python scripts/relaylm_e1_evaluation_consolidation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          python scripts/relaylm_docs_semantic_audit.py
          python scripts/relaylm_docs_semantic_audit.py --self-test
          python scripts/relaylm_documentation_current_boundary_smoke.py
      - name: Capture whitespace failure
        run: |
          set +e
          {
            echo '## git diff --check'
            git diff --check
            echo "status=$?"
            echo
            echo '## git status --short'
            git status --short
            echo
            echo '## diff numstat'
            git diff --numstat
          } > cutover-1c56-whitespace.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: cutover-1c56-whitespace
          path: cutover-1c56-whitespace.txt
          if-no-files-found: error
