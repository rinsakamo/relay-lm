name: Documentation Cutover 1C-55 Main Sync

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/documentation-current-boundary-smoke.yml"

permissions:
  contents: write

concurrency:
  group: documentation-cutover-1c55-main-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c55-phase-i2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge latest main with explicit README authority preservation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          original_head="$(git rev-parse HEAD)"
          git show "${original_head}^:.github/workflows/documentation-current-boundary-smoke.yml" > /tmp/documentation-current-boundary-smoke.final.yml
          git fetch origin main
          merge_status=0
          git merge --no-ff --no-commit origin/main || merge_status=$?
          unresolved="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "$unresolved" | grep -v '^docs/architecture/README.md$' | sed '/^$/d' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected merge conflicts:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 11
          fi
          git show origin/main:docs/architecture/README.md > docs/architecture/README.md
          retired='- [Phase I-2 Real SOUL Lab Observation](phase_i2_real_soul_lab_observation.md)'
          retired_count="$(grep -Fxc -- "$retired" docs/architecture/README.md || true)"
          if [ "$retired_count" -ne 2 ]; then
            echo "Expected two retired Phase I-2 index entries, got $retired_count" >&2
            exit 12
          fi
          grep -Fvx -- "$retired" docs/architecture/README.md > docs/architecture/README.md.tmp
          mv docs/architecture/README.md.tmp docs/architecture/README.md
          grep -Fq -- '- [SM-1 Subjective MEM Create Runtime](sm1_subjective_mem_create_runtime.md)' docs/architecture/README.md
          git add docs/architecture/README.md
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 13
          fi
          git add -A
          if [ "$merge_status" -ne 0 ] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "Merge failed before producing a merge state" >&2
            exit 14
          fi
      - name: Validate synchronized final content
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
          python -m compileall -q relaylm scripts
          python scripts/relaylm_phase_i2_handoff_cutover_guard.py
          python scripts/relaylm_phase_i2_handoff_cutover_guard.py --self-test
          python scripts/relaylm_phase_i2_documentation_boundary_smoke.py
          python scripts/relaylm_e1_evaluation_consolidation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          python scripts/relaylm_docs_semantic_audit.py
          python scripts/relaylm_docs_semantic_audit.py --self-test
          python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check
          test ! -e scripts/_cutover_1c55_builder.py
          test ! -e .github/workflows/documentation-cutover-1c55-bootstrap.yml
          grep -q 'SM-1 Subjective MEM Create Runtime' docs/architecture/README.md
          ! grep -q 'phase_i2_real_soul_lab_observation.md' docs/architecture/README.md
      - name: Commit and publish synchronized non-workflow tree
        run: |
          set -euo pipefail
          git commit -m "docs: synchronize cutover 1C-55 with SM-1 main"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - name: Upload validated final workflow
        uses: actions/upload-artifact@v4
        with:
          name: cutover-1c55-final-workflow-after-main-sync
          path: /tmp/documentation-current-boundary-smoke.final.yml
          if-no-files-found: error
