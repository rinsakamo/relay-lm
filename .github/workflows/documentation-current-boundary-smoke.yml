name: Cutover 1C-56 Payload Hash Probe

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c56-phase-i3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Print payload hashes
        run: |
          sha256sum scripts/_cutover_1c56_phase_i3_builder.py.b64.*
          cat scripts/_cutover_1c56_phase_i3_builder.py.b64.* | sha256sum
