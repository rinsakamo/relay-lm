name: Stage cutover 1C-49 on latest main

on:
  pull_request:
    types: [reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'agent/docs-cutover-1c49-phase55c0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c49-phase55c0
          fetch-depth: 0
      - name: Apply cutover payload
        run: |
          set -euo pipefail
          if [ -f docs/evidence/migrations/cutover-1c49-phase55c0.md ]; then
            echo 'Cutover payload already staged.'
            exit 0
          fi
          git fetch origin backup/cutover-1c49-aa82
          git checkout origin/backup/cutover-1c49-aa82 -- \
            docs/architecture/phase55c1_tts_adapter_handoff_contract.md \
            docs/architecture/phase5_5_stream_unpack_bounded_slice.md \
            docs/evidence/implementation/README.md \
            docs/evidence/implementation/phase55c0-tts-segmentation-helper-handoff.md \
            docs/evidence/migrations/cutover-1c49-phase55c0.md \
            docs/evidence/migrations/documentation-hard-cutover-receipt.md \
            docs/planning/documentation-cutover-rules.yaml \
            scripts/relaylm_phase55c0_handoff_cutover_guard.py
          git rm docs/architecture/phase55c0_tts_segmentation_helper_handoff.md
          python - <<'PY'
          from pathlib import Path
          old_base = '3e7d035f4542d1cf7c6b18d7250813154c05c5e8'
          new_base = '1ca928cd28541f5a05fece30e9437a7fcf267921'
          receipt = Path('docs/evidence/migrations/cutover-1c49-phase55c0.md')
          text = receipt.read_text(encoding='utf-8')
          text = text.replace(f'- Base main: `{old_base}`', f'- Base main: `{new_base}`')
          text = text.replace(
              '- Open-PR content imported: none; PR #621 is contract-only at branch inspection, PR #586 shares only `docs/evidence/implementation/README.md` in a disjoint added entry, and PR #578/#567 have no path overlap',
              '- Open-PR content imported: none; merged PRs #621 and #623 are part of base main and their Subjective MEM plus storage-authority workflow integration is preserved alongside the C0 guard; PR #586 shares only `docs/evidence/implementation/README.md` in a disjoint added entry; PR #578 has no changed-path overlap',
          )
          receipt.write_text(text, encoding='utf-8')
          ledger = Path('docs/evidence/migrations/documentation-hard-cutover-receipt.md')
          text = ledger.read_text(encoding='utf-8')
          text = text.replace(f'base_main: {old_base}', f'base_main: {new_base}', 1)
          text = text.replace(
              '  open_pr_shared_path_reconciliation: ["#586:preserve C0 implementation-evidence index entry when rebased", "#621:contract-only at cutover branch inspection; preserve any later workflow integration during reconciliation"]',
              '  open_pr_shared_path_reconciliation: ["#586:preserve C0 implementation-evidence index entry when rebased"]',
              1,
          )
          ledger.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q scripts/relaylm_phase55c0_handoff_cutover_guard.py
          python scripts/relaylm_phase55c0_handoff_cutover_guard.py
          python scripts/relaylm_phase55c0_handoff_cutover_guard.py --self-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: stage cutover 1C-49 on latest main'
          git push origin HEAD:agent/docs-cutover-1c49-phase55c0
