name: Cutover 1C-56 Workflow Blob Stager

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  stage:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c56-phase-i3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage exact canonical workflow blob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/cutover-workflow tmp
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8560052638/zip" \
            --output /tmp/cutover-workflow/artifact.zip
          unzip -q /tmp/cutover-workflow/artifact.zip -d /tmp/cutover-workflow/extracted
          cp /tmp/cutover-workflow/extracted/documentation-current-boundary-smoke.yml tmp/cutover-1c56-final-workflow.yml
          echo '95e3cfba2eef40ee7f415a3adfa905788c7d02ce716295bbb0f243b460db8036  tmp/cutover-1c56-final-workflow.yml' | sha256sum -c -
          git add tmp/cutover-1c56-final-workflow.yml
          git commit -m "chore: stage canonical cutover 1C-56 workflow blob"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
