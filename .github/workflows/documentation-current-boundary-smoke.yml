name: Cutover 1C-56 Tree Shape Diagnostic

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c56-phase-i3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Reconstruct final cutover tree
        env:
          BASE_MAIN: 358e6a57251688df8590f48f3b04317fd7023601
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          cat scripts/_cutover_1c56_phase_i3_builder.py.b64.* > /tmp/cutover_i3_builder.py.b64
          echo 'a80be96139edc44d8c346aeab1b796a363ef5a5e102d0157066f50b12edca0da  /tmp/cutover_i3_builder.py.b64' | sha256sum -c -
          base64 -d /tmp/cutover_i3_builder.py.b64 > /tmp/cutover_i3_builder.py
          echo 'eb89897568c5bfa7c439a73610d8fac3a7bd5ec543c420155be366bb7496a71f  /tmp/cutover_i3_builder.py' | sha256sum -c -
          python /tmp/cutover_i3_builder.py
          rm -f scripts/_cutover_1c56_phase_i3_builder.py.b64.*
      - name: Diff check
        continue-on-error: true
        run: git diff --check
      - name: Old source absent
        continue-on-error: true
        run: test ! -e docs/architecture/phase_i3_auditable_primary_mem_correct.md
      - name: Canonical target present
        continue-on-error: true
        run: test -e docs/evidence/implementation/phase-i3-auditable-primary-mem-correct-handoff.md
      - name: Payload absent
        continue-on-error: true
        run: test -z "$(find scripts -maxdepth 1 -name '_cutover_1c56_phase_i3_builder.py.b64.*' -print -quit)"
      - name: Canonical workflow restored
        continue-on-error: true
        run: grep -q '^name: Documentation current boundary smoke$' .github/workflows/documentation-current-boundary-smoke.yml
      - name: Runtime and Project Status unchanged
        continue-on-error: true
        run: test -z "$(git diff --name-only -- relaylm docs/PROJECT_STATUS.md)"
      - name: Show final status
        if: always()
        run: |
          git status --short
          git diff --name-only
