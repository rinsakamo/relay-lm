name: Bootstrap Documentation Hard Cutover 1C-52

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/documentation-current-boundary-smoke.yml"
      - "scripts/relaylm_cutover_1c52_bootstrap.py"

permissions:
  contents: write

jobs:
  bootstrap-cutover-1c52:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c52-i1ge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assemble Cutover 1C-52
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set +e
          python scripts/relaylm_cutover_1c52_bootstrap.py > /tmp/cutover-1c52.log 2>&1
          status=$?
          set -e
          tail -120 /tmp/cutover-1c52.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/cutover-1c52.log docs/evidence/migrations/cutover-1c52-bootstrap-failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/evidence/migrations/cutover-1c52-bootstrap-failure.txt
            git commit -m "chore: capture Cutover 1C-52 bootstrap failure"
            git push origin HEAD:"${HEAD_REF}"
            exit "$status"
          fi
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "docs: move I1-GE handoff to frozen evidence"
          git push origin HEAD:"${HEAD_REF}"
