name: Cutover 1C-55 Generator Trigger Probe

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    if: github.head_ref == 'agent/cutover-1c55-bookkeeping-generator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo generator-trigger-ok
