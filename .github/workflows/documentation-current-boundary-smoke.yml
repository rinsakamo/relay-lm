name: Finalize Documentation Hard Cutover 1C-51

on:
  pull_request:
    paths:
      - ".github/workflows/documentation-current-boundary-smoke.yml"
      - "scripts/relaylm_cutover_1c51_finalize_bootstrap.py"

permissions:
  contents: write

jobs:
  finalize-cutover-1c51:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c51-phase55b2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Finalize workflow integration facts
        run: python scripts/relaylm_cutover_1c51_finalize_bootstrap.py
      - name: Commit finalization facts
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/evidence/migrations/cutover-1c51-phase55b2.md \
            docs/evidence/migrations/documentation-hard-cutover-receipt.md
          git commit -m "docs: record Cutover 1C-51 workflow integration"
          git push origin HEAD:"${HEAD_REF}"
