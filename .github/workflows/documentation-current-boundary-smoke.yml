name: Documentation current boundary smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "README_ja.md"
      - "config.example.yaml"
      - "relaylm/config.py"
      - "docs/**"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "scripts/relaylm_docs_semantic_audit.py"
      - ".github/workflows/documentation-current-boundary-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "README_ja.md"
      - "config.example.yaml"
      - "relaylm/config.py"
      - "docs/**"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "scripts/relaylm_docs_semantic_audit.py"
      - ".github/workflows/documentation-current-boundary-smoke.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semantic audit dependency
        run: python -m pip install pyyaml
      - name: Compile documentation validation scripts
        run: |
          python -m compileall -q \
            scripts/relaylm_documentation_current_boundary_smoke.py \
            scripts/relaylm_docs_semantic_audit.py
      - name: Validate documentation semantics and current boundaries
        run: |
          set +e
          python scripts/relaylm_docs_semantic_audit.py 2>&1 | tee documentation-current-boundary.log
          semantic_status=${PIPESTATUS[0]}
          python scripts/relaylm_documentation_current_boundary_smoke.py 2>&1 | tee -a documentation-current-boundary.log
          boundary_status=${PIPESTATUS[0]}
          if [ "$semantic_status" -ne 0 ] || [ "$boundary_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload documentation boundary diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-current-boundary-diagnostics
          path: documentation-current-boundary.log
          if-no-files-found: error

  apply-c1c19-o1f:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/docs-cutover-1c19-o1f'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c19-o1f
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install pyyaml
      - name: Apply Cutover 1C-19 updates
        shell: bash
        run: |
          set -o pipefail
          python scripts/tmp_c1c19_o1f_applicator.py 2>&1 | tee c1c19-applicator.log
      - name: Upload applicator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: c1c19-applicator-diagnostics
          path: c1c19-applicator.log
          if-no-files-found: error
      - name: Verify exact source preservation
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:docs/mvp/wave6/o1f_completion_report.md > /tmp/o1f_completion_report.md
          cmp /tmp/o1f_completion_report.md docs/evidence/implementation/o1f_completion_report-source.txt
          test "$(git hash-object docs/evidence/implementation/o1f_completion_report-source.txt)" = "cae70dbe1648ed6757af928eeae0becd7fd313dd"
          test "$(sha256sum docs/evidence/implementation/o1f_completion_report-source.txt | awk '{print $1}')" = "b7c61bd6711e2f8ab741e4f73df5715d64229cfa5f11865c1004eed9d5a6e976"
          test ! -e docs/mvp/wave6/o1f_completion_report.md
          ! git grep -n "docs/mvp/wave6/o1f_completion_report.md" -- . \
            ':!docs/evidence/migrations/documentation-hard-cutover-receipt.md' \
            ':!docs/evidence/implementation/o1f_completion_report-source.txt' \
            ':!.github/workflows/tmp-c1c19-o1f-applicator.yml' \
            ':!scripts/tmp_c1c19_o1f_applicator.py'
      - name: Run O1F and documentation validation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/o1f_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_corruption_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_concurrency_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_saturation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_restart_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_security_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1a_scheduler_contract_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1b_sealed_replay_lane_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1c_eligible_queue_lane_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1d1_production_round_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1d2_scheduler_policy_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1e_scheduler_operational_controls_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o2_supervised_scheduler_service_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o3_always_on_local_scheduler_smoke.py
          git diff --check
      - name: Commit Cutover 1C-19 updates and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-c1c19-o1f-applicator.yml
          rm -f scripts/tmp_c1c19_o1f_applicator.py
          git checkout origin/main -- .github/workflows/documentation-current-boundary-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: complete O1F cutover references"
          git push origin HEAD:agent/docs-cutover-1c19-o1f
