name: Documentation current boundary smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "README_ja.md"
      - "config.example.yaml"
      - "relaylm/config.py"
      - "docs/**"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "scripts/relaylm_docs_semantic_audit.py"
      - ".github/workflows/documentation-current-boundary-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "README_ja.md"
      - "config.example.yaml"
      - "relaylm/config.py"
      - "docs/**"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "scripts/relaylm_docs_semantic_audit.py"
      - ".github/workflows/documentation-current-boundary-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semantic audit dependency
        run: python -m pip install pyyaml
      - name: Compile documentation validation scripts
        run: |
          python -m compileall -q \
            scripts/relaylm_documentation_current_boundary_smoke.py \
            scripts/relaylm_docs_semantic_audit.py
      - name: Validate documentation semantics and current boundaries
        run: |
          set +e
          python scripts/relaylm_docs_semantic_audit.py 2>&1 | tee documentation-current-boundary.log
          semantic_status=${PIPESTATUS[0]}
          python scripts/relaylm_documentation_current_boundary_smoke.py 2>&1 | tee -a documentation-current-boundary.log
          boundary_status=${PIPESTATUS[0]}
          if [ "$semantic_status" -ne 0 ] || [ "$boundary_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload documentation boundary diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-current-boundary-diagnostics
          path: documentation-current-boundary.log
          if-no-files-found: error

  apply-c1c20-i5b:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/docs-cutover-1c20-i5b'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c20-i5b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install RelayLM validation dependencies
        run: python -m pip install -e '.[test]'
      - name: Apply Cutover 1C-20 updates
        run: python scripts/tmp_c1c20_i5b_applicator.py
      - name: Bind draft PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('docs/evidence/migrations/documentation-hard-cutover-receipt.md')
          body = path.read_text(encoding='utf-8')
          old = '### C1C20-001 — I-5B completion report\n\n```yaml\ncutover_pr: pending\n'
          new = f"### C1C20-001 — I-5B completion report\n\n```yaml\ncutover_pr: {os.environ['PR_NUMBER']}\n"
          assert old in body
          path.write_text(body.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify exact source preservation
        run: |
          set -euo pipefail
          git show origin/main:docs/mvp/wave6/i5b_completion_report.md > /tmp/i5b_completion_report.md
          cmp /tmp/i5b_completion_report.md docs/evidence/implementation/i5b_completion_report-source.txt
          test "$(git hash-object docs/evidence/implementation/i5b_completion_report-source.txt)" = "19d631470dc0cf16e65c214169e3097758381de9"
          test "$(sha256sum docs/evidence/implementation/i5b_completion_report-source.txt | awk '{print $1}')" = "2efce2a61fb09b9ed4226d2a09e6e6b78645bf11f65badc855e03f7e64b8aa85"
          test ! -e docs/mvp/wave6/i5b_completion_report.md
          ! git grep -n "docs/mvp/wave6/i5b_completion_report.md" -- . \
            ':!docs/evidence/implementation/i5b_completion_report-source.txt' \
            ':!docs/evidence/waves/wave6_cross_slice_convergence_audit-source.txt' \
            ':!docs/evidence/migrations/documentation-hard-cutover-receipt.md' \
            ':!scripts/tmp_c1c20_i5b_applicator.py' \
            ':!.github/workflows/documentation-current-boundary-smoke.yml'
      - name: Validate I-5B cutover and focused behavior
        run: |
          set -euo pipefail
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/i5b_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i5a_pin_unpin_contract_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i5b_pin_unpin_apply_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i5b_pin_unpin_ranking_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i5b_pin_unpin_concurrency_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i5b_pin_unpin_security_smoke.py
          git diff --check
          cd apps/soul-lab
          npm install
          npm run build
          npm run smoke:pin-unpin-ui
      - name: Mark local validation passed
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/evidence/migrations/documentation-hard-cutover-receipt.md')
          body = path.read_text(encoding='utf-8')
          for key in (
              'focused_i5a_i5b_smokes',
              'soul_lab_pin_unpin_ui_validation',
              'documentation_link_check',
              'documentation_semantic_audit',
              'completion_report_model_and_file_checks',
              'completion_report_pr_link_check',
          ):
              old = f'  {key}: pending'
              new = f'  {key}: passed'
              assert old in body, key
              body = body.replace(old, new, 1)
          path.write_text(body, encoding='utf-8')
          PY
      - name: Commit Cutover 1C-20 updates and remove temporary tooling
        run: |
          set -euo pipefail
          rm -f scripts/tmp_c1c20_i5b_applicator.py
          git checkout origin/main -- .github/workflows/documentation-current-boundary-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: complete I-5B cutover references"
          git push origin HEAD:agent/docs-cutover-1c20-i5b
