name: Documentation current boundary smoke

on:
  pull_request:
    paths:
      - "README.md"
      - "README_ja.md"
      - "config.example.yaml"
      - "relaylm/config.py"
      - "docs/**"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - ".github/workflows/documentation-current-boundary-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "README_ja.md"
      - "config.example.yaml"
      - "relaylm/config.py"
      - "docs/**"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - ".github/workflows/documentation-current-boundary-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile semantic documentation smoke
        run: python -m compileall -q scripts/relaylm_documentation_current_boundary_smoke.py
      - name: Validate active documentation boundaries
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/relaylm_documentation_current_boundary_smoke.py 2>&1 | tee documentation-current-boundary.log
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-current-boundary-log
          path: documentation-current-boundary.log
          if-no-files-found: error
      - name: Propagate validation result
        if: steps.validate.outcome == 'failure'
        run: exit 1
