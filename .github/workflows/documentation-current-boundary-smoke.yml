name: Cutover 1C-55 Bookkeeping Validation Trigger

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  trigger:
    if: github.head_ref == 'agent/cutover-1c55-validation-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/documentation-hard-cutover-1c55-bookkeeping
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push exact-head validation trigger
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "8e7e85560479efc965533b519da9b1d42da5be32"
          git commit --allow-empty -m "ci: validate cutover 1C-55 bookkeeping"
          git push origin HEAD:agent/documentation-hard-cutover-1c55-bookkeeping
