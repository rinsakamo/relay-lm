name: Bootstrap Documentation Hard Cutover 1C-52

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/documentation-current-boundary-smoke.yml"
      - "scripts/relaylm_cutover_1c52_bootstrap.py"

permissions:
  contents: write

jobs:
  bootstrap-cutover-1c52:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c52-i1ge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assemble Cutover 1C-52
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python scripts/relaylm_cutover_1c52_bootstrap.py
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "docs: move I1-GE handoff to frozen evidence"
          git push origin HEAD:"${HEAD_REF}"
