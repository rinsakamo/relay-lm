name: Documentation Cutover 1C-55 Main Sync

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/documentation-current-boundary-smoke.yml"

permissions:
  contents: write

concurrency:
  group: documentation-cutover-1c55-main-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c55-phase-i2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture latest-main merge preparation
        id: merge_prepare
        shell: bash
        run: |
          set +e
          {
            set -x
            original_head="$(git rev-parse HEAD)"
            git show "${original_head}^:.github/workflows/documentation-current-boundary-smoke.yml" > /tmp/documentation-current-boundary-smoke.final.yml
            git fetch origin main
            git merge --no-ff --no-commit origin/main
            merge_status=$?
            echo "merge_status=$merge_status"
            unresolved="$(git diff --name-only --diff-filter=U || true)"
            echo "unresolved=$unresolved"
            unexpected="$(printf '%s\n' "$unresolved" | grep -v '^docs/architecture/README.md$' | sed '/^$/d' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unexpected"
              exit 11
            fi
            git show origin/main:docs/architecture/README.md > docs/architecture/README.md
            python - <<'PY'
          from pathlib import Path
          path = Path("docs/architecture/README.md")
          text = path.read_text(encoding="utf-8")
          retired = "- [Phase I-2 Real SOUL Lab Observation](phase_i2_real_soul_lab_observation.md)\n"
          print(f"retired_count={text.count(retired)}")
          if text.count(retired) != 2:
              raise SystemExit(f"expected two retired Phase I-2 index entries, got {text.count(retired)}")
          text = text.replace(retired, "")
          required = "- [SM-1 Subjective MEM Create Runtime](sm1_subjective_mem_create_runtime.md)"
          if required not in text:
              raise SystemExit("SM-1 architecture index entry was not preserved")
          path.write_text(text, encoding="utf-8")
          PY
            git add docs/architecture/README.md
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved merge conflicts remain"
              git diff --name-only --diff-filter=U
              exit 12
            fi
            git add -A
            if [ "$merge_status" -ne 0 ] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "Merge failed before producing a merge state"
              exit 13
            fi
            git status --short
          } > cutover-1c55-main-sync.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload main-sync diagnostics
        if: steps.merge_prepare.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cutover-1c55-main-sync-diagnostics
          path: cutover-1c55-main-sync.log
          if-no-files-found: error
      - name: Enforce main merge preparation
        if: steps.merge_prepare.outputs.status != '0'
        run: |
          cat cutover-1c55-main-sync.log
          exit 1
      - name: Validate synchronized final content
        if: steps.merge_prepare.outputs.status == '0'
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
          python -m compileall -q relaylm scripts
          python scripts/relaylm_phase_i2_handoff_cutover_guard.py
          python scripts/relaylm_phase_i2_handoff_cutover_guard.py --self-test
          python scripts/relaylm_phase_i2_documentation_boundary_smoke.py
          python scripts/relaylm_e1_evaluation_consolidation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          python scripts/relaylm_docs_semantic_audit.py
          python scripts/relaylm_docs_semantic_audit.py --self-test
          python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check
          test ! -e scripts/_cutover_1c55_builder.py
          test ! -e .github/workflows/documentation-cutover-1c55-bootstrap.yml
          grep -q 'SM-1 Subjective MEM Create Runtime' docs/architecture/README.md
          ! grep -q 'phase_i2_real_soul_lab_observation.md' docs/architecture/README.md
      - name: Commit and publish synchronized non-workflow tree
        if: steps.merge_prepare.outputs.status == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: synchronize cutover 1C-55 with SM-1 main"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - name: Upload validated final workflow
        if: steps.merge_prepare.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: cutover-1c55-final-workflow-after-main-sync
          path: /tmp/documentation-current-boundary-smoke.final.yml
          if-no-files-found: error
