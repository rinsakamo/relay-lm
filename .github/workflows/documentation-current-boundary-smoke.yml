name: Documentation Cutover 1C-54 Bookkeeping Bootstrap

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - ".github/workflows/documentation-current-boundary-smoke.yml"
      - ".github/workflows/documentation-cutover-1c54-bookkeeping.yml"
      - "docs/evidence/migrations/cutover-1c54-i4c2.md"
      - "docs/evidence/migrations/documentation-hard-cutover-receipt.md"

permissions:
  contents: write

concurrency:
  group: documentation-cutover-1c54-bookkeeping-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c54-bookkeeping'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract and run exact bookkeeping patch
        env:
          BOOKKEEPING_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/documentation-cutover-1c54-bookkeeping.yml').read_text(encoding='utf-8').splitlines()
          marker = "          python - <<'PY'"
          start = source.index(marker) + 1
          end = source.index('          PY', start)
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          Path('/tmp/apply_cutover_1c54_bookkeeping.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/apply_cutover_1c54_bookkeeping.py
      - name: Restore final workflow tree before validation
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/documentation-current-boundary-smoke.yml
          rm .github/workflows/documentation-cutover-1c54-bookkeeping.yml
      - name: Validate bookkeeping serially
        run: |
          set -euo pipefail
          python -m pip install -e ".[test]"
          python -m compileall -q scripts
          python scripts/relaylm_i4c2_handoff_cutover_guard.py
          python scripts/relaylm_i4c2_handoff_cutover_guard.py --self-test
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check
      - name: Commit validated bookkeeping
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/migrations/cutover-1c54-i4c2.md docs/evidence/migrations/documentation-hard-cutover-receipt.md
          git commit -m "docs: finalize cutover 1C-54 bookkeeping"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
