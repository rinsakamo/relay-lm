name: Cutover 1C-56 Phase I-3 Inventory

on:
  pull_request:
    types: [ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c56-i3-inventory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Phase I-3 inventory
        run: |
          set -euo pipefail
          target='docs/architecture/phase_i3_auditable_primary_mem_correct.md'
          basename='phase_i3_auditable_primary_mem_correct.md'
          stem='phase_i3_auditable_primary_mem_correct'
          authority='phase_i3_primary_mem_correct'
          {
            echo '## HEAD'
            git rev-parse HEAD
            echo
            echo '## target metadata and content'
            sed -n '1,260p' "$target"
            echo
            echo '## target blob and sha256'
            git rev-parse "HEAD:$target"
            sha256sum "$target"
            wc -l "$target"
            echo
            echo '## target history'
            git log --follow --date=iso-strict --format='%H|%aI|%cI|%s' -- "$target"
            echo
            echo '## exact path references'
            git grep -n -F "$target" HEAD -- . || true
            echo
            echo '## basename references'
            git grep -n -F "$basename" HEAD -- . || true
            echo
            echo '## stem references'
            git grep -n -F "$stem" HEAD -- . || true
            echo
            echo '## authority references'
            git grep -n -F "$authority" HEAD -- . || true
            echo
            echo '## Phase I-3 prose references'
            git grep -n -E 'Phase I-3|Phase I3|I-3' HEAD -- README.md README_ja.md docs scripts .github/workflows relaylm tests pyproject.toml config.example.yaml || true
            echo
            echo '## related cutover files and guards'
            find docs/evidence/implementation docs/evidence/migrations scripts .github/workflows -maxdepth 2 -type f | sort | grep -E 'phase-i2|phase_i2|i4c2|cutover-1c55|handoff_cutover_guard|documentation-current-boundary' || true
            echo
            echo '## current open branch hints'
            git branch -r --contains HEAD || true
          } > phase-i3-inventory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase-i3-inventory
          path: phase-i3-inventory.txt
          if-no-files-found: error
