name: Cutover 1C-56 Payload Part Probe

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c56-phase-i3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Check payload part 03a
        run: echo 'c38bed1f861b822949f3b08993428706b7e5fb3d14ed2797f83467903c9fda31  scripts/_cutover_1c56_phase_i3_builder.py.b64.03a' | sha256sum -c -
      - name: Check payload part 03b
        if: always()
        run: echo '8ced35c642d77d3f3933d575ab0603b1dfd9162e9bfd0def543ad633dfa2e475  scripts/_cutover_1c56_phase_i3_builder.py.b64.03b' | sha256sum -c -
