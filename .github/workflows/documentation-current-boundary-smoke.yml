name: Documentation current boundary smoke

on:
  pull_request:
    paths:
      - "README.md"
      - "README_ja.md"
      - "config.example.yaml"
      - "relaylm/config.py"
      - "docs/README.md"
      - "docs/PROJECT_STATUS.md"
      - "docs/config_schema.md"
      - "docs/openwebui_lmstudio_mvp.md"
      - "docs/architecture/README.md"
      - "docs/architecture/pipeline_implementation_plan.md"
      - "docs/architecture/current_target_migration_guide.md"
      - "docs/architecture/relaymem_mvp_implementation_plan.md"
      - "docs/architecture/relaymem_slp_current_target.md"
      - "docs/architecture/client_instruction_authority_contract.md"
      - "docs/architecture/runtime_architecture.md"
      - "docs/architecture/runtime_operational_requirements.md"
      - "docs/architecture/open_llm_vtuber_current_target.md"
      - "docs/architecture/open_llm_vtuber_integration.md"
      - "docs/smoke/openwebui_lmstudio_manual_smoke.md"
      - "docs/smoke/client_history_exclusion_manual_smoke.md"
      - "docs/smoke/openwebui_lmstudio_troubleshooting.md"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - ".github/workflows/documentation-current-boundary-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "README_ja.md"
      - "config.example.yaml"
      - "relaylm/config.py"
      - "docs/README.md"
      - "docs/PROJECT_STATUS.md"
      - "docs/config_schema.md"
      - "docs/openwebui_lmstudio_mvp.md"
      - "docs/architecture/README.md"
      - "docs/architecture/pipeline_implementation_plan.md"
      - "docs/architecture/current_target_migration_guide.md"
      - "docs/architecture/relaymem_mvp_implementation_plan.md"
      - "docs/architecture/relaymem_slp_current_target.md"
      - "docs/architecture/client_instruction_authority_contract.md"
      - "docs/architecture/runtime_architecture.md"
      - "docs/architecture/runtime_operational_requirements.md"
      - "docs/architecture/open_llm_vtuber_current_target.md"
      - "docs/architecture/open_llm_vtuber_integration.md"
      - "docs/smoke/openwebui_lmstudio_manual_smoke.md"
      - "docs/smoke/client_history_exclusion_manual_smoke.md"
      - "docs/smoke/openwebui_lmstudio_troubleshooting.md"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - ".github/workflows/documentation-current-boundary-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile semantic documentation smoke
        run: python -m compileall -q scripts/relaylm_documentation_current_boundary_smoke.py
      - name: Validate active documentation boundaries
        run: python scripts/relaylm_documentation_current_boundary_smoke.py
