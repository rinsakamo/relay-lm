name: RelayCTX TTS adapter transport smoke

on:
  pull_request:
    paths:
      - "relaylm/**"
      - "scripts/relaylm_relayctx_tts_adapter_transport_smoke.py"
      - ".github/workflows/relayctx-tts-adapter-transport-smoke.yml"
  push:
    branches: [main]
    paths:
      - "relaylm/**"
      - "scripts/relaylm_relayctx_tts_adapter_transport_smoke.py"
      - ".github/workflows/relayctx-tts-adapter-transport-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Install package
        run: pip install -e .
      - name: Compile RelayLM
        run: python -m compileall relaylm scripts
      - name: Run TTS adapter transport smoke
        run: python scripts/relaylm_relayctx_tts_adapter_transport_smoke.py
