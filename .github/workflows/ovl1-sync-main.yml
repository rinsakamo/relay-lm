name: OVL-1 validate latest-main integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge latest main with bounded conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "relaylm-integration-validator"
          git config user.email "relaylm-integration-validator@invalid.example"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected_conflicts=$'config.example.yaml\nrelaylm/config.py'
          if [[ "$merge_rc" -ne 0 ]]; then
            if [[ "$conflicts" != "$expected_conflicts" ]]; then
              printf 'Unexpected merge conflicts:\n%s\n' "$conflicts" >&2
              exit 1
            fi
            git checkout --ours -- config.example.yaml relaylm/config.py
            git add config.example.yaml relaylm/config.py
          elif [[ -n "$conflicts" ]]; then
            printf 'Unresolved conflicts after successful merge:\n%s\n' "$conflicts" >&2
            exit 1
          fi

          git rm .github/workflows/ovl1-sync-main.yml
          git commit -m "merge: integrate latest main for OVL-1"

      - name: Install test dependencies
        run: python -m pip install -q -e .[test]

      - name: Validate ASM-1 and OVL-1 integration
        run: >-
          pytest -q
          tests/test_ctx_ovl_config.py
          tests/test_ctx_ovl_hint_boundary.py
          tests/test_ctx_ovl_runtime_contract.py
          tests/test_ctx_ovl_runtime_e2e.py
          tests/test_ctx_ovl_admission_origin_e2e.py
          tests/test_shared_assessment_runtime.py

      - name: Export validated integration metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "merge_commit=$(git rev-parse HEAD)"
            echo "merge_tree=$(git rev-parse HEAD^{tree})"
            echo "main_commit=$(git rev-parse origin/main)"
            echo "main_tree=$(git rev-parse origin/main^{tree})"
            echo "branch_parent=$(git rev-parse HEAD^1)"
            echo "main_parent=$(git rev-parse HEAD^2)"
          } > ovl1-integration-metadata.txt
          git bundle create ovl1-integrated.bundle HEAD origin/main

      - uses: actions/upload-artifact@v4
        with:
          name: ovl1-validated-main-integration
          path: |
            ovl1-integrated.bundle
            ovl1-integration-metadata.txt
          if-no-files-found: error
