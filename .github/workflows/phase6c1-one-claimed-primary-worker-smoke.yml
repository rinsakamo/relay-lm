name: Phase 6-C1 one-claimed Primary worker smoke

on:
  pull_request:
    paths:
      - "relaylm/relaymem_slp_primary_worker.py"
      - "relaylm/relaymem_primary_pipeline.py"
      - "relaylm/_relaymem_primary_pipeline_impl.py"
      - "relaylm/relaymem_slp_queue_state.py"
      - "relaylm/relaymem_slp_primary_worker_source.py"
      - "relaylm/relaymem_slp_primary_worker_outcome.py"
      - "scripts/relaylm_phase6c1_primary_worker_*.py"
      - "scripts/relaylm_relaymem_primary_pipeline_checkpoint_smoke.py"
      - "docs/architecture/phase6c1_one_claimed_primary_worker_handoff.md"
      - ".github/workflows/phase6c1-one-claimed-primary-worker-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/relaymem_slp_primary_worker.py"
      - "relaylm/relaymem_primary_pipeline.py"
      - "relaylm/_relaymem_primary_pipeline_impl.py"
      - "relaylm/relaymem_slp_queue_state.py"
      - "relaylm/relaymem_slp_primary_worker_source.py"
      - "relaylm/relaymem_slp_primary_worker_outcome.py"
      - "scripts/relaylm_phase6c1_primary_worker_*.py"
      - "scripts/relaylm_relaymem_primary_pipeline_checkpoint_smoke.py"
      - "docs/architecture/phase6c1_one_claimed_primary_worker_handoff.md"
      - ".github/workflows/phase6c1-one-claimed-primary-worker-smoke.yml"

permissions:
  contents: write

jobs:
  patch-source:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      patched: ${{ steps.patch.outputs.patched }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - id: patch
        name: Normalize exact M3e idempotent snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          changed = False
          worker = Path("relaylm/relaymem_slp_primary_worker.py")
          text = worker.read_text(encoding="utf-8")
          old = '''            page_applied=value["page_applied"],
            idempotent_noop=value["idempotent_noop"],
'''
          new = '''            page_applied=(
                value["page_applied"]
                or (
                    value["status"] == "already_applied"
                    and value["idempotent_noop"] is True
                )
            ),
            idempotent_noop=value["idempotent_noop"],
'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit("worker snapshot patch target mismatch")
              worker.write_text(text.replace(old, new), encoding="utf-8")
              changed = True

          runner = Path("scripts/relaylm_phase6c1_primary_worker_ci_runner.py")
          runner_text = runner.read_text(encoding="utf-8")
          probe_line = '    "scripts/relaylm_phase6c1_primary_worker_final_fence_probe.py",\n'
          if probe_line in runner_text:
              if runner_text.count(probe_line) != 1:
                  raise SystemExit("probe runner target mismatch")
              runner.write_text(runner_text.replace(probe_line, ""), encoding="utf-8")
              changed = True

          probe = Path("scripts/relaylm_phase6c1_primary_worker_final_fence_probe.py")
          if probe.is_file():
              probe.unlink()
              changed = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"patched={'true' if changed else 'false'}\n")
          PY
          python -m compileall -q \
            relaylm/relaymem_slp_primary_worker.py \
            scripts/relaylm_phase6c1_primary_worker_ci_runner.py
      - name: Commit normalized source
        if: steps.patch.outputs.patched == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add relaylm/relaymem_slp_primary_worker.py \
            scripts/relaylm_phase6c1_primary_worker_ci_runner.py
          git add -u scripts/relaylm_phase6c1_primary_worker_final_fence_probe.py
          git diff --cached --check
          git commit -m "fix: normalize idempotent M3e worker outcome snapshot"
          git push origin HEAD:phase6c1-one-claimed-primary-worker

  smoke:
    needs: patch-source
    if: always() && (github.event_name != 'pull_request' || needs.patch-source.outputs.patched != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile worker boundary and smokes
        run: >-
          python -m compileall -q
          relaylm/relaymem_slp_primary_worker.py
          relaylm/relaymem_primary_pipeline.py
          scripts/relaylm_phase6c1_primary_worker_test_support.py
          scripts/relaylm_phase6c1_primary_worker_ci_runner.py
          scripts/relaylm_relaymem_primary_pipeline_checkpoint_smoke.py
          scripts/relaylm_phase6c1_primary_worker_smoke.py
          scripts/relaylm_phase6c1_primary_worker_security_smoke.py
          scripts/relaylm_phase6c1_primary_worker_fault_smoke.py
      - name: Run compose checkpoint seam smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_relaymem_primary_pipeline_checkpoint_smoke.py
      - name: Run one-claimed worker smokes
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_primary_worker_ci_runner.py
      - name: Upload sanitized worker diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase6c1-primary-worker-diagnostic
          path: phase6c1-primary-worker-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Run B3 queue and C1 source smokes
        run: |
          PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6c1_primary_worker_source_smoke.py
      - name: Run outcome classifier and fault fixture smokes
        run: |
          PYTHONPATH=. python scripts/relaylm_phase6c1_primary_worker_outcome_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6c1_fault_injection_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6c1_fault_race_smoke.py
      - name: Run RelayMEM compose and persistence smokes
        run: |
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_pipeline_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_pipeline_security_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_apply_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_recovery_audit_smoke.py
      - name: Run Phase 6-C1 contract and documentation checks
        run: |
          PYTHONPATH=. python scripts/relaylm_phase6c1_worker_contract_smoke.py
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
