name: Phase 6-C1 worker snapshot patch

on:
  pull_request:
    paths:
      - ".github/workflows/phase6c1-one-claimed-primary-worker-smoke.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6c1-one-claimed-primary-worker
          fetch-depth: 1
      - name: Patch exact M3e idempotent snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("relaylm/relaymem_slp_primary_worker.py")
          text = path.read_text(encoding="utf-8")
          old = '            page_applied=value["page_applied"],\n'
          new = '''            page_applied=(
                value["page_applied"]
                or (
                    value["status"] == "already_applied"
                    and value["idempotent_noop"] is True
                )
            ),
'''
          if text.count(old) != 1:
              raise SystemExit("worker snapshot patch target mismatch")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m py_compile relaylm/relaymem_slp_primary_worker.py
          git diff --check
      - name: Commit worker snapshot patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add relaylm/relaymem_slp_primary_worker.py
          git commit -m "fix: normalize idempotent M3e worker outcome snapshot"
          git push origin HEAD:phase6c1-one-claimed-primary-worker
