name: Phase 6-C1 one-claimed Primary worker smoke

on:
  pull_request:
    paths:
      - "relaylm/relaymem_slp_primary_worker.py"
      - "relaylm/_relaymem_slp_primary_worker_*.py"
      - "relaylm/relaymem_slp_primary_worker_source_adapter.py"
      - "relaylm/relaymem_slp_primary_worker_source_registry.py"
      - "relaylm/relaymem_primary_pipeline.py"
      - "relaylm/_relaymem_primary_pipeline_impl.py"
      - "relaylm/relaymem_slp_queue_state.py"
      - "relaylm/relaymem_slp_primary_worker_source.py"
      - "relaylm/relaymem_slp_primary_worker_outcome.py"
      - "scripts/relaylm_phase6c1_primary_worker_*.py"
      - "scripts/relaylm_relaymem_primary_pipeline_checkpoint_smoke.py"
      - "docs/architecture/phase6c1_one_claimed_primary_worker_handoff.md"
      - ".github/workflows/phase6c1-one-claimed-primary-worker-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/relaymem_slp_primary_worker.py"
      - "relaylm/_relaymem_slp_primary_worker_*.py"
      - "relaylm/relaymem_slp_primary_worker_source_adapter.py"
      - "relaylm/relaymem_slp_primary_worker_source_registry.py"
      - "relaylm/relaymem_primary_pipeline.py"
      - "relaylm/_relaymem_primary_pipeline_impl.py"
      - "relaylm/relaymem_slp_queue_state.py"
      - "relaylm/relaymem_slp_primary_worker_source.py"
      - "relaylm/relaymem_slp_primary_worker_outcome.py"
      - "scripts/relaylm_phase6c1_primary_worker_*.py"
      - "scripts/relaylm_relaymem_primary_pipeline_checkpoint_smoke.py"
      - "docs/architecture/phase6c1_one_claimed_primary_worker_handoff.md"
      - ".github/workflows/phase6c1-one-claimed-primary-worker-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RelayLM runtime dependencies
        run: python -m pip install -e .
      - name: Compile worker boundary and smokes
        run: >-
          python -m compileall -q
          relaylm/relaymem_slp_primary_worker.py
          relaylm/_relaymem_slp_primary_worker_types.py
          relaylm/_relaymem_slp_primary_worker_fence.py
          relaylm/_relaymem_slp_primary_worker_outcome_adapter.py
          relaylm/_relaymem_slp_primary_worker_validate.py
          relaylm/_relaymem_slp_primary_worker_execute.py
          relaylm/_relaymem_slp_primary_worker_view.py
          relaylm/relaymem_slp_primary_worker_source_adapter.py
          relaylm/relaymem_primary_pipeline.py
          scripts/relaylm_phase6c1_primary_worker_test_support.py
          scripts/relaylm_phase6c1_primary_worker_ci_runner.py
          scripts/relaylm_relaymem_primary_pipeline_checkpoint_smoke.py
          scripts/relaylm_phase6c1_primary_worker_smoke.py
          scripts/relaylm_phase6c1_primary_worker_security_smoke.py
          scripts/relaylm_phase6c1_primary_worker_fault_smoke.py
          scripts/relaylm_phase6c1_primary_worker_review_fix_smoke.py
      - name: Run compose checkpoint seam smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_relaymem_primary_pipeline_checkpoint_smoke.py
      - name: Run one-claimed worker smokes
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_primary_worker_ci_runner.py
      - name: Upload sanitized worker diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase6c1-primary-worker-diagnostic
          path: |
            phase6c1-primary-worker-diagnostic.txt
            phase6c1-primary-worker-safe-status.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Run I1-B source and B3 regressions
        run: |
          PYTHONPATH=. python scripts/relaylm_phase6_runtime_enqueue_source_capture_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6c1_primary_worker_source_smoke.py
      - name: Run classifier and fault fixture smokes
        run: |
          PYTHONPATH=. python scripts/relaylm_phase6c1_primary_worker_outcome_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6c1_fault_injection_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6c1_fault_race_smoke.py
      - name: Run RelayMEM compose and persistence smokes
        run: |
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_pipeline_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_pipeline_security_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_apply_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_recovery_audit_smoke.py
      - name: Run Phase 6-C1 contract and docs checks
        run: |
          PYTHONPATH=. python scripts/relaylm_phase6c1_worker_contract_smoke.py
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
