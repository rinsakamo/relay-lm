name: Retire temporary O1C docs reconciliation

on:
  push:
    branches:
      - phase-o1c-eligible-b2-queue-lane
    paths:
      - ".github/workflows/o1c-docs-reconcile-temp.yml"

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-o1c-eligible-b2-queue-lane
      - name: Remove temporary workflow from the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/o1c-docs-reconcile-temp.yml
          git commit -m "chore: remove temporary O1C docs workflow"
          git push origin HEAD:phase-o1c-eligible-b2-queue-lane
