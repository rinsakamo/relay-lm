name: Phase 5-D1 targeted patch

on:
  push:
    branches:
      - phase5d1-cjk-token-estimation
    paths:
      - .github/workflows/phase5d1-targeted-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5d1-cjk-token-estimation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply targeted estimator patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("relaylm/relaymem_runtime_ctx.py")
          text = path.read_text(encoding="utf-8")
          old_call = '"estimated_tokens": _estimate_tokens(inserted_content),'
          new_call = (
              '"estimated_tokens": estimate_text_tokens(\n'
              '                inserted_content,\n'
              '                chars_per_token=max(1, int(chars_per_token)),\n'
              '            ).estimated_tokens,'
          )
          if text.count(old_call) != 2:
              raise SystemExit(
                  f"expected 2 legacy estimate calls, found {text.count(old_call)}"
              )
          text = text.replace(old_call, new_call)
          old_helper = (
              '\n\ndef _estimate_tokens(text: str) -> int:\n'
              '    return max(1, len(text) // 4) if text else 0\n'
          )
          if old_helper not in text:
              raise SystemExit("legacy estimate helper not found")
          text = text.replace(old_helper, "")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit targeted patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add relaylm/relaymem_runtime_ctx.py
          git commit -m "fix: align RelayMEM injection token estimates"
          git push origin HEAD:phase5d1-cjk-token-estimation
