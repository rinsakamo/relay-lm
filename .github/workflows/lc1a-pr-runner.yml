name: LC1A PR helper repair runner

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/lc1a-subjective-mem-correct'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Execute normalized helper repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/lc1a-compile-diagnostic.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in source[start:].splitlines()
          ) + '\n'
          script = script.replace(
              "git config user.name 'github-actions[bot]'",
              "rm -f .github/workflows/lc1a-pr-runner.yml .github/lc1a-pr-runner-trigger\n"
              "git config user.name 'github-actions[bot]'",
          )
          Path('/tmp/lc1a-helper-repair.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/lc1a-helper-repair.sh
