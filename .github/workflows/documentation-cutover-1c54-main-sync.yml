name: Documentation Cutover 1C-54 Main Sync

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - ".github/workflows/documentation-cutover-1c54-main-sync.yml"

permissions:
  contents: write

concurrency:
  group: documentation-cutover-1c54-main-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c54-i4c2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge current main with one explicit conflict resolution
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "current main is already contained in the branch"
            exit 0
          fi
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
            if [ "${#unresolved[@]}" -ne 1 ] || [ "${unresolved[0]}" != "docs/architecture/README.md" ]; then
              printf 'unexpected unresolved paths:\n%s\n' "${unresolved[*]}" >&2
              exit 1
            fi
            git checkout --theirs docs/architecture/README.md
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/architecture/README.md")
          text = path.read_text(encoding="utf-8")
          retired = "- [Phase I-4C2 Primary Forget Recovery and Finalization](phase_i4c2_primary_forget_recovery_finalization.md)\n"
          if text.count(retired) != 2:
              raise SystemExit(f"expected two retired I-4C2 index entries, found {text.count(retired)}")
          text = text.replace(retired, "")
          asm = "- [ASM-1 Shared Assessment Runtime Foundation](asm1_shared_assessment_runtime_foundation.md) records the default-off EV-1-to-Shared-Assessment implementation boundary and its explicit stop before Subjective MEM.\n"
          if text.count(asm) != 1:
              raise SystemExit(f"expected one ASM-1 index entry, found {text.count(asm)}")
          path.write_text(text, encoding="utf-8")
          PY
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "merge: sync cutover 1C-54 with current main"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
