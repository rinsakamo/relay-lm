name: Scripts inventory artifact

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/lc1a-subjective-mem-correct'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply repair and capture focused failure
        shell: bash
        run: |
          set +e
          mkdir -p generated
          {
            echo '=== repair ==='
            python .github/lc1a_intent_reason_repair.py
            echo '=== compile ==='
            python -m compileall -f -q relaylm scripts tests
            echo '=== install ==='
            python -m pip install -q -e '.[test]'
            echo '=== focused pytest ==='
            PYTHONPATH=tests:. python -m pytest -q --maxfail=1 \
              tests/test_subjective_mem_runtime.py \
              tests/test_subjective_mem_commit_runtime.py \
              tests/test_subjective_mem_lifecycle_runtime.py \
              tests/test_ctx_ovl_config.py \
              tests/test_evidence_config_routing.py \
              tests/test_shared_assessment_runtime.py
          } > generated/lc1a-focused-failure.log 2>&1
          echo "$?" > generated/lc1a-focused-status.txt
          cat generated/lc1a-focused-failure.log
          exit 0
      - name: Upload focused diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: lc1a-focused-failure
          path: |
            generated/lc1a-focused-failure.log
            generated/lc1a-focused-status.txt
          if-no-files-found: error
          retention-days: 1
