name: Scripts inventory artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "docs/**"
      - ".github/workflows/scripts-inventory.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate inventory
        run: python scripts/relaylm_generate_scripts_inventory.py --output generated/scripts_inventory.md
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: scripts-inventory
          path: generated/scripts_inventory.md
          if-no-files-found: error
          retention-days: 7
      - name: Upload LC-1A runtime source for repair
        uses: actions/upload-artifact@v4
        with:
          name: lc1a-runtime-source
          path: relaylm/subjective_mem_lifecycle_runtime.py
          if-no-files-found: error
          retention-days: 1
