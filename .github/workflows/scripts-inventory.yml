name: Scripts inventory artifact

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/lc1a-subjective-mem-correct'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply verified repair and validate
        id: validate
        shell: bash
        run: |
          set +e
          mkdir -p generated
          {
            echo '=== repair ==='
            python .github/lc1a_repair_verified.py
            echo '=== compile ==='
            python -m compileall -f -q relaylm scripts tests
            echo '=== install ==='
            python -m pip install -q -e '.[test]'
            echo '=== focused pytest ==='
            PYTHONPATH=tests:. python -m pytest -q \
              tests/test_subjective_mem_runtime.py \
              tests/test_subjective_mem_commit_runtime.py \
              tests/test_subjective_mem_lifecycle_runtime.py \
              tests/test_ctx_ovl_config.py \
              tests/test_evidence_config_routing.py \
              tests/test_shared_assessment_runtime.py
            echo '=== LC-1A smoke ==='
            PYTHONPATH=. python scripts/relaylm_lc1a_subjective_mem_correct_smoke.py
            echo '=== diff check ==='
            git diff --check
          } > generated/lc1a-repair-diagnostic.log 2>&1
          status=$?
          cat generated/lc1a-repair-diagnostic.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload repair diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lc1a-repair-diagnostic
          path: generated/lc1a-repair-diagnostic.log
          if-no-files-found: error
          retention-days: 1
      - name: Commit repaired source and restore workflow
        if: steps.validate.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated
          git show origin/main:.github/workflows/scripts-inventory.yml > .github/workflows/scripts-inventory.yml
          rm -f .github/lc1a_repair_verified.py .github/lc1a-fix-preimage-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: normalize LC-1A runtime helper indentation'
          git push origin HEAD:agent/lc1a-subjective-mem-correct
      - name: Fail when validation failed
        if: steps.validate.outputs.status != '0'
        run: exit 1
