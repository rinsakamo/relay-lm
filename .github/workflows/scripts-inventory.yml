name: Scripts inventory artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "docs/**"
      - ".github/workflows/scripts-inventory.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate inventory
        run: python scripts/relaylm_generate_scripts_inventory.py --output generated/scripts_inventory.md
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: scripts-inventory
          path: generated/scripts_inventory.md
          if-no-files-found: error
          retention-days: 7
      - name: Install package with test dependencies
        run: python -m pip install -q -e '.[test]'
      - name: Capture remaining unit failure
        shell: bash
        run: |
          set +e
          PYTHONPATH=tests:. python -m pytest -q --maxfail=1 > generated/lc1a-unit-failure-v2.log 2>&1
          status=$?
          cat generated/lc1a-unit-failure-v2.log
          echo "$status" > generated/lc1a-unit-status-v2.txt
          exit 0
      - name: Upload remaining unit diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: lc1a-unit-failure-v2
          path: |
            generated/lc1a-unit-failure-v2.log
            generated/lc1a-unit-status-v2.txt
          if-no-files-found: error
          retention-days: 1
