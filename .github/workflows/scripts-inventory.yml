name: Scripts inventory artifact

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/lc1a-subjective-mem-correct'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Diagnose repair validation
        shell: bash
        run: |
          set +e
          mkdir -p generated
          : > generated/lc1a-post-test-diagnostic.log
          run_step() {
            label="$1"
            shift
            echo "=== $label ===" >> generated/lc1a-post-test-diagnostic.log
            "$@" >> generated/lc1a-post-test-diagnostic.log 2>&1
            code=$?
            echo "exit=$code" >> generated/lc1a-post-test-diagnostic.log
            return 0
          }
          run_step repair python .github/lc1a_intent_reason_repair.py
          run_step compile python -m compileall -f -q relaylm scripts tests
          run_step install python -m pip install -q -e '.[test]'
          echo '=== focused pytest ===' >> generated/lc1a-post-test-diagnostic.log
          PYTHONPATH=tests:. python -m pytest -q \
            tests/test_subjective_mem_runtime.py \
            tests/test_subjective_mem_commit_runtime.py \
            tests/test_subjective_mem_lifecycle_runtime.py \
            tests/test_ctx_ovl_config.py \
            tests/test_evidence_config_routing.py \
            tests/test_shared_assessment_runtime.py \
            >> generated/lc1a-post-test-diagnostic.log 2>&1
          echo "exit=$?" >> generated/lc1a-post-test-diagnostic.log
          echo '=== LC-1A smoke ===' >> generated/lc1a-post-test-diagnostic.log
          PYTHONPATH=. python scripts/relaylm_lc1a_subjective_mem_correct_smoke.py \
            >> generated/lc1a-post-test-diagnostic.log 2>&1
          echo "exit=$?" >> generated/lc1a-post-test-diagnostic.log
          echo '=== diff check ===' >> generated/lc1a-post-test-diagnostic.log
          git diff --check >> generated/lc1a-post-test-diagnostic.log 2>&1
          echo "exit=$?" >> generated/lc1a-post-test-diagnostic.log
          cat generated/lc1a-post-test-diagnostic.log
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: lc1a-post-test-diagnostic
          path: generated/lc1a-post-test-diagnostic.log
          if-no-files-found: error
          retention-days: 1
