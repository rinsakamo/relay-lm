name: Scripts inventory artifact

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'agent/lc1a-subjective-mem-correct'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply and validate LC-1A final repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/lc1a_intent_reason_repair.py
          python -m compileall -f -q relaylm scripts tests
          python -m pip install -q -e '.[test]'
          PYTHONPATH=tests:. python -m pytest -q \
            tests/test_subjective_mem_runtime.py \
            tests/test_subjective_mem_commit_runtime.py \
            tests/test_subjective_mem_lifecycle_runtime.py \
            tests/test_ctx_ovl_config.py \
            tests/test_evidence_config_routing.py \
            tests/test_shared_assessment_runtime.py
          PYTHONPATH=. python scripts/relaylm_lc1a_subjective_mem_correct_smoke.py
          PYTHONPATH=. python scripts/relaylm_subjective_mem_v1_validate.py
          PYTHONPATH=. python scripts/relaylm_subjective_mem_v1_equivalence.py
          git diff --check
      - name: Commit repaired source and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/scripts-inventory.yml > .github/workflows/scripts-inventory.yml
          rm -f .github/lc1a_intent_reason_repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: validate LC-1A selector authority schema'
          git push origin HEAD:agent/lc1a-subjective-mem-correct
