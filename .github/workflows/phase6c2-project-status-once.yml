name: Phase 6-C2 project status alignment once

on:
  push:
    branches:
      - phase6c2-one-queued-job-integration
    paths:
      - "scripts/_phase6c2_project_status_next.py"
      - ".github/workflows/phase6c2-project-status-once.yml"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6c2-one-queued-job-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Align explicit next-turn boundary
        run: python scripts/_phase6c2_project_status_next.py
      - name: Remove one-shot machinery
        run: |
          rm scripts/_phase6c2_project_status_next.py
          rm .github/workflows/phase6c2-project-status-once.yml
      - name: Commit project status alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md scripts/_phase6c2_project_status_next.py .github/workflows/phase6c2-project-status-once.yml
          git commit -m "docs: mark next-turn recall as the post-C2 boundary"
          git push origin HEAD:phase6c2-one-queued-job-integration
