name: MVP eval runner

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/relaylm_mvp_eval_runner*.py"
      - "docs/mvp/wave8/mvp_eval_runner_completion_report.md"
      - ".github/workflows/mvp-eval-runner.yml"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - "scripts/relaylm_mvp_eval_runner*.py"
      - "docs/mvp/wave8/mvp_eval_runner_completion_report.md"
      - ".github/workflows/mvp-eval-runner.yml"
      - "pyproject.toml"

jobs:
  mvp-eval-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile focused files
        run: python -m compileall relaylm scripts
      - name: Runner aggregation smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_mvp_eval_runner_smoke.py
      - name: Runner security smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_mvp_eval_runner_security_smoke.py
      - name: Static runner summary
        run: PYTHONPATH=.:scripts python scripts/relaylm_mvp_eval_runner.py --mode static --json-out runtime/eval/mvp_eval_static_latest.json
      - name: Completion report smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/mvp/wave8/mvp_eval_runner_completion_report.md
      - name: Docs link check
        run: PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
