name: Docs cutover 1C-17 applicator

on:
  pull_request:
    paths:
      - ".github/scripts/docs_cutover_1c17.py"
      - ".github/workflows/docs-cutover-1c17-applicator.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Apply cutover
        run: python .github/scripts/docs_cutover_1c17.py
      - name: Validate exact source preservation
        run: |
          test "$(git hash-object docs/evidence/implementation/e1r4_completion_report-source.txt)" = "ea940e524c7c99173108c8088a3435485bd3736a"
          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path
          snapshot = Path('docs/evidence/implementation/e1r4_completion_report-source.txt')
          canonical = Path('docs/evidence/implementation/e1r4_completion_report.md').read_text(encoding='utf-8')
          digest = hashlib.sha256(snapshot.read_bytes()).hexdigest()
          match = re.search(r'^relaylm_source_content_sha256: ([0-9a-f]{64})$', canonical, re.MULTILINE)
          assert match and match.group(1) == digest
          PY
      - name: Validate E1-R4 and completion evidence
        run: |
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_e1r4_grounded_recall_response_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_e1r4_unsupported_detail_suppression_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_e1r4_grounded_recall_security_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_e1_evaluation_consolidation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/e1r4_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
      - name: Validate documentation
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check
      - name: Commit cutover result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: move E1-R4 report in cutover 1C-17"
          git push origin HEAD:${{ github.head_ref }}
