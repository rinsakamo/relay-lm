name: I-4C2 one-shot documentation reconciliation

on:
  push:
    branches:
      - phase-i4c2-primary-forget-recovery-finalization
    paths:
      - ".github/workflows/i4c2-doc-sync-once.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i4c2-primary-forget-recovery-finalization
          fetch-depth: 0
      - name: Reconcile current documentation and smoke anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Project status.
          replace_once("docs/PROJECT_STATUS.md",
              "  - docs/architecture/phase_i4c1_primary_forget_hidden_successor.md\n  - docs/architecture/o1a_two_lane_scheduler_contract.md",
              "  - docs/architecture/phase_i4c1_primary_forget_hidden_successor.md\n  - docs/architecture/phase_i4c2_primary_forget_recovery_finalization.md\n  - docs/architecture/o1a_two_lane_scheduler_contract.md")
          replace_once("docs/PROJECT_STATUS.md",
              "Phase I-4C1 hidden-successor commit: complete\nPhase I-4C2 through I-4F recovery, exclusion, UI, and validation: unimplemented",
              "Phase I-4C1 hidden-successor commit: complete\nPhase I-4C2 prepared recovery / operation-scoped M3f-M3g / tombstone finalization: complete\nPhase I-4D through I-4F exclusion, UI, and validation: unimplemented")
          replace_once("docs/PROJECT_STATUS.md",
              "- I-4C1 immutable Forget prepared evidence and deterministic hidden-successor M3e commit.",
              "- I-4C1 immutable Forget prepared evidence and deterministic hidden-successor M3e commit;\n- I-4C2 exact prepared resume, operation-scoped M3f/M3g convergence, tombstone finalization, and exact replay.")
          replace_once("docs/PROJECT_STATUS.md",
              "Phase I-4C1 establishes durable lifecycle commit ownership only. Forget is not product-complete until:\n\n```text\nI-4C2 prepared resume / exact replay / forward recovery / tombstone\n  -> I-4D M3f/M3g convergence and M2/RelayCTX exclusion\n  -> I-4E loopback API and SOUL Lab UI\n  -> I-4F crash/race/security/fresh-conversation validation\n```",
              "Phase I-4C2 completes bounded one-operation recovery/finalization while preserving I-4D ownership of ordinary retrieval behavior. Forget is not product-complete until:\n\n```text\nI-4D M2/RelayCTX lifecycle and prior-revision exclusion\n  -> I-4E loopback API and SOUL Lab UI\n  -> I-4F crash/race/security/fresh-conversation validation\n```")
          replace_once("docs/PROJECT_STATUS.md",
              "I-4C2 prepared recovery / tombstone\n|| I1-GE crash validation preparation\n\nthen\n  I-4D M2 exclusion\n  O1D ordering / fairness / backoff\n  O1E stale recovery / shutdown",
              "I-4D M2/RelayCTX exclusion\n|| I1-GE crash validation preparation\n|| O1D ordering / fairness / backoff\n|| O1E stale recovery / shutdown")
          replace_once("docs/PROJECT_STATUS.md",
              "I-4C1 adds no accepted browser route and does not change ordinary M2 retrieval behavior.",
              "I-4C2 adds no accepted browser route and deliberately leaves ordinary M2/RelayCTX lifecycle filtering to I-4D.")
          replace_once("docs/PROJECT_STATUS.md", "- I-4C2 through I-4F;", "- I-4D through I-4F;")

