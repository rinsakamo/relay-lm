              "I1-GC, I1-GD, I-4C1, O1B, and O1C.",
              "I1-GC, I1-GD, I-4C1, I-4C2, O1B, and O1C.")
          replace_once("docs/architecture/post_i3_evaluation_work_roadmap.md",
              "I-4C2\n|| UI-B1A projection design\n|| I1-GE crash validation preparation",
              "I-4D design and integration preparation\n|| UI-B1A projection design\n|| I1-GE crash validation preparation")

          # RelayMEM / RelaySLP current-target boundary.
          replace_once("docs/architecture/relaymem_slp_current_target.md",
              "  - phase_i4c1_primary_forget_hidden_successor.md\n  - relaymem_mvp_implementation_plan.md",
              "  - phase_i4c1_primary_forget_hidden_successor.md\n  - phase_i4c2_primary_forget_recovery_finalization.md\n  - relaymem_mvp_implementation_plan.md")
          replace_once("docs/architecture/relaymem_slp_current_target.md",
              "canonical read-only Primary current-state resolution, and I-4C1 hidden-successor lifecycle commit ownership.",
