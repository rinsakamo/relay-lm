name: KNOWLEDGE v0 patch bootstrap

on:
  push:
    branches:
      - work/2003-knowledge-v0
    paths:
      - .github/workflows/_knowledge-v0-bootstrap.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out transaction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/2003-knowledge-v0
          fetch-depth: 0

      - name: Verify bootstrap event head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Apply exact bounded production and authority patches
        run: |
          python tools/_knowledge_v0_patch.py
          python tools/_knowledge_v0_followup_patch.py
          python tools/_knowledge_v0_authority_fix.py

      - name: Remove bootstrap-only files from product diff
        run: |
          rm tools/_knowledge_v0_patch.py
          rm tools/_knowledge_v0_followup_patch.py
          rm tools/_knowledge_v0_authority_fix.py
          rm .github/workflows/_knowledge-v0-bootstrap.yml

      - name: Install test environment
        run: python -m pip install -e ".[test]"

      - name: Advance exact Core semantic freeze for this semantic transaction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.repository_authority import load_declarations, qualification_fingerprint

          root = Path.cwd()
          path = root / "evaluation/actual_model/qualifications/core-semantic-v1.json"
          spec = json.loads(path.read_text(encoding="utf-8"))
          fingerprint = qualification_fingerprint(
              root,
              load_declarations(root),
              roots=tuple(spec["roots"]),
          )
          spec["expected_fingerprint"] = fingerprint
          path.write_text(json.dumps(spec, indent=2) + "\n", encoding="utf-8")
          print(f"advanced core-semantic-v1 to {fingerprint}")
          PY

      - name: Run full deterministic suite
        run: python -m pytest -q

      - name: Commit verified product diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "feat: implement read-only Cognitive Package KNOWLEDGE v0"
          git push origin HEAD:work/2003-knowledge-v0
