name: Phase 6 runtime enqueue source capture smoke

on:
  pull_request:
    paths:
      - "relaylm/app.py"
      - "relaylm/config.py"
      - "relaylm/routing.py"
      - "relaylm/relaymem_slp_finalized_turn_source.py"
      - "relaylm/relaymem_slp_runtime_finalization.py"
      - "relaylm/relaymem_slp_runtime_enqueue.py"
      - "relaylm/relaymem_slp_primary_worker_source_registry.py"
      - "config.example.yaml"
      - "scripts/_relaylm_phase6_i1b_review_fix.py"
      - "scripts/relaylm_phase6_runtime_enqueue_source_capture_smoke.py"
      - "scripts/relaylm_phase6_runtime_enqueue_app_smoke.py"
      - "docs/architecture/phase6_i1b_runtime_enqueue_source_capture_handoff.md"
      - ".github/workflows/phase6-runtime-enqueue-source-capture-smoke.yml"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-i1b-runtime-enqueue-source-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded production review fixes
        run: |
          if [ -f scripts/_relaylm_phase6_i1b_review_fix.py ]; then
            python scripts/_relaylm_phase6_i1b_review_fix.py
            python -m compileall -q \
              relaylm/relaymem_slp_finalized_turn_source.py \
              relaylm/relaymem_slp_runtime_finalization.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm scripts/_relaylm_phase6_i1b_review_fix.py
            git add \
              relaylm/relaymem_slp_finalized_turn_source.py \
              relaylm/relaymem_slp_runtime_finalization.py
            git commit -m "fix: fail closed on blocked finalized-turn persistence"
            git push origin HEAD:phase6-i1b-runtime-enqueue-source-capture
          else
            echo "review fixes already applied"
          fi

  smoke:
    needs: apply-review-fixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-i1b-runtime-enqueue-source-capture
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RelayLM runtime dependencies
        run: python -m pip install -e .
      - name: Compile runtime enqueue source capture boundary
        run: >-
          python -m compileall -q
          relaylm/app.py
          relaylm/config.py
          relaylm/routing.py
          relaylm/relaymem_slp_finalized_turn_source.py
          relaylm/relaymem_slp_runtime_finalization.py
          relaylm/relaymem_slp_runtime_enqueue.py
          relaylm/relaymem_slp_primary_worker_source_registry.py
          scripts/relaylm_phase6_runtime_enqueue_source_capture_smoke.py
          scripts/relaylm_phase6_runtime_enqueue_app_smoke.py
      - name: Validate runtime enqueue and source capture
        run: PYTHONPATH=. python scripts/relaylm_phase6_runtime_enqueue_source_capture_smoke.py
      - name: Validate ordinary non-stream and stream runtime wiring
        run: PYTHONPATH=. python scripts/relaylm_phase6_runtime_enqueue_app_smoke.py
      - name: Revalidate exact Phase 6 boundaries
        run: |
          PYTHONPATH=. python scripts/relaylm_relaymem_slp_job_admission_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_slp_response_handoff_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6b1_dispatch_preflight_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6b2_durable_enqueue_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6b3_enqueue_lifecycle_compat_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6c1_primary_worker_source_smoke.py
      - name: Revalidate request runtime finalization
        run: |
          PYTHONPATH=. python scripts/relaylm_relayctx_unpack_runtime_app_smoke.py
          PYTHONPATH=. python scripts/relaylm_openwebui_lmstudio_proxy_smoke.py
      - name: Check documentation links
        run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
