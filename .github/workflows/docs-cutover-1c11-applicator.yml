name: Docs cutover 1C-11 applicator

on:
  pull_request:
    paths:
      - ".github/scripts/docs_cutover_1c11.py"
      - ".github/workflows/docs-cutover-1c11-applicator.yml"
      - "docs/evidence/implementation/mvp_eval_runner_completion_report-source.txt"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Apply cutover
        run: |
          rm -f .github/cutover-1c11-error.md .github/cutover-1c11-focused-error.md
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/docs_cutover_1c11.py')
          body = path.read_text(encoding='utf-8')
          replacements = (
              (
                  'if path not in {SNAP, RECEIPT}:',
                  'if path not in {SNAP, RECEIPT, ".github/scripts/docs_cutover_1c11.py"}:',
              ),
              (
                  'replace("scripts/relaylm_documentation_current_boundary_smoke.py", OLD, NEW, 1)',
                  'replace("scripts/relaylm_documentation_current_boundary_smoke.py", OLD, NEW, 2)',
              ),
              (
                  'repository_root_literal_reference_occurrences_updated_in_pr_tree: 6',
                  'repository_root_literal_reference_occurrences_updated_in_pr_tree: 7',
              ),
              (
                  'The dependency sweep identified six repository-root path occurrences across four files',
                  'The dependency sweep identified seven repository-root path occurrences across four files',
              ),
          )
          for old, new in replacements:
              assert body.count(old) == 1, old
              body = body.replace(old, new, 1)
          cleanup = '''for temporary in (
              ".github/scripts/docs_cutover_1c11.py",
              ".github/workflows/docs-cutover-1c11-applicator.yml",
          ):
              target = ROOT / temporary
              if target.exists():
                  target.unlink()

          '''
          assert body.count(cleanup) == 1
          body = body.replace(cleanup, '', 1)
          path.write_text(body, encoding='utf-8')
          PY
          set +e
          python .github/scripts/docs_cutover_1c11.py > .github/cutover-1c11-error.md 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f .github/cutover-1c11-error.md
            git commit -m "chore: capture Cutover 1C-11 diagnostic"
            git push origin HEAD:${{ github.head_ref }}
            exit "$status"
          fi
          rm -f .github/cutover-1c11-error.md
      - name: Validate exact source preservation
        run: |
          test "$(git hash-object docs/evidence/implementation/mvp_eval_runner_completion_report-source.txt)" = "3ba3a2f5e402240b8d322b0ac55d9c77dfaed237"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('docs/evidence/implementation/mvp_eval_runner_completion_report-source.txt')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '3565af79a521f80bef021a7a9a9cd31c525192b95f9dcb561a0e027c2f790635'
          PY
      - name: Compile Python
        run: python -m compileall -q relaylm scripts
      - name: Validate completion report model and canonical file
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/mvp_eval_runner_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
      - name: Validate MVP eval runner contract
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_eval_runner_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_eval_runner_security_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_eval_runner.py --mode static --list
      - name: Validate documentation
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check
      - name: Commit cutover result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Defer workflow-path update and temporary-file cleanup to the GitHub connector.
          git restore .github/scripts/docs_cutover_1c11.py .github/workflows/mvp-eval-runner.yml
          rm -f .github/cutover-1c11-error.md .github/cutover-1c11-focused-error.md
          git add -A
          git status --short
          git commit -m "docs: move MVP eval runner report in cutover 1C-11"
          git push --verbose origin HEAD:${{ github.head_ref }}
