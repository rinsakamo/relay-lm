name: LC1A review corrections

on:
  push:
    branches: [agent/lc1a-subjective-mem-correct]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed corrections
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = """"""
          exec(compile(gzip.decompress(base64.b64decode(payload)), 'lc1a_review_patch.py', 'exec'))
          PY
          python -m compileall -q relaylm scripts tests
          git diff --check
      - name: Commit reviewed corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden LC-1A authority recovery"
          git push origin HEAD:agent/lc1a-subjective-mem-correct
