name: One-time Phase 6 documentation alignment

on:
  push:
    branches:
      - docs-align-phase6-i1-current-boundary

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-align-phase6-i1-current-boundary
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Align current Phase 6 and I1 documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, body: str) -> None:
              (ROOT / path).write_text(body, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              body = read(path)
              count = body.count(old)
              if count != 1:
                  raise AssertionError(f"{path}: expected one match, found {count}: {old[:120]!r}")
              write(path, body.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              body = read(path)
              start_index = body.find(start)
              if start_index < 0:
                  raise AssertionError(f"{path}: start marker not found: {start!r}")
              end_index = body.find(end, start_index + len(start))
              if end_index < 0:
                  raise AssertionError(f"{path}: end marker not found: {end!r}")
              write(path, body[:start_index] + replacement + body[end_index:])

          # P0-1: document every current Phase 6 / RelaySLP config field without
          # inventing worker/scheduler flags that do not exist in RelayLMConfig.
          config_section = dedent('''
          ## RelayMEM / RelaySLP Phase 6 flags

          Current `RelayLMConfig` fields:

          ```yaml
          relaymem_slp_runtime_enqueue_enabled: false
          relaymem_slp_runtime_enqueue_dry_run_only: true
          relaymem_slp_runtime_enqueue_apply_enabled: false
          relaymem_slp_queue_root:
          relaymem_slp_protected_source_root:
          relaymem_slp_protected_source_max_artifact_bytes: 262144
          relaymem_slp_source_registry_max_entries: 256
          relaymem_slp_source_registry_ttl_seconds: 1800
          ```

          These fields configure the ordinary I1-B / C1-5 source-publication and B2 enqueue seam:

          - dry-run observation requires `relaymem_slp_runtime_enqueue_enabled=true`; it performs no durable source or queue mutation while `relaymem_slp_runtime_enqueue_dry_run_only=true`,
          - durable publication requires `relaymem_slp_runtime_enqueue_enabled=true`, `relaymem_slp_runtime_enqueue_dry_run_only=false`, and `relaymem_slp_runtime_enqueue_apply_enabled=true`,
          - apply also requires absolute existing `relaymem_slp_queue_root` and runtime-private `relaymem_slp_protected_source_root` directories,
          - `relaymem_slp_protected_source_max_artifact_bytes` defaults to 262144 and accepts 1 through 1048576 bytes,
          - the process-local source registry is only a capacity/TTL-bounded hot cache; at capacity it rejects a new entry instead of evicting an existing one, and restart rehydration uses the durable C1-5 artifact,
          - the B2 queue record remains content-free while the protected source root contains runtime-private content-bearing artifacts.

          B3 claim/lease helpers, C1-2 worker execution, and the C2 one-job adapter are explicit caller-driven boundaries. They do not have separate top-level `RelayLMConfig` enable/apply flags, do not scan the queue, and do not start a scheduler or daemon.

          ''')
          replace_once(
              "docs/config_schema.md",
              "## Client-message and instruction flags\n",
              config_section + "## Client-message and instruction flags\n",
          )

          # P0-2: bring the current/target matrix and migration narrative to the
          # completed C1/C2/I-1 boundary.
          replace_once(
              "docs/architecture/current_target_migration_guide.md",
              "| RelaySLP / Phase 6 | A1/A2/B1 helpers and B2 atomic durable enqueue | deferred worker orchestration and gated memory apply | B3 lifecycle, request-runtime enqueue wiring, worker execution |",
              "| RelaySLP / Phase 6 | A1/A2/B0-B3, ordinary I1-B source-before-queue publication, C1-0 through C1-5, C2 one-job claim/rehydrate/execute, and Phase I-1 next-turn recall with character/namespace isolation | durable deferred orchestration with automatic operational scheduling and bounded observation/correction | I1-G pre-enqueue finalizer durability plus queue scanning/scheduling/daemon lifecycle; completed C1/C2/I-1 behavior does not require remigration |",
          )
          migration_section = dedent('''
          ## RelaySLP and Primary MEM migration

          Phase 6 currently implements the bounded production path through ordinary next-turn recall:

          ```text
          ordinary finalized turn
            -> I1-B A1/A2/B1 source-before-queue publication and B2 enqueue
            -> caller-selected C2 canonical B3 claim
            -> C1-5 durable protected-source rehydration
            -> C1-2 execution of C1-1 M3a-M3h
            -> B3 retry release or terminal commit
            -> later-turn M2 retrieval
            -> RelayCTX bounded injection
          ```

          Phase I-1 verifies the later-turn retrieval path, character partition, memory namespace, canonical page/index/log state, bounded backend context, and duplicate/retry idempotency. This is current implemented behavior, not a required migration.

          Remaining migration boundaries are explicit and separate:

          - **I1-G pre-enqueue durability**: a process exit after visible response delivery but before the Starlette background finalizer publishes the protected source and B2 queue record can still lose deferred work,
          - **operational scheduling**: C2 handles one exact caller-selected queued record; no queue scanner, retry scheduler, daemon lifecycle, or worker pool selects work automatically,
          - **product observation and intervention**: real SOUL Lab observation and auditable correction are I1-E/I1-F product boundaries rather than missing C1/C2 worker wiring.

          Queue creation or helper availability alone is not evidence for these remaining boundaries, but it also must not be described as if B3, C1-2, C1-5, C2, or Phase I-1 were still absent.

          ''')
          replace_between(
              "docs/architecture/current_target_migration_guide.md",
              "## RelaySLP and Primary MEM migration\n",
              "## Safe defaults\n",
              migration_section,
          )
          replace_once(
              "docs/architecture/current_target_migration_guide.md",
              "relayctx_tts_adapter_handoff_runtime_dry_run_only=true\n",
              "relayctx_tts_adapter_handoff_runtime_dry_run_only=true\nrelaymem_slp_runtime_enqueue_enabled=false\nrelaymem_slp_runtime_enqueue_dry_run_only=true\nrelaymem_slp_runtime_enqueue_apply_enabled=false\n",
          )

          # P0-3 / P2: remove stale RelayMEM plan status and clarify the actual M4 gate.
          replace_once(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "RelayMEM's immediate goal is no longer another persistence primitive. M3a-M3h, C1-1/C1-2 execution, C1-4 fault convergence, C1-5 protected-source restart recovery, and the C2 one-job adapter now exist. The next goal is to prove later-turn recall with character/namespace isolation.",
              "RelayMEM's immediate goal is no longer another persistence primitive. M3a-M3h, C1-1/C1-2 execution, C1-4 fault convergence, C1-5 protected-source restart recovery, C2 one-job execution, and Phase I-1 later-turn recall with character/namespace isolation now exist. The next product goal is real SOUL Lab observation and auditable correction while Secondary MEM remains deferred until Integration Milestone I1 closes.",
          )
          replace_once(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "  M3i-c next-turn recall and scope isolation: next",
              "  M3i-c next-turn recall and scope isolation: complete as Phase I-1",
          )
          replace_once(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "MEM-M4 Secondary MEM consolidation: deferred until M3i-b",
              "MEM-M4 Secondary MEM consolidation: deferred until Integration Milestone I1 closes",
          )
          replace_once(
              "docs/architecture/relaymem_mvp_implementation_plan.md",
              "M4 must not precede proof that Primary MEM can be formed and recalled in the ordinary runtime.",
              "Primary MEM formation and recall are now proven, but M4 remains deferred until Integration Milestone I1 closes its real observation, auditable correction, and accepted pre-enqueue durability boundary.",
          )

          # P0-3 / P1 / P2: mark I1-D complete, create an explicit I1-G slot,
          # and strengthen the update rule.
          replace_once(
              "docs/architecture/pipeline_implementation_plan.md",
              "  character and namespace isolation: complete\n",
              "  character and namespace isolation: complete\n  I1-G pre-enqueue background-finalizer durability: unresolved\n",
          )
          replace_once(
              "docs/architecture/pipeline_implementation_plan.md",
              "The C2 adapter does not scan the queue, own a daemon lifecycle, create a worker pool, sleep until retry time, or redefine RelayMEM semantics. The remaining I1 connection is next-turn recall with correct character and namespace scope.",
              "The C2 adapter does not scan the queue, own a daemon lifecycle, create a worker pool, sleep until retry time, or redefine RelayMEM semantics. Phase I-1 has completed next-turn recall with correct character and namespace scope; I1-E real observation, I1-F auditable correction, and I1-G pre-enqueue durability remain distinct boundaries.",
          )
          i1d = dedent('''
          ### I1-D: next-turn recall validation — complete

          Phase I-1 proves that a Primary MEM formed by the ordinary runtime is selected by the existing RelayMEM retrieval path and injected by RelayCTX on a later turn.

          Completed smoke:

          1. completed a first turn with eligible governed experience,
          2. published the protected source and enqueued one job,
          3. claimed and executed it through the one-job adapter,
          4. verified durable page/index/log state and B3 outcome,
          5. submitted a second turn whose answer requires that memory,
          6. verified correct character and namespace scope,
          7. verified backend-bound context contains only bounded selected memory,
          8. verified no cross-character or cross-namespace leakage,
          9. verified duplicate dispatch and worker retry preserve both idempotency domains.

          The implementation reuses existing M2 discovery and RelayCTX injection rather than adding a parallel retriever.

          ''')
          replace_between(
              "docs/architecture/pipeline_implementation_plan.md",
              "### I1-D: next-turn recall validation\n",
              "### I1-E: SOUL Lab real observation bridge\n",
              i1d,
          )
          i1g = dedent('''
          ### I1-G: pre-enqueue background-finalizer durability

          Status: unresolved required I1 correctness boundary.

          I1-B currently schedules source publication and B2 enqueue in a Starlette background finalizer after visible response delivery. C1-5 is restart-complete only after the protected source has been durably published and the queue record exists. A process exit in the earlier response-to-publication window can still lose that turn's deferred work.

          The accepted contract must define the authority and recovery behavior for that window without moving M3a-M3h inline or making visible response success depend on memory persistence.

          Required smoke must cover at least:

          1. termination after visible response completion but before protected-source publication,
          2. termination after protected-source publication but before B2 queue publication,
          3. restart discovery or explicit accepted-loss classification without duplicate dispatch,
          4. preservation of response independence, content-free queue records, and protected-source confidentiality,
          5. idempotent convergence when the finalizer or recovery path is replayed.

          Queue scanning, retry scheduling, and daemon lifecycle remain separate operational work unless the selected I1-G contract explicitly requires a minimal recovery enumerator.

          ''')
          replace_once(
              "docs/architecture/pipeline_implementation_plan.md",
              "## I1 completion criteria\n",
              i1g + "## I1 completion criteria\n",
          )
          replace_once(
              "docs/architecture/pipeline_implementation_plan.md",
              "- I1-B remains response-background-task based; the pre-enqueue process-exit window is not restart-complete.",
              "- I1-G remains unresolved: I1-B is response-background-task based and the pre-enqueue process-exit window is not restart-complete.",
          )
          replace_once(
              "docs/architecture/pipeline_implementation_plan.md",
              "Update this plan whenever a phase lands, I1 sequencing changes, a target-only schema gains a real producer/consumer path, or a helper/mock boundary becomes ordinary runtime behavior. The same PR must review `docs/PROJECT_STATUS.md`, `docs/README.md`, the architecture index, affected current/target documents, and status-checking smoke scripts.",
              "Update this plan whenever a phase lands, I1 sequencing changes, a target-only schema gains a real producer/consumer path, or a helper/mock boundary becomes ordinary runtime behavior. The same PR must review `docs/PROJECT_STATUS.md`, `docs/README.md`, the architecture index, `docs/config_schema.md`, the Boundary Matrix and affected sections of `current_target_migration_guide.md`, affected current/target documents, stale TODO/future-tense text inside related plans, and status-checking smoke scripts.",
          )

          # Make I1-G visible in the concise status without changing runtime scope.
          replace_once(
              "docs/PROJECT_STATUS.md",
              "- a process exit after visible response delivery but before the Starlette background finalizer publishes the source and queue record may still lose that turn's deferred work,\n- real SOUL Lab latest-run and memory observation remain unimplemented.",
              "- a process exit after visible response delivery but before the Starlette background finalizer publishes the source and queue record may still lose that turn's deferred work,\n- I1-G explicitly tracks the required pre-enqueue background-finalizer durability contract and smoke,\n- real SOUL Lab latest-run and memory observation remain unimplemented.",
          )
          replace_once(
              "docs/PROJECT_STATUS.md",
              "3. Treat the visible-response-to-background-finalizer crash window as a separate I1 durability boundary; C1-5, C2, and Phase I-1 do not claim to close it.",
              "3. Close I1-G, the explicit visible-response-to-background-finalizer durability boundary; C1-5, C2, and Phase I-1 do not claim to close it.",
          )
          replace_once(
              "docs/PROJECT_STATUS.md",
              "- character and namespace isolation: complete\n- SOUL Lab real observation: next",
              "- character and namespace isolation: complete\n- I1-G pre-enqueue background-finalizer durability: unresolved\n- SOUL Lab real observation: next",
          )

          # Architecture and documentation indexes must not direct readers to the
          # already-completed recall boundary.
          replace_once(
              "docs/architecture/README.md",
              "Phase 6-C2 is complete for one caller-selected canonical queued job. The next boundary is next-turn recall and character/namespace isolation. Queue scanning, daemon scheduling, and the pre-enqueue background-finalizer crash window remain unimplemented.",
              "Phase 6-C2 is complete for one caller-selected canonical queued job, and Phase I-1 completes next-turn recall with character/namespace isolation. The next product boundary is real SOUL Lab observation; I1-G pre-enqueue background-finalizer durability plus queue scanning, daemon scheduling, and automatic worker selection remain unimplemented.",
          )
          replace_once(
              "docs/architecture/README.md",
              "- [RelayMEM / RelaySLP Current / Target Boundary](relaymem_slp_current_target.md) — current enqueue/source capture, queue lifecycle, completed C1-0 through C1-5 and C2, and remaining next-turn recall integration.",
              "- [RelayMEM / RelaySLP Current / Target Boundary](relaymem_slp_current_target.md) — current enqueue/source capture, queue lifecycle, completed C1-0 through C1-5/C2/Phase I-1 recall, and remaining durability/operational boundaries.",
          )
          replace_once(
              "docs/README.md",
              "- when an implemented handoff changes milestone state, review Project Status, the implementation plan, this index, the architecture index, affected current/target boundaries, and status-checking smoke scripts together.",
              "- when an implemented handoff changes milestone state, review Project Status, the implementation plan, this index, the architecture index, `config_schema.md`, the Current/Target Boundary Matrix and affected sections, stale TODO/future-tense text in related plans, and status-checking smoke scripts together.",
          )

          # Expand CI coverage to the documents whose drift caused this audit.
          workflow_path = ".github/workflows/documentation-current-boundary-smoke.yml"
          workflow = read(workflow_path)
          workflow = workflow.replace(
              '      - "docs/PROJECT_STATUS.md"\n',
              '      - "docs/PROJECT_STATUS.md"\n      - "docs/README.md"\n      - "docs/architecture/README.md"\n      - "docs/architecture/relaymem_mvp_implementation_plan.md"\n',
          )
          if workflow.count('      - "docs/README.md"') != 2:
              raise AssertionError("documentation workflow path expansion did not affect both pull_request and push blocks")
          write(workflow_path, workflow)

          smoke = dedent('''\
          #!/usr/bin/env python3
          """Validate current Phase 6/I1 documentation and config coverage."""

          import ast
          import re
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          def read_text(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")


          def require(path: str, *anchors: str) -> None:
              body = read_text(path)
              missing = [anchor for anchor in anchors if anchor not in body]
              assert not missing, f"{path}: missing current-boundary anchors: {missing!r}"


          def forbid(path: str, *anchors: str) -> None:
              body = read_text(path)
              present = [anchor for anchor in anchors if anchor in body]
              assert not present, f"{path}: superseded boundary remains: {present!r}"


          def relaylm_config_fields() -> tuple[str, ...]:
              tree = ast.parse(read_text("relaylm/config.py"))
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and node.name == "RelayLMConfig":
                      return tuple(
                          statement.target.id
                          for statement in node.body
                          if isinstance(statement, ast.AnnAssign)
                          and isinstance(statement.target, ast.Name)
                      )
              raise AssertionError("relaylm/config.py: RelayLMConfig class not found")


          def require_config_coverage(path: str) -> None:
              body = read_text(path)
              missing = [
                  field
                  for field in relaylm_config_fields()
                  if re.search(rf"(?<![A-Za-z0-9_]){re.escape(field)}(?![A-Za-z0-9_])", body) is None
              ]
              assert not missing, f"{path}: missing RelayLMConfig fields: {missing!r}"


          def main() -> None:
              require_config_coverage("docs/config_schema.md")
              require_config_coverage("config.example.yaml")
              require(
                  "docs/config_schema.md",
                  "## RelayMEM / RelaySLP Phase 6 flags",
                  "relaymem_slp_runtime_enqueue_enabled: false",
                  "relaymem_slp_protected_source_root:",
                  "relaymem_slp_protected_source_max_artifact_bytes: 262144",
                  "at capacity it rejects a new entry instead of evicting an existing one",
                  "do not have separate top-level `RelayLMConfig` enable/apply flags",
              )

              require(
                  "docs/PROJECT_STATUS.md",
                  "C1-0 through C1-5 complete",
                  "C2 one-job claim/rehydrate/execute adapter: complete",
                  "I1 next-turn Primary MEM recall: complete",
                  "character and namespace isolation: complete",
                  "I1-G pre-enqueue background-finalizer durability: unresolved",
              )

              require(
                  "docs/architecture/pipeline_implementation_plan.md",
                  "### I1-D: next-turn recall validation — complete",
                  "### I1-G: pre-enqueue background-finalizer durability",
                  "Phase I-1 has completed next-turn recall",
                  "`docs/config_schema.md`",
                  "stale TODO/future-tense text inside related plans",
              )
              forbid(
                  "docs/architecture/pipeline_implementation_plan.md",
                  "### I1-D: next-turn recall validation\n\nProve that",
                  "The remaining I1 connection is next-turn recall",
              )

              require(
                  "docs/architecture/current_target_migration_guide.md",
                  "A1/A2/B0-B3, ordinary I1-B source-before-queue publication",
                  "Phase I-1 verifies the later-turn retrieval path",
                  "I1-G pre-enqueue durability",
                  "relaymem_slp_runtime_enqueue_apply_enabled=false",
              )
              forbid(
                  "docs/architecture/current_target_migration_guide.md",
                  "A1/A2/B1 helpers and B2 atomic durable enqueue",
                  "Phase 6 currently reaches B2 atomic durable enqueue",
              )

              require(
                  "docs/architecture/relaymem_mvp_implementation_plan.md",
                  "M3i-c next-turn recall and scope isolation: complete as Phase I-1",
                  "MEM-M4 Secondary MEM consolidation: deferred until Integration Milestone I1 closes",
              )
              forbid(
                  "docs/architecture/relaymem_mvp_implementation_plan.md",
                  "M3i-c next-turn recall and scope isolation: next",
                  "MEM-M4 Secondary MEM consolidation: deferred until M3i-b",
              )

              require(
                  "docs/architecture/README.md",
                  "Phase I-1 completes next-turn recall with character/namespace isolation",
                  "I1-G pre-enqueue background-finalizer durability",
              )
              forbid(
                  "docs/architecture/README.md",
                  "The next boundary is next-turn recall and character/namespace isolation",
              )

              require(
                  "docs/README.md",
                  "`config_schema.md`",
                  "stale TODO/future-tense text in related plans",
              )

              print("RelayLM documentation current-boundary smoke passed.")


          if __name__ == "__main__":
              main()
          ''')
          write("scripts/relaylm_documentation_current_boundary_smoke.py", smoke)
          PY

          python -m compileall -q scripts/relaylm_documentation_current_boundary_smoke.py
          python scripts/relaylm_documentation_current_boundary_smoke.py
          python scripts/relaylm_docs_link_check.py

          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/documentation-current-boundary-smoke.yml scripts/relaylm_documentation_current_boundary_smoke.py
          git commit -m "docs: align Phase 6 and I1 current boundaries"
          git push origin HEAD:docs-align-phase6-i1-current-boundary
