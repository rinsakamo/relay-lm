name: Temporary Cutover 1C-25 applicator

on:
  push:
    branches:
      - agent/docs-cutover-1c25-e1

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c25-e1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyyaml
      - name: Apply Cutover 1C-25
        run: python scripts/_tmp_apply_docs_cutover_1c25_v2.py
      - name: Validate Cutover 1C-25
        run: |
          rm -f docs/evidence/migrations/_tmp-cutover-1c25-failure.log
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_e1_evaluation_consolidation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_wave5_cross_slice_convergence_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/e1_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          test ! -e docs/mvp/wave5/e1_completion_report.md
          test -e docs/evidence/implementation/e1_completion_report.md
          test -e docs/evidence/implementation/e1_completion_report-source.txt
          git diff --check
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs: move E1 report in cutover 1C-25'
          git push origin HEAD:agent/docs-cutover-1c25-e1
