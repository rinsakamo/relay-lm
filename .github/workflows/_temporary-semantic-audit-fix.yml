name: Temporary semantic audit path fix

on:
  push:
    paths:
      - ".github/workflows/_temporary-semantic-audit-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.ref_name == 'agent/docs-semantic-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-semantic-validation
      - name: Restrict path validation to executable script references
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/relaylm_docs_semantic_audit.py')
          text = path.read_text(encoding='utf-8')
          old_re = 'REPOSITORY_PATH_RE = re.compile(r"(?<![A-Za-z0-9_.-])((?:scripts|apps)/[A-Za-z0-9_./-]+)")'
          new_re = 'SCRIPT_PATH_RE = re.compile(r"(?<![A-Za-z0-9_.-])(scripts/[A-Za-z0-9_./-]+\\.py)\\b")'
          old_loop = 'for candidate in sorted(set(REPOSITORY_PATH_RE.findall(text))):\n            clean = candidate.rstrip(".,:;)]}")\n            target = ROOT / clean'
          new_loop = 'for candidate in sorted(set(SCRIPT_PATH_RE.findall(text))):\n            clean = candidate.rstrip(".,:;)]}")\n            target = ROOT / clean'
          for old, new in ((old_re, new_re), (old_loop, new_loop)):
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected semantic-audit replacement count for {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/_temporary-semantic-audit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/relaylm_docs_semantic_audit.py
          git commit -m "test: scope documentation path checks to scripts"
          git push origin HEAD:agent/docs-semantic-validation
