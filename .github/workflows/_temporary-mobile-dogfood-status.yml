name: Temporary mobile dogfood status alignment

on:
  push:
    paths:
      - ".github/workflows/_temporary-mobile-dogfood-status.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.ref_name == 'agent/docs-user-ops-guidance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-user-ops-guidance
      - name: Align mobile dogfood status wording
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/PROJECT_STATUS.md'): (
                  'Single-owner mobile dogfood operation runbook added: [P0 Mobile Dogfood Entry](tools/mobile_dogfood_entry.md) documents a Cloudflare Tunnel + Cloudflare Access external-reachability procedure limiting external exposure to the chat-only UI, with `/v1`, LM Studio, SOUL Lab, Memory Inspector, and admin/debug surfaces kept unreachable from outside. This is an operations runbook only: it does not change RelayLM runtime behavior, does not add multi-user/family-tester/actor support, and does not add any Cloudflare API integration or automated configuration.',
                  'Single-owner mobile dogfood target boundary is documented in [P0 Mobile Dogfood Entry](tools/mobile_dogfood_entry.md), but external publication remains blocked until a concrete dedicated chat-only origin and negative-path acceptance evidence exist. The current Vite Character Workspace development server, RelayLM `/v1`, `/lab/api`, LM Studio, SOUL Lab management surfaces, Memory Inspector, and admin/debug routes are not supported public tunnel origins. This target runbook does not change RelayLM runtime behavior, add multi-user/family-tester/actor support, or add Cloudflare API integration.'
              ),
              Path('docs/README.md'): (
                  '- [P0 Mobile Dogfood Entry](tools/mobile_dogfood_entry.md) — single-owner Cloudflare Tunnel + Cloudflare Access runbook for daily mobile dogfooding of the chat-only UI only; no family/multi-actor support and no runtime behavior change.',
                  '- [P0 Mobile Dogfood Entry](tools/mobile_dogfood_entry.md) — target boundary for future single-owner Cloudflare access; external publication is blocked until a dedicated chat-only origin and negative-path acceptance evidence exist. Do not expose Vite, RelayLM `/v1`, `/lab/api`, LM Studio, or management/debug surfaces.'
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected wording anchor count in {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/_temporary-mobile-dogfood-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md docs/README.md
          git commit -m "docs: align mobile dogfood status boundary"
          git push origin HEAD:agent/docs-user-ops-guidance
