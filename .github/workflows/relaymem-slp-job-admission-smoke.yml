name: RelayMEM RelaySLP job admission smoke

on:
  pull_request:
    paths:
      - "relaylm/relaymem_slp_job_admission.py"
      - "scripts/relaylm_relaymem_slp_job_admission_smoke.py"
      - ".github/workflows/relaymem-slp-job-admission-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/relaymem_slp_job_admission.py"
      - "scripts/relaylm_relaymem_slp_job_admission_smoke.py"
      - ".github/workflows/relaymem-slp-job-admission-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Phase 6-A1 helper
        run: python -m compileall -q relaylm/relaymem_slp_job_admission.py scripts/relaylm_relaymem_slp_job_admission_smoke.py
      - name: Run Phase 6-A1 smoke
        run: PYTHONPATH=. python scripts/relaylm_relaymem_slp_job_admission_smoke.py
