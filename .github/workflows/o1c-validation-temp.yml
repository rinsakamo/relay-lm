name: Temporary O1C branch validation

on:
  push:
    branches:
      - phase-o1c-eligible-b2-queue-lane
    paths:
      - ".github/workflows/o1c-validation-temp.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-o1c-eligible-b2-queue-lane
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and publish bounded result
        shell: bash
        run: |
          set +e
          report="/tmp/o1c-validation-report.txt"
          log="/tmp/o1c-validation.log"
          : > "$log"
          failed=""
          run_check() {
            name="$1"
            shift
            echo "== $name ==" >> "$log"
            "$@" >> "$log" 2>&1
            code=$?
            if [ $code -ne 0 ] && [ -z "$failed" ]; then
              failed="$name:$code"
            fi
            return 0
          }

          run_check install python -m pip install -e .
          run_check compileall python -m compileall -q relaylm scripts
          run_check o1c-functional env PYTHONPATH=.:scripts python scripts/relaylm_o1c_eligible_queue_lane_smoke.py
          run_check o1c-security env PYTHONPATH=.:scripts python scripts/relaylm_o1c_eligible_queue_lane_security_smoke.py
          run_check o0-compat env PYTHONPATH=.:scripts python scripts/relaylm_o0_local_one_job_runner_ci_runner.py
          run_check o1a-contract env PYTHONPATH=. python scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py
          run_check b2-regression env PYTHONPATH=. python scripts/relaylm_phase6b2_durable_enqueue_contract_smoke.py
          run_check b3-regression env PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_smoke.py
          run_check c2-regression env PYTHONPATH=.:scripts python scripts/relaylm_phase6c2_one_queued_job_runner_ci_runner.py
          run_check c1-worker env PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_primary_worker_ci_runner.py
          run_check c1-integration env PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_worker_integration_ci_runner.py
          run_check c1-source env PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_durable_protected_source_smoke.py
          run_check docs-boundary env PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          run_check docs-links env PYTHONPATH=. python scripts/relaylm_docs_link_check.py

          if [ -z "$failed" ]; then
            status="PASS"
          else
            status="FAIL:$failed"
          fi
          {
            echo "O1C branch validation: $status"
            echo "head=$(git rev-parse HEAD)"
            echo "commands=install,compileall,o1c-functional,o1c-security,o0-compat,o1a-contract,b2-regression,b3-regression,c2-regression,c1-worker,c1-integration,c1-source,docs-boundary,docs-links"
            echo "--- bounded log tail ---"
            tail -n 120 "$log"
          } > "$report"

          cp "$report" o1c_validation_report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/o1c-validation-temp.yml
          git add o1c_validation_report.txt
          git commit -m "test: record O1C branch validation"
          git push origin HEAD:phase-o1c-eligible-b2-queue-lane

          if [ -n "$failed" ]; then
            exit 1
          fi
