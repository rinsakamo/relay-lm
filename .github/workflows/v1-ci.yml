name: v1 CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v1
  push:
    branches:
      - v1

permissions:
  contents: read

concurrency:
  group: v1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install RelayLM test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run full v1 test suite
        run: python -m pytest -q
