name: v1 CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v1
  push:
    branches:
      - v1

permissions:
  contents: read

concurrency:
  group: v1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install RelayLM test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run full v1 test suite
        run: python -m pytest -q

  minimum-supported:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install minimum supported build backend
        run: python -m pip install -c constraints/minimum.txt hatchling==1.25.0

      - name: Install minimum supported RelayLM dependencies
        run: python -m pip install --no-build-isolation -c constraints/minimum.txt -e ".[test]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run full v1 test suite at minimum support floors
        run: python -m pytest -q
