name: I1-GC merge latest main once

on:
  push:
    branches:
      - tmp-i1gc-merge-actual
    paths:
      - ".github/workflows/i1gc-merge-main-once.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/i1gc-merge-main-once.yml"

permissions:
  contents: write

jobs:
  merge-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-i1gc-merge-actual
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge latest main and resolve only expected documentation conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if (( merge_status != 0 )) && (( ${#conflicts[@]} == 0 )); then
            echo "merge failed without resolvable file conflicts"
            exit 1
          fi

          for file in "${conflicts[@]}"; do
            case "$file" in
              docs/PROJECT_STATUS.md|docs/README.md|docs/architecture/README.md|docs/architecture/i1g_pre_enqueue_durable_finalization_contract.md|docs/architecture/pipeline_implementation_plan.md|docs/architecture/post_i3_evaluation_work_roadmap.md|docs/architecture/relaymem_slp_current_target.md|docs/architecture/relaymem_mvp_implementation_plan.md|scripts/relaylm_documentation_current_boundary_smoke.py)
                git checkout --theirs -- "$file"
                git add "$file"
                ;;
              *)
                echo "unexpected merge conflict: $file"
                exit 1
                ;;
            esac
          done

          test -z "$(git diff --name-only --diff-filter=U)"
          python scripts/relaylm_i1gc_merge_main_once.py
          rm scripts/relaylm_i1gc_merge_main_once.py
          rm .github/workflows/i1gc-merge-main-once.yml
          git add -A
      - name: Install RelayLM
        run: python -m pip install -e .
      - name: Compile repository Python
        run: python -m compileall -q relaylm scripts
      - name: Validate I1-G and I1-GC
        run: |
          PYTHONPATH=. python scripts/relaylm_i1g_pre_enqueue_fault_model_smoke.py
          PYTHONPATH=. python scripts/relaylm_i1gb_durable_finalization_publication_smoke.py
          PYTHONPATH=. python scripts/relaylm_i1gb_durable_finalization_app_smoke.py
          PYTHONPATH=. python scripts/relaylm_i1gc_durable_finalization_replay_smoke.py
      - name: Validate source queue and C2 regressions
        run: |
          PYTHONPATH=. python scripts/relaylm_phase6_runtime_enqueue_source_capture_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6_runtime_enqueue_app_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_durable_protected_source_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6b2_durable_enqueue_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c2_one_queued_job_runner_ci_runner.py
      - name: Validate merged O1A and I-4C1 boundaries
        run: |
          PYTHONPATH=. python scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c1_ci_runner.py
      - name: Validate documentation
        run: |
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
      - name: Commit reconciled merge
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git commit -m "merge: reconcile latest main into I1-GC"
          git push origin HEAD:tmp-i1gc-merge-actual
