name: I4C2 finalize branch

on:
  push:
    branches:
      - phase-i4c2-primary-forget-recovery-finalization
    paths:
      - .github/workflows/i4c2-finalize-branch.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i4c2-primary-forget-recovery-finalization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply pending exact patches idempotently
        shell: bash
        run: |
          test ! -f scripts/_phase_i4c2_already_hidden_patch.py || python scripts/_phase_i4c2_already_hidden_patch.py
          test ! -f scripts/_phase_i4c2_docs_summary_patch.py || python scripts/_phase_i4c2_docs_summary_patch.py
          test ! -f scripts/_phase_i4c2_documentation_smoke_patch.py || python scripts/_phase_i4c2_documentation_smoke_patch.py
      - run: pip install -e .
      - run: python -m compileall -q relaylm scripts
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_recovery_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_fault_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_concurrency_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_security_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
      - run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
      - name: Remove temporary branch-only helpers
        shell: bash
        run: |
          rm -f i4c2-debug.log
          rm -f scripts/_phase_i4c2_already_hidden_patch.py
          rm -f scripts/_phase_i4c2_docs_summary_patch.py
          rm -f scripts/_phase_i4c2_documentation_smoke_patch.py
          rm -f .github/workflows/i4c2-already-hidden-patch.yml
          rm -f .github/workflows/i4c2-doc-smoke-patch.yml
          rm -f .github/workflows/i4c2-doc-summary-apply.yml
          rm -f .github/workflows/i4c2-finalize-branch.yml
      - name: Commit final branch state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: finalize Phase I-4C2 recovery boundary"
            git push origin HEAD:phase-i4c2-primary-forget-recovery-finalization
          fi
