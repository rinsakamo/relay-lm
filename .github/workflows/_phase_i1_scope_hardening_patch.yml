name: Phase I-1 scope hardening patch

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/_phase_i1_scope_hardening_patch.py"
      - ".github/workflows/_phase_i1_scope_hardening_patch.yml"

permissions:
  contents: write

env:
  PYTHONPATH: .:scripts

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i1-primary-mem-next-turn-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/_phase_i1_scope_hardening_patch.py
      - run: pip install -e .
      - run: python -m compileall -q relaylm scripts
      - run: python scripts/relaylm_phase_i1_two_turn_primary_recall_security_smoke.py
      - run: python scripts/relaylm_phase_i1_two_turn_primary_recall_smoke.py
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relaylm/app.py relaylm/relaymem_primary_recall.py scripts/relaylm_phase_i1_two_turn_primary_recall_security_smoke.py
          git commit -m "fix: harden I1 character store scope resolution"
          git push origin HEAD:phase-i1-primary-mem-next-turn-recall
