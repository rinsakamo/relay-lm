name: Docs cutover 1C-16 applicator

on:
  pull_request:
    paths:
      - ".github/scripts/docs_cutover_1c16.py"
      - ".github/workflows/docs-cutover-1c16-applicator.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Apply cutover
        run: python .github/scripts/docs_cutover_1c16.py
      - name: Validate exact source preservation
        run: |
          test "$(git hash-object docs/evidence/implementation/e1r3_completion_report-source.txt)" = "40ceeaa4a7eca7e90cafcfb522cc8340ab31e40a"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          source = Path('docs/evidence/implementation/e1r3_completion_report-source.txt').read_bytes()
          canonical = Path('docs/evidence/implementation/e1r3_completion_report.md').read_text(encoding='utf-8')
          digest = hashlib.sha256(source).hexdigest()
          assert f'relaylm_source_content_sha256: {digest}' in canonical
          PY
      - name: Validate E1-R3 and completion evidence
        run: |
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_e1r3_provenance_formation_summary_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_e1r3_provenance_formation_security_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6_runtime_enqueue_source_capture_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_e1_evaluation_consolidation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/e1r3_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
      - name: Validate documentation
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check
      - name: Commit cutover result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: move E1-R3 report in cutover 1C-16"
          git push origin HEAD:${{ github.head_ref }}
