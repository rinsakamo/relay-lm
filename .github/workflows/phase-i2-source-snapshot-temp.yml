name: Phase I-2 temporary local fixes

on:
  pull_request:
    paths:
      - ".github/workflows/phase-i2-source-snapshot-temp.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply locally verified replacements
        run: python scripts/phase_i2_apply_local_fixes_temp.py
      - name: Verify syntax
        run: python -m compileall -q relaylm scripts
      - name: Commit verified replacements
        run: |
          if git diff --quiet; then
            echo "No replacement required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relaylm/soul_lab_observation_projection.py \
            scripts/relaylm_phase_i2_lab_observation_security_smoke.py \
            apps/soul-lab/src/app/RootApp.tsx
          git commit -m "fix: align Phase I2 observation validation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
