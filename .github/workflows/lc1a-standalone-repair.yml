name: LC1A standalone source repair

on:
  push:
    branches: [agent/lc1a-subjective-mem-correct]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lc1a-subjective-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply standalone repair and validate
        shell: bash
        run: |
          set +e
          {
            python .github/lc1a_final_repair.py
            python - <<'PY'
          import py_compile
          import subprocess
          failures = []
          for name in subprocess.check_output(['git', 'ls-files', '*.py'], text=True).splitlines():
              try:
                  py_compile.compile(name, doraise=True)
              except Exception as exc:
                  failures.append((name, repr(exc)))
          if failures:
              for name, error in failures:
                  print(f'PY_COMPILE_FAILURE {name}: {error}')
              raise SystemExit(1)
          print('all tracked Python compiled')
          PY
            python -m pip install -q -e '.[test]'
            PYTHONPATH=tests:. python -m pytest -q \
              tests/test_subjective_mem_runtime.py \
              tests/test_subjective_mem_commit_runtime.py \
              tests/test_subjective_mem_lifecycle_runtime.py \
              tests/test_ctx_ovl_config.py \
              tests/test_evidence_config_routing.py \
              tests/test_shared_assessment_runtime.py
            git diff --check
          } > /tmp/lc1a-standalone-repair.log 2>&1
          status=$?
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            tail -300 /tmp/lc1a-standalone-repair.log > .github/lc1a-standalone-repair-error.txt
            git add .github/lc1a-standalone-repair-error.txt
            git commit -m 'chore: record LC-1A standalone repair failure'
            git push origin HEAD:agent/lc1a-subjective-mem-correct
            exit 1
          fi
          rm -f .github/lc1a_final_repair.py \
                .github/workflows/lc1a-standalone-repair.yml \
                .github/lc1a-standalone-repair-trigger \
                .github/lc1a-standalone-repair-error.txt
          git add -A
          git commit -m 'fix: normalize LC-1A authority source blocks'
          git push origin HEAD:agent/lc1a-subjective-mem-correct
