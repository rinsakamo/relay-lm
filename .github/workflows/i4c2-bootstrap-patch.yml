name: I4C2 bootstrap patch

on:
  push:
    branches:
      - phase-i4c2-primary-forget-recovery-finalization
    paths:
      - .github/workflows/i4c2-bootstrap-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i4c2-primary-forget-recovery-finalization
          fetch-depth: 0
      - name: Apply exact scanner integration patch
        run: python scripts/_phase_i4c2_repository_patch.py
      - name: Compile production modules
        run: python -m compileall relaylm
      - name: Commit patch and remove bootstrap files
        run: |
          rm scripts/_phase_i4c2_repository_patch.py
          rm .github/workflows/i4c2-bootstrap-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Forget tombstones with shared scanners"
          git push origin HEAD:phase-i4c2-primary-forget-recovery-finalization
