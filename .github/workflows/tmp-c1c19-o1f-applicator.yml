name: Temporary Cutover 1C-19 Applicator

on:
  push:
    branches:
      - agent/docs-cutover-1c19-o1f
    paths:
      - .github/workflows/tmp-c1c19-o1f-applicator.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c19-o1f
          fetch-depth: 0

      - name: Apply atomic reference and receipt updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          OLD = "docs/mvp/wave6/o1f_completion_report.md"
          NEW = "docs/evidence/implementation/o1f_completion_report.md"

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              write(path, text.replace(old, new, 1))

          replace_once(
              "docs/README.md",
              "[O1F completion report](mvp/wave6/o1f_completion_report.md)",
              "[O1F completion report](evidence/implementation/o1f_completion_report.md)",
          )
          replace_once(
              "docs/architecture/README.md",
              "[O1F completion report](../mvp/wave6/o1f_completion_report.md)",
              "[O1F completion report](../evidence/implementation/o1f_completion_report.md)",
          )

          path = "docs/mvp/README.md"
          text = read(path)
          old_link = "[O1F completion report](wave6/o1f_completion_report.md)"
          if text.count(old_link) != 1 or text.count(OLD) != 1:
              raise SystemExit(f"{path}: unexpected O1F dependency inventory")
          text = text.replace(
              old_link,
              "[O1F completion report](../evidence/implementation/o1f_completion_report.md)",
              1,
          ).replace(OLD, NEW, 1)
          write(path, text)

          path = "docs/architecture/o1f_operational_validation.md"
          text = read(path)
          if text.count(OLD) != 1:
              raise SystemExit(f"{path}: expected one repository-root path")
          old_link = "[O1F completion report](../mvp/wave6/o1f_completion_report.md)"
          if text.count(old_link) != 1:
              raise SystemExit(f"{path}: expected one relative completion-report link")
          text = text.replace(OLD, NEW, 1).replace(
              old_link,
              "[O1F completion report](../evidence/implementation/o1f_completion_report.md)",
              1,
          )
          write(path, text)

          replace_once(
              "docs/evidence/waves/wave6_cross_slice_convergence_audit.md",
              "[O1F completion report](../../mvp/wave6/o1f_completion_report.md)",
              "[O1F completion report](../implementation/o1f_completion_report.md)",
          )

          path = "docs/evidence/implementation/README.md"
          text = read(path)
          anchor = "- [E1-R5 completion report](e1r5_completion_report.md) — frozen bounded Primary recall candidate-discovery implementation evidence from PR #439; current behavior and the PR #491 fold-in remain architecture-owned.\n"
          addition = anchor + "- [O1F completion report](o1f_completion_report.md) — frozen validation-only scheduler operational-hardening evidence from PR #429; current behavior remains architecture, implementation, and focused-smoke-owned.\n"
          if text.count(anchor) != 1 or "[O1F completion report](o1f_completion_report.md)" in text:
              raise SystemExit(f"{path}: unexpected implementation-router state")
          write(path, text.replace(anchor, addition, 1))

          path = "scripts/relaylm_documentation_current_boundary_smoke.py"
          text = read(path)
          current_anchor = '    "docs/architecture/o1e_scheduler_operational_controls.md",\n    "docs/architecture/o2_supervised_scheduler_service.md",\n'
          current_replacement = '    "docs/architecture/o1e_scheduler_operational_controls.md",\n    "docs/architecture/o1f_operational_validation.md",\n    "docs/architecture/o2_supervised_scheduler_service.md",\n'
          if text.count(current_anchor) != 1:
              raise SystemExit(f"{path}: current-doc insertion anchor mismatch")
          text = text.replace(current_anchor, current_replacement, 1)

          o1e_block = '''    "docs/architecture/o1e_scheduler_operational_controls.md": (\n        "# O1E Scheduler Operational Controls",\n        "Status: implemented in this slice.",\n        "O1F is complete as validation-only operational hardening over this caller-invoked boundary.",\n        "O2 and O3 are implemented in dedicated handoffs as opt-in layers above O1E",\n    ),\n    "docs/architecture/o2_supervised_scheduler_service.md": (\n'''
          o1f_block = '''    "docs/architecture/o1e_scheduler_operational_controls.md": (\n        "# O1E Scheduler Operational Controls",\n        "Status: implemented in this slice.",\n        "O1F is complete as validation-only operational hardening over this caller-invoked boundary.",\n        "O2 and O3 are implemented in dedicated handoffs as opt-in layers above O1E",\n    ),\n    "docs/architecture/o1f_operational_validation.md": (\n        "# O1F Operational Validation",\n        "Status: implemented in this slice.",\n        "validate_scheduler_operational_boundary_once",\n        "../evidence/implementation/o1f_completion_report.md",\n    ),\n    "docs/architecture/o2_supervised_scheduler_service.md": (\n'''
          if text.count(o1e_block) != 1:
              raise SystemExit(f"{path}: O1F handoff REQUIRED insertion anchor mismatch")
          text = text.replace(o1e_block, o1f_block, 1)

          evidence_anchor = '    "docs/evidence/implementation/e1r4_completion_report.md": (\n'
          evidence_block = '''    "docs/evidence/implementation/o1f_completion_report.md": (\n        "relaylm_doc_type: implementation_completion_report",\n        "relaylm_source_pr: 429",\n        "O1F Completion Report",\n        "Current O1F behavior belongs to",\n        "o1f_completion_report-source.txt",\n        "At source PR #429",\n    ),\n    "docs/evidence/implementation/e1r4_completion_report.md": (\n'''
          if text.count(evidence_anchor) != 1:
              raise SystemExit(f"{path}: canonical evidence REQUIRED insertion anchor mismatch")
          text = text.replace(evidence_anchor, evidence_block, 1)
          write(path, text)

          path = "docs/evidence/migrations/documentation-hard-cutover-receipt.md"
          text = read(path)
          c1c18 = "### C1C18-001 — E1-R5 completion report\n\n```yaml\ncutover_pr: 576\nmerged_commit: pending\n"
          c1c18_done = "### C1C18-001 — E1-R5 completion report\n\n```yaml\ncutover_pr: 576\nmerged_commit: 91c21085b468052f77b65d5e1577cd1940fe0b2b\n"
          if text.count(c1c18) != 1:
              raise SystemExit(f"{path}: C1C18 finalization anchor mismatch")
          text = text.replace(c1c18, c1c18_done, 1)

          pending_anchor = "## Pending batches\n"
          if text.count(pending_anchor) != 1 or "### C1C19-001" in text:
              raise SystemExit(f"{path}: C1C19 insertion state mismatch")
          c1c19 = '''### C1C19-001 — O1F completion report\n\n```yaml\ncutover_pr: 581\nmerged_commit: pending\nold_path: docs/mvp/wave6/o1f_completion_report.md\nold_blob_sha: cae70dbe1648ed6757af928eeae0becd7fd313dd\nold_content_sha256: b7c61bd6711e2f8ab741e4f73df5715d64229cfa5f11865c1004eed9d5a6e976\nsource_commit: 14b91b5ed21f240aa92eb54189e0b2d36ab089f7\nsource_origin_commit: 961fff2d935cd764e81e577887328e86363e56d5\nsource_pr: 429\nrecorded_on: 2026-06-27\ndisposition: evidence_retained\nnew_canonical_path: docs/evidence/implementation/o1f_completion_report.md\nexact_source_snapshot: docs/evidence/implementation/o1f_completion_report-source.txt\nexact_source_blob_sha: cae70dbe1648ed6757af928eeae0becd7fd313dd\nverification:\n  old_path_removed_in_pr_tree: true\n  exact_source_blob_reused: true\n  canonical_evidence_metadata_added: true\n  repository_root_literal_reference_files_updated_in_pr_tree: 3\n  repository_root_literal_reference_occurrences_updated_in_pr_tree: 5\n  relative_markdown_link_referrer_files_at_frozen_baseline: 6\n  relative_markdown_link_dependencies_at_frozen_baseline: 6\n  o1f_architecture_handoff_updated: true\n  wave6_convergence_evidence_link_updated: true\n  implementation_evidence_index_updated: true\n  documentation_current_boundary_smoke_updated: true\n  dedicated_o1f_workflow_absent_in_current_tree: true\n  cutover_preparation_self_test_reused_without_path_change: true\n  migration_aware_completion_report_model_reused: true\n  migration_aware_pr_link_smoke_reused: true\n  focused_o1f_smokes: passed\n  o1_scheduler_and_operational_regressions: passed\n  documentation_link_check: passed\n  documentation_semantic_audit: passed\n  completion_report_model_and_file_checks: passed\n  completion_report_pr_link_check: passed\n  all_github_actions: pending\n  unresolved_review_threads: 0\n```\n\nThe canonical record preserves the complete O1F validation-only scheduler operational-hardening boundary from PR #429 while separating it from current architecture-, implementation-, and focused-smoke-owned behavior. The exact pre-cutover source is retained as the original Git blob and byte-for-byte snapshot. The dependency sweep identified five repository-root literals across three files and six Markdown-link dependencies across six router, handoff, convergence, and source-report files. The dedicated O1F workflow named by the historical source report is no longer present in the current tree and is not recreated. The migration-aware completion-report model and PR-link checks apply without validator changes. The old path above is only the historical migration identifier for this receipt.\n\n'''
          write(path, text.replace(pending_anchor, c1c19 + pending_anchor, 1))

          forbidden = []
          for candidate in Path(".").rglob("*"):
              if not candidate.is_file() or ".git" in candidate.parts:
                  continue
              rel = candidate.as_posix().removeprefix("./")
              if rel in {
                  "docs/evidence/migrations/documentation-hard-cutover-receipt.md",
                  "docs/evidence/implementation/o1f_completion_report-source.txt",
                  ".github/workflows/tmp-c1c19-o1f-applicator.yml",
              }:
                  continue
              try:
                  body = candidate.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if OLD in body:
                  forbidden.append(rel)
          if forbidden:
              raise SystemExit(f"old live path remains: {forbidden}")
          PY

      - name: Verify exact source preservation
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:docs/mvp/wave6/o1f_completion_report.md > /tmp/o1f_completion_report.md
          cmp /tmp/o1f_completion_report.md docs/evidence/implementation/o1f_completion_report-source.txt
          test "$(git hash-object docs/evidence/implementation/o1f_completion_report-source.txt)" = "cae70dbe1648ed6757af928eeae0becd7fd313dd"
          test "$(sha256sum docs/evidence/implementation/o1f_completion_report-source.txt | awk '{print $1}')" = "b7c61bd6711e2f8ab741e4f73df5715d64229cfa5f11865c1004eed9d5a6e976"
          test ! -e docs/mvp/wave6/o1f_completion_report.md
          ! git grep -n "docs/mvp/wave6/o1f_completion_report.md" -- . \
            ':!docs/evidence/migrations/documentation-hard-cutover-receipt.md' \
            ':!docs/evidence/implementation/o1f_completion_report-source.txt' \
            ':!.github/workflows/tmp-c1c19-o1f-applicator.yml'

      - name: Run O1F and documentation validation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/o1f_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_corruption_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_concurrency_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_saturation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_restart_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1f_operational_validation_security_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1a_scheduler_contract_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1b_sealed_replay_lane_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1c_eligible_queue_lane_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1d1_production_round_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1d2_scheduler_policy_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1e_scheduler_operational_controls_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o2_supervised_scheduler_service_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o3_always_on_local_scheduler_smoke.py
          git diff --check

      - name: Commit generated cutover changes and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-c1c19-o1f-applicator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: complete O1F cutover references"
          git push origin HEAD:agent/docs-cutover-1c19-o1f
