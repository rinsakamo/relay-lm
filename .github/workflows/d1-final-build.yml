name: Build final D1 documentation boundary

on:
  push:
    branches:
      - agent/d1-final-build
    paths:
      - ".github/workflows/d1-final-build.yml"
  pull_request:
    paths:
      - ".github/workflows/d1-final-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/d1-final-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply accepted P1 authority transfer
        run: |
          set -o pipefail
          : > /tmp/d1-final-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main 2>&1 | tee -a /tmp/d1-final-build.log
          echo "> python .d1_patch_repair.py" | tee -a /tmp/d1-final-build.log
          python .d1_patch_repair.py 2>&1 | tee -a /tmp/d1-final-build.log || exit 1
          echo "> python .d1_completion_model_retirement.py" | tee -a /tmp/d1-final-build.log
          python .d1_completion_model_retirement.py 2>&1 | tee -a /tmp/d1-final-build.log || exit 1
          rm -f .d1_patch_repair.py .d1_completion_model_retirement.py
          rm -f .github/workflows/d1-final-build.yml
      - name: Validate exact build
        run: |
          set -o pipefail
          failed=0
          run_check() {
            echo "> $*" | tee -a /tmp/d1-final-build.log
            "$@" 2>&1 | tee -a /tmp/d1-final-build.log || failed=1
          }
          run_check python -m pip install -e ".[test]"
          run_check python -m compileall -q scripts/relaylm_mvp_completion_report_smoke.py scripts/relaylm_docs_semantic_audit.py scripts/relaylm_documentation_governance_validate.py scripts/relaylm_mvp_eval_runner_registry.py scripts/relaylm_ci_consolidated_smoke.py
          run_check python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          run_check python scripts/relaylm_mvp_completion_report_smoke.py --self-test
          run_check python scripts/relaylm_docs_semantic_audit.py
          run_check python scripts/relaylm_docs_semantic_audit.py --self-test
          run_check python scripts/relaylm_documentation_governance_validate.py --base-ref origin/main
          run_check python scripts/relaylm_documentation_governance_validate.py --self-test
          run_check python scripts/relaylm_documentation_current_boundary_smoke.py
          run_check python scripts/relaylm_docs_link_check.py
          run_check python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          run_check env PYTHONPATH=.:scripts python scripts/relaylm_wave4_cross_slice_convergence_smoke.py
          run_check env PYTHONPATH=.:scripts python scripts/relaylm_mvp_eval_runner_smoke.py
          run_check git diff --check
          if git grep -n -- '--check-model' -- .github scripts >> /tmp/d1-final-build.log 2>&1; then
            echo "FAIL: live model-mode invocation remains" | tee -a /tmp/d1-final-build.log
            failed=1
          fi
          for path in \
            docs/templates/implementation-completion-report.md \
            .github/workflows/documentation-completion-report-model.yml \
            .github/workflows/d1-final-build.yml \
            .d1_patch_repair.py \
            .d1_completion_model_retirement.py; do
            if [ -e "$path" ]; then
              echo "FAIL: retired or temporary path remains: $path" | tee -a /tmp/d1-final-build.log
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d1-final-build-diagnostics
          path: /tmp/d1-final-build.log
          if-no-files-found: error
      - name: Publish validated build
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "docs: finalize D1 authority transfer"
          git push origin HEAD:agent/d1-final-build
