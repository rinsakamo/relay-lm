name: Sync latest main into I-4C1 branch

on:
  push:
    branches:
      - phase-i4c1-primary-forget-hidden-successor
    paths:
      - ".github/workflows/i4c1-sync-latest-main.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i4c1-primary-forget-hidden-successor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge latest main and preserve both documentation boundaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Latest main is already contained"
            exit 0
          fi
          git merge --no-commit --no-ff -X ours origin/main
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/PROJECT_STATUS.md")
          body = path.read_text(encoding="utf-8")
          old = (
              "UI-B0, I1-GA/I1-GB, Phase I-4A/I-4B/I-4C1, and O0 do not weaken existing server defaults. "
              "I1-GB is default-off and changes response ordering only in explicit apply mode. "
              "Phase I-4C1 adds no accepted loopback route, M3f/M3g convergence, tombstone, M2 filtering change, or browser mutation capability. "
              "O0 cannot be elevated to apply by CLI flags and performs no discovery while disabled."
          )
          new = (
              "UI-B0, I1-GA/I1-GB, Phase I-4A/I-4B/I-4C1, O0, and O1A do not weaken existing server defaults. "
              "I1-GB is default-off and changes response ordering only in explicit apply mode. "
              "Phase I-4C1 adds no accepted loopback route, M3f/M3g convergence, tombstone, M2 filtering change, or browser mutation capability. "
              "O0 cannot be elevated to apply by CLI flags and performs no discovery while disabled. "
              "O1A adds no accepted configuration fields, CLI command, production scanner, or runtime invocation path."
          )
          if old in body:
              path.write_text(body.replace(old, new, 1), encoding="utf-8")
          elif "O1A adds no accepted configuration fields" not in body:
              raise RuntimeError("safe-default documentation anchor missing")
          PY
      - name: Install project
        run: pip install -e .
      - name: Validate merged authorities
        shell: bash
        run: |
          set -o pipefail
          status=0
          {
            python -m compileall -q relaylm scripts
            PYTHONPATH=. python scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py
            PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c1_ci_runner.py
            PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
            PYTHONPATH=. python scripts/relaylm_docs_link_check.py
          } 2>&1 | tee /tmp/i4c1-sync-validation.log || status=$?
          if [ "$status" -ne 0 ]; then
            git merge --abort || true
            cp /tmp/i4c1-sync-validation.log .i4c1-sync-diagnostics.log
            git add .i4c1-sync-diagnostics.log
            git commit -m "chore: update I-4C1 main-sync diagnostics"
            git push origin HEAD:phase-i4c1-primary-forget-hidden-successor
            exit 1
          fi
      - name: Commit synchronized branch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "chore: sync latest main into I-4C1 branch"
          rm -f \
            .i4c1-sync-diagnostics.log \
            .github/workflows/i4c1-finalize-ready.yml \
            .github/workflows/i4c1-sync-latest-main-diagnostic.yml \
            .github/workflows/i4c1-sync-latest-main.yml
          git add -A
          git commit -m "chore: remove temporary I-4C1 synchronization files"
          git push origin HEAD:phase-i4c1-primary-forget-hidden-successor
