name: O0 local one-job runner smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "relaylm/local_worker_*.py"
      - "relaylm/config.py"
      - "relaylm/relaymem_slp_one_queued_job_runner.py"
      - "relaylm/relaymem_slp_queue_*.py"
      - "relaylm/relaymem_slp_protected_source_store.py"
      - "relaylm/relaymem_slp_primary_worker_source_adapter.py"
      - "relaylm/relaymem_slp_primary_worker_source_registry.py"
      - "relaylm/relaymem_slp_primary_worker.py"
      - "relaylm/_relaymem_slp_primary_worker_*.py"
      - "relaylm/relaymem_primary_pipeline.py"
      - "relaylm/relaymem_primary_recall.py"
      - "scripts/_relaylm_o0_local_worker_support.py"
      - "scripts/relaylm_o0_local_one_job_runner_*.py"
      - "scripts/relaylm_phase6c2_one_queued_job_runner_*.py"
      - "scripts/relaylm_phase6c1_*.py"
      - "scripts/relaylm_phase6b2_*.py"
      - "scripts/relaylm_phase6b3_*.py"
      - "scripts/relaylm_phase_i1_two_turn_primary_recall_smoke.py"
      - "scripts/relaylm_phase_i2_lab_observation_smoke.py"
      - "scripts/relaylm_phase_i3_primary_mem_correct_smoke.py"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "docs/architecture/o0_local_one_job_runner.md"
      - "docs/architecture/post_i3_evaluation_work_roadmap.md"
      - "docs/architecture/pipeline_implementation_plan.md"
      - "docs/architecture/README.md"
      - "docs/PROJECT_STATUS.md"
      - "docs/README.md"
      - "config.example.yaml"
      - "pyproject.toml"
      - ".github/workflows/o0-local-one-job-runner-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/local_worker_*.py"
      - "relaylm/config.py"
      - "scripts/_relaylm_o0_local_worker_support.py"
      - "scripts/relaylm_o0_local_one_job_runner_*.py"
      - "docs/architecture/o0_local_one_job_runner.md"
      - "config.example.yaml"
      - "pyproject.toml"
      - ".github/workflows/o0-local-one-job-runner-smoke.yml"

permissions:
  contents: read

concurrency:
  group: o0-local-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RelayLM runtime dependencies
        run: python -m pip install -e .
      - name: Compile O0 and repository Python
        run: python -m compileall -q relaylm scripts
      - name: Run O0 functional and security suite
        run: PYTHONPATH=.:scripts python scripts/relaylm_o0_local_one_job_runner_ci_runner.py
      - name: Run Phase 6-C2 regression suite
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase6c2_one_queued_job_runner_ci_runner.py
      - name: Run Phase 6 queue regressions
        run: |
          PYTHONPATH=. python scripts/relaylm_phase6b2_durable_enqueue_contract_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_smoke.py
      - name: Run Phase 6-C1 worker and durable-source regressions
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_primary_worker_ci_runner.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_worker_integration_ci_runner.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_durable_protected_source_smoke.py
      - name: Run I-1 through I-3 regressions
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i1_two_turn_primary_recall_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i2_lab_observation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i3_primary_mem_correct_smoke.py
      - name: Run documentation boundary and link checks
        run: |
          PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
