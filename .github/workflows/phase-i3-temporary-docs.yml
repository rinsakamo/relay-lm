name: Temporary Phase I-3 documentation patch

on:
  push:
    branches:
      - phase-i3-auditable-primary-mem-correct
    paths:
      - scripts/_phase_i3_docs_patch.py
      - .github/workflows/phase-i3-temporary-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i3-auditable-primary-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/_phase_i3_docs_patch.py
      - run: python -m compileall -q scripts
      - run: PYTHONPATH=. python scripts/relaylm_docs_link_check.py
      - run: PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py
      - run: PYTHONPATH=. python scripts/relaylm_phase_i2_documentation_boundary_smoke.py
      - name: Commit documentation authority update
        run: |
          rm scripts/_phase_i3_docs_patch.py
          rm .github/workflows/phase-i3-temporary-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/relaylm_documentation_current_boundary_smoke.py scripts/relaylm_phase_i2_documentation_boundary_smoke.py
          git add -u scripts/_phase_i3_docs_patch.py .github/workflows/phase-i3-temporary-docs.yml
          git commit -m "docs: record Phase I3 Correct completion boundary"
          git push origin HEAD:phase-i3-auditable-primary-mem-correct
