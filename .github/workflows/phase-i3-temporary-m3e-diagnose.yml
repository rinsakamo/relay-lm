name: Temporary Phase I-3 M3e recovery diagnosis

on:
  push:
    branches:
      - phase-i3-auditable-primary-mem-correct
    paths:
      - .github/workflows/phase-i3-temporary-m3e-diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i3-auditable-primary-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Capture bounded M3e result
        run: |
          PYTHONPATH=.:scripts python - <<'PY'
          import json
          from pathlib import Path
          import relaylm.relaymem_primary_correction as correction
          import relaylm_phase_i3_primary_mem_correct_fault_smoke as smoke

          observed = []
          original = correction.apply_relaymem_primary_page_write
          def wrapped(*args, **kwargs):
              result = original(*args, **kwargs)
              observed.append({
                  "status": result.get("status"),
                  "durability_confirmed": result.get("durability_confirmed"),
                  "blocked_reasons": [
                      item for item in result.get("blocked_reasons", [])
                      if isinstance(item, str) and len(item) <= 160
                  ],
              })
              return result
          correction.apply_relaymem_primary_page_write = wrapped
          try:
              smoke.main()
          except AssertionError:
              pass
          Path("phase-i3-m3e-diagnosis.json").write_text(
              json.dumps({"m3e": observed[-3:]}, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Record bounded M3e diagnosis
        run: |
          {
            printf '\n## M3e recovery diagnosis\n\n```json\n'
            cat phase-i3-m3e-diagnosis.json
            printf '```\n'
          } >> docs/architecture/phase_i3_validation_receipt.md
          rm phase-i3-m3e-diagnosis.json
          rm .github/workflows/phase-i3-temporary-m3e-diagnose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/phase_i3_validation_receipt.md
          git add -u .github/workflows/phase-i3-temporary-m3e-diagnose.yml
          git commit -m "test: record Phase I3 M3e recovery diagnosis"
          git push origin HEAD:phase-i3-auditable-primary-mem-correct
