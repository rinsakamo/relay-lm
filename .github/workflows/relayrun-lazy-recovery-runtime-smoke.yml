name: RelayRUN lazy recovery runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - relaylm/app.py
      - relaylm/relayrun_lazy_recovery.py
      - scripts/relaylm_relayrun_lazy_recovery_runtime_wiring_smoke.py
      - scripts/relaylm_relayrun_runtime_checkpoint_dry_run_smoke.py
      - .github/workflows/relayrun-lazy-recovery-runtime-smoke.yml
      - docs/architecture/phase5d2_lazy_relayrun_recovery_detail_handoff.md
      - docs/architecture/pipeline_implementation_plan.md
      - docs/PROJECT_STATUS.md
  push:
    branches: [main]
    paths:
      - relaylm/app.py
      - relaylm/relayrun_lazy_recovery.py
      - scripts/relaylm_relayrun_lazy_recovery_runtime_wiring_smoke.py
      - scripts/relaylm_relayrun_runtime_checkpoint_dry_run_smoke.py
      - .github/workflows/relayrun-lazy-recovery-runtime-smoke.yml
      - docs/architecture/phase5d2_lazy_relayrun_recovery_detail_handoff.md
      - docs/architecture/pipeline_implementation_plan.md
      - docs/PROJECT_STATUS.md

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall relaylm scripts
      - name: Run runtime wiring smoke
        run: python scripts/relaylm_relayrun_lazy_recovery_runtime_wiring_smoke.py
      - name: Run runtime checkpoint smoke
        run: python scripts/relaylm_relayrun_runtime_checkpoint_dry_run_smoke.py
