name: Temporary Cutover 1C-24 applicator

on:
  push:
    branches:
      - agent/docs-cutover-1c24-horizontal-status-sweep
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c24-horizontal-status-sweep
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyyaml

      - name: Apply Cutover 1C-24
        run: python scripts/_tmp_apply_docs_cutover_1c24.py

      - name: Verify exact preservation and cutover boundary
        run: |
          test "$(git hash-object docs/evidence/implementation/docs_horizontal_status_sweep_completion_report-source.txt)" = "c92bc7e856ef28e862a738c47668d46c67a71904"
          test "$(sha256sum docs/evidence/implementation/docs_horizontal_status_sweep_completion_report-source.txt | cut -d' ' -f1)" = "889edab78de527869e3b94c764fadf9d9cce92b03f8adb946e42c3e6ca6a7627"
          test ! -e docs/mvp/wave6/docs_horizontal_status_sweep_completion_report.md
          test -z "$(find docs/mvp/wave6 -maxdepth 1 -type f -name '*.md' -print -quit)"
          ! git grep -n -F 'docs/mvp/wave6/docs_horizontal_status_sweep_completion_report.md' -- . ':!docs/evidence/implementation/docs_horizontal_status_sweep_completion_report-source.txt' ':!docs/evidence/migrations/documentation-hard-cutover-receipt.md' ':!scripts/_tmp_apply_docs_cutover_1c24.py' ':!.github/workflows/_tmp-docs-cutover-1c24-inventory.yml'

      - name: Run documentation validation
        run: |
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/docs_horizontal_status_sweep_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          git diff --check

      - name: Commit validated cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs scripts
          git commit -m 'docs: apply Cutover 1C-24 horizontal status sweep'
          git push origin HEAD:agent/docs-cutover-1c24-horizontal-status-sweep
