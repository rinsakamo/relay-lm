name: ST-1 apply implementation

on:
  push:
    branches:
      - agent/st1-apply-trigger-20260723

permissions:
  contents: write

concurrency:
  group: st1-apply-trigger-20260723
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact bootstrap head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply exact ST-1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/st1-payload/part-* > /tmp/st1-implementation.patch.gz.b64
          test "$(sha256sum /tmp/st1-implementation.patch.gz.b64 | awk '{print $1}')" = "cab472304ebe50df73c6f5866342765e31609ac9b4183464ab231a87b01054ca"
          base64 -d /tmp/st1-implementation.patch.gz.b64 | gzip -d > /tmp/st1-implementation.patch
          test "$(sha256sum /tmp/st1-implementation.patch | awk '{print $1}')" = "121026689846deba32bdce5158bdb799e5c33e65801a24c999b0d0617aee3684"
          git apply --check /tmp/st1-implementation.patch
          git apply /tmp/st1-implementation.patch
          rm -rf .github/st1-payload
          rm .github/workflows/st1-bootstrap-snapshot.yml

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Validate implementation serially
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q relaylm scripts
          PYTHONPATH=tests:. pytest -q tests/test_subjective_mem_runtime.py tests/test_subjective_mem_commit_runtime.py
          python scripts/relaylm_sm1_subjective_mem_create_smoke.py
          python scripts/relaylm_st1_subjective_mem_commit_smoke.py
          python scripts/relaylm_subjective_mem_v1_validate.py
          python scripts/relaylm_subjective_mem_v1_equivalence.py
          python scripts/relaylm_subjective_mem_v1_fixture_registry_guard.py
          python scripts/relaylm_docs_link_check.py
          python scripts/relaylm_docs_semantic_audit.py
          python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check

      - name: Commit exact implementation tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -z "$(git status --short | grep -E '^\?\?' || true)"
          git commit -m "feat: implement ST-1 Subjective MEM commit protocol"
          git push origin HEAD:${{ github.ref_name }}
