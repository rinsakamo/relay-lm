name: ST-1 bootstrap snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/st1-bootstrap-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'agent/st1-subjective-mem-commit-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Archive repository snapshot
        run: |
          tar --exclude=.git -czf /tmp/relay-lm-st1-snapshot.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: relay-lm-st1-snapshot
          path: /tmp/relay-lm-st1-snapshot.tgz
          if-no-files-found: error
          retention-days: 1
