name: Wave 4 cross-slice convergence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/relaylm_wave4_cross_slice_convergence_smoke.py"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "scripts/relaylm_mvp_completion_report_smoke.py"
      - "scripts/relaylm_mvp_completion_report_pr_link_smoke.py"
      - "scripts/relaylm_docs_link_check.py"
      - ".github/workflows/wave4-cross-slice-convergence.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/relaylm_wave4_cross_slice_convergence_smoke.py"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "scripts/relaylm_mvp_completion_report_smoke.py"
      - "scripts/relaylm_mvp_completion_report_pr_link_smoke.py"
      - "scripts/relaylm_docs_link_check.py"
      - ".github/workflows/wave4-cross-slice-convergence.yml"

jobs:
  wave4-cross-slice-convergence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m compileall -q scripts
      - name: Wave 4 convergence smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_wave4_cross_slice_convergence_smoke.py
      - name: Documentation current boundary smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
      - name: Validate Wave 4 completion reports
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/evidence/implementation/o1d2_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/evidence/implementation/i4e_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/evidence/implementation/ui_b1a_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/evidence/implementation/i5a_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/evidence/implementation/i7ab_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model --check-all
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
      - name: Documentation link check
        run: PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
