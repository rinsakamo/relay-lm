name: I-4C2 one-shot main sync

on:
  push:
    branches:
      - phase-i4c2-primary-forget-recovery-finalization
    paths:
      - ".github/workflows/i4c2-sync-main-once.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i4c2-primary-forget-recovery-finalization
          fetch-depth: 0
      - name: Merge latest main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit -X theirs origin/main; then
            git checkout --theirs -- .
            git add -A
            git commit -m "Merge latest main into I-4C2 branch"
          fi
          git rm .github/workflows/i4c2-sync-main-once.yml
          git commit -m "chore: remove one-shot I-4C2 main sync workflow"
          git push origin HEAD:phase-i4c2-primary-forget-recovery-finalization
