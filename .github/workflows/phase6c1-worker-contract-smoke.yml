name: Phase 6-C1 worker contract smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/architecture/phase6c1_primary_mem_worker_contract.md"
      - "docs/architecture/README.md"
      - "scripts/relaylm_phase6c1_worker_contract_smoke.py"
      - ".github/workflows/phase6c1-worker-contract-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "docs/architecture/phase6c1_primary_mem_worker_contract.md"
      - "docs/architecture/README.md"
      - "scripts/relaylm_phase6c1_worker_contract_smoke.py"
      - ".github/workflows/phase6c1-worker-contract-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Phase 6-C1 contract smoke
        run: python -m compileall -q scripts/relaylm_phase6c1_worker_contract_smoke.py
      - name: Validate Phase 6-C1 worker contract
        run: python scripts/relaylm_phase6c1_worker_contract_smoke.py
