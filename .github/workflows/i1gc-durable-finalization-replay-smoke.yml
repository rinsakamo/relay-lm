name: I1-GC durable-finalization replay smoke

on:
  pull_request:
    paths:
      - "relaylm/app.py"
      - "relaylm/config.py"
      - "relaylm/_relaymem_slp_durable_finalization_replay_impl.py"
      - "relaylm/relaymem_slp_durable_finalization_*.py"
      - "relaylm/relaymem_slp_durable_runtime_enqueue.py"
      - "relaylm/relaymem_slp_runtime_enqueue.py"
      - "relaylm/relaymem_slp_runtime_finalization.py"
      - "relaylm/relaymem_slp_protected_source_store.py"
      - "relaylm/relaymem_slp_durable_enqueue.py"
      - "relaylm/relaymem_slp_queue_*.py"
      - "scripts/relaylm_i1g_*.py"
      - "scripts/relaylm_i1gb_*.py"
      - "scripts/relaylm_i1gc_*.py"
      - "scripts/relaylm_phase6_runtime_enqueue_*.py"
      - "scripts/relaylm_phase6c1_durable_protected_source_smoke.py"
      - "scripts/relaylm_phase6b2_durable_enqueue_smoke.py"
      - "scripts/relaylm_phase6b3_queue_state_smoke.py"
      - "scripts/relaylm_phase6c2_one_queued_job_runner_ci_runner.py"
      - "docs/**"
      - "config.example.yaml"
      - ".github/workflows/i1gc-durable-finalization-replay-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/_relaymem_slp_durable_finalization_replay_impl.py"
      - "relaylm/relaymem_slp_durable_finalization_*.py"
      - "relaylm/relaymem_slp_runtime_finalization.py"
      - "scripts/relaylm_i1gc_*.py"
      - "docs/**"
      - ".github/workflows/i1gc-durable-finalization-replay-smoke.yml"

permissions:
  contents: read

concurrency:
  group: i1gc-durable-finalization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RelayLM runtime dependencies
        run: python -m pip install -e .
      - name: Compile repository Python
        run: python -m compileall -q relaylm scripts
      - name: Run I1-GC replay convergence smoke
        id: i1gc
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python scripts/relaylm_i1gc_durable_finalization_replay_smoke.py > i1gc-smoke.log 2>&1
          exit_code=$?
          cat i1gc-smoke.log
          exit "$exit_code"
      - name: Upload I1-GC smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1gc-smoke-output
          path: i1gc-smoke.log
          if-no-files-found: error
          retention-days: 3
      - name: Run I1-G contract and I1-GB publication regressions
        run: |
          PYTHONPATH=. python scripts/relaylm_i1g_pre_enqueue_fault_model_smoke.py
          PYTHONPATH=. python scripts/relaylm_i1gb_durable_finalization_publication_smoke.py
          PYTHONPATH=. python scripts/relaylm_i1gb_durable_finalization_app_smoke.py
          PYTHONPATH=. python scripts/relaylm_i1gc_durable_finalization_formation_replay_smoke.py
      - name: Run source-before-queue regressions
        run: |
          PYTHONPATH=. python scripts/relaylm_phase6_runtime_enqueue_source_capture_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6_runtime_enqueue_app_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_durable_protected_source_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6b2_durable_enqueue_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_smoke.py
      - name: Run C2 non-regression
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase6c2_one_queued_job_runner_ci_runner.py
      - name: Run documentation checks
        run: |
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
          PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py
