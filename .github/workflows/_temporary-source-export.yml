name: Temporary source export

on:
  push:
    paths:
      - ".github/workflows/_temporary-source-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: response-split-smoke-sources
          path: |
            scripts/relaylm_i1gb_durable_finalization_app_smoke.py
            scripts/_relaylm_i1ge_crash_child.py
          if-no-files-found: error
          retention-days: 1
