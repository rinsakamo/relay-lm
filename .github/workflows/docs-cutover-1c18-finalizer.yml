name: Docs cutover 1C-18 finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docs-cutover-1c18-finalizer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 576
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c18-e1r5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Finalize receipt
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/evidence/migrations/documentation-hard-cutover-receipt.md')
          text = path.read_text(encoding='utf-8')
          marker = '### C1C18-001 — E1-R5 completion report'
          start = text.index(marker)
          end = text.index('\n## Pending batches', start)
          section = text[start:end]
          if section.count('all_github_actions: pending') != 1:
              raise SystemExit('C1C18 pending GitHub Actions state is not unique')
          section = section.replace('all_github_actions: pending', 'all_github_actions: passed', 1)
          text = text[:start] + section + text[end:]
          text = text.replace(
              'The old path above is only the historical migration identifier for this receipt.\n\n\nPR #575 merged',
              'The old path above is only the historical migration identifier for this receipt.\n\nPR #575 merged',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate final state
        run: |
          PYTHONPATH=. python scripts/relaylm_docs_cutover_prepare.py --self-test
          PYTHONPATH=. python scripts/relaylm_e1_evaluation_consolidation_smoke.py
          PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
          PYTHONPATH=. python scripts/relaylm_mvp_completion_report_smoke.py --check-model
          PYTHONPATH=. python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          PYTHONPATH=. python scripts/relaylm_mvp_completion_report_smoke.py docs/evidence/implementation/e1r5_completion_report.md
          PYTHONPATH=. python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          PYTHONPATH=. python scripts/relaylm_docs_semantic_audit.py
          test "$(git hash-object docs/evidence/implementation/e1r5_completion_report-source.txt)" = "68fa2b0c76caf745e55f5f4ef3fd3677c8681a8d"
          test "$(git hash-object docs/evidence/waves/e1r5_post_wave7_correction_convergence_audit-source.txt)" = "0d7cbceca1259d127ebf4fa1a7f91bcbf9e144e5"
          git diff --check
      - name: Commit receipt finalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/evidence/migrations/documentation-hard-cutover-receipt.md
          git commit -m "docs: finalize cutover 1C-18 receipt"
          git push origin HEAD:agent/docs-cutover-1c18-e1r5
