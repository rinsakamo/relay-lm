name: Temporary Phase I-3 fixture patch

on:
  push:
    branches:
      - phase-i3-auditable-primary-mem-correct
    paths:
      - scripts/_phase_i3_fixture_patch.py
      - .github/workflows/phase-i3-temporary-fixture-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i3-auditable-primary-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/_phase_i3_fixture_patch.py
      - run: python -m compileall -q scripts/relaylm_phase_i3_primary_mem_correct_smoke.py
      - name: Commit corrected fixture
        run: |
          rm scripts/_phase_i3_fixture_patch.py
          rm .github/workflows/phase-i3-temporary-fixture-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/relaylm_phase_i3_primary_mem_correct_smoke.py
          git add -u scripts/_phase_i3_fixture_patch.py .github/workflows/phase-i3-temporary-fixture-patch.yml
          git commit -m "test: align Phase I3 query with M2 token boundary"
          git push origin HEAD:phase-i3-auditable-primary-mem-correct
