name: Phase 5-C4b audit projection auto patch

on:
  push:
    branches: [phase5c4b-cache-hit-relayscn-projection]
    paths:
      - .github/workflows/phase5c4b-auto-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch audit projection registration
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path('relaylm/audit_projection.py')
          text = audit.read_text(encoding='utf-8')
          if '_RELAYSCN_PROJECTION_DIAGNOSTICS' not in text:
              marker = '\n\n_HISTORY_DIAGNOSTICS = _mapping(\n'
              insert = '''\n\n_RELAYSCN_PROJECTION_DIAGNOSTICS = _mapping(\n    {\n        "schema_version": _enum("client_instruction_relayscn_projection.v0"),\n        "status": _enum("projected", "miss", "blocked", "skipped"),\n        "cache_hit": _bool,\n        "projection_ready": _bool,\n        "projected_scene_type": _optional(_bounded_token),\n        "projected_scene_role_present": _bool,\n        "projected_scene_role_scope": _optional(_lower_token),\n        "projected_scene_role_source": _optional(_lower_token),\n        "projected_scene_role_confidence_bucket": _optional(\n            _enum("very_high", "high", "medium", "low", "unknown")\n        ),\n        "projected_scene_context_present": _bool,\n        "projected_scene_context_field_count": _non_negative_int,\n        "projected_scene_context_participant_count": _non_negative_int,\n        "projected_scene_constraint_count": _non_negative_int,\n        "durable_candidate_count": _non_negative_int,\n        "blocked_instruction_kind_count": _non_negative_int,\n        "miss_reason": _optional(_lower_token),\n        "diagnostics_only": _bool,\n        "content_free": _bool,\n        "read_only": _bool,\n        "applied": _bool,\n    }\n)\n'''
              if marker not in text:
                  raise SystemExit('history diagnostics marker not found')
              text = text.replace(marker, insert + marker, 1)
          if '"client_instruction_relayscn_projection": NodeProjector(' not in text:
              marker = '''    "client_history_exclusion_preflight": NodeProjector(\n'''
              insert = '''    "client_instruction_relayscn_projection": NodeProjector(\n        decisions=frozenset({\n            "cache_hit_relayscn_projection_ready",\n            "cache_hit_relayscn_projection_miss",\n            "cache_hit_relayscn_projection_blocked",\n            "cache_hit_relayscn_projection_skipped",\n        }),\n        diagnostics=_RELAYSCN_PROJECTION_DIAGNOSTICS,\n        artifact_names=frozenset({"client_instruction_relayscn_projection_summary"}),\n    ),\n'''
              if marker not in text:
                  raise SystemExit('history node marker not found')
              text = text.replace(marker, insert + marker, 1)
          audit.write_text(text, encoding='utf-8')

          trace = Path('relaylm/trace_runtime.py')
          text = trace.read_text(encoding='utf-8')
          debug = '''        print(\n            "relayscn_projection_trace_debug "\n            f"lookup_present={cache_lookup_runtime_result is not None} "\n            f"lookup_status={getattr(cache_lookup_runtime_result, 'status', None)} "\n            f"projection_present={projection_node is not None}"\n        )\n'''
          text = text.replace(debug, '')
          trace.write_text(text, encoding='utf-8')
          PY
      - name: Remove auto patch workflow
        run: rm .github/workflows/phase5c4b-auto-patch.yml
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'no changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add relaylm/audit_projection.py relaylm/trace_runtime.py .github/workflows/phase5c4b-auto-patch.yml
          git commit -m 'fix: register cache-hit RelaySCN projection audit node'
          git push
