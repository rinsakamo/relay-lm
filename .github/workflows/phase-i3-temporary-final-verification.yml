name: Temporary Phase I-3 final branch verification

on:
  push:
    branches:
      - phase-i3-auditable-primary-mem-correct
    paths:
      - .github/workflows/phase-i3-temporary-final-verification.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i3-auditable-primary-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e .
      - id: whitespace
        continue-on-error: true
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
      - id: compile
        continue-on-error: true
        run: python -m compileall -q relaylm scripts
      - id: phase_i3
        continue-on-error: true
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i3_primary_mem_correct_ci_runner.py
      - id: relaymem_regressions
        continue-on-error: true
        run: |
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_security_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_atomicity_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_reconciliation_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_reconciliation_marker_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_apply_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_apply_security_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_recovery_audit_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_recovery_audit_security_smoke.py
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_recovery_audit_receipt_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_primary_worker_ci_runner.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_worker_integration_ci_runner.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c2_one_queued_job_runner_ci_runner.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i1_two_turn_primary_recall_ci_runner.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i2_lab_observation_ci_runner.py
          PYTHONPATH=. python scripts/relaylm_soul_lab_management_projection_smoke.py
      - id: docs
        continue-on-error: true
        run: |
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
          PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase_i2_documentation_boundary_smoke.py
      - run: npm install --no-audit --no-fund
        working-directory: apps/soul-lab
      - id: frontend
        continue-on-error: true
        working-directory: apps/soul-lab
        run: |
          npm run typecheck
          rm -rf .observation-smoke .correction-smoke
          npx tsc src/features/lab/observationApi.ts --target ES2022 --module ES2022 --moduleResolution Bundler --outDir .observation-smoke --skipLibCheck
          node scripts/observationApiSmoke.mjs
          npx tsc src/features/lab/correctionApi.ts --target ES2022 --module ES2022 --moduleResolution Bundler --outDir .correction-smoke --skipLibCheck
          node scripts/correctionApiSmoke.mjs
          rm -rf .observation-smoke .correction-smoke
          npm run build
      - name: Replace bounded validation receipt
        env:
          WHITESPACE: ${{ steps.whitespace.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          PHASE_I3: ${{ steps.phase_i3.outcome }}
          REGRESSIONS: ${{ steps.relaymem_regressions.outcome }}
          DOCS: ${{ steps.docs.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
        run: |
          cat > docs/architecture/phase_i3_validation_receipt.md <<EOF
          ---
          relaylm_doc_type: validation_receipt
          relaylm_authority: phase_i3_branch_validation
          relaylm_status: evidence
          relaylm_volatility: low
          relaylm_owner: phase_i3_ci
          ---
          # Phase I-3 branch validation receipt

          Final branch verification executed on 2026-06-24 JST.

          | Group | Result |
          |---|---|
          | Git diff whitespace check | ${WHITESPACE} |
          | Python compileall | ${COMPILE} |
          | Phase I-3 functional, security, bounds, corruption, path-safety, concurrency, and fault/recovery runner | ${PHASE_I3} |
          | M3e-M3h, Phase 6-C1/C2, I-1, I-2, and management regressions | ${REGRESSIONS} |
          | Documentation links and current-boundary smokes | ${DOCS} |
          | SOUL Lab typecheck, strict browser schema smokes, and production build | ${FRONTEND} |

          The I-3 fault runner includes a real durable index-applied/log-pending crash seam and verifies log-only M3f/M3g recovery before the corrected revision becomes current.

          This receipt intentionally contains no prompt, transcript, filesystem path, digest, token, exception, or raw workflow log content.
          EOF
          rm .github/workflows/phase-i3-temporary-final-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/phase_i3_validation_receipt.md
          git add -u .github/workflows/phase-i3-temporary-final-verification.yml
          git commit -m "test: record final Phase I3 branch verification"
          git push origin HEAD:phase-i3-auditable-primary-mem-correct
      - name: Fail on any unsuccessful validation group
        env:
          WHITESPACE: ${{ steps.whitespace.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          PHASE_I3: ${{ steps.phase_i3.outcome }}
          REGRESSIONS: ${{ steps.relaymem_regressions.outcome }}
          DOCS: ${{ steps.docs.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
        run: |
          test "$WHITESPACE" = success
          test "$COMPILE" = success
          test "$PHASE_I3" = success
          test "$REGRESSIONS" = success
          test "$DOCS" = success
          test "$FRONTEND" = success
