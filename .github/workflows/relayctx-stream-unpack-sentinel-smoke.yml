name: RelayCTX stream unpack sentinel smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - relaylm/adapter.py
      - relaylm/routing.py
      - relaylm/relayctx_stream_suppression_runtime.py
      - relaylm/relayctx_stream_unpack.py
      - relaylm/relayctx_unpack.py
      - relaylm/config.py
      - config.example.yaml
      - scripts/relaylm_relayctx_stream_unpack_sentinel_smoke.py
      - scripts/relaylm_relayctx_stream_suppression_runtime_smoke.py
      - docs/PROJECT_STATUS.md
      - docs/architecture/phase5_5_stream_unpack_bounded_slice.md
      - docs/architecture/phase55a_stream_sentinel_buffer_dry_run_handoff.md
      - docs/architecture/phase55b1_stream_suppression_gate_handoff.md
      - docs/architecture/phase55b2_stream_suppression_runtime_handoff.md
      - docs/architecture/pipeline_implementation_plan.md
      - .github/workflows/relayctx-stream-unpack-sentinel-smoke.yml
      - pyproject.toml
  push:
    branches: [main]
    paths:
      - relaylm/adapter.py
      - relaylm/routing.py
      - relaylm/relayctx_stream_suppression_runtime.py
      - relaylm/relayctx_stream_unpack.py
      - relaylm/relayctx_unpack.py
      - relaylm/config.py
      - config.example.yaml
      - scripts/relaylm_relayctx_stream_unpack_sentinel_smoke.py
      - scripts/relaylm_relayctx_stream_suppression_runtime_smoke.py
      - docs/PROJECT_STATUS.md
      - docs/architecture/phase5_5_stream_unpack_bounded_slice.md
      - docs/architecture/phase55a_stream_sentinel_buffer_dry_run_handoff.md
      - docs/architecture/phase55b1_stream_suppression_gate_handoff.md
      - docs/architecture/phase55b2_stream_suppression_runtime_handoff.md
      - docs/architecture/pipeline_implementation_plan.md
      - .github/workflows/relayctx-stream-unpack-sentinel-smoke.yml
      - pyproject.toml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and smoke scripts
        run: python -m compileall relaylm scripts
      - name: Run stream sentinel smoke
        run: python scripts/relaylm_relayctx_stream_unpack_sentinel_smoke.py
      - name: Run runtime stream suppression smoke
        run: python scripts/relaylm_relayctx_stream_suppression_runtime_smoke.py
