name: Temporary SM-1 final synchronization

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/tmp-sm1-final-sync.yml

permissions:
  contents: write

jobs:
  sync-correct-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Synchronize main and correct idempotency wording
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/architecture/sm1_subjective_mem_create_runtime.md")
          text = path.read_text(encoding="utf-8")
          old = "The raw key is never persisted or emitted publicly. The same key and equivalent immutable input returns the same decision, memory ID, revision, manifest, and current state. Any changed input is an integrity conflict or, for cross-character/workspace authority reuse, a scope mismatch. Retry cannot create revision 2 or another selector."
          new = "The raw key is never persisted or emitted publicly. Within one exact Evidence-space and character-authority namespace, the same key and equivalent immutable input returns the same decision, memory ID, revision, manifest, and current state, while changed immutable input is an integrity conflict. The same raw key may independently identify another operation in a different character/workspace namespace. A persisted operation that is repointed across namespaces or claims mismatched scope authority fails closed. Retry cannot create revision 2 or another selector."
          if text.count(old) != 1:
              raise SystemExit("expected one stale idempotency paragraph")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Compile
        run: python -m compileall -q relaylm scripts

      - name: Focused SM-1 tests
        run: PYTHONPATH=tests:. pytest -q tests/test_subjective_mem_runtime.py

      - name: SM-1 smoke
        run: python scripts/relaylm_sm1_subjective_mem_create_smoke.py

      - name: Documentation links
        run: python scripts/check_docs_links.py

      - name: Diff check
        run: git diff --check

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git add docs/architecture/sm1_subjective_mem_create_runtime.md
          git rm .github/workflows/tmp-sm1-final-sync.yml
          git commit -m "docs: align SM-1 scoped idempotency wording"
          git push origin HEAD:agent/sm1-subjective-mem-create-runtime
