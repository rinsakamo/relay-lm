name: Phase 6-C2 pipeline plan fix once

on:
  push:
    branches:
      - phase6c2-one-queued-job-integration
    paths:
      - "scripts/_phase6c2_fix_pipeline_plan.py"
      - ".github/workflows/phase6c2-pipeline-plan-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6c2-one-queued-job-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fix Phase 6-C2 pipeline plan consistency
        run: python scripts/_phase6c2_fix_pipeline_plan.py
      - name: Remove one-shot machinery
        run: |
          rm scripts/_phase6c2_fix_pipeline_plan.py
          rm .github/workflows/phase6c2-pipeline-plan-once.yml
      - name: Commit pipeline plan consistency fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/pipeline_implementation_plan.md scripts/_phase6c2_fix_pipeline_plan.py .github/workflows/phase6c2-pipeline-plan-once.yml
          git commit -m "docs: remove obsolete pre-C2 pipeline plan boundaries"
          git push origin HEAD:phase6c2-one-queued-job-integration
