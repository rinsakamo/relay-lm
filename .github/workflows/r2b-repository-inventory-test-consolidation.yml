# Synchronize after draft PR creation so the pull_request workflow evaluates this branch.
name: R2-B repository inventory test consolidation

on:
  push:
    branches:
      - agent/r2b-repository-inventory-test-consolidation
    paths:
      - .github/workflows/r2b-repository-inventory-test-consolidation.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/r2b-repository-inventory-test-consolidation.yml

permissions:
  contents: write

concurrency:
  group: r2b-repository-inventory-test-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.event_name == 'push' || github.head_ref == 'agent/r2b-repository-inventory-test-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r2b-repository-inventory-test-consolidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consolidate inventory regression ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          canonical_test = root / 'tests/test_relaylm_repo_inventory.py'
          partition_paths = (
              root / 'tests/test_relaylm_repo_inventory_cross_mode_hardening.py',
              root / 'tests/test_relaylm_repo_inventory_final_hardening.py',
          )
          workflow_path = root / '.github/workflows/repository-storage-inventory.yml'
          authority_path = root / 'docs/reference/repository-asset-classification.md'
          registry_path = root / 'records/repository/asset_classification_v1.yaml'
          construction_path = root / '.github/workflows/r2b-repository-inventory-test-consolidation.yml'

          def replace_exact(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          canonical = canonical_test.read_text(encoding='utf-8').rstrip()
          moved_sections: list[str] = []
          for path in partition_paths:
              source = path.read_text(encoding='utf-8')
              marker = '\ndef '
              position = source.find(marker)
              if position < 0:
                  raise SystemExit(f'{path}: no test functions found')
              moved_sections.append(source[position + 1 :].rstrip())
          canonical_test.write_text(
              canonical + '\n\n\n' + '\n\n\n'.join(moved_sections) + '\n',
              encoding='utf-8',
          )
          for path in partition_paths:
              path.unlink()

          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = replace_exact(
              workflow,
              'tests/test_relaylm_repo_inventory_cross_mode_hardening.py::test_package_internal_script_is_not_reported_as_direct_cli',
              'tests/test_relaylm_repo_inventory.py::test_package_internal_script_is_not_reported_as_direct_cli',
              'focused workflow caller',
          )
          workflow_path.write_text(workflow, encoding='utf-8')

          entrypoint_old = '''    current_callers:
      - .github/workflows/repository-storage-inventory.yml
      - docs/evidence/implementation/repository_inventory_baseline_1ca928cd.md reproduction command
      - tests/test_relaylm_repo_inventory_cross_mode_hardening.py operator-root assertion
    invocation_roots: [operator_cli, github_actions_step]
    evidence:
      - scripts/relaylm_repo_inventory_cli.py
      - .github/workflows/repository-storage-inventory.yml
      - tests/test_relaylm_repo_inventory.py
      - tests/test_relaylm_repo_inventory_cross_mode_hardening.py
'''
          entrypoint_new = '''    current_callers:
      - .github/workflows/repository-storage-inventory.yml
      - docs/evidence/implementation/repository_inventory_baseline_1ca928cd.md reproduction command
      - tests/test_relaylm_repo_inventory.py operator-root assertion
    invocation_roots: [operator_cli, github_actions_step]
    evidence:
      - scripts/relaylm_repo_inventory_cli.py
      - .github/workflows/repository-storage-inventory.yml
      - tests/test_relaylm_repo_inventory.py
'''
          tests_old = '''  - asset_id: repo_inventory.tests
    paths:
      - tests/test_relaylm_repo_inventory.py
      - tests/test_relaylm_repo_inventory_cross_mode_hardening.py
      - tests/test_relaylm_repo_inventory_final_hardening.py
    responsibility: ordinary_test
    lifecycle: active
    owner: repository_maintenance
    protected_boundary: regression coverage for discovery, determinism, cross-mode behavior, hardening, and one canonical repository-inventory entry point
    current_callers: [maintained pytest suite]
    invocation_roots: [pytest_root]
    evidence:
      - tests/test_relaylm_repo_inventory.py
      - tests/test_relaylm_repo_inventory_cross_mode_hardening.py
      - tests/test_relaylm_repo_inventory_final_hardening.py
    removal_gate: null
    replacement_validation: null
    confidence: confirmed
'''
          tests_new = '''  - asset_id: repo_inventory.tests
    paths: [tests/test_relaylm_repo_inventory.py]
    responsibility: ordinary_test
    lifecycle: active
    owner: repository_maintenance
    protected_boundary: regression coverage for discovery, determinism, cross-mode behavior, subprocess and dynamic-import expansion, storage linkage, config evidence, and one canonical repository-inventory entry point
    current_callers: [.github/workflows/repository-storage-inventory.yml, maintained pytest suite]
    invocation_roots: [pytest_root]
    evidence:
      - tests/test_relaylm_repo_inventory.py
      - .github/workflows/repository-storage-inventory.yml
    removal_gate: null
    replacement_validation: null
    confidence: confirmed
    notes: R2-B consolidated the cross-mode and final-hardening partitions without removing their assertions
'''

          for path in (authority_path, registry_path):
              text = path.read_text(encoding='utf-8')
              text = replace_exact(text, entrypoint_old, entrypoint_new, f'{path} entrypoint record')
              text = replace_exact(
                  text,
                  '      - tests/test_relaylm_repo_inventory_cross_mode_hardening.py\n    removal_gate:',
                  '      - tests/test_relaylm_repo_inventory.py\n    removal_gate:',
                  f'{path} implementation evidence',
              )
              text = replace_exact(text, tests_old, tests_new, f'{path} test record')
              text = replace_exact(
                  text,
                  'source_commit: c6a0735ec51dff2ba4aa4e7f741b3c3d9f788de0',
                  'source_commit: b733903f09a8fda5cb6b440b21a2702225d3c443',
                  f'{path} source provenance',
              )
              path.write_text(text, encoding='utf-8')

          authority = authority_path.read_text(encoding='utf-8')
          authority = replace_exact(
              authority,
              'source main: c6a0735ec51dff2ba4aa4e7f741b3c3d9f788de0\nsource main meaning: squash merge of PR #671\nlane: R\nstage: R3 generated navigation and drift checks\nscope: reviewed classification, one canonical repository-inventory entry point, and its machine-readable mirror',
              'source main: b733903f09a8fda5cb6b440b21a2702225d3c443\nsource main meaning: main after PR #674; R2-B reviewed base\nlane: R\nstage: R2 test / smoke / validation consolidation\nscope: reviewed classification, one canonical repository-inventory entry point, one consolidated inventory pytest owner, and its machine-readable mirror',
              'authority stage header',
          )
          authority = replace_exact(
              authority,
              'No asset in this bounded surface is retired. Every record has a current supported caller or an open protected migration responsibility. R3-A performs no file retirement.',
              'No classified responsibility in this bounded surface is retired. R2-B retires two redundant pytest file partitions through Git history while preserving every assertion in the active repository-inventory test owner.',
              'decision summary wording',
          )
          authority = replace_exact(
              authority,
              '- current complete inventory row counts at `c6a0735e...`; the committed baseline is fixed to `1ca928cd...`;',
              '- current complete inventory row counts at `b733903f...`; the committed baseline is fixed to `1ca928cd...`;',
              'inventory baseline wording',
          )
          authority = replace_exact(
              authority,
              '- whether the three repository-inventory pytest files should remain partitioned after complete overlap review;\n',
              '',
              'resolved R2-B unknown',
          )
          authority = replace_exact(
              authority,
              '### R2-B: repository inventory test partition review\n\nReview the three pytest files for duplicated setup and assertions. Consolidate only when cross-mode, subprocess, deterministic-output, and negative coverage remain clear. File-count reduction alone is insufficient.',
              '### R2-B: repository inventory test consolidation\n\nR2-B consolidates all repository-inventory pytest responsibility into `tests/test_relaylm_repo_inventory.py`. The cross-mode and final-hardening partitions are deleted from the current tree after their six tests are moved unchanged. The dedicated workflow continues to execute the canonical-entrypoint regression by its new path, and the classification authority and mirror identify one maintained pytest owner. Process, operator, migration, and characterization assets are unaffected.',
              'R2-B decision record',
          )
          authority = replace_exact(
              authority,
              'R3-A adds only repository-governance data, validation, tests, and generated navigation wiring. It does not change runtime or storage behavior, APIs, UI, feature gates, user state, `docs/PROJECT_STATUS.md`, Lane D documentation retirement authority, LC-1, or RT-1 paths.',
              'R2-B changes only repository-inventory ordinary tests, their focused workflow invocation, and the Lane R classification authority/mirror. It does not change runtime or storage behavior, process smoke, operator commands, APIs, UI, feature gates, user state, `docs/PROJECT_STATUS.md`, Lane C, Lane D, LC-1, or RT-1 paths.',
              'parallel-safety wording',
          )
          authority_path.write_text(authority, encoding='utf-8')

          construction_path.unlink()
          PY
      - name: Install validation dependencies
        run: python -m pip install --quiet pyyaml pytest
      - name: Validate consolidated ordinary tests
        run: python -m pytest -q tests/test_relaylm_repo_inventory.py
      - name: Validate classification authority and mirror
        run: |
          python -m pytest -q tests/test_relaylm_repository_asset_classification_registry.py
          python scripts/relaylm_repository_asset_classification_registry.py --check
      - name: Validate inventory entry point
        run: python scripts/relaylm_repo_inventory_cli.py --self-test
      - name: Validate negative references and final construction state
        run: |
          test ! -e tests/test_relaylm_repo_inventory_cross_mode_hardening.py
          test ! -e tests/test_relaylm_repo_inventory_final_hardening.py
          test ! -e .github/workflows/r2b-repository-inventory-test-consolidation.yml
          ! git grep -n 'test_relaylm_repo_inventory_cross_mode_hardening.py'
          ! git grep -n 'test_relaylm_repo_inventory_final_hardening.py'
      - name: Commit R2-B stable structure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: consolidate repository inventory regressions"
          git push origin HEAD:agent/r2b-repository-inventory-test-consolidation
