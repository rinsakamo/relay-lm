name: I1-GC documentation reconciliation once

on:
  push:
    branches:
      - phase-i1gc-durable-finalization-replay
    paths:
      - ".github/workflows/i1gc-docs-patch-once.yml"
      - "scripts/relaylm_i1gc_docs_patch_once.py"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i1gc-durable-finalization-replay
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic documentation update
        run: python scripts/relaylm_i1gc_docs_patch_once.py
      - name: Validate documentation
        run: |
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
          PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py
      - name: Remove one-shot tooling and commit
        shell: bash
        run: |
          rm scripts/relaylm_i1gc_docs_patch_once.py
          rm .github/workflows/i1gc-docs-patch-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts .github/workflows
          git commit -m "docs: record I1-GC replay current boundary"
          git push origin HEAD:phase-i1gc-durable-finalization-replay
