name: E1 evaluation consolidation

on:
  pull_request:
    paths:
      - "docs/evidence/migrations/documentation-hard-cutover-receipt.md"
      - "scripts/_tmp_finalize_docs_cutover_1c25.py"
      - ".github/workflows/e1-evaluation-consolidation.yml"

permissions:
  contents: read

concurrency:
  group: e1-evaluation-consolidation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-receipt-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c25-e1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Finalize and diagnose receipt
        shell: bash
        run: |
          set +e
          : > /tmp/c1c25-finalizer.log
          run_check() {
            label="$1"
            shift
            printf '\n== %s ==\n' "$label" | tee -a /tmp/c1c25-finalizer.log
            "$@" >> /tmp/c1c25-finalizer.log 2>&1
            status=$?
            printf 'status=%s\n' "$status" | tee -a /tmp/c1c25-finalizer.log
            return "$status"
          }
          final_status=0
          run_check finalize python scripts/_tmp_finalize_docs_cutover_1c25.py || final_status=$?
          run_check completion-model env PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all || final_status=$?
          run_check pr-link env PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py || final_status=$?
          run_check links env PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py || final_status=$?
          run_check semantic env PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py || final_status=$?
          run_check diff-check git diff --check || final_status=$?
          cat /tmp/c1c25-finalizer.log
          printf '%s\n' "$final_status" > /tmp/c1c25-finalizer.status
          exit 0
      - name: Upload finalizer diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1c25-finalizer-diagnostic
          path: |
            /tmp/c1c25-finalizer.log
            /tmp/c1c25-finalizer.status
          if-no-files-found: error
      - name: Fail on validation error
        run: exit "$(cat /tmp/c1c25-finalizer.status)"
