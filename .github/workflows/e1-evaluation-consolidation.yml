name: E1 evaluation consolidation
# Temporary applicator anchor: PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/mvp/wave5/e1_completion_report.md

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/e1-evaluation-consolidation.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/e1-evaluation-consolidation.yml"

permissions:
  contents: write

concurrency:
  group: e1-evaluation-consolidation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-cutover:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c25-e1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyyaml
      - name: Apply, validate, and record Cutover 1C-25
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            python scripts/_tmp_apply_docs_cutover_1c25.py
            python -m compileall -q relaylm scripts
            PYTHONPATH=.:scripts python scripts/relaylm_e1_evaluation_consolidation_smoke.py
            PYTHONPATH=.:scripts python scripts/relaylm_wave5_cross_slice_convergence_smoke.py
            PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
            PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
            PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
            PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/e1_completion_report.md
            PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
            PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
            test ! -e docs/mvp/wave5/e1_completion_report.md
            test -e docs/evidence/implementation/e1_completion_report.md
            test -e docs/evidence/implementation/e1_completion_report-source.txt
            git diff --check
          ) > /tmp/cutover-1c25.log 2>&1
          status=$?
          cat /tmp/cutover-1c25.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -ne 0 ]; then
            cp /tmp/cutover-1c25.log docs/evidence/migrations/_tmp-cutover-1c25-failure.log
            git add docs/evidence/migrations/_tmp-cutover-1c25-failure.log
            git commit -m 'chore: record Cutover 1C-25 failure'
            git push origin HEAD:agent/docs-cutover-1c25-e1
            exit "$status"
          fi
          rm -f docs/evidence/migrations/_tmp-cutover-1c25-failure.log
          git add -A
          git commit -m 'docs: move E1 report in cutover 1C-25'
          git push origin HEAD:agent/docs-cutover-1c25-e1

  smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile repository Python
        run: python -m compileall -q relaylm scripts
      - name: Run E1 evaluation consolidation smoke
        run: PYTHONPATH=.:scripts python scripts/relaylm_e1_evaluation_consolidation_smoke.py
      - name: Run documentation boundary checks
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/evidence/implementation/e1_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
