name: E1 evaluation consolidation

on:
  pull_request:
    paths:
      - "docs/evidence/migrations/documentation-hard-cutover-receipt.md"
      - "scripts/_tmp_finalize_docs_cutover_1c25.py"
      - ".github/workflows/e1-evaluation-consolidation.yml"

permissions:
  contents: write

concurrency:
  group: e1-evaluation-consolidation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-receipt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c25-e1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semantic audit dependency
        run: python -m pip install pyyaml
      - name: Finalize receipt
        run: python scripts/_tmp_finalize_docs_cutover_1c25.py
      - name: Validate finalized receipt
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          git diff --check
      - name: Commit receipt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/evidence/migrations/documentation-hard-cutover-receipt.md
          git commit -m 'docs: finalize C1C25 receipt'
          git push origin HEAD:agent/docs-cutover-1c25-e1
