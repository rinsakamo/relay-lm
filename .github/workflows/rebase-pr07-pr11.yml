name: Rebase PR-7 through PR-11 stack

on:
  push:
    branches:
      - maintenance/rebase-pr07-pr11-20260710
    paths:
      - .github/workflows/rebase-pr07-pr11.yml

permissions:
  contents: write

jobs:
  rebase-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Rebase stack, verify each layer, and update refs
        shell: bash
        env:
          PR7_OLD_TIP: 6897a37d390200f918329ac5e315a51982ba1ecc
          PR8_OLD_TIP: f57e8338c4b54e5d9b12af7a25b1561e90b409c8
          PR9_OLD_TIP: cf370a107c08ba00f3bf12e275f95c12ce032283
          PR10_OLD_TIP: 103a7ebfb3603f98d1660981f651bd65bd1c4b67
          PR11_OLD_TIP: 6d677b31da01ae8402c6eff9565a2421e4ecf461
          STACK_BASE: a3d50f6d043fa9a2802ffb029b0123f827180a00
          PR7_OLD_BASE: d002120bd2cf2115a01dcf4a69a691060def03ec
          PR8_OLD_BASE: f57e8338c4b54e5d9b12af7a25b1561e90b409c8
          PR9_OLD_BASE: cf370a107c08ba00f3bf12e275f95c12ce032283
          PR10_OLD_BASE: 103a7ebfb3603f98d1660981f651bd65bd1c4b67
        run: |
          set -euo pipefail

          git config user.name "RelayLM stack maintenance"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin \
            main \
            claude/pr-07-stage-runner \
            claude/pr-08-input-stages \
            claude/pr-09-memory-stages \
            claude/pr-10-prebackend-stages \
            claude/pr-11-response-service

          verify_branch() {
            local label="$1"
            echo "::group::verify ${label}"
            python -m compileall -q relaylm tests
            pytest -q
            python scripts/relaylm_acg5_relayemo_scene_cleanup_smoke.py
            python scripts/relaylm_p0_pipeline_ordering_smoke.py
            echo "::endgroup::"
          }

          ensure_relayint_anchors() {
            python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/relaylm_acg5_relayemo_scene_cleanup_smoke.py")
          text = path.read_text(encoding="utf-8")
          replacement = '''"relayint": {
                  "build_relayint_reference_intent_artifact",
                  "build_relayint_reference_repair_dry_run",
                  "run_relayint_stage",
              },'''
          updated, count = re.subn(
              r'"relayint":\s*\{[^}]*\},',
              replacement,
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("could not locate exactly one RelayINT identifier set")
          if updated != text:
              path.write_text(updated, encoding="utf-8")
          PY
            if ! git diff --quiet -- scripts/relaylm_acg5_relayemo_scene_cleanup_smoke.py; then
              git add scripts/relaylm_acg5_relayemo_scene_cleanup_smoke.py
              git commit -m "Fix RelayINT ordering smoke anchors"
            fi
          }

          continue_expected_rebase() {
            local label="$1"
            while git rev-parse -q --verify REBASE_HEAD >/dev/null 2>&1; do
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              if [[ ${#conflicts[@]} -eq 0 ]]; then
                GIT_EDITOR=true git rebase --continue
                continue
              fi
              for path in "${conflicts[@]}"; do
                case "${label}:${path}" in
                  pr9:scripts/relaylm_acg5_relayemo_scene_cleanup_smoke.py)
                    git checkout --theirs -- "$path"
                    ;;
                  *)
                    echo "Unexpected rebase conflict for ${label}: ${path}" >&2
                    exit 1
                    ;;
                esac
              done
              ensure_relayint_anchors
              git add "${conflicts[@]}"
              GIT_EDITOR=true git rebase --continue
            done
          }

          rebase_layer() {
            local label="$1"
            local remote_ref="$2"
            local new_base="$3"
            local old_base="$4"
            git switch --detach "$remote_ref"
            if ! git rebase --onto "$new_base" "$old_base"; then
              continue_expected_rebase "$label"
            fi
            ensure_relayint_anchors
          }

          push_with_lease() {
            local branch="$1"
            local expected_old="$2"
            git push origin HEAD:"refs/heads/${branch}" \
              --force-with-lease="refs/heads/${branch}:${expected_old}"
          }

          # PR-7 contains six pre-PR Wave A commits followed by the actual PR-7
          # commits and the review fixes. Drop the first six and replay only the
          # PR-7 slice onto the current main tip.
          mapfile -t pr7_commits < <(
            git rev-list --reverse "${STACK_BASE}..origin/claude/pr-07-stage-runner"
          )
          if [[ ${#pr7_commits[@]} -ne 12 ]]; then
            printf 'Unexpected PR-7 commit count: %s\n' "${#pr7_commits[@]}" >&2
            printf '%s\n' "${pr7_commits[@]}" >&2
            exit 1
          fi
          pr7_wave_a_tip="${pr7_commits[5]}"
          git switch --detach origin/claude/pr-07-stage-runner
          git rebase --onto origin/main "$pr7_wave_a_tip"
          ensure_relayint_anchors
          verify_branch pr7
          PR7_NEW="$(git rev-parse HEAD)"
          push_with_lease claude/pr-07-stage-runner "$PR7_OLD_TIP"

          rebase_layer pr8 origin/claude/pr-08-input-stages "$PR7_NEW" "$PR7_OLD_BASE"
          verify_branch pr8
          PR8_NEW="$(git rev-parse HEAD)"
          push_with_lease claude/pr-08-input-stages "$PR8_OLD_TIP"

          rebase_layer pr9 origin/claude/pr-09-memory-stages "$PR8_NEW" "$PR8_OLD_BASE"
          verify_branch pr9
          PR9_NEW="$(git rev-parse HEAD)"
          push_with_lease claude/pr-09-memory-stages "$PR9_OLD_TIP"

          rebase_layer pr10 origin/claude/pr-10-prebackend-stages "$PR9_NEW" "$PR9_OLD_BASE"
          verify_branch pr10
          PR10_NEW="$(git rev-parse HEAD)"
          push_with_lease claude/pr-10-prebackend-stages "$PR10_OLD_TIP"

          rebase_layer pr11 origin/claude/pr-11-response-service "$PR10_NEW" "$PR10_OLD_BASE"

          python - <<'PY'
          from pathlib import Path

          smoke = Path("scripts/relaylm_relayemo_smoke.py")
          smoke_text = smoke.read_text(encoding="utf-8")
          old_smoke_import = '''from relaylm.managed_chat_runtime import (
              _apply_relayemo_marker_to_response,
              _build_relayemo_text_marker_preview,
          )'''
          new_smoke_import = '''from relaylm.relayemo_response_marker import (
              apply_relayemo_marker_to_response as _apply_relayemo_marker_to_response,
              build_relayemo_text_marker_preview as _build_relayemo_text_marker_preview,
          )'''
          if old_smoke_import not in smoke_text:
              raise SystemExit("expected managed_chat_runtime marker import not found")
          smoke.write_text(smoke_text.replace(old_smoke_import, new_smoke_import), encoding="utf-8")

          runtime = Path("relaylm/managed_chat_runtime.py")
          runtime_text = runtime.read_text(encoding="utf-8")
          old_runtime_import = '''from relaylm.relayemo_response_marker import (
              # These two aliases are no longer used in this module (the response-side
              # marker application they backed moved to
              # relaylm.managed_chat_response._build_nonstream_response, which imports
              # the same functions under their plain names). The aliased imports stay
              # here solely because scripts/relaylm_relayemo_smoke.py imports them by
              # these names directly from relaylm.managed_chat_runtime.
              apply_relayemo_marker_to_response as _apply_relayemo_marker_to_response,
              build_relayemo_text_marker_preview as _build_relayemo_text_marker_preview,
          )
          '''
          if old_runtime_import not in runtime_text:
              raise SystemExit("expected compatibility marker import block not found")
          runtime.write_text(runtime_text.replace(old_runtime_import, ""), encoding="utf-8")
          PY
          git add relaylm/managed_chat_runtime.py scripts/relaylm_relayemo_smoke.py
          git commit -m "Remove response marker compatibility aliases"

          verify_branch pr11
          PR11_NEW="$(git rev-parse HEAD)"
          push_with_lease claude/pr-11-response-service "$PR11_OLD_TIP"

          {
            echo "PR7_NEW=${PR7_NEW}"
            echo "PR8_NEW=${PR8_NEW}"
            echo "PR9_NEW=${PR9_NEW}"
            echo "PR10_NEW=${PR10_NEW}"
            echo "PR11_NEW=${PR11_NEW}"
          } | tee /tmp/rebased-heads.txt

      - name: Upload rebased head summary
        uses: actions/upload-artifact@v4
        with:
          name: rebased-heads
          path: /tmp/rebased-heads.txt
