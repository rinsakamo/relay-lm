# Pull-request trigger commit for observable one-shot execution.
name: Rebase PR-7 through PR-11 stack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebase-pr07-pr11.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rebase-pr07-pr11.yml
      - .github/scripts/rebase-pr07-pr11.sh

permissions:
  contents: write

concurrency:
  group: relaylm-rebase-pr07-pr11
  cancel-in-progress: false

jobs:
  rebase-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Rebase, verify, and atomically update the stack
        run: bash .github/scripts/rebase-pr07-pr11.sh

      - name: Upload rebased head summary
        uses: actions/upload-artifact@v4
        with:
          name: rebased-heads
          path: /tmp/rebased-heads.txt
