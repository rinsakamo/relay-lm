# Pull-request trigger commit for observable one-shot execution.
name: Rebase PR-7 through PR-11 stack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebase-pr07-pr11.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rebase-pr07-pr11.yml
      - .github/scripts/rebase-pr07-pr11.sh

permissions:
  contents: write

concurrency:
  group: relaylm-rebase-pr07-pr11
  cancel-in-progress: false

jobs:
  rebase-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Rebase, verify, and atomically update the stack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/rebase-pr07-pr11.sh')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'pr7_wave_a_tip="${pr7_commits[5]}"': 'pr7_wave_a_tip="${pr7_commits[6]}"',
              'git rm "$WORKFLOW_PATH" "$SCRIPT_PATH"': 'git rm -f "$WORKFLOW_PATH" "$SCRIPT_PATH"',
              'pr9:scripts/relaylm_acg5_relayemo_scene_cleanup_smoke.py)': 'pr9:relaylm/managed_chat_runtime.py|pr9:scripts/relaylm_acg5_relayemo_scene_cleanup_smoke.py)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected one-shot script fragment not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          set -o pipefail
          bash .github/scripts/rebase-pr07-pr11.sh 2>&1 | tee /tmp/rebase-pr07-pr11.log

      - name: Upload rebase diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebase-diagnostics-${{ github.run_id }}
          path: /tmp/rebase-pr07-pr11.log

      - name: Upload rebased head summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rebased-heads
          path: /tmp/rebased-heads.txt
