name: Temporary Phase I-3 recovery code diagnosis

on:
  push:
    branches:
      - phase-i3-auditable-primary-mem-correct
    paths:
      - .github/workflows/phase-i3-temporary-recovery-code.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i3-auditable-primary-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Capture bounded recovery failure code
        run: |
          PYTHONPATH=.:scripts python - <<'PY'
          import json
          from pathlib import Path
          import relaylm.relaymem_primary_correction as correction
          import relaylm_phase_i3_primary_mem_correct_fault_smoke as smoke

          observed = []
          original = correction._publish_prepared_successor
          def wrapped(*args, **kwargs):
              try:
                  return original(*args, **kwargs)
              except correction.PrimaryCorrectionError as error:
                  observed.append(error.code)
                  raise
          correction._publish_prepared_successor = wrapped
          try:
              smoke.main()
          except AssertionError:
              pass
          allowed = {
              "invalid_request", "not_found_or_wrong_scope", "stale_revision",
              "operation_conflict", "token_expired", "token_invalid", "target_corrupt",
              "reconciliation_required", "store_unavailable", "response_lost",
          }
          bounded = [code for code in observed if code in allowed]
          Path("phase-i3-recovery-code.json").write_text(
              json.dumps({"codes": bounded}, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Record bounded recovery code
        run: |
          {
            printf '\n## Recovery code diagnosis\n\n```json\n'
            cat phase-i3-recovery-code.json
            printf '```\n'
          } >> docs/architecture/phase_i3_validation_receipt.md
          rm phase-i3-recovery-code.json
          rm .github/workflows/phase-i3-temporary-recovery-code.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/phase_i3_validation_receipt.md
          git add -u .github/workflows/phase-i3-temporary-recovery-code.yml
          git commit -m "test: record Phase I3 recovery failure code"
          git push origin HEAD:phase-i3-auditable-primary-mem-correct
