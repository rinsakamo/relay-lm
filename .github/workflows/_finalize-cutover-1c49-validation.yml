name: Finalize cutover 1C-49 validation facts

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/docs-cutover-1c49-phase55c0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-cutover-1c49-phase55c0
          fetch-depth: 0
      - name: Record latest-main validation facts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          validated_head = 'c7682947eea1ce97ed84e9586f4f9c225683be8b'
          receipt = Path('docs/evidence/migrations/cutover-1c49-phase55c0.md')
          ledger = Path('docs/evidence/migrations/documentation-hard-cutover-receipt.md')

          text = receipt.read_text(encoding='utf-8')
          text = text.replace(
              '- Validated content head: `7c7fc6097252f6a89131d8020ce62ce6a9f96dac`',
              f'- Validated content head: `{validated_head}`',
          )
          text = text.replace(
              '- Open-PR content imported: none; PR #621 now shares `.github/workflows/documentation-current-boundary-smoke.yml` in disjoint validation blocks and must preserve both the C0 guard and Subjective MEM integration when reconciled; PR #586 shares only `docs/evidence/implementation/README.md` in a disjoint added entry; PR #578/#567 have no path overlap',
              '- Open-PR content imported: none; merged PRs #621 and #623 are part of base main and their Subjective MEM plus storage-authority workflow integration is preserved alongside the C0 guard; PR #586 shares only `docs/evidence/implementation/README.md` in a disjoint added entry; PR #578 has no changed-path overlap',
          )
          receipt.write_text(text, encoding='utf-8')

          text = ledger.read_text(encoding='utf-8')
          text = text.replace(
              'validated_content_head: 7c7fc6097252f6a89131d8020ce62ce6a9f96dac',
              f'validated_content_head: {validated_head}',
              1,
          )
          text = text.replace(
              '  open_pr_shared_path_reconciliation: ["#586:preserve C0 implementation-evidence index entry when rebased", "#621:shared documentation-boundary workflow; preserve both C0 guard and Subjective MEM integration during reconciliation"]',
              '  open_pr_shared_path_reconciliation: ["#586:preserve C0 implementation-evidence index entry when rebased"]',
              1,
          )
          ledger.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- docs/evidence/migrations/cutover-1c49-phase55c0.md docs/evidence/migrations/documentation-hard-cutover-receipt.md; then
            echo 'Validation facts already recorded.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/migrations/cutover-1c49-phase55c0.md docs/evidence/migrations/documentation-hard-cutover-receipt.md
          git diff --cached --check
          git commit -m 'docs: record latest-main cutover 1C-49 validation facts'
          git push origin HEAD:agent/docs-cutover-1c49-phase55c0
