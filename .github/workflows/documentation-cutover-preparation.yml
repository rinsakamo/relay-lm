name: Documentation cutover preparation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/planning/documentation-cutover-rules.yaml"
      - "docs/planning/documentation-cutover-tooling.md"
      - "docs/planning/documentation-architecture-inventory.md"
      - "docs/planning/documentation-target-architecture-graph.md"
      - "docs/planning/documentation-placement-decisions.md"
      - "scripts/relaylm_docs_cutover_prepare.py"
      - "scripts/relaylm_docs_normative_digest.py"
      - ".github/workflows/documentation-cutover-preparation.yml"
  push:
    branches:
      - main
    paths:
      - "docs/planning/documentation-cutover-rules.yaml"
      - "scripts/relaylm_docs_cutover_prepare.py"
      - "scripts/relaylm_docs_normative_digest.py"
      - ".github/workflows/documentation-cutover-preparation.yml"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Compile and self-test preparation tools
        run: |
          python -m compileall -q \
            scripts/relaylm_docs_cutover_prepare.py \
            scripts/relaylm_docs_normative_digest.py
          python scripts/relaylm_docs_cutover_prepare.py --self-test
          python scripts/relaylm_docs_normative_digest.py --self-test
      - name: Generate strict dry run twice
        run: |
          set -euo pipefail
          baseline="22981c3b26b2ec0141093d1ec23592d304f1a053"
          for output in generated/documentation-cutover-a generated/documentation-cutover-b; do
            python scripts/relaylm_docs_cutover_prepare.py \
              --baseline "$baseline" \
              --rules docs/planning/documentation-cutover-rules.yaml \
              --output-dir "$output" \
              --strict
            python scripts/relaylm_docs_normative_digest.py \
              --baseline "$baseline" \
              --rules docs/planning/documentation-cutover-rules.yaml \
              --inventory "$output/inventory.json" \
              --output-dir "$output" \
              --strict
          done
          diff -ru generated/documentation-cutover-a generated/documentation-cutover-b
          mv generated/documentation-cutover-a generated/documentation-cutover
          rm -rf generated/documentation-cutover-b
      - name: Check diff whitespace
        run: git diff --check
      - name: Publish summary
        if: always()
        run: |
          if [ -f generated/documentation-cutover/summary.md ]; then
            cat generated/documentation-cutover/summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f generated/documentation-cutover-a/summary.md ]; then
            cat generated/documentation-cutover-a/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f generated/documentation-cutover/normative-digests.md ]; then
            cat generated/documentation-cutover/normative-digests.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f generated/documentation-cutover-a/normative-digests.md ]; then
            cat generated/documentation-cutover-a/normative-digests.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload dry-run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-cutover-preparation
          path: |
            generated/documentation-cutover
            generated/documentation-cutover-a
          if-no-files-found: warn
          retention-days: 14
