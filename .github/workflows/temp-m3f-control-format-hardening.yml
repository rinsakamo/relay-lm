name: Temporary M3f control format hardening

on:
  push:
    branches:
      - relaymem-m3f-primary-index-log-reconciliation
    paths:
      - ".github/workflows/temp-m3f-control-format-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relaymem-m3f-primary-index-log-reconciliation
      - name: Apply exact control format hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          plan = Path("relaylm/_relaymem_primary_index_log_reconciliation_plan.py")
          text = plan.read_text(encoding="utf-8")
          replacements = [
              (
                  '        marker="relaymem-primary-index-entry-v0",\n        entry=entry,\n',
                  '        marker="relaymem-primary-index-entry-v0",\n        expected_header="# Index",\n        entry=entry,\n',
              ),
              (
                  '        marker="relaymem-primary-log-entry-v0",\n        entry=entry,\n',
                  '        marker="relaymem-primary-log-entry-v0",\n        expected_header="# Log",\n        entry=entry,\n',
              ),
              (
                  '    marker: str,\n    entry: Mapping[str, Any],\n',
                  '    marker: str,\n    expected_header: str,\n    entry: Mapping[str, Any],\n',
              ),
              (
                  '    parsed = _parse_markers(current, marker)\n',
                  '    parsed = _parse_markers(current, marker, expected_header)\n',
              ),
              (
                  'def _parse_markers(content: bytes, marker: str) -> dict[str, Any]:\n',
                  'def _parse_markers(\n    content: bytes, marker: str, expected_header: str\n) -> dict[str, Any]:\n',
              ),
              (
                  '    entries: list[dict[str, Any]] = []\n    prefix = f"<!-- {marker} "\n    suffix = " -->"\n    for line in text.splitlines():\n',
                  '    lines = text.splitlines()\n    if not lines or lines[0] != expected_header:\n        return _invalid("primary_reconciliation_control_file_header_mismatch")\n    entries: list[dict[str, Any]] = []\n    prefix = f"<!-- {marker} "\n    suffix = " -->"\n    for line in lines[1:]:\n        if line.lstrip().startswith("<!-- relaymem-primary-") and marker not in line:\n            return _invalid("primary_reconciliation_marker_schema_unsupported")\n',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected plan replacement count for {old!r}")
              text = text.replace(old, new)
          plan.write_text(text, encoding="utf-8")

          smoke = Path("scripts/relaylm_relaymem_primary_index_log_reconciliation_marker_smoke.py")
          text = smoke.read_text(encoding="utf-8")
          old = '        print("ok noncanonical marker JSON fails closed")\n\n'
          new = '''        print("ok noncanonical marker JSON fails closed")\n\n        fixture(root)\n        index_path.write_text("not-an-index\\n", encoding="utf-8")\n        bad_index_header = preflight(root, receipt)\n        require(bad_index_header["status"] == "index_conflict", bad_index_header)\n\n        receipt, _, index_path, log_path = fixture(root)\n        first = preflight(root, receipt)\n        index_path.write_text(\n            first["plan"]["index_plan"]["proposed_next_content"],\n            encoding="utf-8",\n        )\n        log_path.write_text("not-a-log\\n", encoding="utf-8")\n        bad_log_header = preflight(root, receipt)\n        require(bad_log_header["status"] == "log_conflict", bad_log_header)\n        print("ok exact index and log base headings are required")\n\n        receipt, _, index_path, _ = fixture(root)\n        index_path.write_text(\n            "# Index\\n<!-- relaymem-primary-index-entry-v1 {} -->\\n",\n            encoding="utf-8",\n        )\n        unknown_marker = preflight(root, receipt)\n        require(unknown_marker["status"] == "index_conflict", unknown_marker)\n        print("ok unknown reconciliation marker versions fail closed")\n\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected marker smoke insertion count")
          smoke.write_text(text.replace(old, new), encoding="utf-8")

          doc = Path("docs/architecture/relaymem_m3f_primary_index_log_reconciliation_preflight.md")
          text = doc.read_text(encoding="utf-8")
          old = "All three files must be regular UTF-8 files. OS exception strings and absolute root paths are not copied into diagnostics.\n"
          new = "All three files must be regular UTF-8 files. The control files must retain their exact first-line base headings, `# Index` and `# Log`; a missing or substituted heading is a conflict. OS exception strings and absolute root paths are not copied into diagnostics.\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected documentation replacement count")
          text = text.replace(old, new)
          old = "malformed or non-canonical markers, unknown marker fields, or schema/value mismatches are `index_conflict`."
          new = "malformed or non-canonical markers, markers from another control-file family, unknown marker versions or fields, or schema/value mismatches are `index_conflict`."
          if text.count(old) != 1:
              raise SystemExit("unexpected index documentation replacement count")
          text = text.replace(old, new)
          doc.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            relaylm/_relaymem_primary_index_log_reconciliation_plan.py \
            scripts/relaylm_relaymem_primary_index_log_reconciliation_marker_smoke.py \
            docs/architecture/relaymem_m3f_primary_index_log_reconciliation_preflight.md
          git commit -m "fix: validate M3f control file base format"
          git push origin HEAD:relaymem-m3f-primary-index-log-reconciliation
