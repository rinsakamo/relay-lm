name: RelayMEM Primary index log reconciliation smoke

on:
  pull_request:
    paths:
      - "relaylm/relaymem_primary_index_log_reconciliation.py"
      - "relaylm/_relaymem_primary_index_log_reconciliation.py"
      - "relaylm/_relaymem_primary_index_log_reconciliation_contract.py"
      - "relaylm/_relaymem_primary_index_log_reconciliation_io.py"
      - "relaylm/_relaymem_primary_index_log_reconciliation_plan.py"
      - "scripts/relaylm_relaymem_primary_index_log_reconciliation_smoke.py"
      - "scripts/relaylm_relaymem_primary_index_log_reconciliation_marker_smoke.py"
      - "docs/architecture/relaymem_m3f_primary_index_log_reconciliation_preflight.md"
      - ".github/workflows/relaymem-primary-index-log-reconciliation-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/relaymem_primary_index_log_reconciliation.py"
      - "relaylm/_relaymem_primary_index_log_reconciliation.py"
      - "relaylm/_relaymem_primary_index_log_reconciliation_contract.py"
      - "relaylm/_relaymem_primary_index_log_reconciliation_io.py"
      - "relaylm/_relaymem_primary_index_log_reconciliation_plan.py"
      - "scripts/relaylm_relaymem_primary_index_log_reconciliation_smoke.py"
      - "scripts/relaylm_relaymem_primary_index_log_reconciliation_marker_smoke.py"
      - "docs/architecture/relaymem_m3f_primary_index_log_reconciliation_preflight.md"
      - ".github/workflows/relaymem-primary-index-log-reconciliation-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RelayMEM M3f helper and smoke
        run: >-
          python -m compileall -q
          relaylm/relaymem_primary_index_log_reconciliation.py
          relaylm/_relaymem_primary_index_log_reconciliation.py
          relaylm/_relaymem_primary_index_log_reconciliation_contract.py
          relaylm/_relaymem_primary_index_log_reconciliation_io.py
          relaylm/_relaymem_primary_index_log_reconciliation_plan.py
          scripts/relaylm_relaymem_primary_index_log_reconciliation_smoke.py
          scripts/relaylm_relaymem_primary_index_log_reconciliation_marker_smoke.py
      - name: Run RelayMEM M3f reconciliation preflight smoke
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_reconciliation_smoke.py \
            2>&1 | tee /tmp/relaymem-m3f-smoke.log
      - name: Upload RelayMEM M3f failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relaymem-m3f-smoke-failure
          path: /tmp/relaymem-m3f-smoke.log
          if-no-files-found: error
      - name: Run RelayMEM M3f marker hardening smoke
        run: >-
          PYTHONPATH=.
          python scripts/relaylm_relaymem_primary_index_log_reconciliation_marker_smoke.py
