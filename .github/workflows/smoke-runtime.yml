# Consolidated non-RelayMEM runtime smokes with a changed-group matrix.

name: RelayLM runtime code smokes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "relaylm/**"
      - "scripts/**"
      - "docs/architecture/**"
      - "docs/evidence/implementation/**"
      - "config.example.yaml"
      - "pyproject.toml"
      - ".github/workflows/smoke-runtime.yml"
  pull_request:
    paths:
      - "relaylm/**"
      - "scripts/**"
      - "docs/architecture/**"
      - "docs/evidence/implementation/**"
      - "config.example.yaml"
      - "pyproject.toml"
      - ".github/workflows/smoke-runtime.yml"

permissions:
  contents: read

concurrency:
  group: smoke-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select changed runtime groups
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            matrix="$(python scripts/relaylm_ci_changed_matrix.py --workflow runtime --all)"
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$PUSH_BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --check "$base" "$GITHUB_SHA"
          git diff --name-only "$base" "$GITHUB_SHA" > changed-files.txt
          cat changed-files.txt
          matrix="$(python scripts/relaylm_ci_changed_matrix.py --workflow runtime --files changed-files.txt)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  smoke:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    name: Runtime / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Compile package and smoke scripts
        run: python -m compileall -q relaylm scripts
      - name: Run selected runtime smoke group
        shell: bash
        run: |
          set -o pipefail
          python scripts/relaylm_ci_consolidated_smoke.py run --workflow runtime --group "${{ matrix.group }}" 2>&1 | tee "${{ matrix.name }}.log"
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.name }}-log
          path: ${{ matrix.name }}.log
          if-no-files-found: error
          retention-days: 3
