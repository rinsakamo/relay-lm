permissions:
  contents: read

jobs:
  client-instruction:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install package
      run: python -m pip install -e .
    - name: Compile package and smoke scripts
      run: python -m compileall relaylm scripts
    - name: Run RelaySCN projection smoke
      run: python scripts/relaylm_client_instruction_relayscn_projection_smoke.py
    - name: Run cache lookup runtime regression
      run: python scripts/relaylm_client_instruction_cache_lookup_runtime_smoke.py
    - name: Run typed parse cache write smoke
      run: python scripts/relaylm_client_instruction_typed_parse_cache_write_smoke.py
    - name: Run runtime cache writer smoke
      run: python scripts/relaylm_client_instruction_cache_write_runtime_smoke.py

  relayctx-tts-stream:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check diff whitespace
      run: git diff --check origin/main...HEAD
    - name: Install package
      run: python -m pip install -e .
    - name: Compile package and smoke scripts
      run: python -m compileall relaylm scripts
    - name: Run stream sentinel smoke
      run: python scripts/relaylm_relayctx_stream_unpack_sentinel_smoke.py
    - name: Run runtime stream suppression smoke
      run: python scripts/relaylm_relayctx_stream_suppression_runtime_smoke.py
    - name: Run runtime TTS handoff smoke
      run: python scripts/relaylm_relayctx_tts_adapter_handoff_runtime_smoke.py
    - name: Run TTS adapter handoff smoke
      run: python scripts/relaylm_relayctx_tts_adapter_handoff_smoke.py
    - name: Run TTS adapter transport smoke
      run: python scripts/relaylm_relayctx_tts_adapter_transport_smoke.py
    - name: Run TTS segmentation smoke
      run: python scripts/relaylm_relayctx_tts_segmentation_smoke.py

  relayrun-lazy-recovery:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check diff whitespace
      run: git diff --check origin/main...HEAD
    - name: Install package
      run: python -m pip install -e .
    - name: Compile package and smoke scripts
      run: python -m compileall relaylm scripts
    - name: Run lazy RelayRUN recovery detail smoke
      run: python scripts/relaylm_relayrun_lazy_recovery_detail_smoke.py
    - name: Run runtime wiring smoke
      run: python scripts/relaylm_relayrun_lazy_recovery_runtime_wiring_smoke.py
    - name: Run runtime checkpoint smoke
      run: python scripts/relaylm_relayrun_runtime_checkpoint_dry_run_smoke.py

  token-estimation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check diff whitespace
      run: git diff --check origin/main...HEAD
    - name: Install package
      run: python -m pip install -e .
    - name: Compile package and smoke scripts
      run: python -m compileall relaylm scripts
    - name: Run CJK estimator contract
      run: python scripts/relaylm_cjk_token_estimation_smoke.py
    - name: Run full-width space regression
      run: python scripts/relaylm_fullwidth_space_token_smoke.py
    - name: Run RelayMEM CJK runtime estimate contract
      run: python scripts/relaylm_relaymem_cjk_runtime_estimation_smoke.py
    - name: Run token memory regression
      run: python scripts/relaylm_token_memory_dry_run_smoke.py
    - name: Run message truncation contract
      run: python scripts/relaylm_token_budget_truncation_smoke.py
    - name: Run truncation dry-run regression
      run: python scripts/relaylm_token_budget_truncation_dry_run_smoke.py
    - name: Run truncation apply regression
      run: python scripts/relaylm_token_budget_truncation_apply_smoke.py
    - name: Run truncation proxy regression
      run: python scripts/relaylm_token_budget_truncation_proxy_smoke.py

  merged-review-residuals:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -e .
    - run: >-
        python -m compileall relaylm
        scripts/relaylm_merged_review_residuals_smoke.py
        scripts/relaylm_m3c_operation_index_normalization_smoke.py
    - run: python scripts/relaylm_merged_review_residuals_smoke.py
    - run: python scripts/relaylm_m3c_operation_index_normalization_smoke.py

  e1r1-trusted-home-scene-admission:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
    - name: E1-R1 validation
      run: |
        python -m compileall -q relaylm scripts
        PYTHONPATH=.:scripts python scripts/relaylm_e1r1_trusted_home_scene_admission_smoke.py
        PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/mvp/wave6/e1r1_completion_report.md
    # scripts/relaylm_docs_link_check.py and
    # scripts/relaylm_mvp_completion_report_pr_link_smoke.py dropped here:
    # job e1r2-character-store-bootstrap below already runs both verbatim.

  e1r2-character-store-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: e1r2-character-store-bootstrap-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v4
      with:
        show-progress: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install package
      run: python -m pip install -e .
    - name: Compile repository Python
      run: python -m compileall -q relaylm scripts
    - name: Run E1-R2 bootstrap smoke
      run: |
        set +e
        PYTHONPATH=.:scripts python scripts/relaylm_e1r2_character_store_bootstrap_smoke.py > e1r2-smoke.log 2>&1
        status=$?
        cat e1r2-smoke.log
        exit ${status}
    - name: Upload E1-R2 smoke log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e1r2-smoke-log
        path: e1r2-smoke.log
    - name: Run documentation checks
      run: |
        PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/mvp/wave6/e1r2_completion_report.md
        PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
        PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py

  soul-lab-management:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install RelayLM
      run: python -m pip install -e .
    - name: Compile SOUL Lab management modules
      run: python -m compileall -q relaylm/soul_lab_management.py relaylm/soul_lab_app.py scripts/relaylm_soul_lab_management_projection_smoke.py
    - name: Run SOUL Lab management projection smoke
      run: python scripts/relaylm_soul_lab_management_projection_smoke.py
