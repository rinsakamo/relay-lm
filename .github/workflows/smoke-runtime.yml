# Consolidated non-RelayMEM runtime code smokes: client-instruction, RelayCTX
# stream/TTS, RelayRUN lazy recovery, token estimation, merged-review
# residuals, E1-R1/E1-R2, and SOUL Lab management projection.
#
# <old-workflow-file> -> job <job-name>
# client-instruction-relayscn-projection-smoke.yml -> job client-instruction
# client-instruction-typed-parse-cache-write-smoke.yml -> job client-instruction
# relayctx-stream-unpack-sentinel-smoke.yml -> job relayctx-tts-stream
# relayctx-tts-adapter-handoff-runtime-smoke.yml -> job relayctx-tts-stream
# relayctx-tts-adapter-handoff-smoke.yml -> job relayctx-tts-stream
# relayctx-tts-adapter-transport-smoke.yml -> job relayctx-tts-stream
# relayctx-tts-segmentation-smoke.yml -> job relayctx-tts-stream
# relayrun-lazy-recovery-detail-smoke.yml -> job relayrun-lazy-recovery
# relayrun-lazy-recovery-runtime-smoke.yml -> job relayrun-lazy-recovery
# token-estimation-smoke.yml -> job token-estimation
# merged-review-residuals-smoke.yml -> job merged-review-residuals
# e1r1-trusted-home-scene-admission.yml -> job e1r1-trusted-home-scene-admission
# e1r2-character-store-bootstrap.yml -> job e1r2-character-store-bootstrap
# soul-lab-management-projection.yml -> job soul-lab-management
#
# Dropped duplicate invocations (documented per PR-13 dedup convention):
# - job relayctx-tts-stream: 4 of the 5 absorbed workflows each ran an
#   identical "git diff --check origin/main...HEAD" whitespace step; kept
#   one instance for the job instead of five.
# - job e1r1-trusted-home-scene-admission: dropped its own
#   scripts/relaylm_docs_link_check.py and
#   scripts/relaylm_mvp_completion_report_pr_link_smoke.py invocations
#   because job e1r2-character-store-bootstrap in this same file already
#   runs both verbatim (identical commands, no arguments differ).

