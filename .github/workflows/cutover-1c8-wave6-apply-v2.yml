name: Cutover 1C-8 Wave 6 applicator v2

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.head_ref == 'agent/docs-cutover-1c8-wave6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Wave 6 hard cutover
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import subprocess
          from pathlib import Path

          OLD = "docs/architecture/wave6_cross_slice_convergence_audit.md"
          SNAPSHOT = "docs/evidence/waves/wave6_cross_slice_convergence_audit-source.txt"
          CANONICAL = "docs/evidence/waves/wave6_cross_slice_convergence_audit.md"
          SOURCE_BLOB = "ecb06b4a95095c28c2b953fae926219d22cfe814"
          SOURCE_SHA256 = "915b99fba7e136543be041ab44debc9331ef081ed0c80b1ad1226fd184b9bbf4"
          SOURCE_COMMIT = "497ee3196c93ec0f69b4001a9c6bbd237009e35a"
          SOURCE_PR = 435
          MERGED_1C7 = "8cf7caca3891b29cf3439dde8fb23e81a365a254"
          pr_number = int(os.environ["PR_NUMBER"])

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")

          def replace_one(path: str, old: str, new: str) -> None:
              text = read(path)
              if text.count(old) != 1:
                  raise AssertionError(f"{path}: expected one occurrence of {old!r}, found {text.count(old)}")
              write(path, text.replace(old, new, 1))

          source_path = Path(OLD)
          source_bytes = source_path.read_bytes()
          source_text = source_bytes.decode("utf-8")
          if hashlib.sha256(source_bytes).hexdigest() != SOURCE_SHA256:
              raise AssertionError("Wave 6 source SHA-256 mismatch")
          if subprocess.check_output(["git", "hash-object", OLD], text=True).strip() != SOURCE_BLOB:
              raise AssertionError("Wave 6 source Git blob mismatch")

          Path(SNAPSHOT).parent.mkdir(parents=True, exist_ok=True)
          Path(SNAPSHOT).write_bytes(source_bytes)

          parts = source_text.split("---\n", 2)
          if len(parts) != 3 or parts[0] != "":
              raise AssertionError("unexpected Wave 6 front matter")
          body = parts[2]
          generated = "Generated: 2026-06-28 JST.\n\n"
          status = (
              "## Status and authority\n\n"
              "W6-INT converged the merged O1F, I-5B, I-7C, E1-R1, and E1-R2 tracks and was merged through PR #435. Later work may use this document only as frozen evidence for the Wave 6 convergence point.\n\n"
              "This audit preserves source PRs, merge commits, integrated authority boundaries, leakage review, non-goals, and frozen next inputs. Dedicated handoffs and production modules remain authoritative for lower-level behavior. Current repository-wide status after Wave 6 belongs to [Project Status](../../PROJECT_STATUS.md).\n\n"
              "The exact submitted source is retained byte-for-byte as [wave6_cross_slice_convergence_audit-source.txt](wave6_cross_slice_convergence_audit-source.txt).\n\n"
          )
          if body.count(generated) != 1:
              raise AssertionError("Wave 6 generated marker mismatch")
          body = body.replace(generated, generated + status, 1)
          link_replacements = {
              "[Project Status](../PROJECT_STATUS.md)": "[Project Status](../../PROJECT_STATUS.md)",
              "(o1f_operational_validation.md)": "(../../architecture/o1f_operational_validation.md)",
              "(phase_i5b_pin_unpin_apply.md)": "(../../architecture/phase_i5b_pin_unpin_apply.md)",
              "(phase_i7c_held_apply_discard_runtime.md)": "(../../architecture/phase_i7c_held_apply_discard_runtime.md)",
              "(e1r1_trusted_home_scene_admission.md)": "(../../architecture/e1r1_trusted_home_scene_admission.md)",
              "(e1r2_character_store_bootstrap.md)": "(../../architecture/e1r2_character_store_bootstrap.md)",
              "(../mvp/wave6/o1f_completion_report.md)": "(../../mvp/wave6/o1f_completion_report.md)",
              "(../mvp/wave6/i5b_completion_report.md)": "(../../mvp/wave6/i5b_completion_report.md)",
              "(../mvp/wave6/i7c_completion_report.md)": "(../../mvp/wave6/i7c_completion_report.md)",
              "(../mvp/wave6/e1r1_completion_report.md)": "(../../mvp/wave6/e1r1_completion_report.md)",
              "(../mvp/wave6/e1r2_completion_report.md)": "(../../mvp/wave6/e1r2_completion_report.md)",
          }
          for old, new in link_replacements.items():
              if old not in body:
                  raise AssertionError(f"canonical link source missing: {old}")
              body = body.replace(old, new)

          metadata = f"""---
          relaylm_doc_type: evidence
          relaylm_authority: wave6_cross_slice_convergence_record
          relaylm_status: frozen
          relaylm_volatility: low
          relaylm_owner: documentation
          relaylm_update_trigger:
            - metadata or link repair only
          relaylm_current_status_source: ../../PROJECT_STATUS.md
          relaylm_not_authoritative_for:
            - current repository-wide implementation status after Wave 6
            - Wave 7 or later completion
            - exact lower-level subsystem contracts
          relaylm_source_commit: {SOURCE_COMMIT}
          relaylm_source_pr: {SOURCE_PR}
          relaylm_recorded_on: 2026-06-28
          relaylm_source_blob: {SOURCE_BLOB}
          relaylm_source_content_sha256: {SOURCE_SHA256}
          ---
          """
          metadata = "\n".join(line.removeprefix("          ") for line in metadata.splitlines()) + "\n"
          write(CANONICAL, metadata + body)
          source_path.unlink()

          replace_one("docs/README.md", "[Wave 6 Cross-Slice Convergence Audit](architecture/wave6_cross_slice_convergence_audit.md)", "[Wave 6 Cross-Slice Convergence Audit](evidence/waves/wave6_cross_slice_convergence_audit.md)")

          arch_path = "docs/architecture/README.md"
          arch_text = read(arch_path)
          old_arch = "- [Wave 6 Cross-Slice Convergence Audit](wave6_cross_slice_convergence_audit.md)"
          if arch_text.count(old_arch) != 2:
              raise AssertionError(f"architecture router Wave 6 count mismatch: {arch_text.count(old_arch)}")
          arch_text = arch_text.replace(old_arch, "- [Wave 6 Cross-Slice Convergence Audit](../evidence/waves/wave6_cross_slice_convergence_audit.md) — frozen historical convergence evidence, not active architecture.", 1)
          arch_text = arch_text.replace(old_arch, "- [Wave 6 Cross-Slice Convergence Audit](../evidence/waves/wave6_cross_slice_convergence_audit.md)", 1)
          write(arch_path, arch_text)

          replace_one("docs/mvp/README.md", "[Wave 6 Cross-Slice Convergence Audit](../architecture/wave6_cross_slice_convergence_audit.md)", "[Wave 6 Cross-Slice Convergence Audit](../evidence/waves/wave6_cross_slice_convergence_audit.md)")
          replace_one("docs/architecture/phase_i5_pin_unpin_contract.md", "  - wave6_cross_slice_convergence_audit.md", "  - ../evidence/waves/wave6_cross_slice_convergence_audit.md")
          replace_one("docs/architecture/relaymem_slp_current_target.md", "  - wave6_cross_slice_convergence_audit.md", "  - ../evidence/waves/wave6_cross_slice_convergence_audit.md")
          replace_one("scripts/relaylm_documentation_current_boundary_smoke.py", '    "docs/architecture/wave6_cross_slice_convergence_audit.md",\n', "")

          index_path = "docs/evidence/waves/README.md"
          index_text = read(index_path)
          wave_line = "- [Wave 6 cross-slice convergence audit](wave6_cross_slice_convergence_audit.md) — frozen boundary after PRs #429 through #435, merged as W6-INT.\n"
          if wave_line.strip() in index_text:
              raise AssertionError("Wave 6 evidence index entry already exists")
          write(index_path, index_text.rstrip("\n") + "\n" + wave_line)

          receipt_path = "docs/evidence/migrations/documentation-hard-cutover-receipt.md"
          receipt = read(receipt_path)
          c1c7_start = receipt.index("### C1C7-001")
          pending_start = receipt.index("## Pending batches", c1c7_start)
          c1c7 = receipt[c1c7_start:pending_start]
          if c1c7.count("merged_commit: pending") != 1:
              raise AssertionError("C1C7 pending merge field mismatch")
          c1c7 = c1c7.replace("merged_commit: pending", f"merged_commit: {MERGED_1C7}", 1)
          stale = "PR #564 is retargeted to `main`, and its validation fields record the rerun-ready final state before merge."
          final = f"PR #564 merged as `{MERGED_1C7}`; C1C7 is finalized by Cutover 1C-8."
          if stale not in c1c7:
              raise AssertionError("C1C7 finalization sentence mismatch")
          c1c7 = c1c7.replace(stale, final, 1)
          receipt = receipt[:c1c7_start] + c1c7 + receipt[pending_start:]

          c1c8 = f"""### C1C8-001 — Wave 6 cross-slice convergence audit

          ```yaml
          cutover_pr: {pr_number}
          merged_commit: pending
          old_path: {OLD}
          old_blob_sha: {SOURCE_BLOB}
          old_content_sha256: {SOURCE_SHA256}
          source_commit: {SOURCE_COMMIT}
          source_pr: {SOURCE_PR}
          recorded_on: 2026-06-28
          disposition: evidence_retained
          new_canonical_path: {CANONICAL}
          exact_source_snapshot: {SNAPSHOT}
          exact_source_blob_sha: {SOURCE_BLOB}
          verification:
            old_path_removed_in_pr_tree: true
            exact_source_blob_reused: true
            canonical_evidence_metadata_added: true
            repository_root_literal_reference_files_updated_in_pr_tree: 1
            script_hard_coded_path_reference_files_updated_in_pr_tree: 1
            script_hard_coded_path_reference_occurrences_updated_in_pr_tree: 1
            relative_markdown_link_referrer_files_at_frozen_baseline: 3
            relative_markdown_link_dependencies_at_frozen_baseline: 4
            current_tree_related_authority_references_updated: 2
            current_boundary_smoke_historical_path_removed: true
            documentation_link_check_required: true
            documentation_semantic_audit_required: true
            affected_current_boundary_checks_required: true
          ```

          The canonical evidence document preserves the complete Wave 6 convergence account while correcting its live relative links for the evidence collection. The exact pre-cutover source remains available as the original Git blob. The dependency sweep identified one hard-coded current-boundary path, four Markdown relative links across three router files, and two `relaylm_related_authority` YAML references. The old path below is only the historical migration identifier for this receipt.

          """
          c1c8 = "\n".join(line.removeprefix("          ") for line in c1c8.splitlines()) + "\n"
          if receipt.count("## Pending batches\n") != 1:
              raise AssertionError("receipt pending marker mismatch")
          receipt = receipt.replace("## Pending batches\n", c1c8 + "## Pending batches\n", 1)
          write(receipt_path, receipt)

          if Path(OLD).exists() or Path(SNAPSHOT).read_bytes() != source_bytes:
              raise AssertionError("Wave 6 exact move verification failed")
          if subprocess.check_output(["git", "hash-object", SNAPSHOT], text=True).strip() != SOURCE_BLOB:
              raise AssertionError("Wave 6 snapshot blob mismatch")
          PY

          rm -f \
            .github/workflows/cutover-1c8-wave6-apply.yml \
            .github/workflows/cutover-1c8-wave6-apply-v2.yml \
            docs/evidence/migrations/.cutover-1c8-pr-bootstrap \
            docs/evidence/migrations/.cutover-1c8-pr-bootstrap-2

          test "$(git grep -lF 'docs/architecture/wave6_cross_slice_convergence_audit.md' -- ':!docs/evidence/migrations/documentation-hard-cutover-receipt.md' | wc -l)" -eq 0
          test "$(git hash-object docs/evidence/waves/wave6_cross_slice_convergence_audit-source.txt)" = "ecb06b4a95095c28c2b953fae926219d22cfe814"
          test "$(sha256sum docs/evidence/waves/wave6_cross_slice_convergence_audit-source.txt | cut -d' ' -f1)" = "915b99fba7e136543be041ab44debc9331ef081ed0c80b1ad1226fd184b9bbf4"
          git diff --check
          python -m compileall -q relaylm scripts
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
          PYTHONPATH=. python scripts/relaylm_documentation_current_boundary_smoke.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: move Wave 6 convergence audit in cutover 1C-8"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
