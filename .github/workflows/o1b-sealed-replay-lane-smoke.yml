name: O1B sealed replay lane smoke

on:
  push:
    paths:
      - "relaylm/relaymem_slp_scheduler_replay_lane.py"
      - "relaylm/relaymem_slp_scheduler_contract.py"
      - "scripts/relaylm_o1b_sealed_replay_lane_smoke.py"
      - "scripts/relaylm_o1b_sealed_replay_lane_security_smoke.py"
      - "scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py"
      - "docs/**"
      - ".github/workflows/o1b-sealed-replay-lane-smoke.yml"
  pull_request:
    paths:
      - "relaylm/relaymem_slp_scheduler_replay_lane.py"
      - "relaylm/relaymem_slp_scheduler_contract.py"
      - "scripts/relaylm_o1b_sealed_replay_lane_smoke.py"
      - "scripts/relaylm_o1b_sealed_replay_lane_security_smoke.py"
      - "scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py"
      - "docs/**"
      - ".github/workflows/o1b-sealed-replay-lane-smoke.yml"

permissions:
  contents: read

jobs:
  o1b-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py
      - run: python scripts/relaylm_o1b_sealed_replay_lane_smoke.py
      - run: python scripts/relaylm_o1b_sealed_replay_lane_security_smoke.py
      - run: python scripts/relaylm_i1g_pre_enqueue_fault_model_smoke.py
      - run: python scripts/relaylm_i1gb_durable_finalization_publication_smoke.py
      - run: python scripts/relaylm_i1gc_durable_finalization_replay_smoke.py
      - run: python scripts/relaylm_o0_local_one_job_runner_smoke.py
      - run: python scripts/relaylm_o0_local_one_job_runner_security_smoke.py
      - run: python scripts/relaylm_documentation_current_boundary_smoke.py
      - run: python -m compileall relaylm scripts
