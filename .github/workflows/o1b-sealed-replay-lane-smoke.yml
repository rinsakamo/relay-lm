name: O1B sealed replay lane smoke

on:
  push:
    branches:
      - phase-o1b-sealed-i1g-replay-lane
    paths:
      - "relaylm/relaymem_slp_scheduler_replay_lane.py"
      - "relaylm/relaymem_slp_scheduler_contract.py"
      - "scripts/relaylm_o1b_sealed_replay_lane_smoke.py"
      - "scripts/relaylm_o1b_sealed_replay_lane_security_smoke.py"
      - "scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "docs/**"
      - ".github/workflows/o1b-sealed-replay-lane-smoke.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "relaylm/relaymem_slp_scheduler_replay_lane.py"
      - "relaylm/relaymem_slp_scheduler_contract.py"
      - "scripts/relaylm_o1b_sealed_replay_lane_smoke.py"
      - "scripts/relaylm_o1b_sealed_replay_lane_security_smoke.py"
      - "scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py"
      - "scripts/relaylm_documentation_current_boundary_smoke.py"
      - "docs/**"
      - ".github/workflows/o1b-sealed-replay-lane-smoke.yml"

permissions:
  contents: write

concurrency:
  group: o1b-sealed-replay-lane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  o1b-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Patch fixture or run validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch phase-o1b-sealed-i1g-replay-lane \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/relaylm_o1b_sealed_replay_lane_smoke.py")
          body = path.read_text(encoding="utf-8")
          old = '''        first, _, _, _ = gc._publish_sealed(root, request_id="o1b-request-a")
                  second, _, _, _ = gc._publish_sealed(root, request_id="o1b-request-b")
          '''
          new = '''        first, _, _, _ = gc._publish_sealed(root, request_id="o1b-request-a")
                  with patch.object(gc.gb, "RUN_ID", f"{gc.gb.RUN_ID}-o1b-b"):
                      second, _, _, _ = gc._publish_sealed(root, request_id="o1b-request-b")
          '''
          if old in body:
              path.write_text(body.replace(old, new), encoding="utf-8")
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add scripts/relaylm_o1b_sealed_replay_lane_smoke.py
            git commit -m "test: use distinct O1B locator fixtures"
            git push -q origin HEAD:phase-o1b-sealed-i1g-replay-lane
            exit 0
          fi
          python -m pip install -q -e .
          export PYTHONPATH=.:scripts
          python -m compileall -q relaylm scripts
          python scripts/relaylm_o1a_two_lane_scheduler_contract_smoke.py
          python scripts/relaylm_o1b_sealed_replay_lane_smoke.py
          python scripts/relaylm_o1b_sealed_replay_lane_security_smoke.py
          python scripts/relaylm_i1g_pre_enqueue_fault_model_smoke.py
          python scripts/relaylm_i1gb_durable_finalization_publication_smoke.py
          python scripts/relaylm_i1gb_durable_finalization_app_smoke.py
          python scripts/relaylm_i1gc_durable_finalization_replay_smoke.py
          python scripts/relaylm_o0_local_one_job_runner_smoke.py
          python scripts/relaylm_o0_local_one_job_runner_security_smoke.py
          python scripts/relaylm_documentation_current_boundary_smoke.py
          python scripts/relaylm_docs_link_check.py
