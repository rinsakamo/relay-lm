name: C1C32 one-shot receipt finalizer

on:
  push:
    branches:
      - claude/docs-cutover-1c32-relayctx-short-term-chain
    paths:
      - ".github/workflows/c1c32-finalize-receipt.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/docs-cutover-1c32-relayctx-short-term-chain
          fetch-depth: 0
          persist-credentials: true
      - name: Finalize C1C32 receipt and remove one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/evidence/migrations/documentation-hard-cutover-receipt.md")
          text = path.read_text(encoding="utf-8")
          start = text.index("### C1C32-001 — RelayCTX short-term runtime chain")
          end = text.index("\n## Pending batches", start)
          block = text[start:end]

          replacements = {
              "cutover_pr: pending": "cutover_pr: 595",
              "gate_condition_paragraph_4_conditions: current_absorb_required_code_derived_rewrite_13_reasons_confirmed_incomplete_as_warned": "gate_condition_paragraph_4_conditions: current_absorb_required_code_derived_rewrite_12_apply_tier_5_preflight_tier_13_distinct_union_confirmed_incomplete_as_warned",
              "delta: replaced_4_condition_prose_with_13_distinct_reason_strings_across_preflight_and_apply_tiers_no_verbatim_source_exists": "delta: replaced_4_condition_prose_with_12_apply_tier_and_5_preflight_tier_reason_strings_13_distinct_union_no_verbatim_source_exists",
              "  compileall: pending_final_head": "  compileall: passed",
              "  documentation_link_check: pending_final_head": "  documentation_link_check: passed",
              "  documentation_semantic_audit: pending_final_head": "  documentation_semantic_audit: passed",
              "  documentation_current_boundary_smoke: pending_final_head": "  documentation_current_boundary_smoke: passed",
              "  consolidated_smoke_contract: pending_final_head": "  consolidated_smoke_contract: passed",
              "  relayctx_short_term_extraction_dry_run_smoke: pending_final_head": "  relayctx_short_term_extraction_dry_run_smoke: pre_existing_local_fixture_failure_verified_against_base",
              "  relayctx_short_term_block_assembly_dry_run_smoke: pending_final_head": "  relayctx_short_term_block_assembly_dry_run_smoke: pre_existing_local_fixture_failure_verified_against_base",
              "  relayctx_short_term_runtime_injection_preflight_smoke: pending_final_head": "  relayctx_short_term_runtime_injection_preflight_smoke: pre_existing_local_fixture_failure_verified_against_base",
              "  relayctx_short_term_runtime_injection_apply_smoke: pending_final_head": "  relayctx_short_term_runtime_injection_apply_smoke: pre_existing_local_fixture_failure_verified_against_base",
              "  ctx_repack_final_gate_smoke: pending_final_head": "  ctx_repack_final_gate_smoke: passed",
              "  openwebui_lmstudio_config_smoke: pending_final_head": "  openwebui_lmstudio_config_smoke: passed",
              "  git_diff_check: pending_final_head": "  git_diff_check: passed",
              "  all_github_actions: pending_final_head": "  all_github_actions: passed",
              "  codex_review: pending_final_head": "  codex_review: unavailable_usage_limit_reached",
              "  unresolved_review_threads: pending_final_head": "  unresolved_review_threads: 0",
          }
          for old, new in replacements.items():
              if old not in block:
                  raise SystemExit(f"C1C32 receipt marker missing: {old}")
              block = block.replace(old, new, 1)

          anchor = "  documentation_current_boundary_smoke: passed\n"
          addition = (
              "  relayctx_short_term_runtime_contract_smoke: passed\n"
              "  repository_wide_stage_order_verified: relaymem_retrieval_to_relaymem_runtime_injection_to_relayctx_extraction_to_assembly_to_preflight_to_apply_to_token_budget_truncation\n"
              "  internal_relayctx_artifact_dependency_verified: extraction_to_assembly_to_preflight_to_apply\n"
              "  disabled_builder_none_semantics_verified: true\n"
              "  stage4_forwarded_payload_input_verified: true\n"
              "  apply_tier_blocked_reason_count: 12\n"
              "  preflight_tier_blocked_reason_count: 5\n"
              "  blocked_reason_distinct_union_count: 13\n"
              "  payload_mutation_disabled_reachable_apply_condition: apply_enabled_true_and_dry_run_only_true_with_blocked_reason\n"
          )
          if "  relayctx_short_term_runtime_contract_smoke: passed\n" not in block:
              if anchor not in block:
                  raise SystemExit("C1C32 validation insertion anchor missing")
              block = block.replace(anchor, anchor + addition, 1)

          old_narrative = (
              "No compatibility path, redirect, or runtime behavior change is introduced. "
              "Local validation, GitHub Actions, Codex review, and unresolved-thread counts are recorded only once the final remote head is green, per the cutover requirement not to finalize this receipt before that point."
          )
          new_narrative = (
              "No compatibility path, redirect, or runtime behavior change is introduced. "
              "Final review corrected the repository-wide order to RelayMEM retrieval -> RelayMEM runtime CTX/snippet injection -> RelayCTX extraction -> assembly -> preflight -> apply -> token-budget truncation, while retaining extraction -> assembly -> preflight -> apply as the internal RelayCTX artifact dependency. "
              "The corrected default-off artifact-presence rules, Stage 4 forwarded-payload input, 12 apply-tier reasons, 5 preflight-tier reasons, 13-name distinct union, and reachable payload_mutation_disabled condition are pinned by scripts/relaylm_relayctx_short_term_runtime_contract_smoke.py. "
              "All 14 triggered GitHub Actions workflows on correction head 7298526f36c5ddc59db0b6de028679000b88ed36 completed successfully; Codex review was unavailable because the usage limit was reached, and there were zero unresolved review threads."
          )
          if old_narrative not in block:
              raise SystemExit("C1C32 final narrative marker missing")
          block = block.replace(old_narrative, new_narrative, 1)

          path.write_text(text[:start] + block + text[end:], encoding="utf-8")
          PY

          rm .github/workflows/c1c32-finalize-receipt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/migrations/documentation-hard-cutover-receipt.md .github/workflows/c1c32-finalize-receipt.yml
          git diff --cached --check
          git commit -m "docs: finalize cutover 1C-32 receipt"
          git push origin HEAD:claude/docs-cutover-1c32-relayctx-short-term-chain
