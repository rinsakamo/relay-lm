name: Temporary Phase I-3 dedicated rerun

on:
  push:
    branches:
      - phase-i3-auditable-primary-mem-correct
    paths:
      - .github/workflows/phase-i3-temporary-rerun.yml

permissions:
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i3-auditable-primary-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - id: functional
        continue-on-error: true
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i3_primary_mem_correct_smoke.py
      - id: security
        continue-on-error: true
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i3_primary_mem_correct_security_smoke.py
      - id: fault
        continue-on-error: true
        run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i3_primary_mem_correct_fault_smoke.py
      - name: Record bounded rerun result
        env:
          FUNCTIONAL: ${{ steps.functional.outcome }}
          SECURITY: ${{ steps.security.outcome }}
          FAULT: ${{ steps.fault.outcome }}
        run: |
          cat >> docs/architecture/phase_i3_validation_receipt.md <<EOF

          ## Dedicated rerun after fixture corrections

          | Script | Result |
          |---|---|
          | functional and retrieval convergence | ${FUNCTIONAL} |
          | mutation/token/scope security | ${SECURITY} |
          | crash and recovery | ${FAULT} |
          EOF
          rm .github/workflows/phase-i3-temporary-rerun.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/phase_i3_validation_receipt.md
          git add -u .github/workflows/phase-i3-temporary-rerun.yml
          git commit -m "test: record Phase I3 dedicated rerun"
          git push origin HEAD:phase-i3-auditable-primary-mem-correct
