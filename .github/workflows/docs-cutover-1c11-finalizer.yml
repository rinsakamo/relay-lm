name: Docs cutover 1C-11 finalizer

on:
  pull_request:
    paths:
      - ".github/workflows/docs-cutover-1c11-finalizer.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Finalize receipt and formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          receipt = Path('docs/evidence/migrations/documentation-hard-cutover-receipt.md')
          body = receipt.read_text(encoding='utf-8')
          old = '  all_github_actions: pending'
          new = '  all_github_actions: passed'
          assert body.count(old) == 1
          receipt.write_text(body.replace(old, new, 1), encoding='utf-8')

          canonical = Path('docs/evidence/implementation/mvp_eval_runner_completion_report.md')
          body = canonical.read_text(encoding='utf-8')
          old = 'unless explicitly qualified.\n\n\n## Scope'
          new = 'unless explicitly qualified.\n\n## Scope'
          assert body.count(old) == 1
          canonical.write_text(body.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate focused files
        run: |
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/mvp_eval_runner_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          git diff --check
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/migrations/documentation-hard-cutover-receipt.md docs/evidence/implementation/mvp_eval_runner_completion_report.md
          git commit -m "docs: finalize Cutover 1C-11 validation state"
          git push origin HEAD:${{ github.head_ref }}
