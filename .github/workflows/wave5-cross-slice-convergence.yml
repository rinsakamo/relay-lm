name: Wave 5 cross-slice convergence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/relaylm_wave5_cross_slice_convergence_smoke.py'
      - 'scripts/relaylm_documentation_current_boundary_smoke.py'
      - '.github/workflows/wave5-cross-slice-convergence.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/relaylm_wave5_cross_slice_convergence_smoke.py'
      - 'scripts/relaylm_documentation_current_boundary_smoke.py'
      - '.github/workflows/wave5-cross-slice-convergence.yml'

jobs:
  wave5-cross-slice-convergence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile docs smokes
        run: python -m compileall scripts
      - name: Validate Wave 5 convergence audit
        run: PYTHONPATH=.:scripts python scripts/relaylm_wave5_cross_slice_convergence_smoke.py
      - name: Validate documentation current boundary
        run: PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
      - name: Validate docs links
        run: PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
      - name: Validate Wave 5 completion reports
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/mvp/wave5/e1_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/mvp/wave5/o1e_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py docs/mvp/wave5/i4f_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
