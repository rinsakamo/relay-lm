name: W2 O1B diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/w2-o1b-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone branch
        run: git clone --depth 1 --branch wave2-cross-slice-convergence-audit https://github.com/rinsakamo/relay-lm.git repo
      - name: Run O1B security only
        run: |
          cd repo
          python -m pip install -q -e .
          PYTHONPATH=.:scripts python scripts/relaylm_o1b_sealed_replay_lane_security_smoke.py
