name: W2 combined diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/w2-combined-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone branch
        run: git clone --depth 1 --branch wave2-cross-slice-convergence-audit https://github.com/rinsakamo/relay-lm.git repo
      - name: Run combined smoke only
        run: |
          cd repo
          python -m pip install -q -e .
          PYTHONPATH=.:scripts python scripts/relaylm_wave2_cross_slice_convergence_smoke.py
