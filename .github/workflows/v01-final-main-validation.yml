name: v0.1 final main validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/relaylm_v01_final_validation.py"
      - ".github/workflows/v01-final-main-validation.yml"
      - "docs/mvp/v0.1_final_validation_receipt.md"
      - "docs/mvp/v0.1_release_readiness.md"

permissions:
  contents: read

jobs:
  validate-frozen-main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VALIDATED_MAIN_SHA: 522018e62d69bcbe89465d574bf2d1b377f10bd9
    steps:
      - name: Checkout validation tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize frozen main worktree
        run: |
          set -euo pipefail
          git cat-file -e "${VALIDATED_MAIN_SHA}^{commit}"
          git worktree add --detach /tmp/relaylm-v01 "${VALIDATED_MAIN_SHA}"
          test "$(git -C /tmp/relaylm-v01 rev-parse HEAD)" = "${VALIDATED_MAIN_SHA}"

      - name: Install frozen main dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '/tmp/relaylm-v01[test]'

      - name: Run required final validation checklist
        run: |
          python scripts/relaylm_v01_final_validation.py \
            --repo-dir /tmp/relaylm-v01 \
            --baseline "${VALIDATED_MAIN_SHA}" \
            --output-dir generated/v01-final-validation

      - name: Check validation-tooling whitespace
        run: git diff --check

      - name: Publish validation summary
        if: always()
        run: |
          if [ -f generated/v01-final-validation/validation-summary.md ]; then
            cat generated/v01-final-validation/validation-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload content-free validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v01-final-main-validation
          path: generated/v01-final-validation
          if-no-files-found: error
          retention-days: 90
