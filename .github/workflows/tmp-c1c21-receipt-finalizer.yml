name: Temporary Cutover 1C-21 receipt finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/tmp_c1c21_receipt_finalizer.py"
      - ".github/workflows/tmp-c1c21-receipt-finalizer.yml"

permissions:
  contents: write

jobs:
  finalize-c1c21-receipt:
    if: github.head_ref == 'agent/docs-cutover-1c21-i7c'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation validation dependency
        run: python -m pip install pyyaml

      - name: Mark final GitHub Actions passed in C1C21 receipt
        run: python scripts/tmp_c1c21_receipt_finalizer.py

      - name: Validate finalized receipt and documentation
        run: |
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_smoke.py --check-model docs/evidence/implementation/i7c_completion_report.md
          PYTHONPATH=.:scripts python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          git diff --check

      - name: Commit finalized receipt and remove temporary tooling
        run: |
          rm scripts/tmp_c1c21_receipt_finalizer.py
          rm .github/workflows/tmp-c1c21-receipt-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: finalize I-7C cutover receipt"
          git push origin HEAD:${{ github.head_ref }}
