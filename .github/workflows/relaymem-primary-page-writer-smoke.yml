name: RelayMEM Primary page writer smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "relaylm/relaymem_primary_page_writer.py"
      - "relaylm/_relaymem_primary_page_writer_common.py"
      - "relaylm/_relaymem_primary_page_writer_handoff.py"
      - "relaylm/_relaymem_primary_page_writer_contract.py"
      - "relaylm/_relaymem_primary_page_writer_io.py"
      - "relaylm/_relaymem_primary_page_writer_impl.py"
      - "scripts/relaylm_relaymem_primary_page_writer_smoke.py"
      - "scripts/relaylm_relaymem_primary_page_writer_security_smoke.py"
      - "scripts/relaylm_relaymem_primary_page_writer_atomicity_smoke.py"
      - ".github/workflows/relaymem-primary-page-writer-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "relaylm/relaymem_primary_page_writer.py"
      - "relaylm/_relaymem_primary_page_writer_common.py"
      - "relaylm/_relaymem_primary_page_writer_handoff.py"
      - "relaylm/_relaymem_primary_page_writer_contract.py"
      - "relaylm/_relaymem_primary_page_writer_io.py"
      - "relaylm/_relaymem_primary_page_writer_impl.py"
      - "scripts/relaylm_relaymem_primary_page_writer_smoke.py"
      - "scripts/relaylm_relaymem_primary_page_writer_security_smoke.py"
      - "scripts/relaylm_relaymem_primary_page_writer_atomicity_smoke.py"
      - ".github/workflows/relaymem-primary-page-writer-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile RelayMEM M3e helper and smokes
        run: >-
          python -m compileall -q
          relaylm/relaymem_primary_page_writer.py
          relaylm/_relaymem_primary_page_writer_common.py
          relaylm/_relaymem_primary_page_writer_handoff.py
          relaylm/_relaymem_primary_page_writer_contract.py
          relaylm/_relaymem_primary_page_writer_io.py
          relaylm/_relaymem_primary_page_writer_impl.py
          scripts/relaylm_relaymem_primary_page_writer_smoke.py
          scripts/relaylm_relaymem_primary_page_writer_security_smoke.py
          scripts/relaylm_relaymem_primary_page_writer_atomicity_smoke.py
      - name: Run RelayMEM M3e page writer smoke
        run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_smoke.py
      - name: Run RelayMEM M3e security smoke
        run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_security_smoke.py
      - name: Run RelayMEM M3e atomicity smoke
        run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_atomicity_smoke.py
