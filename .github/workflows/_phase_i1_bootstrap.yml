name: Phase I-1 branch cleanup

on:
  push:
    branches:
      - phase-i1-primary-mem-next-turn-recall
    paths:
      - ".github/workflows/_phase_i1_bootstrap.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i1-primary-mem-next-turn-recall
          fetch-depth: 0
      - name: Remove temporary and duplicate wiring
        run: |
          git fetch origin main
          git checkout origin/main -- relaylm/relayctx_repack.py relaylm/relaymem_store.py
          rm -f scripts/_phase_i1_bootstrap_patch.py
          rm -f phase-i1-bootstrap.log phase-i1-recovery.log
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: keep I1 recall wiring at the request boundary"
          git push origin HEAD:phase-i1-primary-mem-next-turn-recall
