name: Phase I-1 branch bootstrap

on:
  push:
    branches:
      - phase-i1-primary-mem-next-turn-recall
    paths:
      - "scripts/_phase_i1_bootstrap_patch.py"
      - ".github/workflows/_phase_i1_bootstrap.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/_phase_i1_bootstrap_patch.py"
      - ".github/workflows/_phase_i1_bootstrap.yml"

permissions:
  contents: write

env:
  PYTHONPATH: .:scripts

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i1-primary-mem-next-turn-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Normalize one-shot patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_phase_i1_bootstrap_patch.py")
          body = path.read_text(encoding="utf-8")
          body = body.replace(
              'if body.count(old) != 1:\n        raise RuntimeError(f"{path}: expected one patch anchor, got {body.count(old)}")\n    target.write_text(body.replace(old, new), encoding="utf-8")',
              'if old not in body:\n        raise RuntimeError(f"{path}: patch anchor missing")\n    target.write_text(body.replace(old, new, 1), encoding="utf-8")',
              1,
          )
          path.write_text(body, encoding="utf-8")
          PY
      - name: Apply branch patch
        id: apply_patch
        continue-on-error: true
        run: |
          python scripts/_phase_i1_bootstrap_patch.py > phase-i1-bootstrap.log 2>&1
      - name: Upload bootstrap log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-i1-bootstrap-log
          path: phase-i1-bootstrap.log
          if-no-files-found: error
      - name: Fail when patch failed
        if: steps.apply_patch.outcome != 'success'
        run: exit 1
