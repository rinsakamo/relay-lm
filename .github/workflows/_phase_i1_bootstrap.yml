name: Phase I-1 branch bootstrap

on:
  push:
    branches:
      - phase-i1-primary-mem-next-turn-recall
    paths:
      - "scripts/_phase_i1_bootstrap_patch.py"
      - ".github/workflows/_phase_i1_bootstrap.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/_phase_i1_bootstrap_patch.py"
      - ".github/workflows/_phase_i1_bootstrap.yml"

permissions:
  contents: write

env:
  PYTHONPATH: .:scripts

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i1-primary-mem-next-turn-recall
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: source
        run: |
          if test -f scripts/_phase_i1_bootstrap_patch.py; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.source.outputs.present == 'true'
        run: pip install -e .
      - name: Normalize one-shot patch anchors and fail-closed gate
        if: steps.source.outputs.present == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          patcher = Path("scripts/_phase_i1_bootstrap_patch.py")
          body = patcher.read_text(encoding="utf-8")
          body = body.replace(
              'if body.count(old) != 1:\n        raise RuntimeError(f"{path}: expected one patch anchor, got {body.count(old)}")\n    target.write_text(body.replace(old, new), encoding="utf-8")',
              'if old not in body:\n        raise RuntimeError(f"{path}: patch anchor missing")\n    target.write_text(body.replace(old, new, 1), encoding="utf-8")',
              1,
          )
          patcher.write_text(body, encoding="utf-8")

          adapter = Path("relaylm/relaymem_primary_recall.py")
          body = adapter.read_text(encoding="utf-8")
          body = body.replace(
              '    original_decision = artifact.get("snippet_apply_decision")\n    if original_decision not in {"eligible_but_not_applied", "dry_run_only"}:\n        reasons.append("existing_retrieval_gate_blocked")',
              '    original_decision = artifact.get("snippet_apply_decision")\n    gate_allowed = original_decision in {"eligible_but_not_applied", "dry_run_only"}\n    if not gate_allowed:\n        reasons.append("existing_retrieval_gate_blocked")',
              1,
          )
          body = body.replace(
              '    if root is not None and namespace is not None:\n        control, control_reasons = _load_control_state(root)',
              '    if root is not None and namespace is not None and gate_allowed:\n        control, control_reasons = _load_control_state(root)',
              1,
          )
          adapter.write_text(body, encoding="utf-8")
          PY
      - name: Apply branch patch
        if: steps.source.outputs.present == 'true'
        id: apply_patch
        continue-on-error: true
        run: |
          python scripts/_phase_i1_bootstrap_patch.py > phase-i1-bootstrap.log 2>&1
      - name: Recover implementation commit without workflow files
        if: steps.source.outputs.present == 'true' && steps.apply_patch.outcome != 'success'
        run: |
          test "$(git rev-parse HEAD)" != "$(git rev-parse origin/phase-i1-primary-mem-next-turn-recall)"
          git checkout origin/phase-i1-primary-mem-next-turn-recall -- .github/workflows/_phase_i1_bootstrap.yml
          rm -f .github/workflows/phase-i1-two-turn-primary-recall-smoke.yml
          rm -f phase-i1-bootstrap.log
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:phase-i1-primary-mem-next-turn-recall
      - name: Upload bootstrap log
        if: always() && steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase-i1-bootstrap-log
          path: phase-i1-bootstrap.log
          if-no-files-found: ignore
