name: Audit projection validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/relaylm_token_budget_truncation_apply_smoke.py
      - .github/workflows/audit-projection-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RelayLM
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall relaylm scripts/relaylm_token_budget_truncation_apply_smoke.py
      - name: Token budget truncation apply
        run: python scripts/relaylm_token_budget_truncation_apply_smoke.py
