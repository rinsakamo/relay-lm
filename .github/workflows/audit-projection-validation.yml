name: Audit projection validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/relaylm_token_budget_truncation_apply_smoke.py
      - .github/workflows/audit-projection-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install quietly
        run: python3 -m pip install -q -e . >/dev/null 2>&1
      - name: Run isolated smoke
        id: smoke
        shell: bash
        run: |
          set +e
          python3 scripts/relaylm_token_budget_truncation_apply_smoke.py > smoke.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-smoke-log
          path: smoke.log
      - name: Enforce smoke result
        run: test "${{ steps.smoke.outputs.exit_code }}" = "0"
