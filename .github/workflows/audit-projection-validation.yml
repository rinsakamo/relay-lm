name: Audit projection validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/relaylm_token_budget_truncation_apply_smoke.py
      - .github/workflows/audit-projection-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install quietly
        run: python3 -m pip install -q -e . >/dev/null 2>&1
      - name: Token budget truncation apply
        run: python3 scripts/relaylm_token_budget_truncation_apply_smoke.py
