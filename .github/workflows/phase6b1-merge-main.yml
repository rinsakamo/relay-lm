name: Clean Phase 6-B1 main-sync files

on:
  push:
    branches:
      - phase6b1-relayslp-dispatch-preflight
    paths:
      - ".github/workflows/phase6b1-merge-main.yml"
      - "scripts/phase6b1_merge_main_trigger.txt"

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase6b1-relayslp-dispatch-preflight
      - name: Remove temporary synchronization files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase6b1-merge-main.yml \
            scripts/phase6b1_merge_main_trigger.txt
          git commit -m "chore: remove temporary Phase 6-B1 main sync"
          git push origin HEAD:phase6b1-relayslp-dispatch-preflight
