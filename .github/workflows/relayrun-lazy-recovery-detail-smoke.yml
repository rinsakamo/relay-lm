name: RelayRUN lazy recovery detail smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - relaylm/relayrun_lazy_recovery.py
      - scripts/relaylm_relayrun_lazy_recovery_detail_smoke.py
      - docs/PROJECT_STATUS.md
      - docs/architecture/pipeline_implementation_plan.md
      - docs/architecture/phase5d2_lazy_relayrun_recovery_detail_handoff.md
      - .github/workflows/relayrun-lazy-recovery-detail-smoke.yml
  push:
    branches: [main]
    paths:
      - relaylm/relayrun_lazy_recovery.py
      - scripts/relaylm_relayrun_lazy_recovery_detail_smoke.py
      - docs/PROJECT_STATUS.md
      - docs/architecture/pipeline_implementation_plan.md
      - docs/architecture/phase5d2_lazy_relayrun_recovery_detail_handoff.md
      - .github/workflows/relayrun-lazy-recovery-detail-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and smoke scripts
        run: python -m compileall relaylm scripts
      - name: Run lazy RelayRUN recovery detail smoke
        run: python scripts/relaylm_relayrun_lazy_recovery_detail_smoke.py
