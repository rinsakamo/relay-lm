name: Audit projection diagnostic

on:
  pull_request:
    paths:
      - relaylm/audit_projection.py
      - relaylm/trace.py
      - relaylm/trace_runtime.py
      - relaylm/app.py
      - scripts/**

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RelayLM
        run: python -m pip install -e .
      - name: Run compile and smoke suite
        id: suite
        shell: bash
        run: |
          set +e
          : > suite.log
          python -m compileall relaylm scripts >> suite.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            scripts=(
              relaylm_audit_projection_contract_smoke.py
              relaylm_trace_content_free_contract_smoke.py
              relaylm_jsonl_trace_smoke.py
              relaylm_trace_success_smoke.py
              relaylm_hardening_smoke.py
              relaylm_memory_review_smoke.py
              relaylm_memory_selection_summary_smoke.py
              relaylm_memory_light_apply_smoke.py
              relaylm_pipeline_node_result_smoke.py
              relaylm_pipeline_context_node_results_smoke.py
              relaylm_pipeline_node_results_runtime_smoke.py
              relaylm_runtime_diagnostics_smoke.py
              relaylm_relayctx_unpack_contract_smoke.py
              relaylm_relayctx_unpack_runtime_smoke.py
              relaylm_relayctx_unpack_runtime_app_smoke.py
              relaylm_client_message_canonicalization_dry_run_smoke.py
              relaylm_client_msg_runtime_dry_run_smoke.py
              relaylm_compile_decision_dry_run_smoke.py
              relaylm_token_trace_payload_smoke.py
              relaylm_token_policy_signal_smoke.py
              relaylm_token_budget_truncation_dry_run_smoke.py
              relaylm_token_budget_truncation_apply_smoke.py
              relaylm_mixed_character_token_policy_smoke.py
              relaylm_token_policy_runtime_gate_smoke.py
              relaylm_client_instruction_cache_lookup_dependency_smoke.py
              relaylm_client_history_exclusion_preflight_smoke.py
            )
            for script in "${scripts[@]}"; do
              echo "== $script ==" >> suite.log
              python "scripts/$script" >> suite.log 2>&1
              code=$?
              if [ "$code" -ne 0 ]; then
                break
              fi
            done
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> suite.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: audit-projection-diagnostic-log
          path: suite.log
      - name: Report diagnostic result
        run: echo "suite exit code ${{ steps.suite.outputs.exit_code }}"
