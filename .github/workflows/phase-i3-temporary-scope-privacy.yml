name: Temporary Phase I-3 scope privacy patch

on:
  push:
    branches:
      - phase-i3-auditable-primary-mem-correct
    paths:
      - scripts/_phase_i3_scope_privacy_patch.py
      - .github/workflows/phase-i3-temporary-scope-privacy.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i3-auditable-primary-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/_phase_i3_scope_privacy_patch.py
      - run: pip install -e .
      - run: python -m compileall -q relaylm scripts
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i3_primary_mem_correct_security_smoke.py
      - run: PYTHONPATH=.:scripts python scripts/relaylm_phase_i3_primary_mem_correct_ci_runner.py
      - name: Commit scope privacy fix
        run: |
          rm scripts/_phase_i3_scope_privacy_patch.py
          rm .github/workflows/phase-i3-temporary-scope-privacy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relaylm/relaymem_primary_correction.py scripts/relaylm_phase_i3_primary_mem_correct_security_smoke.py
          git add -u scripts/_phase_i3_scope_privacy_patch.py .github/workflows/phase-i3-temporary-scope-privacy.yml
          git commit -m "fix: preserve I3 wrong-scope indistinguishability"
          git push origin HEAD:phase-i3-auditable-primary-mem-correct
