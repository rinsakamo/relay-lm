name: TEMP 2942 projection materialize

on:
  push:
    branches:
      - codex/2942-rel3-projection-repair

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6.0.2"
      - name: Generate exact projection blob
        run: |
          python -m tools.repository_docs --commit ec23fe7955abff36517e41afa193d6dcdb24270e write
          test "$(git status --porcelain | awk '{print $2}')" = "ARCHITECTURE.md"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ARCHITECTURE.md
          git commit -m "[RelayLM 1.0][#2942] TEMP materialize projection blob"
          git push origin HEAD:codex/2942-rel3-projection-repair
