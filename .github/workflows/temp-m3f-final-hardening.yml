name: Temporary M3f final hardening

on:
  push:
    branches:
      - relaymem-m3f-primary-index-log-reconciliation
    paths:
      - ".github/workflows/temp-m3f-final-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relaymem-m3f-primary-index-log-reconciliation
      - name: Apply strict gate hardening and regression smoke
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = Path("relaylm/_relaymem_primary_index_log_reconciliation.py")
          text = helper.read_text(encoding="utf-8")
          replacements = [
              (
                  "    reasons: list[str] = []\n    if type(enabled) is not bool:\n",
                  "    reasons: list[str] = []\n    gates_valid = True\n    if type(enabled) is not bool:\n",
              ),
              (
                  "        reasons.append(\"primary_reconciliation_enabled_invalid\")\n        enabled = False\n",
                  "        reasons.append(\"primary_reconciliation_enabled_invalid\")\n        gates_valid = False\n        enabled = False\n",
              ),
              (
                  "        reasons.append(\"primary_reconciliation_dry_run_only_invalid\")\n        dry_run_only = True\n",
                  "        reasons.append(\"primary_reconciliation_dry_run_only_invalid\")\n        gates_valid = False\n        dry_run_only = True\n",
              ),
              (
                  "    if enabled and dry_run_only and parsed.get(\"valid\") is True:\n",
                  "    if gates_valid and enabled and dry_run_only and parsed.get(\"valid\") is True:\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected helper replacement count for {old!r}")
              text = text.replace(old, new)
          helper.write_text(text, encoding="utf-8")

          smoke = Path("scripts/relaylm_relaymem_primary_index_log_reconciliation_smoke.py")
          text = smoke.read_text(encoding="utf-8")
          old = """        receipt, page_path, index_path, log_path = fixture(root)\n\n        initial_index = index_path.read_bytes()\n"""
          new = """        receipt, page_path, index_path, log_path = fixture(root)\n\n        invalid_dry_run_gate = build_relaymem_primary_index_log_reconciliation_preflight(\n            receipt=receipt,\n            root_path=str(root),\n            enabled=True,\n            dry_run_only=1,\n        )\n        require(invalid_dry_run_gate[\"status\"] == \"blocked\", invalid_dry_run_gate)\n        require(invalid_dry_run_gate[\"plan\"] is None, invalid_dry_run_gate)\n        require(\n            \"primary_reconciliation_dry_run_only_invalid\"\n            in invalid_dry_run_gate[\"blocked_reasons\"],\n            invalid_dry_run_gate,\n        )\n        invalid_enabled_gate = build_relaymem_primary_index_log_reconciliation_preflight(\n            receipt=receipt,\n            root_path=str(root),\n            enabled=1,\n            dry_run_only=True,\n        )\n        require(invalid_enabled_gate[\"status\"] == \"blocked\", invalid_enabled_gate)\n        require(invalid_enabled_gate[\"plan\"] is None, invalid_enabled_gate)\n        require(\n            \"primary_reconciliation_enabled_invalid\"\n            in invalid_enabled_gate[\"blocked_reasons\"],\n            invalid_enabled_gate,\n        )\n        print(\"ok non-boolean gates cannot produce a reconciliation plan\")\n\n        initial_index = index_path.read_bytes()\n"""
          if text.count(old) != 1:
              raise SystemExit("unexpected smoke insertion count")
          smoke.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            relaylm/_relaymem_primary_index_log_reconciliation.py \
            scripts/relaylm_relaymem_primary_index_log_reconciliation_smoke.py
          git commit -m "fix: fail closed on invalid M3f gates"
          git push origin HEAD:relaymem-m3f-primary-index-log-reconciliation
