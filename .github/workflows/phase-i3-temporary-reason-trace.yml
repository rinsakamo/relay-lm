name: Temporary Phase I-3 bounded reason trace

on:
  push:
    branches:
      - phase-i3-auditable-primary-mem-correct
    paths:
      - .github/workflows/phase-i3-temporary-reason-trace.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i3-auditable-primary-mem-correct
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Capture bounded reason identifiers
        run: |
          PYTHONPATH=.:scripts python - <<'PY'
          import importlib
          import json
          import traceback
          from pathlib import Path

          modules = (
              "relaylm_phase_i3_primary_mem_correct_smoke",
              "relaylm_phase_i3_primary_mem_correct_security_smoke",
              "relaylm_phase_i3_primary_mem_correct_fault_smoke",
          )
          known = (
              "invalid_request", "not_found_or_wrong_scope", "stale_revision",
              "operation_conflict", "preflight_required", "token_expired",
              "token_invalid", "target_corrupt", "reconciliation_required",
              "store_unavailable", "access_refused", "response_lost",
              "primary_recall_correction_state_invalid",
              "primary_recall_superseded_revision_excluded",
              "primary_correction_state_invalid",
          )
          result = {}
          for name in modules:
              try:
                  importlib.import_module(name).main()
              except BaseException as exc:
                  frames = traceback.extract_tb(exc.__traceback__)
                  caller = next(
                      (frame for frame in reversed(frames)
                       if frame.name != "require" and Path(frame.filename).name.startswith(("relaylm_phase_i3", "_relaylm_phase_i3"))),
                      frames[-1] if frames else None,
                  )
                  raw = repr(exc)
                  result[name] = {
                      "exception": type(exc).__name__,
                      "assertion_source": caller.line.strip() if caller and caller.line else "unknown",
                      "bounded_reason_ids": [item for item in known if item in raw],
                  }
              else:
                  result[name] = {"status": "success"}
          Path("phase-i3-reason-trace.json").write_text(
              json.dumps(result, ensure_ascii=True, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Record bounded reasons
        run: |
          {
            printf '\n## Bounded assertion and reason trace\n\n```json\n'
            cat phase-i3-reason-trace.json
            printf '```\n'
          } >> docs/architecture/phase_i3_validation_receipt.md
          rm phase-i3-reason-trace.json
          rm .github/workflows/phase-i3-temporary-reason-trace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/phase_i3_validation_receipt.md
          git add -u .github/workflows/phase-i3-temporary-reason-trace.yml
          git commit -m "test: record bounded Phase I3 reason trace"
          git push origin HEAD:phase-i3-auditable-primary-mem-correct
