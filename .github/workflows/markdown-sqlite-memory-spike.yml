name: Markdown SQLite memory spike

on:
  pull_request:
    paths:
      - "experiments/markdown_sqlite_memory/**"
      - ".github/workflows/markdown-sqlite-memory-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike-tests:
    name: Experiment tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile experiment
        run: python -m compileall -q experiments/markdown_sqlite_memory
      - name: Run full experiment suite
        run: |
          set -o pipefail
          python -m pytest -vv experiments/markdown_sqlite_memory/tests \
            --junitxml=experiment-test-results.xml 2>&1 | tee experiment-test-output.log
      - name: Run current reference benchmark
        if: matrix.python-version == '3.12'
        run: |
          python experiments/markdown_sqlite_memory/run_spike.py \
            --root /tmp/relaylm-markdown-sqlite-benchmark \
            benchmark --pages 20 --blocks 25 --searches 50 \
            > experiment-benchmark.json
      - name: Upload experiment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-sqlite-spike-${{ matrix.python-version }}
          path: |
            experiment-test-results.xml
            experiment-test-output.log
            experiment-benchmark.json
          if-no-files-found: warn
      - name: Verify no production imports
        run: |
          if grep -R "markdown_sqlite_memory\|mdsqlite_spike" relaylm scripts apps --include='*.py' --include='*.ts' --include='*.tsx'; then
            echo "Production code imports or names the isolated experiment" >&2
            exit 1
          fi
