name: I4C2 contract docs patch

on:
  push:
    branches:
      - phase-i4c2-primary-forget-recovery-finalization
    paths:
      - .github/workflows/i4c2-docs-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i4c2-primary-forget-recovery-finalization
          fetch-depth: 0
      - run: python scripts/_phase_i4c2_docs_contract_patch.py
      - run: |
          rm scripts/_phase_i4c2_docs_contract_patch.py
          rm .github/workflows/i4c2-docs-contract-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: reconcile I-4C2 ownership boundaries"
          git push origin HEAD:phase-i4c2-primary-forget-recovery-finalization
