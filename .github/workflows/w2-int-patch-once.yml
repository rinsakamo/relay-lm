name: W2-INT bounded reconciliation

on:
  push:
    branches:
      - wave2-cross-slice-convergence-audit
    paths:
      - ".github/workflows/w2-int-patch-once.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave2-cross-slice-convergence-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply narrow reconciliation
        run: |
          python scripts/_w2_patch_isolation_once.py
          python scripts/_w2_patch_replay_once.py
          python scripts/_w2_patch_docs_once.py
      - name: Validate affected boundaries
        run: |
          python -m pip install -e .
          python -m compileall -q relaylm scripts
          PYTHONPATH=.:scripts python scripts/relaylm_i1gd_durable_finalization_retention_contract_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_i1gd_durable_finalization_retention_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_i1gd_durable_finalization_retention_race_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1b_sealed_replay_lane_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_o1b_sealed_replay_lane_security_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_concurrency_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_wave2_cross_slice_convergence_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_wave2_cross_slice_security_smoke.py
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
      - name: Commit reconciled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relaylm/relaymem_slp_durable_finalization_isolation.py
          git add relaylm/relaymem_slp_scheduler_replay_lane.py
          git add docs/README.md docs/architecture/README.md docs/PROJECT_STATUS.md
          git commit -m "fix: centralize Wave 2 cross-slice authority"
          git push origin HEAD:wave2-cross-slice-convergence-audit
