name: ASM-1 review fix runner

on:
  pull_request:
    branches:
      - asm1-review-fix-runner-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode and apply review fixes
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply_asm1_review_fixes.py
          python /tmp/apply_asm1_review_fixes.py
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Validate fixes
        run: |
          python -m compileall -q relaylm scripts
          pytest -q tests/test_shared_assessment_runtime.py
          python scripts/relaylm_asm1_shared_assessment_smoke.py
          python scripts/relaylm_docs_link_check.py
          python scripts/relaylm_docs_semantic_audit.py
          pytest -q
      - name: Commit reviewed result
        shell: bash
        run: |
          rm -f .github/workflows/asm1-review-fix.yml .asm1-review-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden ASM-1 authority and receipt boundaries"
          git push origin HEAD:agent/asm1-shared-assessment-runtime-v1
