name: ASM-1 final hardening runner

on:
  pull_request:
    branches:
      - asm1-review-fix-runner-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out current ASM-1 head
        shell: bash
        run: |
          git fetch origin agent/asm1-shared-assessment-runtime-v1
          git checkout -B asm1-final-hardening origin/agent/asm1-shared-assessment-runtime-v1
      - name: Apply final authority hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          assessment = Path("relaylm/shared_assessment.py")
          text = assessment.read_text(encoding="utf-8")
          if text.count("[:16]") != 2:
              raise RuntimeError(f"expected two 64-bit namespace prefixes, found {text.count('[:16]')}")
          assessment.write_text(text.replace("[:16]", "[:32]"), encoding="utf-8")

          evidence = Path("relaylm/shared_assessment_evidence.py")
          text = evidence.read_text(encoding="utf-8")
          old_call = '''    artifact_reasons = _validate_validation_artifacts(
                  tx=tx,
                  validation=validation,
                  source_event_id=source_event_id,
                  evidence_space_id=evidence_space_id,
                  manifest_digest=manifest_digest,
                  normalized_origin=origin,
              )
          '''
          new_call = '''    artifact_reasons = _validate_validation_artifacts(
                  tx=tx,
                  source=source,
                  manifest=manifest,
                  validation=validation,
                  source_event_id=source_event_id,
                  evidence_space_id=evidence_space_id,
                  manifest_digest=manifest_digest,
                  normalized_origin=origin,
              )
          '''
          if text.count(old_call) != 1:
              raise RuntimeError(f"validation call match count {text.count(old_call)}")
          text = text.replace(old_call, new_call)

          user_semantics_old = '''    if normalized_origin == "user":
                  expected = {
          '''
          user_semantics_new = '''    if normalized_origin == "user":
                  if (
                      source.get("assistant_response_binding_ref_or_null") is not None
                      or source.get("source_replay_identity") != {"kind": "none"}
                  ):
                      return ("shared_assessment_source_provenance_invalid",)
                  expected = {
          '''
          if text.count(user_semantics_old) != 1:
              raise RuntimeError(f"user semantic match count {text.count(user_semantics_old)}")
          text = text.replace(user_semantics_old, user_semantics_new)

          marker = '''def _validate_validation_artifacts(
              *,
              tx: EvidenceStoreTransaction,
              validation: dict,
          '''
          helper = '''_ASSISTANT_BINDING_DIGEST_FIELDS = (
              "response_id",
              "run_id",
              "turn_id_or_null",
              "delivery_cohort_id",
              "request_source_refs",
              "canonical_output_parts",
              "completion_extent",
              "termination_cause",
              "first_output_unit_sequence",
              "last_output_unit_sequence",
              "output_unit_count",
              "finalization_idempotency_key",
          )


          def _load_assistant_response_binding(
              *,
              tx: EvidenceStoreTransaction,
              source: dict,
              manifest: dict,
              evidence_space_id: str,
          ) -> tuple[tuple[str, str] | None, tuple[str, ...]]:
              binding_id = source.get("assistant_response_binding_ref_or_null")
              replay = source.get("source_replay_identity")
              if not isinstance(binding_id, str) or not isinstance(replay, dict):
                  return None, ("shared_assessment_assistant_response_binding_invalid",)
              binding = tx.read_record(
                  record_kind="assistant_response_binding", record_id=binding_id
              )
              if (
                  not isinstance(binding, dict)
                  or binding.get("schema") != "relaylm.assistant_response_binding.v1"
                  or binding.get("assistant_response_binding_id") != binding_id
              ):
                  return None, ("shared_assessment_assistant_response_binding_invalid",)
              digest_input = {
                  field: binding.get(field) for field in _ASSISTANT_BINDING_DIGEST_FIELDS
              }
              binding_digest = binding.get("canonical_binding_digest")
              if (
                  not isinstance(binding_digest, str)
                  or canonical_digest(digest_input) != binding_digest
              ):
                  return None, ("shared_assessment_assistant_response_binding_invalid",)
              finalized_at = _parse_time(binding.get("finalized_at"))
              first_output_at = _parse_time(binding.get("first_output_accepted_at"))
              received_at = _parse_time(source.get("received_at"))
              observed_at = _parse_time(source.get("observed_at"))
              if (
                  finalized_at is None
                  or first_output_at is None
                  or received_at != finalized_at
                  or observed_at != finalized_at
                  or first_output_at > finalized_at
                  or binding.get("finalization_basis_ref")
                  != "relaylm-managed-visible-output-finalization"
              ):
                  return None, ("shared_assessment_assistant_response_binding_invalid",)
              principal, scope = build_runtime_authority(
                  scope_kind="runtime_finalization_authority",
                  allowed_operations=("response_finalize",),
                  evidence_space_id=evidence_space_id,
                  issued_at=str(binding["finalized_at"]),
              )
              if (
                  binding.get("runtime_principal_ref") != principal.to_dict()
                  or binding.get("runtime_finalization_authority_scope")
                  != scope.to_dict()
              ):
                  return None, ("shared_assessment_assistant_response_binding_invalid",)
              expected_replay = {
                  "kind": "managed_response_identity",
                  "response_id": binding.get("response_id"),
                  "delivery_cohort_id": binding.get("delivery_cohort_id"),
                  "response_finalization_idempotency_key": binding.get(
                      "finalization_idempotency_key"
                  ),
                  "canonical_response_binding_digest": binding_digest,
              }
              if replay != expected_replay:
                  return None, ("shared_assessment_assistant_response_binding_invalid",)

              reservation_id = binding.get("response_capture_reservation_id")
              if not isinstance(reservation_id, str):
                  return None, ("shared_assessment_assistant_response_binding_invalid",)
              reservation = tx.read_record(
                  record_kind="response_capture_reservation", record_id=reservation_id
              )
              if (
                  not isinstance(reservation, dict)
                  or reservation.get("schema")
                  != "relaylm.assistant_response_capture_reservation.v1"
                  or reservation.get("response_capture_reservation_id") != reservation_id
                  or reservation.get("evidence_space_id") != evidence_space_id
                  or any(
                      reservation.get(field) != binding.get(field)
                      for field in (
                          "response_id",
                          "run_id",
                          "turn_id_or_null",
                          "delivery_cohort_id",
                          "request_source_refs",
                      )
                  )
              ):
                  return None, ("shared_assessment_assistant_response_binding_invalid",)
              response_events = tx.read_log(
                  log_kind="response_capture", key=reservation_id
              )
              finalize_events = [
                  event
                  for event in (response_events or [])
                  if isinstance(event, dict) and event.get("operation") == "finalize"
              ]
              if (
                  len(finalize_events) != 1
                  or not isinstance(finalize_events[0].get("operation_payload"), dict)
                  or finalize_events[0]["operation_payload"].get(
                      "assistant_response_binding"
                  )
                  != binding
              ):
                  return None, ("shared_assessment_assistant_response_binding_invalid",)

              manifest_parts = manifest.get("parts")
              binding_parts = binding.get("canonical_output_parts")
              if not isinstance(manifest_parts, list) or not isinstance(binding_parts, list):
                  return None, ("shared_assessment_assistant_response_binding_invalid",)
              manifest_by_id = {
                  item.get("part_id"): item
                  for item in manifest_parts
                  if isinstance(item, dict) and isinstance(item.get("part_id"), str)
              }
              if len(binding_parts) != len(manifest_by_id) or not binding_parts:
                  return None, ("shared_assessment_assistant_response_binding_invalid",)
              for output_part in binding_parts:
                  if not isinstance(output_part, dict):
                      return None, ("shared_assessment_assistant_response_binding_invalid",)
                  part_id = output_part.get("part_id")
                  manifest_part = manifest_by_id.get(part_id)
                  representation = output_part.get("content_representation")
                  ranges = output_part.get("accepted_ranges")
                  if (
                      not isinstance(manifest_part, dict)
                      or not isinstance(representation, dict)
                      or representation
                      != {
                          "kind": "content_digest",
                          "digest_algorithm": "sha256",
                          "digest_value": manifest_part.get("content_digest_or_null"),
                      }
                      or not isinstance(ranges, list)
                      or not ranges
                      or output_part.get("media_type")
                      != "text/plain; charset=utf-8"
                      or str(manifest_part.get("media_type", "")).split(";", 1)[0]
                      .strip()
                      .lower()
                      != "text/plain"
                  ):
                      return None, ("shared_assessment_assistant_response_binding_invalid",)
                  cursor = 0
                  for accepted_range in ranges:
                      if (
                          not isinstance(accepted_range, dict)
                          or accepted_range.get("unit") != "utf8_byte"
                          or type(accepted_range.get("start_inclusive")) is not int
                          or type(accepted_range.get("end_exclusive")) is not int
                          or accepted_range["start_inclusive"] != cursor
                          or accepted_range["end_exclusive"] <= cursor
                      ):
                          return None, ("shared_assessment_assistant_response_binding_invalid",)
                      cursor = accepted_range["end_exclusive"]
                  if cursor != manifest_part.get("byte_length_or_null"):
                      return None, ("shared_assessment_assistant_response_binding_invalid",)
              return (binding_id, binding_digest), ()


          def _validate_validation_artifacts(
              *,
              tx: EvidenceStoreTransaction,
              source: dict,
              manifest: dict,
              validation: dict,
          '''
          if text.count(marker) != 1:
              raise RuntimeError(f"validation marker match count {text.count(marker)}")
          text = text.replace(marker, helper)

          expected_old = '''    expected_gates = (
                  ("canonicalization", "integrity")
                  if normalized_origin == "user"
                  else ("canonicalization", "integrity", "assistant_finalization")
              )
              if len(requirements) != len(refs) or len(set(refs)) != len(refs):
          '''
          expected_new = '''    expected_gates = (
                  ("canonicalization", "integrity")
                  if normalized_origin == "user"
                  else ("canonicalization", "integrity", "assistant_finalization")
              )
              assistant_binding: tuple[str, str] | None = None
              if normalized_origin == "assistant":
                  assistant_binding, binding_reasons = _load_assistant_response_binding(
                      tx=tx,
                      source=source,
                      manifest=manifest,
                      evidence_space_id=evidence_space_id,
                  )
                  if assistant_binding is None:
                      return binding_reasons
              if len(requirements) != len(refs) or len(set(refs)) != len(refs):
          '''
          if text.count(expected_old) != 1:
              raise RuntimeError(f"expected gate match count {text.count(expected_old)}")
          text = text.replace(expected_old, expected_new)

          gate_old = '''        if gate in {"canonicalization", "integrity"}:
                      if (
                          event.get("subject")
                          != {"kind": "source_event", "source_event_id": source_event_id}
                          or payload.get("input_schema")
                          != "relaylm.canonical_source_manifest.v1"
                          or payload.get("input_digest") != manifest_digest
                          or payload.get("output_digest_or_null") != manifest_digest
                          or payload.get("output_binding_ref_or_null") != source_event_id
                      ):
                          return ("shared_assessment_validation_artifacts_invalid",)
                  gates.append(gate)
          '''
          gate_new = '''        if gate in {"canonicalization", "integrity"}:
                      if (
                          event.get("subject")
                          != {"kind": "source_event", "source_event_id": source_event_id}
                          or payload.get("input_schema")
                          != "relaylm.canonical_source_manifest.v1"
                          or payload.get("input_digest") != manifest_digest
                          or payload.get("output_digest_or_null") != manifest_digest
                          or payload.get("output_binding_ref_or_null") != source_event_id
                      ):
                          return ("shared_assessment_validation_artifacts_invalid",)
                  elif gate == "assistant_finalization":
                      assert assistant_binding is not None
                      binding_id, binding_digest = assistant_binding
                      if (
                          event.get("subject")
                          != {
                              "kind": "assistant_response_binding",
                              "assistant_response_binding_id": binding_id,
                          }
                          or payload.get("input_schema")
                          != "relaylm.assistant_response_binding.v1"
                          or payload.get("input_digest") != binding_digest
                          or payload.get("output_digest_or_null") != binding_digest
                          or payload.get("output_binding_ref_or_null") != binding_id
                      ):
                          return ("shared_assessment_validation_artifacts_invalid",)
                  gates.append(gate)
          '''
          if text.count(gate_old) != 1:
              raise RuntimeError(f"artifact gate match count {text.count(gate_old)}")
          text = text.replace(gate_old, gate_new)
          evidence.write_text(text, encoding="utf-8")

          tests = Path("tests/test_shared_assessment_runtime.py")
          text = tests.read_text(encoding="utf-8")
          identity_old = '''def test_assessment_identity_is_bound_to_one_evidence_space(store) -> None:
              _captures, first_bundle = _bundle(store)
          '''
          identity_new = '''def test_assessment_identity_is_bound_to_one_evidence_space(store) -> None:
              assert len(ASSESSMENT_ID.split("_")[1]) == 32
              _captures, first_bundle = _bundle(store)
          '''
          if text.count(identity_old) != 1:
              raise RuntimeError(f"identity test match count {text.count(identity_old)}")
          text = text.replace(identity_old, identity_new)
          text += '''

          def _capture_assistant_for_hardening(store, *, suffix: str):
              from relaylm.evidence_response_capture import (
                  capture_managed_assistant_response_nonstream,
              )

              user = _capture(store, key=f"assistant-hardening-user-{suffix}")
              assistant = capture_managed_assistant_response_nonstream(
                  store=store,
                  apply_enabled=True,
                  character_id="char1",
                  memory_namespace="ns1",
                  session_id="sess1",
                  response_id=f"assistant-hardening-response-{suffix}",
                  delivery_cohort_id=f"assistant-hardening-cohort-{suffix}",
                  request_source_event_ids=(user.source_event_id,),
                  assistant_visible_text="Canonical assistant output.",
                  operation_idempotency_key=f"assistant-hardening-{suffix}",
                  route_snapshot_payload=route_snapshot(
                      capture_profile="managed_assistant_response",
                      issued_at=NOW.isoformat(),
                  ),
                  now=NOW,
              )
              return user, assistant


          def test_assistant_response_binding_digest_is_required(store) -> None:
              user, assistant = _capture_assistant_for_hardening(store, suffix="binding")
              source_path = _record_path(
                  store, user.evidence_space_id, "source_event", assistant.source_event_id
              )
              source = json.loads(source_path.read_text(encoding="utf-8"))
              binding_id = source["assistant_response_binding_ref_or_null"]
              binding_path = _record_path(
                  store, user.evidence_space_id, "assistant_response_binding", binding_id
              )
              binding = json.loads(binding_path.read_text(encoding="utf-8"))
              binding["canonical_binding_digest"] = "f" * 64
              _write_json(binding_path, binding)
              result = prepare_shared_assessment_pass(
                  store=store,
                  evidence_space_id=user.evidence_space_id,
                  source_event_ids=(assistant.source_event_id,),
                  assessment_pass_id="assistant-binding-tamper",
                  now=NOW,
              )
              assert result.status == "fail_closed"
              assert result.blocked_reasons == (
                  "shared_assessment_assistant_response_binding_invalid",
              )


          def test_assistant_finalization_artifact_is_exactly_bound(store) -> None:
              user, assistant = _capture_assistant_for_hardening(store, suffix="artifact")
              source = json.loads(
                  _record_path(
                      store, user.evidence_space_id, "source_event", assistant.source_event_id
                  ).read_text(encoding="utf-8")
              )
              attempt = json.loads(
                  _record_path(
                      store,
                      user.evidence_space_id,
                      "capture_attempt",
                      source["capture_attempt_id"],
                  ).read_text(encoding="utf-8")
              ) if False else json.loads(
                  (
                      store.root
                      / user.evidence_space_id
                      / "logs"
                      / "capture_attempt"
                      / f"{source['capture_attempt_id']}.json"
                  ).read_text(encoding="utf-8")
              )
              admission_id = next(
                  event["operation_payload"]["admission_decision_id"]
                  for event in attempt
                  if event.get("operation") == "bind_admission"
              )
              admission = json.loads(
                  _record_path(
                      store, user.evidence_space_id, "admission_decision", admission_id
                  ).read_text(encoding="utf-8")
              )
              validation = json.loads(
                  _record_path(
                      store,
                      user.evidence_space_id,
                      "validation_bundle",
                      admission["validation_bundle_id_or_null"],
                  ).read_text(encoding="utf-8")
              )
              gate_index = next(
                  index
                  for index, requirement in enumerate(validation["gate_requirements"])
                  if requirement["gate_kind"] == "assistant_finalization"
              )
              derived_id = validation["active_artifact_refs"][gate_index]
              event_id = "artifactevent_" + derived_id.removeprefix("derivedartifact_")
              artifact_path = _record_path(
                  store,
                  user.evidence_space_id,
                  "source_derived_artifact_event",
                  event_id,
              )
              artifact = json.loads(artifact_path.read_text(encoding="utf-8"))
              artifact["operation_payload"]["input_digest"] = "e" * 64
              _write_json(artifact_path, artifact)
              result = prepare_shared_assessment_pass(
                  store=store,
                  evidence_space_id=user.evidence_space_id,
                  source_event_ids=(assistant.source_event_id,),
                  assessment_pass_id="assistant-artifact-tamper",
                  now=NOW,
              )
              assert result.status == "fail_closed"
              assert result.blocked_reasons == (
                  "shared_assessment_validation_artifacts_invalid",
              )
          '''
          tests.write_text(text, encoding="utf-8")
          PY
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Validate exact candidate
        run: |
          python -m compileall -q relaylm scripts
          pytest -q tests/test_shared_assessment_runtime.py
          python scripts/relaylm_asm1_shared_assessment_smoke.py
          python scripts/relaylm_docs_link_check.py
          python scripts/relaylm_docs_semantic_audit.py
          pytest -q
      - name: Publish validated hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relaylm/shared_assessment.py relaylm/shared_assessment_evidence.py tests/test_shared_assessment_runtime.py
          git commit -m "fix: bind assistant evidence finalization authority"
          git push origin HEAD:agent/asm1-shared-assessment-runtime-v1
