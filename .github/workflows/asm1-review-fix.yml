name: ASM-1 review fix runner

on:
  pull_request:
    branches:
      - asm1-review-fix-runner-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode and apply review fixes
        shell: bash
        run: |
          if test -f .asm1-review-fix-error.txt; then
            cat .asm1-review-fix-error.txt
            exit 1
          fi
          tr -d '\n' < .github/asm1-review-fix-payload.txt | base64 -d | gzip -d > /tmp/apply_asm1_review_fixes.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_asm1_review_fixes.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              "tests/test_shared_assessment_runtime.py",
              '        session_id="sess1",\\n',
              '        session_id=session_id,\\n',
          )
          '''
          new = '''replace_once(
              "tests/test_shared_assessment_runtime.py",
              """        character_id="char1",
                  memory_namespace="ns1",
                  session_id="sess1",
                  current_user_text=text,
          """,
              """        character_id="char1",
                  memory_namespace="ns1",
                  session_id=session_id,
                  current_user_text=text,
          """,
          )
          '''
          redundant = '''replace_once(
              "tests/test_shared_assessment_runtime.py",
              '        assessment_id="assessment-1",\\n',
              '        assessment_id=ASSESSMENT_ID,\\n',
          )
          '''
          smoke_old = '''replace_once(
              "scripts/relaylm_asm1_shared_assessment_smoke.py",
              '            assessment_id="asm1-smoke-assessment",\\n',
              '            assessment_id=derive_shared_assessment_id(\\n                user.evidence_space_id, "asm1-smoke-assessment"\\n            ),\\n',
          )
          '''
          smoke_new = '''replace_once(
              "scripts/relaylm_asm1_shared_assessment_smoke.py",
              """        proposal = SharedAssessmentProposal(
                      assessment_id="asm1-smoke-assessment",
                      supported_content="The user reported recent tiredness.",
          """,
              """        proposal = SharedAssessmentProposal(
                      assessment_id=derive_shared_assessment_id(
                          user.evidence_space_id, "asm1-smoke-assessment"
                      ),
                      supported_content="The user reported recent tiredness.",
          """,
          )
          '''
          checks = ((old, 'session'), (redundant, 'redundant'), (smoke_old, 'smoke'))
          for value, label in checks:
              if text.count(value) != 1:
                  raise RuntimeError(f'runner {label} patch expected one match, found {text.count(value)}')
          path.write_text(text.replace(old, new).replace(redundant, '').replace(smoke_old, smoke_new), encoding='utf-8')
          PY
          set +e
          python /tmp/apply_asm1_review_fixes.py > /tmp/asm1-review-fix-error.txt 2>&1
          status=$?
          set -e
          cat /tmp/asm1-review-fix-error.txt
          if test "$status" -ne 0; then
            cp /tmp/asm1-review-fix-error.txt .asm1-review-fix-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .asm1-review-fix-error.txt
            git commit -m "chore: publish ASM-1 review fix error"
            git push origin HEAD:asm1-review-fix-runner-head
            exit "$status"
          fi
          set +e
          python - <<'PY' > /tmp/asm1-review-fix-post-apply.txt 2>&1
          from pathlib import Path

          runtime = Path('relaylm/shared_assessment_runtime.py')
          text = runtime.read_text(encoding='utf-8')
          replacements = (
              (
                  'expected_assessment_id=proposal.assessment_id,\n                )',
                  'expected_assessment_id=proposal.assessment_id,\n                    expected_assessment_revision=(\n                        1\n                        if proposal.expected_current_revision_or_null is None\n                        else proposal.expected_current_revision_or_null + 1\n                    ),\n                )',
                  'operation call',
              ),
              (
                  '    expected_assessment_id: str,\n) -> SharedAssessmentCommitResult:',
                  '    expected_assessment_id: str,\n    expected_assessment_revision: int,\n) -> SharedAssessmentCommitResult:',
                  'operation signature',
              ),
              (
                  'existing.get("assessment_id") != expected_assessment_id\n        or type(assessment_revision) is not int',
                  'existing.get("assessment_id") != expected_assessment_id\n        or assessment_revision != expected_assessment_revision\n        or type(assessment_revision) is not int',
                  'operation revision check',
              ),
          )
          for old_value, new_value, label in replacements:
              count = text.count(old_value)
              if count != 1:
                  raise RuntimeError(f'{label} expected one match, found {count}')
              text = text.replace(old_value, new_value)
          runtime.write_text(text, encoding='utf-8')

          tests = Path('tests/test_shared_assessment_runtime.py')
          test_text = tests.read_text(encoding='utf-8')
          route_old = 'capture_profile="managed_user_input", issued_at=now.isoformat()'
          route_new = 'capture_profile="managed_user_input",\n            session_id=session_id,\n            issued_at=now.isoformat(),'
          count = test_text.count(route_old)
          if count != 1:
              raise RuntimeError(f'route snapshot expected one match, found {count}')
          tests.write_text(test_text.replace(route_old, route_new), encoding='utf-8')
          PY
          post_status=$?
          set -e
          cat /tmp/asm1-review-fix-post-apply.txt
          if test "$post_status" -ne 0; then
            cp /tmp/asm1-review-fix-post-apply.txt .asm1-review-fix-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .asm1-review-fix-error.txt
            git commit -m "chore: publish ASM-1 post-apply error"
            git push origin HEAD:asm1-review-fix-runner-head
            exit "$post_status"
          fi
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Validate fixes
        shell: bash
        run: |
          set +e
          {
            python -m compileall -q relaylm scripts &&
            pytest -q tests/test_shared_assessment_runtime.py &&
            python scripts/relaylm_asm1_shared_assessment_smoke.py &&
            python scripts/relaylm_docs_link_check.py &&
            python scripts/relaylm_docs_semantic_audit.py &&
            pytest -q
          } > /tmp/asm1-review-fix-validation.txt 2>&1
          status=$?
          set -e
          cat /tmp/asm1-review-fix-validation.txt
          if test "$status" -ne 0; then
            cp /tmp/asm1-review-fix-validation.txt .asm1-review-fix-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .asm1-review-fix-error.txt
            git commit -m "chore: publish ASM-1 validation error"
            git push origin HEAD:asm1-review-fix-runner-head
            exit "$status"
          fi
      - name: Commit reviewed result
        shell: bash
        run: |
          rm -f .github/workflows/asm1-review-fix.yml .github/asm1-review-fix-payload.txt .asm1-review-fix-trigger .asm1-review-fix-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden ASM-1 authority and receipt boundaries"
          git push origin HEAD:agent/asm1-shared-assessment-runtime-v1
