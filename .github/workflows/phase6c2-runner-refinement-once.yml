name: Phase 6-C2 runner refinement once

on:
  push:
    branches:
      - phase6c2-one-queued-job-integration
    paths:
      - "scripts/_phase6c2_refine_runner.py"
      - ".github/workflows/phase6c2-runner-refinement-once.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6c2-one-queued-job-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refine canonical reread and source contention coverage
        run: python scripts/_phase6c2_refine_runner.py
      - name: Remove one-shot refinement machinery
        run: |
          rm scripts/_phase6c2_refine_runner.py
          rm .github/workflows/phase6c2-runner-refinement-once.yml
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relaylm scripts .github/workflows/phase6c2-runner-refinement-once.yml
          git commit -m "fix: use canonical reread before Phase 6-C2 rehydrate"
          git push origin HEAD:phase6c2-one-queued-job-integration
