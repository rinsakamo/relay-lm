name: Phase 6-C1 fault injection smoke

on:
  pull_request:
    paths:
      - "scripts/_relaylm_phase6c1_fault_fixtures.py"
      - "scripts/relaylm_phase6c1_fault_injection_smoke.py"
      - "relaylm/relaymem_slp_queue_state.py"
      - "relaylm/relaymem_slp_queue_record.py"
      - "relaylm/relaymem_slp_queue_storage.py"
      - "relaylm/relaymem_slp_durable_enqueue.py"
      - "relaylm/relaymem_primary_page_writer.py"
      - "relaylm/relaymem_primary_index_log_reconciliation.py"
      - "relaylm/relaymem_primary_index_log_apply.py"
      - "relaylm/relaymem_primary_index_log_recovery_audit.py"
      - "relaylm/_relaymem_primary_index_log_apply_io.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_io.py"
      - "docs/architecture/phase6c1_primary_mem_worker_contract.md"
      - ".github/workflows/phase6c1-fault-injection-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/_relaylm_phase6c1_fault_fixtures.py"
      - "scripts/relaylm_phase6c1_fault_injection_smoke.py"
      - "relaylm/relaymem_slp_queue_state.py"
      - "relaylm/relaymem_slp_queue_record.py"
      - "relaylm/relaymem_slp_queue_storage.py"
      - "relaylm/relaymem_slp_durable_enqueue.py"
      - "relaylm/relaymem_primary_page_writer.py"
      - "relaylm/relaymem_primary_index_log_reconciliation.py"
      - "relaylm/relaymem_primary_index_log_apply.py"
      - "relaylm/relaymem_primary_index_log_recovery_audit.py"
      - "relaylm/_relaymem_primary_index_log_apply_io.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_io.py"
      - "docs/architecture/phase6c1_primary_mem_worker_contract.md"
      - ".github/workflows/phase6c1-fault-injection-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Phase 6-C1 fault fixtures and smoke
        run: >-
          python -m compileall -q
          scripts/_relaylm_phase6c1_fault_fixtures.py
          scripts/relaylm_phase6c1_fault_injection_smoke.py
      - name: Run Phase 6-C1 fault injection smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6c1_fault_injection_smoke.py
      - name: Run Phase 6-B3 queue contract smoke
        run: PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_contract_smoke.py
      - name: Run RelayMEM M3e page writer smoke
        run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_page_writer_smoke.py
      - name: Run RelayMEM M3g apply smoke
        run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_apply_smoke.py
      - name: Run RelayMEM M3h recovery audit smoke
        run: PYTHONPATH=. python scripts/relaylm_relaymem_primary_index_log_recovery_audit_smoke.py
