name: Phase 6-C1 fault injection smoke

on:
  pull_request:
    paths:
      - "scripts/_relaylm_phase6c1_fault_fixtures.py"
      - "scripts/relaylm_phase6c1_fault_injection_smoke.py"
      - "relaylm/relaymem_slp_queue_state.py"
      - "relaylm/relaymem_slp_queue_record.py"
      - "relaylm/relaymem_slp_queue_storage.py"
      - "relaylm/relaymem_slp_durable_enqueue.py"
      - "relaylm/relaymem_primary_page_writer.py"
      - "relaylm/relaymem_primary_index_log_reconciliation.py"
      - "relaylm/relaymem_primary_index_log_apply.py"
      - "relaylm/relaymem_primary_index_log_recovery_audit.py"
      - "relaylm/_relaymem_primary_index_log_apply_io.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_io.py"
      - "docs/architecture/phase6c1_primary_mem_worker_contract.md"
      - ".github/workflows/phase6c1-fault-injection-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/_relaylm_phase6c1_fault_fixtures.py"
      - "scripts/relaylm_phase6c1_fault_injection_smoke.py"
      - "relaylm/relaymem_slp_queue_state.py"
      - "relaylm/relaymem_slp_queue_record.py"
      - "relaylm/relaymem_slp_queue_storage.py"
      - "relaylm/relaymem_slp_durable_enqueue.py"
      - "relaylm/relaymem_primary_page_writer.py"
      - "relaylm/relaymem_primary_index_log_reconciliation.py"
      - "relaylm/relaymem_primary_index_log_apply.py"
      - "relaylm/relaymem_primary_index_log_recovery_audit.py"
      - "relaylm/_relaymem_primary_index_log_apply_io.py"
      - "relaylm/_relaymem_primary_index_log_recovery_audit_io.py"
      - "docs/architecture/phase6c1_primary_mem_worker_contract.md"
      - ".github/workflows/phase6c1-fault-injection-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Phase 6-C1 fault fixtures and smoke
        run: >-
          python -m compileall -q
          scripts/_relaylm_phase6c1_fault_fixtures.py
          scripts/relaylm_phase6c1_fault_injection_smoke.py
      - name: Validate queue claim and lease fixtures
        run: >-
          python -c 'from scripts.relaylm_phase6c1_fault_injection_smoke import
          test_claimed_record, test_expired_claim, test_stale_fences;
          test_claimed_record(); test_expired_claim(); test_stale_fences()'
      - name: Validate M3e publication and duplicate fixtures
        run: >-
          python -c 'from scripts.relaylm_phase6c1_fault_injection_smoke import
          test_m3e_and_duplicate; test_m3e_and_duplicate()'
      - name: Validate M3g lock contention fixture
        run: >-
          python -c 'from scripts.relaylm_phase6c1_fault_injection_smoke import
          test_m3g_lock_contention; test_m3g_lock_contention()'
      - name: Validate M3h lock contention fixture
        run: >-
          python -c 'from scripts.relaylm_phase6c1_fault_injection_smoke import
          test_m3h_lock_contention; test_m3h_lock_contention()'
      - name: Validate reconciliation recovery fixtures
        run: >-
          python -c 'from scripts.relaylm_phase6c1_fault_injection_smoke import
          test_recovery_states, test_diverged_controls;
          test_recovery_states(); test_diverged_controls()'
      - name: Validate crash-point fixtures
        run: >-
          python -c 'from scripts.relaylm_phase6c1_fault_injection_smoke import
          test_crash_points; test_crash_points()'
      - name: Validate determinism and identity boundaries
        run: >-
          python -c 'from scripts.relaylm_phase6c1_fault_injection_smoke import
          test_determinism_and_identity_domains, test_source_boundaries;
          test_determinism_and_identity_domains(); test_source_boundaries()'
      - name: Validate subprocess content leakage
        run: >-
          python -c 'from scripts.relaylm_phase6c1_fault_injection_smoke import
          test_subprocess_content_leakage; test_subprocess_content_leakage()'
      - name: Run complete Phase 6-C1 fault injection smoke
        run: python scripts/relaylm_phase6c1_fault_injection_smoke.py
      - name: Run Phase 6-B3 queue contract smoke
        run: python scripts/relaylm_phase6b3_queue_state_contract_smoke.py
      - name: Run RelayMEM M3e page writer smoke
        run: python scripts/relaylm_relaymem_primary_page_writer_smoke.py
      - name: Run RelayMEM M3g apply smoke
        run: python scripts/relaylm_relaymem_primary_index_log_apply_smoke.py
      - name: Run RelayMEM M3h recovery audit smoke
        run: python scripts/relaylm_relaymem_primary_index_log_recovery_audit_smoke.py
