name: Client instruction typed parse cache write smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - relaylm/client_instruction_typed_parse.py
      - relaylm/client_instruction_cache_write.py
      - relaylm/client_instruction_cache.py
      - relaylm/client_instruction_extraction.py
      - relaylm/client_instruction_fingerprint.py
      - relaylm/client_instruction_identity.py
      - relaylm/config.py
      - relaylm/routing.py
      - relaylm/trace_runtime.py
      - scripts/relaylm_client_instruction_typed_parse_cache_write_smoke.py
      - .github/workflows/client-instruction-typed-parse-cache-write-smoke.yml
  push:
    branches:
      - main
    paths:
      - relaylm/client_instruction_typed_parse.py
      - relaylm/client_instruction_cache_write.py
      - relaylm/client_instruction_cache.py
      - relaylm/client_instruction_extraction.py
      - relaylm/client_instruction_fingerprint.py
      - relaylm/client_instruction_identity.py
      - relaylm/config.py
      - relaylm/routing.py
      - relaylm/trace_runtime.py
      - scripts/relaylm_client_instruction_typed_parse_cache_write_smoke.py
      - .github/workflows/client-instruction-typed-parse-cache-write-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package and smoke scripts
        run: python -m compileall relaylm scripts
      - name: Run typed parse cache write smoke
        run: python scripts/relaylm_client_instruction_typed_parse_cache_write_smoke.py
