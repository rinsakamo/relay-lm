name: Temporary Phase I-3 whitespace diagnosis

on:
  push:
    branches:
      - phase-i3-auditable-primary-mem-correct
    paths:
      - .github/workflows/phase-i3-temporary-whitespace-diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-i3-auditable-primary-mem-correct
          fetch-depth: 0
      - name: Capture bounded whitespace locations
        run: |
          git fetch origin main
          python - <<'PY'
          import subprocess
          from pathlib import Path

          result = subprocess.run(
              ["git", "diff", "--check", "origin/main...HEAD"],
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              check=False,
          )
          locations = []
          for line in result.stdout.splitlines():
              if ":" in line:
                  parts = line.split(":", 2)
                  if len(parts) >= 2:
                      locations.append(f"{parts[0]}:{parts[1]}")
          Path("whitespace-locations.txt").write_text(
              "\n".join(sorted(set(locations))) + "\n", encoding="utf-8"
          )
          PY
      - name: Record locations
        run: |
          {
            printf '\n## Whitespace diagnosis\n\n```text\n'
            cat whitespace-locations.txt
            printf '```\n'
          } >> docs/architecture/phase_i3_validation_receipt.md
          rm whitespace-locations.txt
          rm .github/workflows/phase-i3-temporary-whitespace-diagnose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/phase_i3_validation_receipt.md
          git add -u .github/workflows/phase-i3-temporary-whitespace-diagnose.yml
          git commit -m "test: record Phase I3 whitespace locations"
          git push origin HEAD:phase-i3-auditable-primary-mem-correct
