name: Temporary Twin runbook anchor fix

on:
  push:
    paths:
      - ".github/workflows/_temporary-twin-anchor-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.ref_name == 'agent/docs-semantic-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-semantic-validation
      - name: Add stable Twin bridge anchor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/tools/twin_extraction_runbook.md')
          text = path.read_text(encoding='utf-8')
          heading = '### 6. review import bridge (P1出力 -> CW-A4 governed import source)'
          replacement = '<a id="6-review-import-bridge-p1出力--cw-a4-governed-import-source"></a>\n\n' + heading
          if text.count(heading) != 1:
              raise SystemExit('unexpected Twin bridge heading count')
          if replacement in text:
              raise SystemExit('Twin bridge anchor already present')
          path.write_text(text.replace(heading, replacement), encoding='utf-8')
          PY
          git rm .github/workflows/_temporary-twin-anchor-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tools/twin_extraction_runbook.md
          git commit -m "docs: stabilize Twin bridge section anchor"
          git push origin HEAD:agent/docs-semantic-validation
