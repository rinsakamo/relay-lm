name: Documentation Cutover 1C-54 Builder

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/documentation-cutover-1c54-builder.yml"
      - "scripts/_tmp_documentation_cutover_1c54_builder.py"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: documentation-cutover-1c54-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.head_ref == 'agent/documentation-hard-cutover-1c54-i4c2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Construct final tree
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_tmp_documentation_cutover_1c54_builder.py")
          text = path.read_text(encoding="utf-8")
          anchor = '_code = gzip.decompress(base64.b64decode(_PAYLOAD)).decode("utf-8")\n'
          patch = anchor + "_code = _code.replace('        \"corrections\",\\n', '')\n"
          if anchor not in text:
              raise SystemExit("compressed builder anchor missing")
          path.write_text(text.replace(anchor, patch, 1), encoding="utf-8")
          PY
          set +e
          python scripts/_tmp_documentation_cutover_1c54_builder.py 2>&1 | tee /tmp/builder.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            expected=$(cat <<'EOF'
          temporary tooling remains in final diff:
           D .github/workflows/documentation-cutover-1c54-builder.yml
           D scripts/_tmp_documentation_cutover_1c54_builder.py
          EOF
          )
            [ "$(cat /tmp/builder.log)" = "$expected" ] || exit "$status"
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/evidence/migrations/documentation-hard-cutover-receipt.md")
          path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
      - name: Validate final tree serially
        run: |
          set -euo pipefail
          python -m compileall -q relaylm scripts
          python scripts/relaylm_i4c2_handoff_cutover_guard.py
          python scripts/relaylm_i4c2_handoff_cutover_guard.py --self-test
          PYTHONPATH=.:scripts python scripts/relaylm_docs_link_check.py
          PYTHONPATH=.:scripts python scripts/relaylm_docs_semantic_audit.py
          PYTHONPATH=.:scripts python scripts/relaylm_documentation_current_boundary_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_recovery_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_fault_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_concurrency_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_primary_forget_security_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c2_ownership_boundary_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4c1_primary_forget_hidden_successor_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4d_primary_retrieval_exclusion_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4f_forget_validation_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4f_forget_validation_fault_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4f_forget_validation_concurrency_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4f_forget_validation_security_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase_i4f_forget_validation_ui_smoke.py
          git diff --check
      - name: Create validated blob manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git restore -- .github/workflows/documentation-cutover-1c54-builder.yml
          python - <<'PY'
          from __future__ import annotations
          import base64, json, os, subprocess
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          token = os.environ["GH_TOKEN"]
          repository = os.environ["GH_REPOSITORY"]
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "relaylm-documentation-cutover-1c54",
          }

          def post_blob(raw: bytes) -> str:
              payload = json.dumps({
                  "content": base64.b64encode(raw).decode(),
                  "encoding": "base64",
              }).encode()
              req = Request(api + "/git/blobs", data=payload, headers=headers, method="POST")
              try:
                  with urlopen(req, timeout=60) as response:
                      return json.load(response)["sha"]
              except HTTPError as exc:
                  raise RuntimeError(f"blob create failed: {exc.code} {exc.read().decode(errors='replace')}") from exc

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          changed = sorted(set(
              subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=ACMRTUXB"], text=True).splitlines()
              + subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines()
          ))
          deleted = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=D"], text=True).splitlines()
          workflow = ".github/workflows/documentation-cutover-1c54-builder.yml"
          if workflow in changed or workflow in deleted:
              raise SystemExit("temporary workflow must be retained until connector commit")
          elements = []
          for relative in changed:
              elements.append({
                  "path": relative,
                  "mode": "100644",
                  "type": "blob",
                  "sha": post_blob(Path(relative).read_bytes()),
              })
          elements.extend({"path": relative, "mode": "100644", "type": "blob", "sha": None} for relative in deleted)
          manifest = {"parent": head, "tree_elements": elements}
          Path("/tmp/documentation-cutover-1c54-blob-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"manifest parent={head} elements={len(elements)}")
          PY
      - name: Upload validated blob manifest
        uses: actions/upload-artifact@v4
        with:
          name: documentation-cutover-1c54-blob-manifest
          path: /tmp/documentation-cutover-1c54-blob-manifest.json
