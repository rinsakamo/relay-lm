name: Phase 6-C1 durable protected source smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "relaylm/_relaymem_slp_protected_source_*.py"
      - "relaylm/relaymem_slp_protected_source_store.py"
      - "relaylm/relaymem_slp_durable_runtime_enqueue.py"
      - "relaylm/relaymem_slp_primary_worker_source_adapter.py"
      - "relaylm/relaymem_slp_runtime_finalization.py"
      - "relaylm/relaymem_slp_runtime_enqueue.py"
      - "relaylm/relaymem_slp_primary_worker_source.py"
      - "relaylm/relaymem_slp_primary_worker_source_registry.py"
      - "relaylm/relaymem_slp_primary_worker.py"
      - "relaylm/_relaymem_slp_primary_worker_*.py"
      - "relaylm/relaymem_slp_durable_enqueue.py"
      - "relaylm/relaymem_slp_queue_*.py"
      - "relaylm/config.py"
      - "config.example.yaml"
      - "scripts/_relaylm_phase6c1_durable_source_support.py"
      - "scripts/relaylm_phase6c1_durable_source_*.py"
      - "scripts/relaylm_phase6c1_durable_protected_source_smoke.py"
      - "docs/architecture/phase6c1_durable_protected_source_persistence.md"
      - ".github/workflows/phase6c1-durable-protected-source-smoke.yml"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - "relaylm/_relaymem_slp_protected_source_*.py"
      - "relaylm/relaymem_slp_protected_source_store.py"
      - "relaylm/relaymem_slp_durable_runtime_enqueue.py"
      - "relaylm/relaymem_slp_primary_worker_source_adapter.py"
      - "relaylm/relaymem_slp_runtime_finalization.py"
      - "relaylm/relaymem_slp_runtime_enqueue.py"
      - "relaylm/relaymem_slp_primary_worker_source.py"
      - "relaylm/relaymem_slp_primary_worker_source_registry.py"
      - "relaylm/relaymem_slp_primary_worker.py"
      - "relaylm/_relaymem_slp_primary_worker_*.py"
      - "relaylm/relaymem_slp_durable_enqueue.py"
      - "relaylm/relaymem_slp_queue_*.py"
      - "relaylm/config.py"
      - "config.example.yaml"
      - "scripts/_relaylm_phase6c1_durable_source_support.py"
      - "scripts/relaylm_phase6c1_durable_source_*.py"
      - "scripts/relaylm_phase6c1_durable_protected_source_smoke.py"
      - "docs/architecture/phase6c1_durable_protected_source_persistence.md"
      - ".github/workflows/phase6c1-durable-protected-source-smoke.yml"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: phase6c1-durable-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RelayLM runtime dependencies
        run: python -m pip install -e .
      - name: Compile durable protected-source boundary
        run: >-
          python -m compileall -q
          relaylm/_relaymem_slp_protected_source_artifact.py
          relaylm/_relaymem_slp_protected_source_fs.py
          relaylm/relaymem_slp_protected_source_store.py
          relaylm/relaymem_slp_durable_runtime_enqueue.py
          relaylm/relaymem_slp_primary_worker_source_adapter.py
          relaylm/relaymem_slp_runtime_finalization.py
          relaylm/config.py
          scripts/_relaylm_phase6c1_durable_source_support.py
          scripts/relaylm_phase6c1_durable_source_store_smoke.py
          scripts/relaylm_phase6c1_durable_source_restart_smoke.py
          scripts/relaylm_phase6c1_durable_protected_source_smoke.py
      - name: Run durable store and restart suite
        run: >-
          PYTHONPATH=.:scripts
          python scripts/relaylm_phase6c1_durable_protected_source_smoke.py
      - name: Run Phase 6-C1 source and worker regressions
        run: |
          PYTHONPATH=. python scripts/relaylm_phase6_runtime_enqueue_source_capture_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6c1_primary_worker_source_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_primary_worker_review_fix_smoke.py
          PYTHONPATH=.:scripts python scripts/relaylm_phase6c1_worker_integration_ci_runner.py
      - name: Run queue and documentation regressions
        run: |
          PYTHONPATH=. python scripts/relaylm_phase6b2_durable_enqueue_contract_smoke.py
          PYTHONPATH=. python scripts/relaylm_phase6b3_queue_state_smoke.py
          PYTHONPATH=. python scripts/relaylm_docs_link_check.py
          PYTHONPATH=. python scripts/relaylm_onboarding_config_smoke.py
