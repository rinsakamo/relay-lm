name: Temporary M3g final hardening

on:
  push:
    branches:
      - relaymem-m3g-primary-index-log-reconciliation-apply
    paths:
      - ".github/workflows/temp-m3g-final-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relaymem-m3g-primary-index-log-reconciliation-apply
      - name: Harden page binding and append-only transition
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path("relaylm/_relaymem_primary_index_log_apply_contract.py")
          text = contract.read_text(encoding="utf-8")
          old = '''    MAX_PAGE_BYTES,\n    PAGE_SCHEMA,\n    TARGET_DIR,\n'''
          new = '''    MAX_PAGE_BYTES,\n    MAX_SUMMARY,\n    MAX_TITLE,\n    PAGE_SCHEMA,\n    TARGET_DIR,\n'''
          if text.count(old) != 1:
              raise SystemExit("contract import replacement mismatch")
          text = text.replace(old, new)

          old = '''    return {\n        "valid": True,\n        "plan": dict(value),\n        "blocked_reasons": [],\n    }\n\n\ndef verify_m3g_page(plan_page: Mapping[str, Any], content: bytes) -> list[str]:\n'''
          new = '''    return {\n        "valid": True,\n        "plan": dict(value),\n        "index_entry": dict(index_entry),\n        "log_entry": dict(log_entry),\n        "blocked_reasons": [],\n    }\n\n\ndef verify_m3g_page(\n    plan_page: Mapping[str, Any],\n    content: bytes,\n    *,\n    index_entry: Mapping[str, Any],\n    log_entry: Mapping[str, Any],\n) -> list[str]:\n'''
          if text.count(old) != 1:
              raise SystemExit("contract parse return replacement mismatch")
          text = text.replace(old, new)

          old = '''    expected = {\n        "schema_version": PAGE_SCHEMA,\n        "memory_layer": "primary",\n        "memory_kind": plan_page["memory_kind"],\n        "promotion_policy": "free_to_update",\n        "safety_scope": "ordinary_memory",\n        "idempotency_key": plan_page["idempotency_key"],\n    }\n    for field, wanted in expected.items():\n        if metadata.get(field) != wanted:\n            reasons.append(f"primary_reconciliation_apply_page_{field}_mismatch")\n    return dedupe(reasons)\n'''
          new = '''    expected = {\n        "schema_version": PAGE_SCHEMA,\n        "memory_layer": "primary",\n        "memory_kind": plan_page["memory_kind"],\n        "source_event_kind": index_entry["source_event_kind"],\n        "promotion_policy": "free_to_update",\n        "safety_scope": "ordinary_memory",\n        "namespace": index_entry["namespace"],\n        "lineage_fingerprint": log_entry["lineage_fingerprint"],\n        "idempotency_key": plan_page["idempotency_key"],\n        "summary_origin": "trusted_in_process_summary",\n        "content_role": "evidence",\n    }\n    for field, wanted in expected.items():\n        if metadata.get(field) != wanted:\n            reasons.append(f"primary_reconciliation_apply_page_{field}_mismatch")\n    summary = metadata.get("summary")\n    title = metadata.get("title")\n    if (\n        not isinstance(summary, str)\n        or not summary\n        or summary != summary.strip()\n        or len(summary) > MAX_SUMMARY\n    ):\n        reasons.append("primary_reconciliation_apply_page_summary_invalid")\n    elif parsed["body"] != f"# Primary memory\\n\\n## Summary\\n\\n{summary}\\n":\n        reasons.append("primary_reconciliation_apply_page_body_mismatch")\n    if (\n        not isinstance(title, str)\n        or title != title.strip()\n        or len(title) > MAX_TITLE\n        or bad_text(title)\n        or any(char in title for char in "\\n\\r\\t")\n    ):\n        reasons.append("primary_reconciliation_apply_page_title_invalid")\n    return dedupe(reasons)\n'''
          if text.count(old) != 1:
              raise SystemExit("page verification replacement mismatch")
          contract.write_text(text.replace(old, new), encoding="utf-8")

          helper = Path("relaylm/_relaymem_primary_index_log_apply.py")
          text = helper.read_text(encoding="utf-8")
          old = '''            page_reasons = verify_m3g_page(page_plan, page["content"])\n'''
          new = '''            page_reasons = verify_m3g_page(\n                page_plan,\n                page["content"],\n                index_entry=parsed["index_entry"],\n                log_entry=parsed["log_entry"],\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit("helper page call replacement mismatch")
          helper.write_text(text.replace(old, new), encoding="utf-8")

          io = Path("relaylm/_relaymem_primary_index_log_apply_io.py")
          text = io.read_text(encoding="utf-8")
          old = '''import errno\nimport os\nimport secrets\n'''
          new = '''import errno\nimport json\nimport os\nimport secrets\n'''
          if text.count(old) != 1:
              raise SystemExit("io import replacement mismatch")
          text = text.replace(old, new)
          old = '''from ._relaymem_primary_index_log_reconciliation_plan import MAX_INDEX_LOG_BYTES\n'''
          new = '''from ._relaymem_primary_index_log_reconciliation_plan import (\n    MAX_INDEX_LOG_BYTES,\n    _parse_markers,\n    _valid_existing_entry,\n)\n'''
          if text.count(old) != 1:
              raise SystemExit("io plan import replacement mismatch")
          text = text.replace(old, new)
          old = '''    if (\n        len(content) == control_plan["expected_current_bytes"]\n        and sha256(content).hexdigest() == control_plan["expected_current_digest"]\n    ):\n        return {"status": "expected", "blocked_reasons": []}\n'''
          new = '''    if (\n        len(content) == control_plan["expected_current_bytes"]\n        and sha256(content).hexdigest() == control_plan["expected_current_digest"]\n    ):\n        transition_reasons = _append_transition_reasons(\n            current=content, control_plan=control_plan, role=role\n        )\n        if transition_reasons:\n            return {"status": "invalid", "blocked_reasons": transition_reasons}\n        return {"status": "expected", "blocked_reasons": []}\n'''
          if text.count(old) != 1:
              raise SystemExit("io expected classification replacement mismatch")
          text = text.replace(old, new)
          marker = '''\n\ndef _atomic_replace_control(\n'''
          insertion = '''\n\ndef _append_transition_reasons(\n    *, current: bytes, control_plan: Mapping[str, Any], role: str\n) -> list[str]:\n    if control_plan["idempotent_noop"] is True:\n        return [f"primary_reconciliation_apply_{role}_noop_current_mismatch"]\n    marker = f"relaymem-primary-{role}-entry-v0"\n    header = "# Index" if role == "index" else "# Log"\n    current_parsed = _parse_markers(current, marker, header)\n    if current_parsed.get("valid") is not True or any(\n        not _valid_existing_entry(marker, entry)\n        for entry in current_parsed.get("entries", [])\n    ):\n        return [f"primary_reconciliation_apply_{role}_current_contract_invalid"]\n    proposed = str(control_plan["proposed_next_content"]).encode("utf-8")\n    proposed_parsed = _parse_markers(proposed, marker, header)\n    if proposed_parsed.get("valid") is not True:\n        return [f"primary_reconciliation_apply_{role}_append_transition_invalid"]\n    matches = [\n        entry\n        for entry in proposed_parsed["entries"]\n        if entry.get("entry_id") == control_plan["entry_identity"]\n    ]\n    if len(matches) != 1:\n        return [f"primary_reconciliation_apply_{role}_append_transition_invalid"]\n    serialized = json.dumps(\n        matches[0], ensure_ascii=False, sort_keys=True, separators=(",", ":")\n    )\n    suffix = f"<!-- {marker} {serialized} -->\\n".encode("utf-8")\n    expected = current\n    if expected and not expected.endswith(b"\\n"):\n        expected += b"\\n"\n    expected += suffix\n    if proposed != expected:\n        return [f"primary_reconciliation_apply_{role}_append_transition_invalid"]\n    return []\n'''
          if text.count(marker) != 1:
              raise SystemExit("io insertion marker mismatch")
          io.write_text(text.replace(marker, insertion + marker), encoding="utf-8")

          security = Path("scripts/relaylm_relaymem_primary_index_log_apply_security_smoke.py")
          text = security.read_text(encoding="utf-8")
          old = '''from relaylm.relaymem_primary_index_log_apply import (\n    apply_relaymem_primary_index_log_reconciliation,\n)\n'''
          new = '''from relaylm._relaymem_primary_index_log_apply_contract import verify_m3g_page\nfrom relaylm.relaymem_primary_index_log_apply import (\n    apply_relaymem_primary_index_log_reconciliation,\n)\n'''
          if text.count(old) != 1:
              raise SystemExit("security import replacement mismatch")
          text = text.replace(old, new)
          old = '''        require(index_path.read_text(encoding="utf-8") == "# Index\\n", index_path)\n        print("ok exact nested plan contract fails closed without mutation")\n\n'''
          new = '''        require(index_path.read_text(encoding="utf-8") == "# Index\\n", index_path)\n        print("ok exact nested plan contract fails closed without mutation")\n\n        append_violation = copy.deepcopy(plan)\n        original = append_violation["index_plan"]["proposed_next_content"]\n        changed = original.replace("# Index\\n", "# Index\\nrewritten content\\n", 1)\n        changed_bytes = changed.encode("utf-8")\n        changed_digest = hashlib.sha256(changed_bytes).hexdigest()\n        append_violation["index_plan"]["proposed_next_content"] = changed\n        append_violation["index_plan"]["proposed_next_bytes"] = len(changed_bytes)\n        append_violation["index_plan"]["proposed_next_digest"] = changed_digest\n        append_violation["ordered_operations"][0]["proposed_next_content"] = changed\n        append_violation["ordered_operations"][0]["proposed_next_bytes"] = len(changed_bytes)\n        append_violation["ordered_operations"][0]["proposed_next_digest"] = changed_digest\n        append_result = apply_plan(root, append_violation)\n        require(append_result["status"] == "blocked", append_result)\n        require(append_result["writes_memory"] is False, append_result)\n        require(\n            "primary_reconciliation_apply_index_append_transition_invalid"\n            in append_result["blocked_reasons"],\n            append_result,\n        )\n        require(index_path.read_text(encoding="utf-8") == "# Index\\n", index_path)\n        print("ok proposed control content must be an exact append transition")\n\n        page_bytes = (root / receipt["target_relative_path"]).read_bytes()\n        page_plan = dict(plan["page"])\n        index_content = plan["index_plan"]["proposed_next_content"]\n        log_content = plan["log_plan"]["proposed_next_content"]\n        index_line = next(\n            line for line in index_content.splitlines()\n            if "relaymem-primary-index-entry-v0" in line\n        )\n        log_line = next(\n            line for line in log_content.splitlines()\n            if "relaymem-primary-log-entry-v0" in line\n        )\n        index_entry = json.loads(\n            index_line[len("<!-- relaymem-primary-index-entry-v0 ") : -4]\n        )\n        log_entry = json.loads(\n            log_line[len("<!-- relaymem-primary-log-entry-v0 ") : -4]\n        )\n        mismatched_page = page_bytes.decode("utf-8").replace(\n            'namespace: "character-main"',\n            'namespace: "different-character"',\n            1,\n        ).encode("utf-8")\n        page_plan["page_bytes"] = len(mismatched_page)\n        page_plan["page_digest"] = hashlib.sha256(mismatched_page).hexdigest()\n        page_reasons = verify_m3g_page(\n            page_plan,\n            mismatched_page,\n            index_entry=index_entry,\n            log_entry=log_entry,\n        )\n        require(\n            "primary_reconciliation_apply_page_namespace_mismatch" in page_reasons,\n            page_reasons,\n        )\n        print("ok page namespace and lineage remain bound to control entries")\n\n'''
          if text.count(old) != 1:
              raise SystemExit("security insertion mismatch")
          security.write_text(text.replace(old, new), encoding="utf-8")

          doc = Path("docs/architecture/relaymem_m3g_primary_index_log_reconciliation_apply.md")
          text = doc.read_text(encoding="utf-8")
          old = '''- memory-write idempotency key.\n\nA missing or mismatching page blocks the whole apply before any control-file mutation.\n'''
          new = '''- memory-write idempotency key,\n- namespace and source-event correspondence with both control entries,\n- lineage correspondence with the log entry,\n- summary/title bounds and deterministic page body.\n\nA missing or mismatching page blocks the whole apply before any control-file mutation.\n'''
          if text.count(old) != 1:
              raise SystemExit("doc page replacement mismatch")
          text = text.replace(old, new)
          old = '''The current file is never modified in place. Readers observe either the prior complete file or the proposed complete file.\n\nBefore replacement, the current file must equal either:\n'''
          new = '''The current file is never modified in place. Readers observe either the prior complete file or the proposed complete file. M3g also reconstructs the proposed transition and requires it to equal the exact current bytes, an optional terminating newline, and exactly one canonical target marker. A plan cannot remove or rewrite existing control-file bytes while presenting a matching current digest.\n\nBefore replacement, the current file must equal either:\n'''
          if text.count(old) != 1:
              raise SystemExit("doc transition replacement mismatch")
          doc.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            relaylm/_relaymem_primary_index_log_apply_contract.py \
            relaylm/_relaymem_primary_index_log_apply.py \
            relaylm/_relaymem_primary_index_log_apply_io.py \
            scripts/relaylm_relaymem_primary_index_log_apply_security_smoke.py \
            docs/architecture/relaymem_m3g_primary_index_log_reconciliation_apply.md
          git commit -m "fix: harden M3g page binding and append transition"
          git push origin HEAD:relaymem-m3g-primary-index-log-reconciliation-apply
