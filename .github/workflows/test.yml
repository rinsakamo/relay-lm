name: Unit tests

on:
  workflow_dispatch:
  push:
    paths:
      - "relaylm/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "relaylm/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run tests
        run: |
          set -o pipefail
          pytest -x --tb=short 2>&1 | tee pytest-failure.log
      - name: Upload pytest failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-${{ matrix.python-version }}
          path: pytest-failure.log
          if-no-files-found: error
          retention-days: 1
