name: Unit tests

on:
  workflow_dispatch:
  push:
    paths:
      - "relaylm/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "relaylm/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"

permissions:
  contents: write

jobs:
  ev1-snapshot-expiry-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 629
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Gate explicit snapshot-expiry fix
        id: gate
        shell: bash
        run: |
          if [ "$(git log -1 --format=%s)" = "ci: execute EV-1 snapshot expiry validation fix" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Apply snapshot-expiry validation correction
        if: steps.gate.outputs.run == 'true'
        run: python .github/ev1_snapshot_expiry_fix.py
      - name: Install Python 3.12 test dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run plain pytest on Python 3.12
        if: steps.gate.outputs.run == 'true'
        run: pytest
      - name: Run EV-1 smoke
        if: steps.gate.outputs.run == 'true'
        run: python scripts/relaylm_ev1_governed_evidence_smoke.py
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.10'
      - name: Install Python 3.10 test dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run plain pytest on Python 3.10
        if: steps.gate.outputs.run == 'true'
        run: pytest
      - name: Publish corrected head
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git diff --check
          git fetch origin main
          git show origin/main:.github/workflows/test.yml > .github/workflows/test.yml
          rm -f .github/ev1_snapshot_expiry_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: validate route snapshot expiry shape'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run tests
        run: pytest
