name: Build validated D1 final patch

on:
  push:
    branches:
      - agent/d1-final-patch-build
    paths:
      - ".github/workflows/d1-final-patch-build.yml"
      - ".d1-final-v2.diff.gz.b64"
      - ".d1-transitional-final.json"
  pull_request:
    paths:
      - ".github/workflows/d1-final-patch-build.yml"
      - ".d1-final-v2.diff.gz.b64"
      - ".d1-transitional-final.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/d1-final-patch-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply validated D1 delta
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          base64 -d .d1-final-v2.diff.gz.b64 > /tmp/d1-final-v2.diff.gz
          echo "acca8baca3747faf89638afa1997144936fb74c1a92ec3b473689ee71fec225b  /tmp/d1-final-v2.diff.gz" | sha256sum -c -
          gzip -dc /tmp/d1-final-v2.diff.gz > /tmp/d1-final-v2.diff
          patch --batch -p3 < /tmp/d1-final-v2.diff
          cp .d1-transitional-final.json records/documentation/transitional-assets.json
          find . -maxdepth 1 -type f -name '.d1*' -delete
          find .github/workflows -maxdepth 1 -type f -name 'd1-*.yml' -delete
      - name: Validate exact D1 boundary
        run: |
          set -o pipefail
          : > /tmp/d1-final-patch-build.log
          failed=0
          run_check() {
            echo "> $*" | tee -a /tmp/d1-final-patch-build.log
            "$@" 2>&1 | tee -a /tmp/d1-final-patch-build.log || failed=1
          }
          run_check python -m pip install -e ".[test]"
          run_check python -m compileall -q scripts/relaylm_mvp_completion_report_smoke.py scripts/relaylm_docs_semantic_audit.py scripts/relaylm_documentation_governance_validate.py scripts/relaylm_mvp_eval_runner_registry.py scripts/relaylm_ci_consolidated_smoke.py
          run_check python scripts/relaylm_mvp_completion_report_smoke.py --check-all
          run_check python scripts/relaylm_mvp_completion_report_smoke.py --self-test
          run_check python scripts/relaylm_docs_semantic_audit.py
          run_check python scripts/relaylm_docs_semantic_audit.py --self-test
          run_check python scripts/relaylm_documentation_governance_validate.py --base-ref origin/main
          run_check python scripts/relaylm_documentation_governance_validate.py --self-test
          run_check python scripts/relaylm_documentation_current_boundary_smoke.py
          run_check python scripts/relaylm_docs_link_check.py
          run_check python scripts/relaylm_mvp_completion_report_pr_link_smoke.py
          run_check env PYTHONPATH=.:scripts python scripts/relaylm_wave4_cross_slice_convergence_smoke.py
          run_check env PYTHONPATH=.:scripts python scripts/relaylm_mvp_eval_runner_smoke.py
          run_check git diff --check
          if git grep -n -- '--check-model' -- .github scripts >> /tmp/d1-final-patch-build.log 2>&1; then
            echo "FAIL: live model-mode invocation remains" | tee -a /tmp/d1-final-patch-build.log
            failed=1
          fi
          for path in docs/templates/implementation-completion-report.md .github/workflows/documentation-completion-report-model.yml; do
            if [ -e "$path" ]; then
              echo "FAIL: retired path remains: $path" | tee -a /tmp/d1-final-patch-build.log
              failed=1
            fi
          done
          if find . -maxdepth 1 -type f -name '.d1*' | grep -q .; then
            echo "FAIL: temporary root D1 asset remains" | tee -a /tmp/d1-final-patch-build.log
            failed=1
          fi
          if find .github/workflows -maxdepth 1 -type f -name 'd1-*.yml' | grep -q .; then
            echo "FAIL: temporary D1 workflow remains" | tee -a /tmp/d1-final-patch-build.log
            failed=1
          fi
          exit "$failed"
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d1-final-patch-build-diagnostics
          path: /tmp/d1-final-patch-build.log
          if-no-files-found: error
      - name: Publish validated non-workflow tree
        run: |
          set -euo pipefail
          git diff --binary origin/main -- ':!.github/workflows' > /tmp/d1-validated-nonworkflow.patch
          git reset --hard origin/main
          git clean -fdx
          git apply --index /tmp/d1-validated-nonworkflow.patch
          git diff --cached --check
          git commit -m "docs: finalize D1 non-workflow authority transfer"
          git push --force origin HEAD:agent/d1-validated-nonworkflow
