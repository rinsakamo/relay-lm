name: Smoke consolidation contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-*.yml"
      - "scripts/relaylm_ci_consolidated_smoke.py"
      - "scripts/relaylm_ci_changed_matrix.py"
      - "scripts/relaylm_ci_consolidated_smoke_contract.py"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/smoke-*.yml"
      - "scripts/relaylm_ci_consolidated_smoke.py"
      - "scripts/relaylm_ci_changed_matrix.py"
      - "scripts/relaylm_ci_consolidated_smoke_contract.py"
      - "scripts/**"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Compile CI helpers
        run: python -m compileall -q scripts/relaylm_ci_*.py
      - name: Validate consolidated smoke definitions
        run: PYTHONPATH=scripts python scripts/relaylm_ci_consolidated_smoke_contract.py
      - name: Export response-split smoke sources
        uses: actions/upload-artifact@v4
        with:
          name: response-split-smoke-sources
          path: |
            scripts/relaylm_i1gb_durable_finalization_app_smoke.py
            scripts/_relaylm_i1ge_crash_child.py
          if-no-files-found: error
          retention-days: 1
