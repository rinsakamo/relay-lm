version: 2
updates:
  # Python requirements in pyproject.toml are support floors, not lockfile pins.
  # Raise those floors only through explicit reviewed RelayLM transactions.
  # Dependabot security updates remain enabled through repository settings.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v1"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
