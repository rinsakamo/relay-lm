[project]
name = "relay-lm"
version = "0.1.0"
description = "Memory- and persona-aware OpenAI-compatible conversation proxy for local LLM frontends"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.27",
]

[project.scripts]
relaylm = "relaylm.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["relaylm*"]
