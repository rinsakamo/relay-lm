[project]
name = "relay-lm"
version = "0.1.0"
description = "Memory- and persona-aware OpenAI-compatible conversation proxy for local LLM frontends"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21", "jsonschema>=4.23"]
dev = ["relay-lm[test]"]

[project.scripts]
relaylm = "relaylm.cli.soul_lab:main"
relaylm-worker = "relaylm.cli.worker:main"
relaylm-character-store-bootstrap = "relaylm.cli.character_store_bootstrap:main"
relaylm-character-create = "relaylm.cli.character_creation:main_create"
relaylm-character-template-validate = "relaylm.cli.character_creation:main_validate"
relaylm-runtime-install = "relaylm.cli.runtime_install:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["relaylm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
