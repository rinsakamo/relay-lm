[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "relaylm"
dynamic = ["version"]
description = "Persistent character continuity around a replaceable language model"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "PyYAML>=6.0.2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.1.1",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
relaylm = "relaylm.cli:main"
relaylm-eval = "relaylm.evaluation:main"

[tool.hatch.version]
path = "src/relaylm/_version.py"

[tool.hatch.build]
reproducible = true

[tool.hatch.build.targets.wheel]
packages = ["src/relaylm"]

[tool.hatch.build.targets.sdist]
only-include = ["src/relaylm", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W605"]
