[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "relaylm"
version = "1.0.0.dev0"
description = "Persistent character continuity around a replaceable language model"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "PyYAML>=6.0.2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[project.scripts]
relaylm = "relaylm.server:main"
relaylm-eval = "relaylm.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relaylm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
