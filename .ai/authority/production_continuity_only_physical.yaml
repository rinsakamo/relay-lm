schema_version: 1
id: production_continuity_only_physical
summary: >-
  Repository-owned llama.cpp one-shot physical carriage for the merged #2624
  production-context Continuity-only discriminator. It executes ordinary
  production T1, ordinary T2 Pass 1, and exactly one canonical Continuity-only
  retained-formation T2 Pass 2 without making the product semantic verdict.
owner_issue: 2659
canonical_surfaces:
- docs/reference/actual-model-production-continuity-only-physical.md
references:
