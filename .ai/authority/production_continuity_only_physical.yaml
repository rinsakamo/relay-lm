implementation:
- src/relaylm/actual_model_stage_r_llama_cpp_production_continuity_only.py
- src/relaylm/actual_model_stage_r_llama_cpp_production_continuity_only_transaction.py
- tools/v1_stage_r_llama_cpp_production_continuity_only_wsl.py
tests:
