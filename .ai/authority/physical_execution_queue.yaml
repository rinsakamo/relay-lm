schema_version: 1
id: physical_execution_queue
owner_issue: 2660
summary: >-
  v2 carriage of the branch-neutral llama.cpp-only one-shot physical controller.
  LocalCodex selects a policy-addressed fingerprinted persistent Python instance,
  then serializes the canonical local GPU resource and enforces a final fresh-ref,
  environment-identity, and invocation-boundary external-runtime gate. The target
  registry remains branch-local carriage authority and is excluded from any future
  branch-neutral common-generation identity.
