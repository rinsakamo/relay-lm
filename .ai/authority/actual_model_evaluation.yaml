evidence:
- id: actual-model-foundation-scenarios-v1
  summary: >-
    Frozen foundation scenario set and Character fixture for reproducible
    ordinary-turn actual-model runs.
  surfaces:
  - evaluation/actual_model/scenario_sets/foundation-v1.json
  - evaluation/actual_model/characters/foundation-v1/SOUL.md
  - evaluation/actual_model/characters/foundation-v1/config.yaml
  - evaluation/actual_model/characters/foundation-v1/memory/state.json
- id: actual-model-foundation-scenarios-v2
  summary: >-
    Immutable historical foundation-v2 scenario set carrying the previous
    mixed persona/correction oracle and controlled pressure conditions.
  surfaces:
  - evaluation/actual_model/scenario_sets/foundation-v2.json
- id: actual-model-foundation-scenarios-v3
  summary: >-
    Current #2025-promoted Stage R oracle with explicit scored/unscored proposal
    channels, neutral transcript fidelity, adversarial false-attribution
    resistance, and the existing Continuity lifecycle. Fresh execution is
    required for any verdict under this evaluation identity.
  surfaces:
  - evaluation/actual_model/scenario_sets/foundation-v3.json
- id: actual-model-principle-only-prompt-v1
  summary: >-
    Non-production #2025 prompt-crystallization design input. Production wiring,
    if accepted after matched physical comparison, belongs to a separate #1533
    semantic transaction and intentionally advances Core semantic identity.
  surfaces:
  - evaluation/actual_model/prompt_candidates/principle-only-two-pass-v1.txt
- id: actual-model-gemma-target-v1
  summary: >-
    Frozen Gemma target artifact identity for reproducible actual-model runs.
  surfaces:
  - evaluation/actual_model/targets/gemma-4-12b-it-q4-k-m-v1.json
- id: actual-model-gemma-lmstudio-target-v1
  summary: >-
    Frozen LM Studio Community Gemma target identity, including host serving
    parity requirements.
  surfaces:
  - evaluation/actual_model/targets/gemma-4-12b-it-q4-k-m-lmstudio-community-v1.json
- id: actual-model-gemma-vllm-snapshot-target-v1
  summary: >-
    Frozen vLLM-native Gemma 4 repository snapshot identity with exact
    execution-file metadata, serving-tokenizer roles, and chat-template role.
  surfaces:
  - evaluation/actual_model/targets/gemma-4-12b-it-qat-w4a16-vllm-v1.json
- id: actual-model-gemma-google-vllm-snapshot-target-v1
  summary: >-
    Frozen Google official vLLM-native Gemma 4 W4A16 repository snapshot
    identity with exact execution-file metadata, serving-tokenizer roles, and
    chat-template role. This is a separate provenance target from the existing
    Unsloth snapshot, even where model bytes are identical.
  surfaces:
  - evaluation/actual_model/targets/gemma-4-12b-it-qat-w4a16-google-vllm-v1.json
- id: actual-model-vllm-reasoning-proof-v1
  summary: >-
    Machine-readable projection of the already-attested effective OFF and
    bounded vLLM reasoning controls, rebound to fresh live backend identity
    before product-quality runs without repeating unsupported parameter search.
  surfaces:
  - evaluation/actual_model/attestations/gemma-4-12b-it-qat-w4a16-vllm-reasoning-v1.json
- id: actual-model-google-vllm-reasoning-proof-v1
  summary: >-
    Immutable configured-runtime vLLM reasoning attestation for the separate
    Google official Gemma 4 W4A16 target. This does not rebind the current
    Stage R0 target or replace the historical Unsloth proof.
  surfaces:
  - evaluation/actual_model/attestations/gemma-4-12b-it-qat-w4a16-google-vllm-reasoning-v1.json
- id: actual-model-cogp5-vllm-screening-v1
  summary: >-
    Immutable historical plan containing A single-pass OFF, B two-pass OFF/OFF,
    and C two-pass Pass-2 escalation. Current Core 1.0 policy uses semantic
    reference_baseline and optional pass2_reasoning_escalation plan keys;
    historical A/B/C names remain only inside this immutable evidence plan and
    do not define current execution structure or order.
  surfaces:
  - evaluation/actual_model/screenings/cogp5-vllm-screening-v1.json
- id: actual-model-stage-r-v2-execution-template
  summary: >-
    Immutable historical v2 execution template retained for the previous Stage R
    evaluation identity. Its numeric effective context window is historical
    template data and never current hardware/runtime authority.
  surfaces:
  - evaluation/actual_model/screenings/stage-r0-vllm-reference-v2.json
- id: actual-model-stage-r-v3-execution-template
  summary: >-
    Current Stage R execution template. It binds the exact foundation-v3
    repository path and semantic revision, the exact v3 scenario IDs, and the
    current two-pass reference/escalation topology. Its numeric context window
    remains template data; current screening binds fresh external capacity.
  surfaces:
  - evaluation/actual_model/screenings/stage-r0-vllm-reference-v3.json
- id: actual-model-crystallization-quality-v1
  summary: >-
    Frozen Character fixture and revision identity for off-turn crystallization
    quality evidence.
  surfaces:
  - evaluation/actual_model/characters/crystallization-quality-v1.revision.txt
  - evaluation/actual_model/characters/crystallization-quality-v1/config.yaml
  - evaluation/actual_model/characters/crystallization-quality-v1/memory/MEMORY.md
  - evaluation/actual_model/characters/crystallization-quality-v1/memory/events.jsonl
  - evaluation/actual_model/characters/crystallization-quality-v1/memory/state.json
depends_on:
- cognitive_budget
- cognitive_turn
- continuity_context
- crystallization
- memory_provenance
- persistence
- provider_and_api
- runtime_configuration
- state_and_validation
