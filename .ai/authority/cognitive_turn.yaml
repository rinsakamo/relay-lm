schema_version: 1
id: cognitive_turn
summary: >-
  Core 1.0 two-pass-first ordinary-turn cognition authority. Pass 1 and Pass 2
  share one canonical cognitive prefix through CognitiveInput. Pass 1 owns the
  visible character response with a minimal suffix; Pass 2 owns a non-authoritative
  six-field subjective turn-interpretation scaffold followed by semantic
  State/Continuity proposals. Pass 2 extraction transport is selectable between
  RelayLM-owned ordinary-message JSON and provider-native JSON Schema constrained
  output, while RelayLM retains exact IR parsing/type construction plus deterministic
  State/Continuity authority. single_pass remains compatibility/future optimization
  rather than a Core 1.0 quality gate.
